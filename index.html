  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: { tdmh: { blue: '#1e3a8a', green: '#16a34a', dark: '#0f172a', surface: '#f4f7f9', border: '#e2e8f0' } },
          animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards', 'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards', 'pulse-slow': 'pulse 3s infinite', 'spin-slow': 'spin 3s linear infinite' },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body { background-color: #f4f7f9; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    body.modal-open { overflow: hidden !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .structured-card { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 1.5rem; }
    .bg-pattern { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
    @media print {
      body * { visibility: hidden; }
      .print-overlay, .print-overlay * { visibility: visible; }
      .print-overlay { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; background: white !important; margin: 0 !important; padding: 0 !important; }

      .no-print, .no-print * { display: none !important; }

</head>

      Stethoscope: "M19.5 5.5v13m-15-13v13m7.5-13v13M4.5 18.5h15",

      MessageCircle: "M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z",
      CheckCircle: "M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z",
      Trash: "M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16",
      Edit: "M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z",
      PenTool: "M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7",

      Monitor: "M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z",
      Link: "M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1",
      Key: "M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z",
      Chart: "M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z",
      Plus: "M12 5v14m-7-7h14"
    };

    const Icon = ({ name, className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d={ICON_PATHS[name] || ICON_PATHS.Folder} />
      </svg>
    );

    const DEPT_COLORS = [
      { bg: 'bg-blue-50', border: 'border-blue-100', text: 'text-blue-600', hover: 'hover:bg-blue-50 border-slate-200 hover:border-tdmh-blue' },
      { bg: 'bg-emerald-50', border: 'border-emerald-100', text: 'text-emerald-600', hover: 'hover:bg-emerald-50 border-slate-200 hover:border-tdmh-green' },
      { bg: 'bg-purple-50', border: 'border-purple-100', text: 'text-purple-600', hover: 'hover:bg-purple-50 border-slate-200 hover:border-purple-500' },
      { bg: 'bg-pink-50', border: 'border-pink-100', text: 'text-pink-600', hover: 'hover:bg-pink-50 border-slate-200 hover:border-pink-500' },
      { bg: 'bg-orange-50', border: 'border-orange-100', text: 'text-orange-600', hover: 'hover:bg-orange-50 border-slate-200 hover:border-orange-500' }
    ];

    const getToolIcon = (iStr, fStr) => {
      let s = String(iStr || '').toLowerCase().trim();
      if (!s && fStr) s = String(fStr).toLowerCase().trim();
      if (s.includes('form') || s.includes('paper') || s.includes('pen') || s.includes('sheet') || s.includes('report')) return 'FileText';
      if (s.includes('computer') || s.includes('monitor') || s.includes('laptop') || s.includes('it ')) return 'Monitor';
      if (s.includes('infectious') || s.includes('shield') || s.includes('safety') || s.includes('risk')) return 'Shield';
      if (s.includes('medical') || s.includes('stethoscope') || s.includes('clinical')) return 'Stethoscope';
      if (s.includes('person') || s.includes('head') || s.includes('user') || s.includes('people') || s.includes('attendance')) return 'Users';
      
      const exactMatch = Object.keys(ICON_PATHS).find(k => k.toLowerCase() === s);
      return exactMatch ? exactMatch : 'Folder'; 
    };

    const getDriveImage = (url) => {
      if(!url) return '';
      const match = String(url).match(/(?:file\/d\/|id=)([a-zA-Z0-9_-]+)/);
      return match && match[1] ? `https://lh3.googleusercontent.com/d/${match[1]}` : String(url);
    };

    const formatDateFriendly = (dateVal) => {
      if (!dateVal) return { month: 'N/A', day: '--', year: '----', full: 'N/A' };
      let d = new Date(String(dateVal).trim());
      if (!isNaN(d.getTime())) {
        const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        return { month: monthNames[d.getMonth()], day: d.getDate().toString().padStart(2, '0'), year: d.getFullYear(), full: d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) };
      }
      const parts = String(dateVal).trim().split(' ');
      return { month: parts[0] ? parts[0].substring(0, 3).toUpperCase() : 'N/A', day: parts[1] ? parts[1].replace(',', '') : '--', year: parts[2] ? parts[2] : '----', full: String(dateVal) };
    };

    const Modal = ({ isOpen, onClose, title, iconName, subtitle, children, maxWidth = "max-w-md", iconColor = "text-tdmh-blue", iconBg = "bg-blue-50 border-blue-100" }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in no-print overflow-y-auto" onClick={onClose}>
          <div className={`bg-white rounded-[2rem] shadow-2xl w-full ${maxWidth} p-8 relative animate-slide-up border border-slate-200 my-auto shrink-0`} onClick={e => e.stopPropagation()}>
            <button onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-800 transition-colors bg-slate-50 p-2 rounded-full border border-slate-200 shadow-sm"><Icon name="X" className="w-5 h-5"/></button>
            {(title || iconName) && (
              <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                {iconName && <div className={`w-12 h-12 ${iconBg} ${iconColor} rounded-xl flex items-center justify-center border`}><Icon name={iconName} className="w-6 h-6"/></div>}
                <div>
                  <h3 className="text-xl md:text-2xl font-black text-slate-800 leading-tight">{title}</h3>
                  {subtitle && <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mt-0.5">{subtitle}</p>}
                </div>
              </div>
            )}
            {children}
          </div>
        </div>
      );
    };

    const FormInput = ({ label, name, type = "text", value, onChange, placeholder, required = false, as = "input", options = [], disabled = false, className = "", multiple = false }) => (
      <div className={`mb-4 ${className}`}>
        <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">{label} {required && <span className="text-red-500">*</span>}</label>
        {as === "select" ? (
          <select name={name} value={value} onChange={onChange} required={required} disabled={disabled} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none bg-white transition-colors">
            {options.map(o => <option key={o.value || o} value={o.value || o}>{o.label || o}</option>)}
          </select>
        ) : as === "textarea" ? (
          <textarea name={name} value={value} onChange={onChange} placeholder={placeholder} required={required} disabled={disabled} className="w-full p-4 text-sm border border-slate-300 rounded-xl h-28 focus:border-tdmh-blue outline-none resize-y transition-colors"></textarea>
        ) : type === "file" ? (
          <input name={name} type="file" onChange={onChange} accept={placeholder} required={required} disabled={disabled} multiple={multiple} className="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:bg-emerald-50 file:text-tdmh-green file:border file:border-emerald-200 file:font-bold hover:file:bg-emerald-100 transition-colors cursor-pointer border border-slate-200 p-1 rounded-2xl" />
        ) : (
          <input name={name} type={type} value={value} onChange={onChange} placeholder={placeholder} required={required} disabled={disabled} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none transition-colors" />
        )}
      </div>
    );

    const SignaturePad = ({ onSave, onCancel }) => {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasDrawn, setHasDrawn] = useState(false);

      useEffect(() => {
        const initCanvas = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const rect = canvas.parentElement.getBoundingClientRect();
          canvas.width = rect.width || 300;
          canvas.height = 150;
          const ctx = canvas.getContext('2d');
          ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f172a';
        };
        // 🚀 BUG FIX: Delay initialization slightly to let the modal animation complete
        setTimeout(initCanvas, 100);
      }, []);

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;
        
        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const startDrawing = (e) => { if (e.type.includes('touch')) e.preventDefault(); setIsDrawing(true); setHasDrawn(true); const { x, y } = getCoordinates(e); canvasRef.current.getContext('2d').beginPath(); canvasRef.current.getContext('2d').moveTo(x, y); };
      const draw = (e) => { if (e.type.includes('touch')) e.preventDefault(); if (!isDrawing) return; const { x, y } = getCoordinates(e); canvasRef.current.getContext('2d').lineTo(x, y); canvasRef.current.getContext('2d').stroke(); };
      const stopDrawing = () => { setIsDrawing(false); canvasRef.current.getContext('2d').closePath(); };
      const clearCanvas = () => { canvasRef.current.getContext('2d').clearRect(0, 0, canvasRef.current.width, canvasRef.current.height); setHasDrawn(false); };

      return (
        <div className="w-full">
          <div className="border-2 border-slate-300 rounded-xl overflow-hidden bg-slate-50 mb-3 relative cursor-crosshair" style={{ height: '150px' }}>
            <canvas ref={canvasRef} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} className="w-full h-full touch-none" />
            {!hasDrawn && <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-300 font-bold text-xs uppercase tracking-widest">Sign Here</div>}
          </div>
          <div className="flex justify-between gap-3">
            <button type="button" onClick={clearCanvas} className="px-4 py-2 text-xs font-bold text-slate-500 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">Clear</button>
            <div className="flex gap-2">
              <button type="button" onClick={onCancel} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">Cancel</button>
              <button type="button" onClick={() => onSave(hasDrawn ? canvasRef.current.toDataURL('image/png') : null)} className="px-5 py-2 text-xs font-bold text-white bg-tdmh-blue rounded-lg hover:bg-blue-900 transition-colors shadow-md">Confirm Signature</button>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      // 🚀 Unique Client ID for Live Users Counter
      const [clientId] = useState(() => {
        let id = sessionStorage.getItem('tdmh_client_id');
        if (!id) { id = Math.random().toString(36).substring(2, 15); sessionStorage.setItem('tdmh_client_id', id); }
        return id;
      });

      const [userRole, setUserRole] = useState(() => localStorage.getItem('tdmh_role') || 'guest');
      // 🚀 Secure Token Storage (Replaces UI bypass flaw)
      const [adminToken, setAdminToken] = useState(() => localStorage.getItem('tdmh_admin_token') || '');
      const [activeTab, setActiveTab] = useState(() => localStorage.getItem('tdmh_tab') || 'home');

      const changeUserRole = (role, token) => { 
        setUserRole(role); 
        localStorage.setItem('tdmh_role', role); 
        if (token) { setAdminToken(token); localStorage.setItem('tdmh_admin_token', token); }
      };
      
      const changeActiveTab = (tab) => { 
        if (activeTab !== tab) {
            // Analytics Ping on Tab Change
            sendPostRequest({ action: 'logAnalytics', tab: tab, skipLock: true });
        }
        setActiveTab(tab); 
        localStorage.setItem('tdmh_tab', tab); 
      };
      
      const handleLogout = () => { 
        changeUserRole('guest', ''); 
        changeActiveTab('home'); 
        setMobileMenuOpen(false); 
      };

      const [isSyncing, setIsSyncing] = useState(true);
      const [globalPinRequired, setGlobalPinRequired] = useState(false);
      const [deptPinRequired, setDeptPinRequired] = useState(true);
      const [liveUsersCount, setLiveUsersCount] = useState(1);
      
      const [departments, setDepartments] = useState([]);
      const [tools, setTools] = useState([]); 
      const [universalForms, setUniversalForms] = useState([]);
      const [isoRequirements, setIsoRequirements] = useState([]);
      const [isoReviews, setIsoReviews] = useState([]); // New ISO Review Tracker
      const [analyticsData, setAnalyticsData] = useState({ daily: [], monthly: [] }); // New Intelligence Hub Data
      const [dccQueue, setDccQueue] = useState([]);
      const [dccLogbook, setDccLogbook] = useState([]);
      const [monitoring, setMonitoring] = useState([]);
      const [systemLogs, setSystemLogs] = useState([]);
      const [toolRequests, setToolRequests] = useState([]); 
      const [census, setCensus] = useState([{Department: 'Station 3', 'Patient Count': 0}, {Department: 'Station 4B', 'Patient Count': 0}]);
      const [newsList, setNewsList] = useState([]);
      const [calendar, setCalendar] = useState([]);
      const [slideshow, setSlideshow] = useState([]);
      const [agimat, setAgimat] = useState([]);
      const [memos, setMemos] = useState([]);
      const [signatures, setSignatures] = useState([]);
      const [inquiries, setInquiries] = useState([]);
      const [memoRequests, setMemoRequests] = useState([]);

      const [trackQuery, setTrackQuery] = useState('');
      const [trackResult, setTrackResult] = useState(null);
      const [isTracking, setIsTracking] = useState(false);

      const [globalUnlocked, setGlobalUnlocked] = useState(false);
      const [globalPinInput, setGlobalPinInput] = useState('');
      const [globalPinFeedback, setGlobalPinFeedback] = useState(null); 
      const [isVerifyingLogin, setIsVerifyingLogin] = useState(false);

      const [showRoleLogin, setShowRoleLogin] = useState(false);
      const [rolePinInput, setRolePinInput] = useState('');
      const [roleLoginFeedback, setRoleLoginFeedback] = useState(null); 
      const [pendingAction, setPendingAction] = useState(null); 
      
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [dccActiveCategory, setDccActiveCategory] = useState('universal');
      
      const [selectedDept, setSelectedDept] = useState(null); 
      const [deptAuthModal, setDeptAuthModal] = useState({ isOpen: false, targetDept: null, pinInput: '', isLoading: false, feedback: null });
      const [isTogglingLock, setIsTogglingLock] = useState(false);
      
      const [currentSlide, setCurrentSlide] = useState(0);
      const [slideshowIndex, setSlideshowIndex] = useState(null); 
      const [qrLightbox, setQrLightbox] = useState(null); 
      const [liveTime, setLiveTime] = useState(new Date());

        const res = await sendPostRequest({ action: 'submitSignature', refNo: viewingMemo['Ref No'] || viewingMemo[0], name: signData.name, dept: signData.dept, signature: isQuickRead ? 'QUICK_READ_ACK' : signatureBase64 });
        setIsSubmitting(false);
        
        if (res.status === 'success') { showAlert("Acknowledgment Saved", `Thank you, ${signData.name}!\n\nYour record has been saved.`, "success"); setSignModalOpen(false); setSignData({name: '', dept: ''}); fetchDatabase(true); } 
        else showAlert("Network Error", "Failed to save record.", "error"); 
      };

      const handleAddNewsSubmit = async (e) => {
        e.preventDefault(); setIsSubmitting(true);
        const res = await sendPostRequest({ action: 'addNews', ...newsData, author: userRole });
        setIsSubmitting(false);
        if (res.status === 'success') { showAlert("News Submitted", "Sent to Admin queue for approval.", "success"); setShowAddNews(false); unlockScroll(); setNewsData({ title: '', content: '', type: 'Standard' }); fetchDatabase(true); } 
        else showAlert("Error", "Failed to post news.", "error"); 
      };

      const handleEventSubmit = async (e) => {
        e.preventDefault(); setIsSubmitting(true);
        const res = await sendPostRequest({ action: 'addEvent', ...eventData });
        setIsSubmitting(false);
        if (res.status === 'success') { showAlert("Event Scheduled", "Added to Master Calendar.", "success"); setShowAddEvent(false); unlockScroll(); setEventData({ title: '', date: '', time: '', eventType: 'Event / General' }); fetchDatabase(true); } 
        else showAlert("Network Error", "Failed to add event.", "error"); 
      };

      const handleEditEventSubmit = async (e) => {
        e.preventDefault(); setIsSubmitting(true);
        const res = await sendPostRequest({ action: 'editEventTime', ...editEventData });
        setIsSubmitting(false);
        if (res.status === 'success') { showAlert("Time Updated", "Event time successfully updated.", "success"); setShowEditEvent(false); unlockScroll(); setEditEventData({ oldDateText: '', oldTitle: '', newTime: '' }); fetchDatabase(true); } 
        else showAlert("Update Failed", "Could not locate event.", "error"); 
      };

      const submitRoleLogin = async (e) => {
        e.preventDefault(); setIsVerifyingLogin(true);
        const res = await sendPostRequest({ action: 'verifyPin', pin: rolePinInput });
        setIsVerifyingLogin(false);
        
        if (res.status === 'success' && res.role !== 'portal_lock') { 
          changeUserRole(res.role, rolePinInput); // 🚀 Store token safely
          setShowRoleLogin(false); unlockScroll(); setRolePinInput(''); setRoleLoginFeedback(null);
          
          if (pendingAction === 'census' && (res.role === 'admin' || res.role === 'admitting')) { changeActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); } 
          else if (pendingAction === 'admin' && res.role === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); } 
          else if (pendingAction === 'add_event' && (res.role === 'admin' || res.role === 'dept_head')) setShowAddEvent(true); 
          else if (pendingAction === 'add_news' && (res.role === 'admin' || res.role === 'dept_head')) setShowAddNews(true); 
          else if (pendingAction === 'add_memo' && (res.role === 'admin' || res.role === 'dept_head')) { setMemoData({ deptCode: '', forDept: '', fromName: '', subject: '', urgency: 'Normal', body: '', ackType: 'Signature Required' }); setEditMemoRef(null); setShowAddMemo(true); }
          setPendingAction(null);
        } else { setRoleLoginFeedback({ type: 'error', text: 'Invalid PIN or insufficient permissions.' }); setRolePinInput(''); setTimeout(() => setRoleLoginFeedback(null), 3000); }
      };

      const handleGlobalUnlock = async (e) => { 
        e.preventDefault(); setIsVerifyingLogin(true);
        const res = await sendPostRequest({ action: 'verifyPin', pin: globalPinInput });
        setIsVerifyingLogin(false);
        if (res.status === 'success') { setGlobalPinFeedback({ type: 'success', text: 'Verification Successful. Unlocking...' }); setTimeout(() => { setGlobalUnlocked(true); setGlobalPinFeedback(null); }, 1000); } 
        else { setGlobalPinFeedback({ type: 'error', text: 'Invalid Site PIN.' }); setGlobalPinInput(''); setTimeout(() => setGlobalPinFeedback(null), 3000); } 
      };

      const handleSecureAction = (actionType) => {
        setShowAddEvent(false); setShowAddNews(false); setShowAddMemo(false); setViewingMemo(null); setShowEditEvent(false);
        const requireRole = (roles, fallbackAction) => {
          if (roles.includes(userRole)) {
            if(fallbackAction === 'census') { changeActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); } 
            else if(fallbackAction === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); } 
            else if(fallbackAction === 'add_event') setShowAddEvent(true); 
            else if(fallbackAction === 'add_news') setShowAddNews(true); 
            else if(fallbackAction === 'add_memo') { setMemoData({ deptCode: '', forDept: '', fromName: '', subject: '', urgency: 'Normal', body: '', ackType: 'Signature Required' }); setEditMemoRef(null); setShowAddMemo(true); }
          } else { setPendingAction(fallbackAction); setShowRoleLogin(true); }
        };
        
        if (actionType === 'census') requireRole(['admin', 'admitting'], 'census');
        else if (actionType === 'admin') requireRole(['admin'], 'admin');
        else if (actionType === 'add_event') requireRole(['admin', 'dept_head'], 'add_event');
        else if (actionType === 'add_news') requireRole(['admin', 'dept_head'], 'add_news');
        else if (actionType === 'add_memo') requireRole(['admin', 'dept_head'], 'add_memo');
        else { changeActiveTab(actionType); setMobileMenuOpen(false); setSelectedDept(null); }
      };

      const handleDccUpload = async (e) => {
        e.preventDefault(); 
        const email = (e.target.email || e.target.querySelector('input[type="email"]'))?.value; 
        const title = (e.target.title || e.target.querySelector('input[placeholder="e.g. Daily Temperature Log"]'))?.value; 
        const files = Array.from(fileInputRef.current.files);
        
        if (!email || !title || files.length === 0) return showAlert("Missing Fields", "Please fill in all requested fields and attach a file.", "error"); 
        
        for (let file of files) {
          if (file.size > 25 * 1024 * 1024) return showAlert("File Too Large", `The file "${file.name}" exceeds the 25MB safe upload limit.\nPlease compress any images.`, "error"); // 🚀 25MB SAFE LIMIT
          if (file.type === "application/pdf") return showAlert("Invalid File Type", `PDFs are blocked for draft submissions. Upload .docx, .xlsx`, "error"); 
        }

        setIsSubmitting(true); let successCount = 0;
        
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const base64 = await new Promise(resolve => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.readAsDataURL(file); });
          const fileTitle = files.length > 1 ? `${title} (Part ${i+1})` : title;
          const res = await sendPostRequest({ action: "submitDCC", email: email, title: fileTitle, fileName: file.name, mimeType: file.type, fileBase64: base64 });
          if (res.status === 'success') successCount++;
        }

        setIsSubmitting(false);
        if (successCount > 0) { showAlert("Submission Successful", `Successfully pushed ${successCount} document(s) to the CQI Queue.`, "success"); e.target.reset(); fetchDatabase(true); }
      };

      const handleResolveDCC = async (e, r) => {
        e.preventDefault(); 
        const file = e.target.stampedFile.files[0]; const targetTrackingId = r['Tracking ID'] || r[0];
        if (!targetTrackingId || !file) return showAlert("Missing Details", "Please select a stamped file to upload.", "error"); 
        
        const reader = new FileReader();
        reader.onload = async () => {
          setIsResolving(targetTrackingId); const base64 = reader.result.split(',')[1];
          const prevQueue = [...dccQueue]; const prevLogbook = [...dccLogbook];
          setDccQueue(prev => prev.map(item => (item['Tracking ID'] || item[0]) === targetTrackingId ? {...item, Status: 'RESOLVED', 4: 'RESOLVED'} : item));
          setDccLogbook(prev => [...prev, { 'Tracking ID': targetTrackingId, 'Form Title': r.Title || r['Title'] || r[3], 'Dept Email': r['Dept Email'] || r.Email || r[2], 'Date Received': r.Timestamp || r['Timestamp'] || r[1], 'Date Accomplished': new Date().toISOString(), 'Status': 'RESOLVED & EMAILED' }]);

          const res = await sendPostRequest({ action: "resolveDCC", trackingId: targetTrackingId, stampedFileName: file.name, mimeType: file.type, stampedFileBase64: base64 });
          setIsResolving(null);
          if (res.status === 'success') { e.target.reset(); fetchDatabase(true); } 
          else { setDccQueue(prevQueue); setDccLogbook(prevLogbook); showAlert("Resolution Failed", "Failed to resolve request.", "error"); }
        };
        reader.readAsDataURL(file);
      };

      const handleSaveCensus = async () => {

        if (res.status === 'success') { showAlert("Census Updated", "Patient census successfully published.", "success"); fetchDatabase(true); } 
        else showAlert("Update Failed", "Could not connect to database.", "error"); 
      };

                <button type="submit" disabled={isVerifyingLogin} className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg transition-colors disabled:opacity-50">{isVerifyingLogin ? "Verifying..." : "Enter System"}</button>
              </form>
            </div>
          </div>
        );
      }

      const renderActiveTabContent = () => {

                </div>

              {slideshow.length > 0 && (

                  {slideshow.map((slide, index) => (

                  </div>
                </div>
              )}

                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">

                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3>
                    <p className="text-sm text-slate-500">Live patient tracking metrics across major medical departments.</p>
                  </div>
                  <div className="bg-slate-50 border border-slate-200 px-5 py-3 rounded-xl text-left md:text-right shrink-0 shadow-sm w-full md:w-auto">
                    <div className="text-xs font-black text-tdmh-green uppercase tracking-widest mb-0.5">{liveTime.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                    <div className="text-xl font-black text-tdmh-blue tracking-tight">{liveTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                  </div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">

                    const colors = ['bg-blue-600', 'bg-emerald-600', 'bg-purple-600', 'bg-pink-600', 'bg-red-600'];
                    const textColors = ['text-blue-600', 'text-emerald-600', 'text-purple-600', 'text-pink-600', 'text-red-600'];
                    return (
                      <div key={i} className="flex flex-col gap-4 group p-5 rounded-2xl hover:bg-slate-50 transition-colors border border-slate-200 shadow-sm bg-white">
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-center shrink-0 ${textColors[i % textColors.length]}`}><Icon name="Activity" className="w-5 h-5"/></div>
                          <div className="text-sm font-black text-slate-700 uppercase tracking-wider leading-tight">{c.Department || c.dept || c[0]}</div>

                        <div className="flex-1 w-full bg-slate-100 rounded-full h-2.5 overflow-hidden"><div className={`h-full ${colors[i % colors.length]} transition-all duration-1000 ease-out rounded-full`} style={{ width: `${Math.max(5, Math.min(100, (count / 50) * 100))}%` }}></div></div>

        if (activeTab === 'census') {

              <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <div><h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3><p className="text-sm text-slate-500">Live patient tracking metrics. Update the counts below and click Save.</p></div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 mb-10">

                    <label className="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-4">{c.Department || c[0]}</label>
                    {(userRole === 'admin' || userRole === 'admitting') ? (
                      <input type="number" value={c['Patient Count'] || c[1] || ''} onChange={(e) => { const newCensus = [...census]; newCensus[i] = {...newCensus[i], 'Patient Count': e.target.value}; setCensus(newCensus); }} className="w-full p-4 rounded-xl border border-slate-300 font-black text-4xl text-tdmh-blue text-center focus:border-tdmh-green focus:ring-1 outline-none transition-colors" />
                    ) : (
                      <div className="w-full p-4 rounded-xl border border-slate-100 bg-slate-50 font-black text-4xl text-tdmh-blue text-center">{c['Patient Count'] || c[1] || '0'}</div>

                <div className="flex justify-end gap-4 border-t border-slate-200 pt-8">

                </div>

                <div>
                  <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-xl"><Icon name="Bell" className="w-6 h-6" /></div> News & Announcements</h2>
                </div>

                  const ackType = m.Format || m[8] || 'Signature Required';

                    <div key={i} className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row gap-5 relative group hover:shadow-md transition-shadow hover:border-tdmh-blue cursor-pointer" onClick={() => setViewingMemo(m)}>
                      <div className="bg-blue-50 text-tdmh-blue p-4 rounded-xl flex flex-col items-center justify-center w-full sm:w-[90px] border border-blue-100 shrink-0"><span className="text-xs font-bold uppercase tracking-widest">{parsedDate.month}</span><span className="text-3xl font-black">{parsedDate.day}</span></div>

                        <p className="text-slate-500 text-xs mt-1.5 truncate">From: {m.From || m[3]} &bull; For: {m.For || m[2]}</p>
                        {(userRole === 'admin' || userRole === 'dept_head') && (
                          <div className="flex gap-2 mt-3 w-full sm:w-auto">

                        <div className="text-tdmh-blue font-bold text-xs bg-blue-50 px-4 py-2 rounded-lg flex items-center justify-center gap-2 border border-blue-100 shadow-sm hover:bg-blue-100 transition-colors"><Icon name="Eye" className="w-4 h-4" /> Read</div>
                        <div className="text-[10px] text-slate-400 font-bold tracking-widest uppercase flex items-center gap-1"><Icon name={ackType === 'Quick Read' ? "CheckCircle" : "PenTool"} className="w-3 h-3" /> {sigCount} {ackType === 'Quick Read' ? 'Reads' : 'Sigs'}</div>
                      </div>
                    </div>
                  )
                })}
              </div>
            </div>

        }

        if (activeTab === 'dcc') {
          const sortedUniversal = [...universalForms].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));
          const sortedISO = [...isoRequirements].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));

                </div>

              <div className="flex-1 structured-card p-6 md:p-10 min-h-[500px]">

                  <div className="text-left">

                      </div>
                      <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-green text-white font-black tracking-wider uppercase py-4 rounded-xl shadow-lg hover:bg-green-700 transition-transform hover:-translate-y-1 disabled:opacity-50">{isSubmitting ? "Uploading Securely..." : "Submit Control No. request to DCC"}</button>

                  </div>

                    {(dccActiveCategory === 'universal' ? sortedUniversal : sortedISO).map((t, i) => {
                      const colorTheme = DEPT_COLORS[i % DEPT_COLORS.length]; const iconName = getToolIcon(String(t.Icon || t.icon || t['Icon Name'] || t[4] || '').trim(), t['Form Title'] || t[0]);

                          </div>
                          <div className="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                            <a href={t.Link || t[2]} target="_blank" className="flex-1 bg-tdmh-blue text-white text-center py-2.5 rounded-lg text-xs font-bold hover:bg-blue-900 shadow-sm">Open Document</a>
                            <button onClick={() => { setQrLightbox({ url: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(t.Link || t[2] || '')}`, title: t['Form Title'] || t[0] }); unlockScroll(); }} className="px-4 py-2.5 bg-white text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-50 border border-slate-200 shadow-sm hover:text-slate-800"><Icon name="QrCode" className="w-4 h-4" /> QR</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          );

              {/* 🚀 UNIVERSAL TRACKER UI */}
              <form onSubmit={handleTrackRequest} className="flex flex-col sm:flex-row gap-3 mb-10">
                <input type="text" value={trackQuery} onChange={(e)=>setTrackQuery(e.target.value)} className="flex-1 p-4 border-2 rounded-xl focus:border-tdmh-blue outline-none text-base font-medium placeholder-slate-400" placeholder="Search CQI- ID, TKT- ID, or Dept Email..." />

                    <>
                      {/* 🚀 DCC REQUEST RESULT UI */}

                        <>
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <div>
                              <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-1"><Icon name="Folder" className="w-3 h-3" /> DCC Document Request: {trackResult['Tracking ID']}</p>
                              <h3 className="text-xl font-black text-slate-800">{trackResult['Title']}</h3>
                            </div>
                            <span className={`px-4 py-1.5 font-black text-xs rounded-lg uppercase tracking-widest ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-yellow-50 text-yellow-700 border border-yellow-200'}`}>{trackResult['Status']}</span>
                          </div>
                          <div className="w-full bg-slate-100 rounded-full h-3 mb-2">
                            <div className={`h-full rounded-full transition-all duration-1000 ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-500 w-full' : 'bg-yellow-400 w-1/2'}`}></div>
                          </div>
                        </>
                      )}

                      {/* 🚀 SUPPORT TICKET RESULT UI */}
                      {trackResult.type === 'INQUIRY' && (
                        <>
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <div>
                              <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-1"><Icon name="MessageCircle" className="w-3 h-3" /> Support Ticket: {trackResult['Ticket ID']}</p>
                              <h3 className="text-xl font-black text-slate-800">{trackResult['Category']}</h3>
                            </div>
                            <span className={`px-4 py-1.5 font-black text-xs rounded-lg uppercase tracking-widest ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-blue-50 text-blue-700 border border-blue-200'}`}>{trackResult['Status']}</span>

                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4">

                          </div>
                          
                          {trackResult['Status'] === 'RESOLVED' && trackResult['Admin Reply'] && (
                            <div className="bg-blue-50 p-5 rounded-xl border border-blue-200">
                              <div className="flex items-center gap-2 mb-2">
                                <Icon name="Shield" className="w-4 h-4 text-tdmh-blue" />
                                <p className="text-xs text-tdmh-blue font-black uppercase tracking-widest">Admin Resolution Reply:</p>
                              </div>
                              <p className="text-sm text-slate-800 font-medium leading-relaxed">{trackResult['Admin Reply']}</p>
                            </div>
                          )}
                          
                          {trackResult['Status'] !== 'RESOLVED' && (
                            <div className="w-full bg-slate-100 rounded-full h-3 mb-2">
                              <div className="h-full rounded-full transition-all duration-1000 bg-blue-400 w-1/2"></div>
                            </div>
                          )}
                        </>
                      )}
                    </>
                  )}
                </div>
              )}
            </div>
          );
        }

        if (activeTab === 'departments') {
          if (selectedDept) {
            const deptTools = tools.filter(t => [String(t['Target Dept ID'] || t['Target ID'] || t.TargetID || t.targetID || '').toLowerCase().split(',').map(s => s.trim())].some(arr => arr.includes(String(selectedDept['ID'] || selectedDept.id || selectedDept['Name'] || selectedDept.name || '').toLowerCase().trim()) || arr.includes('universal')));
            return (
              <div className="animate-fade-in structured-card p-6 md:p-10 min-h-[500px]">
                <div className="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-6">
                  <div className="flex items-center gap-4">
                    <button onClick={() => setSelectedDept(null)} className="p-2 bg-slate-100 hover:bg-tdmh-blue hover:text-white rounded-lg text-slate-600 transition-colors shadow-sm"><Icon name="ChevronLeft" className="w-6 h-6" /></button>
                    <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight">{selectedDept['Name'] || selectedDept.Name} Forms & Tools</h2>
                  </div>
                  {(userRole === 'admin' || userRole === 'dept_head') && (
                    <button onClick={() => setShowAddToolReq(true)} className="bg-tdmh-blue text-white px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-blue-900 transition-colors shadow-sm w-full sm:w-auto"><Icon name="Plus" className="w-4 h-4"/> Request New Tool</button>
                  )}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {deptTools.length === 0 && <div className="col-span-full text-center p-10 bg-slate-50 rounded-xl border border-slate-200"><Icon name="Folder" className="w-12 h-12 text-slate-300 mx-auto mb-2" /><p className="text-slate-500 italic">No specific tools mapped.</p></div>}
                  {deptTools.map((t, i) => {
                    const colorTheme = DEPT_COLORS[i % DEPT_COLORS.length]; const iconName = getToolIcon(String(t.Icon || t.icon || t['Icon Name'] || t[5] || '').trim(), t['Tool Name'] || t['Name'] || t.name || t[0]);
                    return (
                      <div key={i} className={`flex flex-col p-5 rounded-xl border border-slate-200 hover:bg-slate-50 transition-colors bg-white shadow-sm group ${colorTheme.hover}`}>
                        <div className="flex items-start gap-4 mb-5">
                          <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 border shadow-sm ${colorTheme.bg} ${colorTheme.text} ${colorTheme.border}`}><Icon name={iconName} className="w-5 h-5" /></div>
                          <div className="pt-0.5"><h4 className="font-bold text-slate-800 text-sm leading-tight group-hover:text-tdmh-blue">{t['Tool Name'] || t['Name'] || t.name || t[0]}</h4></div>
                        </div>
                        <div className="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                          <a href={t.Link || t.link || t[2] || '#'} target="_blank" className="flex-1 bg-tdmh-blue text-white text-center py-2.5 rounded-lg text-xs font-bold hover:bg-blue-900 shadow-sm">Open</a>
                          <button onClick={() => { setQrLightbox({ url: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(t.Link || t.link || t[2] || '')}`, title: t['Tool Name'] || t['Name'] || t.name || t[0] }); unlockScroll(); }} className="px-4 py-2.5 bg-white text-slate-600 rounded-lg text-xs font-bold border border-slate-200 shadow-sm"><Icon name="QrCode" className="w-4 h-4" /> QR</button>

                      </div>

          return (

                  if (!iconName) iconName = catStr.includes('admin') || catStr.includes('finance') ? 'Users' : catStr.includes('medical') || catStr.includes('ward') ? 'Stethoscope' : 'Box'; 
                  const colorTheme = DEPT_COLORS[i % DEPT_COLORS.length];
                  const hasLock = dept.HasPassword || (dept.Password && dept.Password.toString().trim() !== '');

                  return (
                    <div key={dept.id || i} onClick={() => handleDeptClick(dept)} className={`flex items-center gap-3 p-4 border rounded-xl cursor-pointer group bg-white shadow-sm hover:shadow-md ${colorTheme.border} relative`}>
                      <div className={`p-2.5 rounded-lg shrink-0 ${colorTheme.bg} ${colorTheme.text} ${colorTheme.hover}`}><Icon name={iconName} className="w-6 h-6" /></div>
                      <div className="flex flex-col min-w-0 pr-4"><span className="font-bold text-sm text-slate-800 truncate">{dept['Name'] || dept.Name}</span><span className="text-[9px] text-slate-400 font-bold uppercase tracking-widest truncate">{dept['Category'] || dept.category || 'Standard'}</span></div>
                      {deptPinRequired && hasLock && <div className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 group-hover:text-tdmh-blue"><Icon name="Lock" className="w-4 h-4"/></div>}
                    </div>
                  )
                })}
              </div>
            </div>
          );
        }

        if (activeTab === 'calendar') {
          const calYear = currentCalDate.getFullYear(); const calMonth = currentCalDate.getMonth(); const monthName = currentCalDate.toLocaleString('default', { month: 'long' });
          const eventsThisMonth = calendar.filter(e => { const d = new Date(e.date || e['Date Text'] || e['Date'] || e[0] || e[1]); return !isNaN(d) && d.getMonth() === calMonth && d.getFullYear() === calYear; });
          
          return (
            <div className="animate-fade-in structured-card p-6 md:p-10">
              <div className="mb-8 border-b border-slate-200 pb-6 flex justify-between items-center">
                <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3"><Icon name="Calendar" className="w-6 h-6 text-purple-600" /> Master Activities Timeline</h2>

                      <button onClick={() => setCurrentCalDate(new Date(calYear, calMonth - 1, 1))} className="p-1.5 rounded border border-slate-200 text-slate-400 hover:text-purple-600"><Icon name="ChevronLeft" className="w-4 h-4"/></button>
                      <button onClick={() => setCurrentCalDate(new Date(calYear, calMonth + 1, 1))} className="p-1.5 rounded border border-slate-200 text-slate-400 hover:text-purple-600"><Icon name="ChevronRight" className="w-4 h-4"/></button>

                      const day = i + 1; const dayEvents = eventsThisMonth.filter(e => new Date(e.date || e['Date Text'] || e['Date'] || e[0] || e[1]).getDate() === day);
                      const isToday = new Date().getDate() === day && new Date().getMonth() === calMonth && new Date().getFullYear() === calYear;
                      let bubbleColor = 'text-slate-600 hover:bg-slate-100';
                      if (dayEvents.length > 0) {
                        const types = dayEvents.map(e => e['Event Type'] || e[5] || 'Event / General');
                        if (types.includes('Holiday / Non-Working')) bubbleColor = 'bg-red-500 text-white shadow-md cursor-pointer';
                        else if (types.includes('Official Business')) bubbleColor = 'bg-blue-500 text-white shadow-md cursor-pointer';
                        else bubbleColor = 'bg-purple-600 text-white shadow-md cursor-pointer';
                      } else if (isToday) bubbleColor = 'bg-purple-50 text-purple-700 border border-purple-200';
                      return (<div key={day} className="aspect-square p-1"><div className={`w-full h-full flex items-center justify-center text-sm font-black rounded-full ${bubbleColor}`}>{day}</div></div>)
                    })}

                  <div className="mt-6 flex flex-wrap gap-4 text-[10px] font-bold uppercase tracking-widest text-slate-500 justify-center">
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-purple-600"></div> General Event</div>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-blue-500"></div> Official Business</div>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded-full bg-red-500"></div> Holiday</div>
                  </div>
                </div>
                <div>
                  <h3 className="font-bold text-slate-500 mb-6 uppercase tracking-widest text-[10px]">Upcoming Schedule</h3>
                  <div className="relative border-l-2 border-slate-200 ml-2 space-y-6 pb-2">
                    {calendar.length === 0 && <p className="text-slate-500 italic pl-6">No events scheduled.</p>}
