                            <div className="bg-slate-50 rounded-[2rem] shadow-2xl w-full max-w-7xl overflow-hidden flex flex-col h-[90vh] animate-slide-up border border-slate-700 m-auto">
                                <div className="bg-slate-900 p-6 flex justify-between items-center text-white shrink-0 shadow-md z-10">
                                    <div className="flex items-center gap-4">
                                        <div className="p-2.5 bg-slate-800 border border-slate-700 rounded-xl"><Icons.Shield className="w-6 h-6 text-tdmh-green" /></div>
                                        <div>
                                            <h2 className="text-2xl font-black tracking-tight">Master Admin Console</h2>
                                            <p className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-1">System Management & File Routing</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 items-center">
                                        <a href="https://docs.google.com/spreadsheets/d/1BGUrqHX9vThP21S3S6lhOekTw4r3xqEELIJpdfMDAuU/edit" target="_blank" className="hidden sm:flex px-6 py-2.5 bg-white/10 border border-white/20 text-white font-bold text-xs uppercase tracking-widest rounded-lg hover:bg-white/20 transition-colors">Raw Database</a>
                                        <button onClick={() => setShowAdminConsole(false)} className="text-slate-400 hover:text-white p-2 bg-slate-800 border border-slate-700 rounded-full transition-colors"><Icons.X className="w-5 h-5" /></button>
                                    </div>
                                </div>
                                <div className="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar flex flex-col lg:flex-row gap-8">
                                    <div className="w-full lg:w-1/3 flex flex-col gap-6">
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                                                <div className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center"><Icons.Upload className="w-5 h-5"/></div>
                                                <div><h3 className="font-black text-slate-800">Resolve Request (Option A)</h3><p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Stamp & Move to Vault</p></div>
                                            </div>
                                            <form onSubmit={handleResolveDCC} className="space-y-5">
                                                <div>
                                                    <label className="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2">Tracking ID to Resolve <span className="text-red-500">*</span></label>
                                                    <input type="text" value={resolveId} onChange={(e)=>setResolveId(e.target.value)} required className="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-emerald-500 outline-none font-bold text-slate-800" placeholder="e.g. CQI-1234" />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2">Upload Stamped Final File <span className="text-red-500">*</span></label>
                                                    <input ref={resolveFileRef} type="file" required className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:bg-emerald-500 file:text-white file:border-0 file:font-bold hover:file:bg-emerald-600 cursor-pointer" />
                                                </div>
                                                <button type="submit" disabled={isResolving} className="w-full bg-emerald-600 text-white font-black tracking-widest uppercase text-sm py-4 rounded-xl shadow-lg shadow-emerald-600/20 hover:bg-emerald-700 transition-colors disabled:opacity-50">
                                                    {isResolving ? "Processing..." : "Approve & Route File"}
                                                </button>
                                            </form>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center"><div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Forms</div><div className="text-3xl font-black text-tdmh-blue">{tools.length || 0}</div></div>
                                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center"><div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Active Memos</div><div className="text-3xl font-black text-emerald-600">{memos.length || 0}</div></div>
                                        </div>
                                    </div>
                                    <div className="w-full lg:w-2/3 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                                        <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-4">
                                            <h3 className="font-black text-slate-800 flex items-center gap-2"><Icons.FileText className="w-5 h-5 text-tdmh-blue"/> Master Index Reference</h3>
                                            <a href="https://docs.google.com/document/d/14_7i6NVjdQWP9bEw2k_qc4tBSzdzHJp96vVaGidxxgY/edit" target="_blank" className="text-xs font-bold text-tdmh-blue hover:underline">Open in new tab</a>
                                        </div>
                                        <div className="flex-1 bg-slate-100 rounded-xl overflow-hidden border-2 border-slate-200 min-h-[400px] lg:min-h-0 relative">
                                            <iframe src="https://docs.google.com/document/d/14_7i6NVjdQWP9bEw2k_qc4tBSzdzHJp96vVaGidxxgY/preview" className="absolute inset-0 w-full h-full border-none"></iframe>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ADD EVENT MODAL */}
                    {showAddEvent && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden relative transform animate-slide-up m-auto">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-black text-slate-800 text-xl">Schedule New Event</h3>
                                    <button onClick={() => setShowAddEvent(false)} className="text-slate-400 hover:text-slate-800 transition-colors"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 space-y-4" onSubmit={(e) => { e.preventDefault(); alert("Feature linked to Database!"); setShowAddEvent(false); }}>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Event Title</label><input type="text" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-purple-500" placeholder="e.g. Quality Assurance Meeting"/></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Date</label><input type="date" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-purple-500"/></div>
                                        <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Time</label><input type="time" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-purple-500"/></div>
                                    </div>
                                    <button type="submit" className="w-full bg-purple-600 text-white font-bold py-3.5 rounded-xl mt-4 hover:bg-purple-700 transition-colors">Add to Calendar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ADD NEWS MODAL */}
                    {showAddNews && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden relative transform animate-slide-up m-auto">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-black text-slate-800 text-xl">Post Announcement</h3>
                                    <button onClick={() => setShowAddNews(false)} className="text-slate-400 hover:text-slate-800 transition-colors"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 space-y-4" onSubmit={(e) => { e.preventDefault(); alert("Feature links to Database!"); setShowAddNews(false); }}>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Headline / Title</label><input type="text" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-tdmh-blue" placeholder="Announcement Title"/></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Category</label><select className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-tdmh-blue"><option>General</option><option>System Update</option><option>Urgent</option></select></div>
                                        <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Date</label><input type="date" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-tdmh-blue"/></div>
                                    </div>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Message Content</label><textarea required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-tdmh-blue resize-none h-32" placeholder="Write the announcement details here..."></textarea></div>
                                    <button type="submit" className="w-full bg-tdmh-blue text-white font-bold py-3.5 rounded-xl mt-4 hover:bg-blue-900 transition-colors shadow-sm">Post to News Feed</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVIGATION: FIXED OVERLAPPING ISSUE */}
                    <nav className="bg-tdmh-blue text-white shadow-xl z-40 sticky top-0 border-b-2 border-blue-900">
                        <div className="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16 md:h-20 gap-4">
                                
                                {/* Left: Branding (Fixed width preventing squash) */}
                                <div className="flex items-center gap-3 shrink-0">
                                    <div className="bg-white p-1 rounded-xl shadow-inner border border-blue-100 flex items-center justify-center">
                                        <svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="90" height="90" rx="20" fill="#1e3a8a" /><path d="M35 50 H65 M50 35 V65" stroke="#16a34a" strokeWidth="16" strokeLinecap="round" /></svg>
                                    </div>
                                    <button onClick={() => handleSecureAction('admin')} className="p-1.5 rounded-md bg-white/10 border border-white/20 text-white hover:bg-white/20 transition-colors shadow-sm" title="Admin Control Center">
                                        <Icons.Shield className="w-4 h-4 md:w-5 md:h-5" />
                                    </button>
                                    <div className="hidden md:flex flex-col border-l border-blue-700 pl-3 ml-1">
                                        <span className="font-black text-sm lg:text-base tracking-tight leading-none whitespace-nowrap">TDMH CQI Portal</span>
                                    </div>
                                </div>
                                
                                {/* Center: Scrollable Tabs for Desktop */}
                                <div className="hidden xl:flex flex-1 items-center justify-center min-w-0 px-10 relative">
                                    <button onClick={() => scrollTabs('left')} className="absolute left-1 z-10 p-1.5 rounded-full bg-blue-800/80 text-white hover:bg-tdmh-blue border border-blue-700 shadow-md transition-colors flex items-center justify-center" title="Scroll Left">
                                        <Icons.ChevronLeft className="w-4 h-4" />
                                    </button>

                                    <div 
                                        ref={tabsContainerRef}
                                        className="flex items-center gap-1 bg-blue-900/40 p-1.5 rounded-xl border border-blue-800/50 overflow-x-auto no-scrollbar scroll-smooth w-full"
                                    >
                                        {TABS.map(tab => {
                                            const IconCmp = Icons[tab.icon];
                                            return (
                                                <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`px-4 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 transition-all whitespace-nowrap shrink-0 ${activeTab === tab.id ? 'bg-white text-tdmh-blue shadow-md scale-105' : 'text-blue-100 hover:bg-blue-800 hover:text-white'}`}>
                                                    <IconCmp className="w-4 h-4" /> {tab.label}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    <button onClick={() => scrollTabs('right')} className="absolute right-1 z-10 p-1.5 rounded-full bg-blue-800/80 text-white hover:bg-tdmh-blue border border-blue-700 shadow-md transition-colors flex items-center justify-center" title="Scroll Right">
                                        <Icons.ChevronRight className="w-4 h-4" />
                                    </button>
                                </div>

                                {/* Right: Auth & Mobile Menu */}
                                <div className="flex items-center gap-4 shrink-0">
                                    <div className="hidden lg:flex gap-2 mr-2">
                                        {userRole === 'admin' && <span className="bg-red-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-red-600">Admin</span>}
                                        {userRole === 'dept_head' && <span className="bg-yellow-500 text-yellow-900 text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-yellow-600">Dept Head</span>}
                                        {userRole === 'admitting' && <span className="bg-purple-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-purple-600">Admitting</span>}
                                    </div>
                                    
                                    {userRole === 'guest' ? (
                                        <button onClick={() => setShowRoleLogin(true)} className="hidden sm:flex items-center gap-2 bg-white/10 border border-white/20 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-white/20 transition-colors shadow-sm whitespace-nowrap">
                                            <Icons.Lock className="w-4 h-4" /> Login
                                        </button>
                                    ) : (
                                        <button onClick={() => {setUserRole('guest'); setActiveTab('home');}} className="hidden sm:flex text-xs font-bold uppercase tracking-widest text-red-300 hover:text-red-100 bg-red-900/30 px-4 py-2 rounded-lg border border-red-900/50 transition-colors">Logout</button>
                                    )}
                                    
                                    {/* Hamburger always shows on non-XL screens */}
                                    <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="xl:hidden p-2 bg-white text-tdmh-blue rounded-lg shadow-sm">
                                        {mobileMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        {mobileMenuOpen && (
                            <div className="xl:hidden bg-white border-t border-slate-200 absolute w-full shadow-2xl animate-fade-in text-slate-800 z-50 max-h-[calc(100vh-4rem)] overflow-y-auto custom-scrollbar">
                                <div className="p-4 space-y-2">
                                    {TABS.map(tab => {
                                        const IconCmp = Icons[tab.icon];
                                        return (
                                            <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`w-full flex items-center gap-3 px-5 py-4 rounded-xl text-sm font-bold transition-colors ${activeTab === tab.id ? 'bg-tdmh-blue text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 border border-slate-100'}`}>
                                                <IconCmp className="w-5 h-5" /> {tab.label}
                                            </button>
                                        );
                                    })}
                                    <div className="pt-4 mt-4 border-t border-slate-200 space-y-2">
                                        {userRole === 'guest' ? (
                                            <button onClick={() => {setShowRoleLogin(true); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-slate-100 border border-slate-200 text-slate-700 px-5 py-4 rounded-xl font-bold hover:bg-slate-200 transition-colors">
                                                <Icons.Lock className="w-5 h-5" /> Staff Login
                                            </button>
                                        ) : (
                                            <button onClick={() => {setUserRole('guest'); setActiveTab('home'); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-red-50 border border-red-100 text-red-600 px-5 py-4 rounded-xl font-bold hover:bg-red-100 transition-colors">
                                                Logout
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </nav>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-grow max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 w-full relative z-10 flex flex-col justify-start">
                        {renderActiveTabContent()}
                    </main>

                    {/* BOTTOM FOOTER */}
                    <footer className="mt-auto bg-tdmh-blue border-t-2 border-blue-900 py-6 text-center text-white text-[10px] font-bold flex flex-col md:flex-row justify-center items-center gap-6 relative z-20 shrink-0">
                        <p className="uppercase tracking-widest text-blue-200">&copy; {new Date().getFullYear()} TAYTAY DOCTORS MULTISPECIALTY HOSPITAL.</p>
                        <button onClick={fetchDatabase} className="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-blue-900 border border-blue-800 text-tdmh-green hover:bg-blue-800 transition-colors uppercase tracking-widest text-xs font-black shadow-lg">
                            <Icons.Sync className="w-4 h-4" /> {isSyncing ? 'Syncing...' : 'System Sync'}
                        </button>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
