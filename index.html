            if (c.includes('red') && !c.includes('orange')) return 'bg-red-50 text-red-600 group-hover:bg-red-600 group-hover:text-white border-red-200';

        const formatDateFriendly = (dateVal) => {
            if (!dateVal) return { month: 'N/A', day: '--', year: '----', full: 'N/A' };
            let str = String(dateVal).trim();
            let d = null;
            if (str.includes('T') && str.includes('Z')) d = new Date(str);
            else {
                let pd = new Date(str);
                if (!isNaN(pd.getTime())) d = pd;
            }
            if (d && !isNaN(d.getTime())) {
                const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                return { 
                    month: monthNames[d.getMonth()], 
                    day: d.getDate().toString().padStart(2, '0'),
                    year: d.getFullYear(),
                    full: d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
                };
            }
            const parts = str.split(' ');
            return { 
                month: parts[0] ? parts[0].substring(0, 3).toUpperCase() : 'N/A', 
                day: parts[1] ? parts[1].replace(',', '') : '--',
                year: parts[2] ? parts[2] : '----',
                full: str
            };
        };

        // --- SIGNATURE CANVAS COMPONENT ---
        const SignaturePad = ({ onSave, onCancel }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#0f172a';
                
                const resizeCanvas = () => {
                    const parent = canvas.parentElement;
                    canvas.width = parent.clientWidth;
                    canvas.height = 150; 
                };
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                return () => window.removeEventListener('resize', resizeCanvas);
            }, []);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                e.preventDefault();
                if (!isDrawing) return;
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
                canvasRef.current.getContext('2d').closePath();
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            return (
                <div className="w-full">
                    <div className="border-2 border-slate-300 rounded-xl overflow-hidden bg-slate-50 mb-3 relative cursor-crosshair">
                        <canvas ref={canvasRef} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} className="w-full touch-none" />
                        <div className="absolute bottom-2 left-0 right-0 text-center pointer-events-none text-slate-300 font-bold text-xs uppercase tracking-widest">Sign Here</div>
                    </div>
                    <div className="flex justify-between gap-3">
                        <button type="button" onClick={clearCanvas} className="px-4 py-2 text-xs font-bold text-slate-500 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">Clear</button>
                        <div className="flex gap-2">
                            <button type="button" onClick={onCancel} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">Cancel</button>
                            <button type="button" onClick={() => {
                                const canvas = canvasRef.current;
                                const blank = document.createElement('canvas');
                                blank.width = canvas.width; blank.height = canvas.height;
                                if(canvas.toDataURL() === blank.toDataURL()) onSave(null); 
                                else onSave(canvas.toDataURL('image/png'));
                            }} className="px-5 py-2 text-xs font-bold text-white bg-tdmh-blue rounded-lg hover:bg-blue-900 transition-colors shadow-md">Confirm Signature</button>
                        </div>
                    </div>
                </div>
            );
        };

                    if (!localStorage.getItem('tdmh_cqi_portal_cache')) setGlobalUnlocked(true); 
                }
                setIsSyncing(false);
            };

            useEffect(() => { fetchDatabase(); }, []);

            const sendPostRequest = async (payload) => {
                if (API_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") { 
                    showAlert("System Offline", "The database is currently running in offline developer mode.", "error");
                    return {status: 'success'}; 
                }
                try {
                    const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" }).catch(() => ({ ok: false }));
                    if (response && response.ok) return await response.json();
                    return {status: 'error', message: 'Failed to parse JSON response from server.'};
                } catch (e) { return {status: 'error', message: e.toString()}; }
            };

            // ---- DEPT PASSWORDS ----
            const handleDeptClick = (dept) => {
                if (dept.HasPassword && userRole !== 'admin') {
                    setDeptAuthModal({ isOpen: true, targetDept: dept, pinInput: '', isLoading: false, feedback: null });
                } else {
                    setSelectedDept(dept);
                }
            };

            const submitDeptAuth = async (e) => {
                e.preventDefault();
                setDeptAuthModal(prev => ({...prev, isLoading: true}));
                const payload = { action: 'verifyDeptPin', pin: deptAuthModal.pinInput, deptId: deptAuthModal.targetDept.ID || deptAuthModal.targetDept.id || deptAuthModal.targetDept.Name || deptAuthModal.targetDept.name };
                const res = await sendPostRequest(payload);
                
                if (res.status === 'success') {
                    setDeptAuthModal(prev => ({...prev, isLoading: false, feedback: {type: 'success', text: 'Access Granted'}}));
                    setTimeout(() => {
                        setSelectedDept(deptAuthModal.targetDept);
                        setDeptAuthModal({ isOpen: false, targetDept: null, pinInput: '', isLoading: false, feedback: null });
                    }, 800);
                } else {
                    setDeptAuthModal(prev => ({...prev, isLoading: false, pinInput: '', feedback: {type: 'error', text: 'Incorrect Department Password'}}));
                    setTimeout(() => setDeptAuthModal(prev => ({...prev, feedback: null})), 3000);
                }
            };

            // ---- CHAT / INQUIRY HANDLERS ----
            const handleInquirySubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const payload = { action: 'submitInquiry', email: inquiryData.email, category: inquiryData.category, refNo: inquiryData.refNo, message: inquiryData.message };
                const res = await sendPostRequest(payload);
                setIsSubmitting(false);
                if (res.status === 'success') {
                    showAlert("Ticket Submitted", `Your inquiry has been sent to Admin support. Ticket ID: ${res.ticketId}\n\nYou will receive a reply to your email.`, "success");
                    setShowSupportChat(false); setInquiryData({ email: '', category: 'General Help', refNo: '', message: '' }); fetchDatabase(true); 
                } else { showAlert("Submission Failed", "Failed to submit inquiry.", "error"); }
            };

            const handleResolveInquiry = async (e, ticketId) => {
                e.preventDefault();
                setIsResolving(ticketId);
                const payload = { action: 'resolveInquiry', ticketId: ticketId, reply: adminReplyData.reply };
                const res = await sendPostRequest(payload);
                setIsResolving(null);
                if (res.status === 'success') {
                    showAlert("Reply Sent", "Your reply has been emailed and the ticket is marked resolved.", "success");
                    setAdminReplyData({reply: ''}); fetchDatabase(true);
                } else { showAlert("Error", "Failed to resolve ticket.", "error"); }
            };

            // ---- MEMO HANDLERS ----
            const handleFixGrammar = () => {
                if (!memoData.body.trim()) { showAlert("Missing Content", "Please type something in the memo body first before fixing grammar.", "error"); return; }
                setIsFixingGrammar(true);
                setTimeout(() => {
                    let text = memoData.body;
                    text = text.replace(/ +/g, ' '); 
                    text = text.replace(/ \s*([,.;?!:])/g, '$1'); 
                    text = text.replace(/([,.;?!:])([a-zA-Z])/g, '$1 $2'); 
                    text = text.replace(/(^\s*|[.?!]\s+)([a-z])/g, (match, p1, p2) => p1 + p2.toUpperCase()); 
                    text = text.replace(/\n{3,}/g, '\n\n'); 
                    setMemoData({...memoData, body: text.trim()});
                    setIsFixingGrammar(false);
                }, 600); 
            };

            const handleNativeMemoSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                let payload = {};

                if (memoRequestMode && editMemoRef) {
                    payload = {
                        action: 'requestMemoAction',
                        requestType: 'EDIT',
                        refNo: editMemoRef,
                        requestedBy: userRole,
                        newData: { forDept: memoData.forDept, fromName: memoData.fromName, subject: memoData.subject, urgency: memoData.urgency, body: memoData.body }
                    };
                } else {
                    payload = {
                        action: editMemoRef ? 'updateMemo' : 'generateMemo',
                        refNo: editMemoRef,
                        forDept: memoData.forDept, fromName: memoData.fromName, subject: memoData.subject, urgency: memoData.urgency, body: memoData.body
                    };
                }

                const res = await sendPostRequest(payload);
                setIsSubmitting(false);

                if(res.status === 'success') {
                    if (memoRequestMode) {
                        showAlert("Modification Request Sent", `Your edit request for Memo ${editMemoRef} has been sent to the Master Admin for review.\nReq ID: ${res.reqId}`, "success");
                    } else {
                        showAlert(editMemoRef ? "Memo Updated" : "Memo Sent for Approval", editMemoRef ? `Memo ${editMemoRef} has been successfully updated in the database.` : `Your digital memo has been generated and routed to the Admin queue for final review.\n\nTracking Ref: ${res.refNo}`, "success");
                    }
                    setShowAddMemo(false); setEditMemoRef(null); setViewingMemo(null); setMemoRequestMode(false); unlockScroll(); setMemoData({ forDept: '', fromName: '', subject: '', urgency: 'Normal', body: '' }); fetchDatabase(true); 
                } else { showAlert("Submission Failed", "Failed to process memo in database.", "error"); }
            };

            const handleApproveMemo = async (refNo) => {
                setIsApprovingMemo(true);
                const res = await sendPostRequest({ action: 'approveMemo', refNo: refNo });
                setIsApprovingMemo(false);
                if (res.status === 'success') {
                    showAlert("Memo Approved", `Memo ${refNo} has been successfully published to the live portal.`, "success");
                    setViewingMemo(null); fetchDatabase(true);
                } else { showAlert("Approval Failed", "Failed to approve memo.", "error"); }
            };

            const handleArchiveMemo = async (refNo) => {
                if(userRole === 'admin') {
                    if(!window.confirm(`Are you sure you want to Archive (Delete) memo ${refNo}? It will be hidden from the portal.`)) return;
                    setIsApprovingMemo(true);
                    const res = await sendPostRequest({ action: 'archiveMemo', refNo: refNo });
                    setIsApprovingMemo(false);
                    if (res.status === 'success') {
                        showAlert("Memo Archived", `Memo ${refNo} has been removed from the portal.`, "success");
                        setViewingMemo(null); fetchDatabase(true);
                    } else { showAlert("Archive Failed", "Failed to archive memo.", "error"); }
                } else {
                    if(!window.confirm(`Are you sure you want to request Archiving for memo ${refNo}? The Master Admin must approve this action.`)) return;
                    setIsApprovingMemo(true);
                    const res = await sendPostRequest({ action: 'requestMemoAction', requestType: 'ARCHIVE', refNo: refNo, requestedBy: userRole });
                    setIsApprovingMemo(false);
                    if (res.status === 'success') {
                        showAlert("Archive Request Sent", `Your request to archive Memo ${refNo} has been sent to the Master Admin.\nReq ID: ${res.reqId}`, "success");
                        setViewingMemo(null); fetchDatabase(true);
                    } else { showAlert("Request Failed", "Failed to send archive request.", "error"); }
                }
            };

            const handleResolveMemoRequest = async (reqId, actionVal) => {
                setIsResolving(reqId);
                const res = await sendPostRequest({ action: 'resolveMemoRequest', reqId: reqId, action: actionVal });
                setIsResolving(null);
                if (res.status === 'success') {
                    showAlert("Request Processed", `The modification request has been ${actionVal === 'APPROVE' ? 'Approved & Applied' : 'Rejected'}.`, "success");
                    fetchDatabase(true);
                } else { showAlert("Error", res.message || "Failed to process request.", "error"); }
            };

            const handleSignatureSubmit = async (signatureBase64) => {
                if (!signatureBase64) { showAlert("Missing Signature", "Please physically draw your signature on the pad before confirming.", "error"); return; }
                if (!signData.name.trim() || !signData.dept.trim()) { showAlert("Missing Details", "Please enter your full name and department.", "error"); return; }
                setIsSubmitting(true);
                const payload = { action: 'submitSignature', refNo: viewingMemo['Ref No'] || viewingMemo[0], name: signData.name, dept: signData.dept, signature: signatureBase64 };
                const res = await sendPostRequest(payload);
                setIsSubmitting(false);
                if (res.status === 'success') {
                    showAlert("Acknowledgment Saved", `Thank you, ${signData.name}!\n\nYour digital signature has been saved to the receiving record.`, "success");
                    setSignModalOpen(false); setSignData({name: '', dept: ''}); fetchDatabase(true); 
                } else { showAlert("Network Error", "Failed to save signature.", "error"); }
            };

            const handlePrintMemo = () => { window.print(); };

            // ---- PORTAL HANDLERS ----
            const handleAddNewsSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const payload = { action: 'addNews', title: newsData.title, content: newsData.content, type: newsData.type, author: userRole };
                const res = await sendPostRequest(payload);
                setIsSubmitting(false);
                if (res.status === 'success') {
                    showAlert("News Published", "The announcement has been posted successfully.", "success");
                    setShowAddNews(false); unlockScroll(); setNewsData({ title: '', content: '', type: 'Standard' }); fetchDatabase(true);
                } else { showAlert("Error", "Failed to post news.", "error"); }
            };

            const handleEventSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const payload = { action: 'addEvent', title: eventData.title, date: eventData.date, time: eventData.time };
                const res = await sendPostRequest(payload);
                setIsSubmitting(false);
                if (res.status === 'success') {
                    showAlert("Event Scheduled", "The event has been successfully added to the Master Calendar.", "success");
                    setShowAddEvent(false); unlockScroll(); setEventData({ title: '', date: '', time: '' }); fetchDatabase(true); 
                } else { showAlert("Network Error", "Failed to add event.", "error"); }
            };

            const handleEditEventSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const payload = { action: 'editEventTime', dateText: editEventData.oldDateText, title: editEventData.oldTitle, newTime: editEventData.newTime };
                const res = await sendPostRequest(payload);
                setIsSubmitting(false);
                if (res.status === 'success') {
                    showAlert("Time Updated", "The event time has been successfully updated.", "success");
                    setShowEditEvent(false); unlockScroll(); setEditEventData({ oldDateText: '', oldTitle: '', newTime: '' }); fetchDatabase(true); 
                } else { showAlert("Update Failed", "Could not locate event.", "error"); }
            };

            const handleGlobalUnlock = async (e) => { 
                e.preventDefault(); 
                setIsVerifyingLogin(true);
                const res = await sendPostRequest({ action: 'verifyPin', pin: globalPinInput });
                setIsVerifyingLogin(false);
                if (res.status === 'success') { 
                    setGlobalPinFeedback({ type: 'success', text: 'Verification Successful. Unlocking...' });
                    setTimeout(() => { setGlobalUnlocked(true); setGlobalPinFeedback(null); }, 1000);
                } else { 
                    setGlobalPinFeedback({ type: 'error', text: 'Invalid Site PIN. Please check your credentials.' });
                    setGlobalPinInput(''); setTimeout(() => setGlobalPinFeedback(null), 3000);
                } 
            };

            const submitRoleLogin = async (e) => {
                e.preventDefault();
                setIsVerifyingLogin(true);
                const res = await sendPostRequest({ action: 'verifyPin', pin: rolePinInput });
                setIsVerifyingLogin(false);
                if (res.status === 'success' && res.role !== 'portal_lock') { 
                    setUserRole(res.role); setShowRoleLogin(false); unlockScroll(); setRolePinInput(''); setRoleLoginFeedback(null);
                    if (pendingAction === 'census' && (res.role === 'admin' || res.role === 'admitting')) { setActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); } 
                    else if (pendingAction === 'admin' && res.role === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); } 
                    else if (pendingAction === 'add_event' && (res.role === 'admin' || res.role === 'dept_head')) { setShowAddEvent(true); } 
                    else if (pendingAction === 'add_news' && (res.role === 'admin' || res.role === 'dept_head')) { setShowAddNews(true); }
                    else if (pendingAction === 'add_memo' && (res.role === 'admin' || res.role === 'dept_head')) { setShowAddMemo(true); }
                    setPendingAction(null);
                } else { 
                    setRoleLoginFeedback({ type: 'error', text: 'Invalid PIN or insufficient permissions.' });
                    setRolePinInput(''); setTimeout(() => setRoleLoginFeedback(null), 3000);
                }
            };

            const handleSecureAction = (actionType) => {
                const requireRole = (roles, fallbackAction) => {
                    if (roles.includes(userRole)) {
                        if(fallbackAction === 'census') { setActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); }
                        else if(fallbackAction === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); }
                        else if(fallbackAction === 'add_event') { setShowAddEvent(true); }
                        else if(fallbackAction === 'add_news') { setShowAddNews(true); }
                        else if(fallbackAction === 'add_memo') { setShowAddMemo(true); }
                    } else { setPendingAction(fallbackAction); setShowRoleLogin(true); }
                };

                if (actionType === 'census') requireRole(['admin', 'admitting'], 'census');
                else if (actionType === 'admin') requireRole(['admin'], 'admin');
                else if (actionType === 'add_event') requireRole(['admin', 'dept_head'], 'add_event');
                else if (actionType === 'add_news') requireRole(['admin', 'dept_head'], 'add_news');
                else if (actionType === 'add_memo') requireRole(['admin', 'dept_head'], 'add_memo');
                else { setActiveTab(actionType); setMobileMenuOpen(false); setSelectedDept(null); }
            };

            const handleDccUpload = async (e) => {
                e.preventDefault();
                const email = e.target.email.value; const title = e.target.title.value; const file = fileInputRef.current.files[0];
                if (!email || !title || !file) { showAlert("Missing Fields", "Please fill in all requested fields.", "error"); return; }
                if (file.size > 35 * 1024 * 1024) { showAlert("File Too Large", "This file exceeds the 35MB safe upload limit.\nPlease compress any images inside your document.", "error"); return; }
                if (file.type === "application/pdf") { showAlert("Invalid File Type", "PDFs are blocked for draft submissions. Please upload an editable format (.docx, .xlsx).", "error"); return; }

                const reader = new FileReader();
                reader.onload = async () => {
                    setIsSubmitting(true);
                    const base64 = reader.result.split(',')[1];
                    const payload = { action: "submitDCC", email: email, title: title, fileName: file.name, mimeType: file.type, fileBase64: base64 };
                    const res = await sendPostRequest(payload);
                    setIsSubmitting(false);
                    if (res.status === 'success') { 
                        showAlert("Submission Successful", `Your document draft has been pushed to the Temp Folder.\n\nTracking ID: ${res.trackingId}\n\nA receipt has been emailed to you.`, "success");
                        e.target.reset(); fetchDatabase(true); 
                    }
                };
                reader.readAsDataURL(file);
            };

            const handleResolveDCC = async (e, targetTrackingId) => {
                e.preventDefault();
                const file = e.target.stampedFile.files[0];
                if (!targetTrackingId || !file) { showAlert("Missing Details", "Please select a stamped file to upload.", "error"); return; }

                const reader = new FileReader();
                reader.onload = async () => {
                    setIsResolving(targetTrackingId);
                    const base64 = reader.result.split(',')[1];
                    const payload = { action: "resolveDCC", trackingId: targetTrackingId, stampedFileName: file.name, mimeType: file.type, stampedFileBase64: base64 };
                    const res = await sendPostRequest(payload);
                    setIsResolving(null);
                    if (res.status === 'success') { 
                        showAlert("Resolution Complete", "The file was successfully saved to the Vault.\n\nThe Temp draft has been purged, and the department has been emailed their stamped copy.", "success");
                        e.target.reset(); fetchDatabase(true); 
                    } else { showAlert("Resolution Failed", "Failed to resolve request. Check network connection.", "error"); }
                };
                reader.readAsDataURL(file);
            };

            const handleSaveCensus = async () => {
                setIsSubmitting(true);
                const updatesArray = census.map(c => ({ department: c.Department || c[0], count: c['Patient Count'] || c[1] }));
                const res = await sendPostRequest({ action: 'updateCensus', updates: updatesArray });
                setIsSubmitting(false);
                if (res.status === 'success') { showAlert("Census Updated", "The patient census has been successfully published to the main dashboard.", "success"); fetchDatabase(true); } 
                else { showAlert("Update Failed", "Could not connect to the database to update the census.", "error"); }
            };

            const handleTrackRequest = async (e) => {
                e.preventDefault();
                if (!trackQuery) return;
                setIsTracking(true);
                try {
                    const fetchUrl = `${API_URL}?action=trackRequest&query=${encodeURIComponent(trackQuery)}`;
                    const response = await fetch(fetchUrl, { redirect: "follow" }).catch(() => ({ ok: false }));
                    if (response && response.ok) {
                        const result = await response.json();
                        if (result.status === 'success') setTrackResult(result.data); 
                        else setTrackResult({ error: result.message }); 
                    } else { setTrackResult({ 'Tracking ID': trackQuery, 'Title': 'System Test Form', 'Status': 'PENDING REVIEW' }); }
                } catch(e) { setTrackResult({ error: "Network error tracking request." }); }
                setIsTracking(false);
            };

            // --- RENDER SAFE COMPONENTS ---
            const renderActiveTabContent = () => {
                if (activeTab === 'home') {
                    return (
                        <div className="animate-fade-in space-y-8">
                            <div className="structured-card p-0 overflow-hidden flex flex-col md:flex-row bg-tdmh-blue border-tdmh-blue">
                                <div className="p-8 md:p-12 lg:p-16 flex-1 flex flex-col justify-center relative z-10">
                                    <span className="px-3 py-1 bg-tdmh-green text-white border border-green-600 text-[10px] font-bold tracking-[0.2em] uppercase mb-5 inline-block w-max rounded shadow-sm">CQI Central Hub</span>
                                    <h2 className="text-3xl md:text-5xl font-black mb-4 tracking-tight text-white">Welcome to TDMH CQI Portal V2</h2>
                                    <p className="text-blue-100 font-medium max-w-xl leading-relaxed text-base">Your centralized administrative command center. Access standard forms, ISO document control, inter-departmental memos, and live hospital census tracking.</p>
                                </div>
                            </div>
                            
                            {slideshow.length > 0 && (
                                <div className="structured-card p-0 overflow-hidden relative h-80 md:h-[600px] flex items-center justify-center bg-slate-900 group shadow-lg cursor-pointer hover:shadow-xl transition-shadow border-2 border-slate-100">
                                    <div className="absolute top-4 right-4 z-30 bg-black/70 backdrop-blur text-white px-5 py-2.5 rounded-full text-sm font-bold flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity" onClick={() => setSlideshowIndex(currentSlide)}>
                                        <Icons.Maximize className="w-5 h-5" /> View Fullscreen
                                    </div>
                                    {slideshow.map((slide, index) => (
                                        <div key={index} className={`absolute inset-0 transition-opacity duration-1000 ${index === currentSlide ? 'opacity-100 z-10' : 'opacity-0 z-0'}`} onClick={() => setSlideshowIndex(currentSlide)}>
                                            <div className="absolute inset-0 bg-slate-900 overflow-hidden pointer-events-none">
                                                <img src={getDriveImage(slide['Image URL'])} className="absolute inset-0 w-full h-full object-cover opacity-30 blur-2xl scale-110" alt="bg" />
                                            </div>
                                            <img src={getDriveImage(slide['Image URL'])} className="absolute inset-0 w-full h-full object-contain drop-shadow-2xl" alt={slide['Title']} />
                                            <div className="absolute inset-x-0 bottom-0 pt-32 pb-8 px-8 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent flex flex-col items-center justify-end text-center text-white pointer-events-none">
                                                <h3 className="text-3xl md:text-5xl font-black mb-2 drop-shadow-xl">{slide['Title']}</h3>
                                                <p className="font-bold tracking-widest uppercase text-sm md:text-base text-blue-200 drop-shadow-md">{slide['Subtitle']}</p>
                                            </div>
                                        </div>
                                    ))}
                                    <div className="absolute bottom-4 left-0 right-0 z-20 flex justify-center gap-2" onClick={e => e.stopPropagation()}>
                                        {slideshow.map((_, index) => (
                                            <button key={index} onClick={(e) => { e.stopPropagation(); setCurrentSlide(index); }} className={`h-2.5 rounded-full transition-all duration-300 shadow-sm ${index === currentSlide ? 'bg-tdmh-green w-8' : 'bg-white/70 w-2.5 hover:bg-white'}`}></button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="structured-card p-8 md:p-10 border-t-4 border-tdmh-green">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                                    <div>
                                        <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3>
                                        <p className="text-sm text-slate-500">Live patient tracking metrics across major medical departments. This data is updated securely by the Admitting Department.</p>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-200 px-5 py-3 rounded-xl text-left md:text-right shrink-0 shadow-sm w-full md:w-auto flex flex-row md:flex-col justify-between md:justify-center items-center md:items-end">
                                        <div className="text-xs font-black text-tdmh-green uppercase tracking-widest mb-0.5">{liveTime.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                                        <div className="text-xl font-black text-tdmh-blue tracking-tight">{liveTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
                                    {census.map((c, i) => {
                                        const count = parseInt(c['Patient Count'] || c.count || c[1] || 0);
                                        const label = c.Department || c.dept || c[0];

                                        const textColors = ['text-blue-600', 'text-emerald-600', 'text-purple-600', 'text-pink-600', 'text-red-600'];
                                        let widthPercentage = Math.max(5, Math.min(100, (count / 50) * 100));
                                        
                                        return (

                                        )
                                    })}
                                </div>
                            </div>

                    );
                }

                if (activeTab === 'census') {
                    return (
                        <div className="animate-fade-in structured-card p-8 md:p-12 border-t-4 border-t-tdmh-green">

                                <div>
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3>
                                    <p className="text-sm text-slate-500">Live patient tracking metrics across major medical departments. Update the counts below and click Save.</p>
                                </div>
                                <div className="bg-slate-50 border border-slate-200 px-5 py-3 rounded-xl text-left md:text-right shrink-0 shadow-sm w-full md:w-auto flex flex-row md:flex-col justify-between md:justify-center items-center md:items-end">
                                    <div className="text-xs font-black text-tdmh-green uppercase tracking-widest mb-0.5">{liveTime.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                                    <div className="text-xl font-black text-tdmh-blue tracking-tight">{liveTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 mb-10">
                                {census.map((c, i) => (
                                    <div key={i} className="bg-white p-6 rounded-2xl border-2 border-slate-100 text-center focus-within:border-tdmh-green transition-colors">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-4">{c.Department || c[0]}</label>
                                        {(userRole === 'admin' || userRole === 'admitting') ? (
                                            <input type="number" value={c['Patient Count'] || c[1] || ''} onChange={(e) => { const newCensus = [...census]; newCensus[i] = {...newCensus[i], 'Patient Count': e.target.value}; setCensus(newCensus); }} className="w-full p-4 rounded-xl border border-slate-300 font-black text-4xl text-tdmh-blue text-center focus:border-tdmh-green focus:ring-1 outline-none transition-colors" />
                                        ) : (
                                            <div className="w-full p-4 rounded-xl border border-slate-100 bg-slate-50 font-black text-4xl text-tdmh-blue text-center">{c['Patient Count'] || c[1] || '0'}</div>
                                        )}
                                    </div>
                                ))}
                            </div>
                            {(userRole === 'admin' || userRole === 'admitting') && (
                                <div className="flex justify-end gap-4 border-t border-slate-200 pt-8">
                                    <button onClick={handleSaveCensus} disabled={isSubmitting} className="px-8 py-4 bg-tdmh-green text-white font-black uppercase rounded-xl hover:bg-green-700 shadow-lg disabled:opacity-50 transition-colors w-full sm:w-auto">
                                        {isSubmitting ? "Saving..." : "Save & Publish"}
                                    </button>
                                </div>
                            )}
                        </div>
                    );
                }

                if (activeTab === 'news') {
                    return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-xl"><Icons.Bell className="w-6 h-6" /></div>News & Announcements</h2>
                                    <p className="text-slate-500 font-medium mt-1">Stay updated with the latest portal changes and hospital notices.</p>
                                </div>
                                {(userRole === 'admin' || userRole === 'dept_head') && (
                                    <button onClick={() => handleSecureAction('add_news')} className="flex items-center justify-center gap-2 bg-tdmh-blue text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm shrink-0 hover:bg-blue-900 transition-colors">
                                        <Icons.Plus className="w-4 h-4" /> Add News
                                    </button>
                                )}

                                    const isWelcomePost = String(n.Title || n.title || n[3] || '').includes('V2 is Live');
                                    return (
                                        <div key={n.id || i} className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm relative group hover:shadow-md transition-shadow">

                                                <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={() => showAlert("Edit Restricted", "Edit row feature is accessible via the Master Google Sheet.", "info")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-tdmh-blue" title="Edit"><Icons.Edit className="w-4 h-4" /></button>
                                                    <button onClick={() => showAlert("Delete Restricted", "Delete row feature is accessible via the Master Google Sheet.", "info")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-red-600" title="Delete"><Icons.Trash className="w-4 h-4" /></button>
                                                </div>
                                            )}
                                            <span className={`text-[10px] font-bold tracking-[0.2em] uppercase block mb-2 ${n.Type === 'Urgent' ? 'text-red-500' : 'text-tdmh-blue'}`}>{n.Type || n[2]}</span>
                                            <h3 className="text-xl md:text-2xl font-black text-slate-800">{n.Title || n[3]}</h3>
                                            <span className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 mt-2 inline-block">{n.Date || n[1]}</span>
                                            <p className="text-slate-600 mt-4 leading-relaxed whitespace-pre-line">{n.Content || n[4]}</p>

                                            {isWelcomePost && (
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 pt-6 border-t border-slate-100">
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Menu className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Top Navigation</strong> <span className="text-slate-500 text-xs">Tools are safely tucked in tabs at the top. Hover over tabs and use your mouse wheel to scroll horizontally.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Box className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Departments</strong> <span className="text-slate-500 text-xs">Clicking a department is open to everyone. Logging in is only required if you are uploading restricted tools.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Folder className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">DCC & Forms</strong> <span className="text-slate-500 text-xs">Consolidated area to find Universal Forms, ISO Requirements, or request new Control Numbers.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.FileText className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Memos & Calendar</strong> <span className="text-slate-500 text-xs">Viewing is open to all staff. Authorized Dept Heads and Admins must log in to generate new Memos or Events.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                                        <div className="text-tdmh-green mt-0.5"><Icons.Activity className="w-5 h-5"/></div>
                                                        <div><strong className="text-emerald-900 block text-sm mb-0.5">Daily Census</strong> <span className="text-emerald-700 text-xs">Live patient tracking metrics. (Updated securely by the Admitting Department via the locked Census tab).</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-red-50 p-4 rounded-xl border border-red-100">
                                                        <div className="text-red-500 mt-0.5"><Icons.Shield className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-base mb-0.5">Enhanced Security</strong> <span className="text-slate-600 text-sm leading-snug block">You will notice a Shield Icon (Admin) and options to "Add Memos/Events". These actions require the Master PIN to ensure our data remains secure.</span></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'memos') {
                    return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-xl"><Icons.FileText className="w-6 h-6" /></div>Inter-Office Memos</h2>
                                    <p className="text-slate-500 font-medium mt-1">Official digital repository for published hospital memorandums.</p>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                                    <div className="bg-blue-50 text-tdmh-blue text-xs font-bold px-4 py-2.5 rounded-lg border border-blue-100 flex items-center justify-center gap-2 shadow-sm shrink-0">
                                        <Icons.Activity className="w-4 h-4" /> {visibleMemos.length} Active Records
                                    </div>
                                    {(userRole === 'admin' || userRole === 'dept_head') && (
                                        <button onClick={() => handleSecureAction('add_memo')} className="flex items-center justify-center gap-2 bg-tdmh-blue text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md hover:bg-blue-900 transition-colors">
                                            <Icons.Plus className="w-4 h-4" /> New Memo
                                        </button>
                                    )}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                {visibleMemos.length === 0 ? (
                                    <div className="col-span-1 lg:col-span-2 text-center p-12 bg-slate-50 rounded-2xl border border-slate-200">
                                        <Icons.FileText className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                                        <p className="text-slate-500 italic">No published memos currently available in the database.</p>
                                    </div>
                                ) : visibleMemos.map((m, i) => {
                                    const sigCount = signatures.filter(s => (s['Memo Ref No'] || s[0]) === (m['Ref No'] || m[0])).length;
                                    const parsedDate = formatDateFriendly(m.Date || m[1]);

                                    return (
                                    <div key={i} className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row gap-5 relative group hover:shadow-md transition-shadow hover:border-tdmh-blue">
                                        <div className="bg-blue-50 text-tdmh-blue p-4 rounded-xl flex flex-col items-center justify-center w-full sm:w-[90px] border border-blue-100 shrink-0 cursor-pointer" onClick={() => setViewingMemo(m)}>
                                            <span className="text-xs font-bold uppercase tracking-widest">{parsedDate.month}</span>
                                            <span className="text-3xl font-black">{parsedDate.day}</span>
                                        </div>
                                        <div className="flex-1 min-w-0 flex flex-col justify-center cursor-pointer" onClick={() => setViewingMemo(m)}>
                                            <div className="flex gap-2 items-center mb-1">
                                                <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded border border-slate-200 uppercase tracking-widest">REF: {m['Ref No'] || m[0]}</span>
                                                {(m.Urgency || m.urgency || m[7]) === 'High' && <span className="text-[10px] font-bold bg-red-50 text-red-600 px-2.5 py-1 rounded border border-red-200 uppercase tracking-widest">Urgent</span>}
                                            </div>
                                            <h3 className="text-lg font-black text-slate-800 mt-1 leading-tight truncate group-hover:text-tdmh-blue transition-colors">{m.Subject || m[4]}</h3>
                                            <p className="text-slate-500 text-xs mt-1.5 truncate">From: {m.From || m[3]} &bull; For: {m.For || m[2]}</p>
                                        </div>
                                        <div className="flex flex-col items-end shrink-0 gap-2 mt-2 sm:mt-0 border-t sm:border-t-0 border-slate-100 pt-3 sm:pt-0">
                                            {(userRole === 'admin' || userRole === 'dept_head') && (
                                                <div className="flex gap-2 w-full sm:w-auto">
                                                    <button onClick={(e) => {
                                                        e.stopPropagation();
                                                        setMemoData({ forDept: m.For || m[2], fromName: m.From || m[3], subject: m.Subject || m[4], body: m.Body || m[5], urgency: m.Urgency || m[7] || 'Normal' });
                                                        setEditMemoRef(m['Ref No'] || m[0]); 
                                                        setMemoRequestMode(userRole !== 'admin');
                                                        setShowAddMemo(true);
                                                    }} className="flex-1 sm:flex-none text-tdmh-blue hover:bg-blue-100 bg-blue-50 px-3 py-2 rounded-lg border border-blue-200 shadow-sm transition-colors" title="Edit Memo"><Icons.Edit className="w-4 h-4"/></button>
                                                    <button onClick={(e) => {
                                                        e.stopPropagation();
                                                        handleArchiveMemo(m['Ref No'] || m[0]);
                                                    }} className="flex-1 sm:flex-none text-red-600 hover:bg-red-100 bg-red-50 px-3 py-2 rounded-lg border border-red-200 shadow-sm transition-colors" title="Archive Memo"><Icons.Trash className="w-4 h-4"/></button>
                                                </div>
                                            )}
                                            <div className="text-[10px] text-slate-400 font-bold tracking-widest uppercase flex items-center gap-1 w-full sm:w-auto justify-end mt-auto pt-2">
                                                <Icons.PenTool className="w-3 h-3" /> {sigCount} Sigs
                                            </div>
                                        </div>
                                    </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'dcc') {
                    const sortedUniversal = [...universalForms].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));
                    const sortedISO = [...isoRequirements].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));
                    
                    return (
                        <div className="animate-fade-in flex flex-col xl:flex-row gap-6">
                            <div className="w-full xl:w-72 shrink-0 flex flex-col gap-3">
                                <div className="bg-slate-900 p-5 rounded-xl text-white mb-2 shadow-md">
                                    <h3 className="font-bold tracking-widest text-xs uppercase mb-1">Document Control</h3>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wider">Official Repository Center</p>
                                </div>
                                <div className="flex flex-col gap-3">
                                    {[{ id: 'universal', label: 'Universal Forms', note: 'Access standardized, hospital-wide documents.' },
                                      { id: 'iso requirements', label: 'ISO Requirements', note: 'Retrieve official Document Control Center (DCC) and ISO compliance documentation.' },
                                      { id: 'request control no.', label: 'Request Control No.', note: 'Submit a formal request to the DCC to assign an official ISO Control Number.' }]
                                      .map(cat => (
                                        <button key={cat.id} onClick={() => setDccActiveCategory(cat.id)} className={`w-full text-left px-5 py-4 rounded-xl font-black text-sm transition-all border ${dccActiveCategory === cat.id ? 'bg-tdmh-blue text-white border-transparent shadow-lg scale-[1.02]' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}>
                                            {cat.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="flex-1 structured-card p-6 md:p-10 min-h-[500px]">
                                <div className="border-b border-slate-200 pb-6 mb-6">
                                    <h3 className="text-2xl font-black text-slate-800 capitalize mb-3 tracking-tight">{dccActiveCategory === 'iso requirements' ? 'ISO Requirements' : `${dccActiveCategory}`}</h3>
                                </div>

                                {dccActiveCategory === 'request control no.' && (
                                    <div className="text-left">
                                        <div className="flex flex-col sm:flex-row justify-between items-center bg-slate-900 text-white rounded-2xl p-6 mb-8 shadow-md">
                                            <div className="flex items-center gap-4 mb-4 sm:mb-0">
                                                <div className="p-3 bg-slate-800 rounded-xl border border-slate-700 shadow-inner"><Icons.Mail className="w-6 h-6 text-tdmh-green" /></div>
                                                <div><h4 className="font-bold text-base md:text-lg leading-tight">System Email Capacity</h4><p className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-1">Receipts & Routing</p></div>
                                            </div>
                                            <div className="flex gap-6 items-center">
                                                <div className="text-center">
                                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Remaining Today</div>
                                                    <div className={`text-3xl font-black ${emailQuota !== null && emailQuota < 10 ? 'text-red-400 animate-pulse-slow' : 'text-tdmh-green'}`}>{emailQuota !== null ? emailQuota : '--'}</div>
                                                </div>
                                                <div className="w-px h-10 bg-slate-700"></div>
                                                <div className="text-center">
                                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center justify-center gap-1"><Icons.Clock className="w-3 h-3"/> Resets In</div>
                                                    <div className="text-xl font-black text-blue-200 tracking-wider font-mono">{timeUntilReset || '--:--:--'}</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="text-center py-4 mb-6">
                                            <div className="w-20 h-20 bg-emerald-50 text-tdmh-green rounded-2xl flex items-center justify-center mx-auto mb-6 border border-emerald-100"><Icons.Upload className="w-10 h-10" /></div>
                                            <h2 className="text-3xl font-black text-slate-800 mb-3 tracking-tight">Request Control Number</h2>
                                            <p className="text-slate-500 max-w-lg mx-auto leading-relaxed">Upload drafted forms here. CQI will assign an official ISO Control Number, store it in the Vault, and email the finalized document back to you.</p>
                                        </div>
                                        
                                        <form onSubmit={handleDccUpload} className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-xl mx-auto">
                                            <div className="mb-5">
                                                <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Official Dept Email <span className="text-red-500">*</span></label>
                                                <input name="email" type="email" required className="w-full p-3 border border-slate-300 rounded-xl focus:border-tdmh-green outline-none" placeholder="dept@tdmh.com" />
                                            </div>
                                            <div className="mb-5">
                                                <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Form Title <span className="text-red-500">*</span></label>
                                                <input name="title" type="text" required className="w-full p-3 border border-slate-300 rounded-xl focus:border-tdmh-green outline-none" placeholder="e.g. Daily Temperature Log" />
                                            </div>
                                            <div className="mb-8">
                                                <div className="flex justify-between items-end mb-2">
                                                    <label className="block text-xs font-bold text-slate-500 uppercase">Upload Draft <span className="text-red-500">*</span></label>
                                                    <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-1 rounded border border-slate-200">MAX: 35MB</span>
                                                </div>
                                                <input ref={fileInputRef} type="file" accept=".docx,.xlsx,.doc,.xls" required className="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:bg-emerald-50 file:text-tdmh-green file:border file:border-emerald-200 file:font-bold hover:file:bg-emerald-100 transition-colors cursor-pointer border border-slate-200 p-1 rounded-2xl" />
                                                <div className="flex items-center gap-2 mt-3 text-[10px] text-red-500 font-bold uppercase tracking-wider bg-red-50 px-3 py-2 rounded-lg border border-red-100 w-max"><Icons.AlertCircle className="w-4 h-4" /> NO PDF FILES ALLOWED</div>
                                            </div>
                                            <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-green text-white font-black tracking-wider uppercase py-4 rounded-xl shadow-lg shadow-green-900/20 hover:bg-green-700 transition-transform hover:-translate-y-1 disabled:opacity-50 disabled:hover:translate-y-0">
                                                {isSubmitting ? "Uploading Securely..." : "Submit to CQI Queue"}
                                            </button>
                                        </form>
                                    </div>
                                )}

                                {(dccActiveCategory === 'universal' || dccActiveCategory === 'iso requirements') && (() => {
                                    const list = dccActiveCategory === 'universal' ? sortedUniversal : sortedISO;
                                    return (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {list.length === 0 && <p className="text-slate-500 italic col-span-full">No forms mapped yet.</p>}
                                            {list.map((t, i) => {
                                                const toolColorClass = getToolColor(t.Color || t.color || t[3], t['Form Title'] || t[0]);
                                                const toolIconStr = String(t.Icon || t.icon || t['Icon Name'] || t[4] || '').trim();
                                                const ToolIconCmp = getToolIcon(toolIconStr, t['Form Title'] || t[0]);
                                                return (
                                                    <div key={i} className="flex flex-col p-5 rounded-xl border border-slate-200 hover:border-tdmh-blue hover:bg-slate-50 transition-colors bg-white shadow-sm group">
                                                        <div className="flex items-start gap-4 mb-5">
                                                            <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 border transition-colors shadow-sm ${toolColorClass}`}><ToolIconCmp className="w-5 h-5" /></div>
                                                            <div className="pt-0.5">
                                                                <h4 className="font-bold text-slate-800 text-sm leading-tight transition-colors group-hover:text-tdmh-blue">{t['Form Title'] || t[0]}</h4>
                                                                <p className="text-xs text-slate-500 mt-1.5 leading-snug">{t.Description || t[1]}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                                                            <a href={t.Link || t[2]} target="_blank" className="flex-1 bg-tdmh-blue text-white text-center py-2.5 rounded-lg text-xs font-bold hover:bg-blue-900 transition-colors shadow-sm">Open Document</a>
                                                            <button onClick={() => { setQrLightbox({url: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(t.Link || t[2] || '')}`, title: t['Form Title'] || t[0]}); unlockScroll(); }} className="px-4 py-2.5 bg-white text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-50 transition-colors flex items-center gap-1.5 border border-slate-200 shadow-sm hover:text-slate-800"><Icons.QrCode className="w-4 h-4" /> QR</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )
                                })()}
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'track') {
                    return (
                        <div className="animate-fade-in structured-card p-8 md:p-12 max-w-3xl mx-auto">
                            <div className="text-center mb-10">
                                <div className="w-16 h-16 bg-blue-50 text-tdmh-blue rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100">
                                    <Icons.Search className="w-8 h-8" />
                                </div>
                                <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-2">Track Request Status</h2>
                                <p className="text-slate-500">Enter your Reference ID or Dept Email to check the live status of your Form.</p>
                            </div>
                            <form onSubmit={handleTrackRequest} className="flex flex-col sm:flex-row gap-3 mb-10">
                                <input type="text" value={trackQuery} onChange={(e)=>setTrackQuery(e.target.value)} className="flex-1 p-4 border-2 rounded-xl focus:border-tdmh-blue outline-none text-lg font-medium" placeholder="e.g. CQI-1029 or dept@tdmh.com" />
                                <button type="submit" disabled={isTracking} className="bg-tdmh-blue text-white px-8 py-4 font-black uppercase tracking-widest rounded-xl shadow-lg hover:bg-blue-900 transition-colors w-full sm:w-auto">
                                    {isTracking ? "..." : "Track"}
                                </button>
                            </form>
                            {trackResult && (
                                <div className="bg-white border-2 border-slate-100 rounded-2xl p-8 shadow-sm">
                                    {trackResult.error ? (
                                        <p className="text-red-500 font-bold text-center">{trackResult.error}</p>
                                    ) : (
                                        <>
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                                <div>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Tracking ID: {trackResult['Tracking ID']}</p>

                                            </div>

                            </div>

                                    if (matchedKey) IconCmp = Icons[matchedKey];

                                        const catStr = String(dept['Category'] || dept.category || '').toLowerCase();

                                                </div>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );

                    const calYear = currentCalDate.getFullYear();
                    const calMonth = currentCalDate.getMonth();
                    const monthName = currentCalDate.toLocaleString('default', { month: 'long' });
                    const daysInMonthCount = new Date(calYear, calMonth + 1, 0).getDate();
                    const firstDayOfMonth = new Date(calYear, calMonth, 1).getDay();

                    const blankDays = Array.from({length: firstDayOfMonth}, (_, i) => i);

                        if (!val) return null;
                        let str = String(val).trim();
                        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return new Date(str + 'T12:00:00');
                        let d = new Date(str);
                        if (isNaN(d.getTime())) return null;
                        return d;
                    };
                    const eventDaysThisMonth = calendar.map(function(e) {
                        const d = getSafeDate(e.date || e['Date Text'] || e['Date'] || e[0] || e[1]);

                                    </div>
                                    <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">

                                                <div key={day} className="aspect-square p-1">

                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                            let displayDate = rawDate;
                                            if (safeDateObj) displayDate = safeDateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                                                        <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-2">
                                                            {displayDate} {displayTime ? `• ${displayTime}` : ''}

                                                                <button onClick={() => { setEditEventData({oldDateText: rawDate, oldTitle: ev['Event Title'] || ev.Title || ev[3], newTime: ''}); setShowEditEvent(true); }} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-1 rounded transition-colors" title="Edit Time"><Icons.Edit className="w-3 h-3" /></button>

                                                        </div>
                                                        <div className="text-base font-bold text-slate-800">{ev['Event Title'] || ev.Title || ev[3]}</div>

                                                </div>

                                        })}

                                </div>
                            </div>
                        </div>

                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );

                                        <p className="text-slate-500">No training videos found in database.</p>
                                    </div>
                                )}
                            </div>
                        </div>

                                            </div>
                                        ) : (

                                                    <div className="flex justify-between items-start mb-3">
                                                        <div className="min-w-0 pr-2">
                                                            <span className="text-[10px] font-bold bg-white text-slate-600 px-2 py-1 rounded-md border border-slate-200 uppercase tracking-widest shadow-sm">{req['Tracking ID']}</span>

                                                            <Icons.Download className="w-4 h-4"/>
                                                        </a>
                                                    </div>
                                                    <div className="mt-3 pt-3 border-t border-slate-200">

                                                        <button type="submit" disabled={isResolving === req['Tracking ID']} className="w-full bg-emerald-600 text-white font-black tracking-widest uppercase text-xs py-2.5 rounded-lg shadow-sm hover:bg-emerald-700 transition-colors disabled:opacity-50">
                                                            {isResolving === req['Tracking ID'] ? "Processing..." : "Approve & Route File"}
                                                        </button>
                                                    </div>
                                                </form>
