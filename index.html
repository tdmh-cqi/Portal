                                    <div key={i} className="structured-card p-5 group hover:border-tdmh-blue transition-colors shadow-sm">
                                        <div className="aspect-video bg-slate-900 rounded-xl mb-5 overflow-hidden border border-slate-200 relative shadow-inner">
                                            {vid['Video URL (Embed)'] ? (
                                                <iframe className="w-full h-full" src={vid['Video URL (Embed)']} frameBorder="0" allowFullScreen></iframe>
                                            ) : (
                                                <div className="w-full h-full flex flex-col items-center justify-center bg-slate-100 text-slate-400 absolute inset-0">
                                                    <Icons.Video className="w-12 h-12 mb-3 opacity-50" />
                                                    <span className="text-[10px] font-bold uppercase tracking-widest text-slate-500">Video Placeholder</span>
                                                    <span className="text-[9px] text-slate-400 mt-1">(Connect Google Drive Link)</span>
                                                </div>
                                            )}
                                        </div>
                                        <div className="px-2 pb-2"><span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[10px] font-bold uppercase tracking-widest rounded border border-slate-200">{vid['Module Number']}</span><h4 className="text-slate-800 font-black text-xl mt-2">{vid['Video Title']}</h4><p className="text-sm text-slate-500 mt-1">{vid.Description}</p></div>
                                    </div>
                                ))}
                                {agimat.length === 0 && (
                                    <div className="col-span-1 md:col-span-2 text-center p-10 bg-white border border-slate-200 rounded-xl">
                                        <Icons.Video className="w-12 h-12 text-slate-300 mx-auto mb-2" />
                                        <p className="text-slate-500">No training videos found in database.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                    case 'census': return (
                        <div className="animate-fade-in structured-card p-8 md:p-12 border-t-4 border-t-tdmh-green">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 border-b border-slate-200 pb-6 gap-4">
                                <div><h2 className="text-3xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><Icons.Activity className="w-8 h-8 text-tdmh-green" /> Admitting Census Entry</h2><p className="text-slate-500 text-sm mt-2">Data entered here instantly updates the public Home Dashboard metrics.</p></div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 mb-10">
                                {census.map((c, i) => (
                                    <div key={i} className="bg-white p-6 rounded-2xl border-2 border-slate-100 text-center focus-within:border-tdmh-green transition-colors">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-4">{c.Department || c[0]}</label>
                                        <input type="number" value={c['Patient Count'] || c[1] || ''} onChange={(e) => { const newCensus = [...census]; newCensus[i] = {...newCensus[i], 'Patient Count': e.target.value}; setCensus(newCensus); }} className="w-full p-4 rounded-xl border border-slate-300 font-black text-4xl text-tdmh-blue text-center focus:border-tdmh-green focus:ring-1 outline-none transition-colors" />
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-end gap-4 border-t border-slate-200 pt-8"><button onClick={handleSaveCensus} disabled={isSubmitting} className="px-8 py-4 bg-tdmh-green text-white font-black uppercase rounded-xl hover:bg-green-700 shadow-lg disabled:opacity-50 transition-colors">{isSubmitting ? "Saving..." : "Save & Publish to Dashboard"}</button></div>
                        </div>
                    );
                    default: return null;
                }
            }

            return (
                <div className="flex flex-col min-h-screen bg-pattern">
                    
                    {/* PHOTO VIEWER (LIGHTBOX) OVERLAY */}
                    {lightboxImg && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/95 backdrop-blur-md animate-fade-in" onClick={() => setLightboxImg(null)}>
                            <div className="relative max-w-7xl w-full max-h-[90vh] flex flex-col items-center justify-center animate-slide-up" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setLightboxImg(null)} className="absolute -top-12 right-0 md:-right-12 text-white hover:text-slate-300 transition-colors bg-white/10 p-2 rounded-full">
                                    <Icons.X className="w-8 h-8"/>
                                </button>
                                <img src={lightboxImg} className="w-full h-auto max-h-[85vh] object-contain rounded-xl shadow-2xl" alt="Enlarged View" />
                            </div>
                        </div>
                    )}

                    {/* NEWS WELCOME FLYER */}
                    {showNewsFlyer && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-2xl overflow-hidden relative transform animate-slide-up flex flex-col border border-slate-200 m-auto">
                                <button onClick={() => setShowNewsFlyer(false)} className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 z-20 transition-all bg-white p-2.5 rounded-full border border-slate-200 shadow-sm hover:bg-slate-50"><Icons.X className="w-5 h-5" /></button>
                                <div className="p-8 pb-6 bg-slate-50 border-b border-slate-100 flex flex-col items-center text-center shrink-0">
                                    <div className="w-16 h-16 bg-tdmh-blue text-white rounded-2xl flex items-center justify-center mb-4 shadow-md"><Icons.Bell className="w-8 h-8" /></div>
                                    <span className="text-[10px] font-bold tracking-[0.2em] text-tdmh-blue uppercase mb-2">TDMH Official Notice</span>
                                    <h2 className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight">TDMH CQI Portal V2 is Live!</h2>
                                </div>
                                <div className="p-8 md:px-10 bg-white overflow-y-auto custom-scrollbar max-h-[60vh]">
                                    <p className="text-slate-700 mb-6 text-lg font-bold leading-relaxed text-center">Welcome to your upgraded administrative command center.</p>
                                    <p className="text-slate-600 mb-8 leading-relaxed">We have completely redesigned the portal to be faster, more secure, and easier to navigate. Instead of scrolling through a massive list, everything is now neatly organized into tabs. Here is your quick guide to navigating the new system:</p>
                                    
                                    <ul className="space-y-5 mb-10">
                                        <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg mt-0.5 shrink-0"><Icons.Menu className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-base mb-0.5">The Top Navigation</strong> <span className="text-slate-600 text-sm leading-snug block">All your tools are now located in the tabs at the top of your screen. You can scroll horizontally through them!</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg mt-0.5 shrink-0"><Icons.Box className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-base mb-0.5">Departments Tab</strong> <span className="text-slate-600 text-sm leading-snug block">Clicking a department is open to everyone. Logging in is only required if you are uploading restricted tools.</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg mt-0.5 shrink-0"><Icons.Folder className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-base mb-0.5">DCC & Forms Tab</strong> <span className="text-slate-600 text-sm leading-snug block">We have consolidated all documents! Go here to find Universal Forms (DERF, Incident Reports), ISO Requirements, or to request a new Control Number.</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg mt-0.5 shrink-0"><Icons.FileText className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-base mb-0.5">Memos & Calendar</strong> <span className="text-slate-600 text-sm leading-snug block">Viewing is open to all staff. Authorized Dept Heads and Admins must log in to generate new Memos or Events.</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-emerald-50 text-tdmh-green rounded-lg mt-0.5 shrink-0"><Icons.Activity className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-base mb-0.5">Hospital Daily Census</strong> <span className="text-slate-600 text-sm leading-snug block">Check the Home Dashboard for live patient tracking. (Note: Only the Admitting Department can edit these numbers using a secure PIN).</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-red-50 text-red-500 rounded-lg mt-0.5 shrink-0"><Icons.Shield className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-base mb-0.5">Enhanced Security</strong> <span className="text-slate-600 text-sm leading-snug block">You will notice a Shield Icon (Admin) and options to "Add Memos/Events". These actions require the Master PIN to ensure our data remains secure.</span></div></li>
                                    </ul>

                                    <p className="text-slate-600 italic text-sm mb-8 text-center bg-slate-50 p-4 rounded-xl border border-slate-100">Take a moment to click through the tabs and explore the new layout. If you need any assistance, please contact the CQI Department.</p>
                                    <button onClick={() => setShowNewsFlyer(false)} className="px-8 py-4 bg-tdmh-blue hover:bg-blue-900 text-white font-black uppercase tracking-widest rounded-xl transition-all w-full text-sm shadow-lg shadow-blue-900/20 hover:-translate-y-1">Acknowledge & Enter Portal</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ROLE LOGIN MODAL */}
                    {showRoleLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 text-center relative animate-slide-up border border-slate-200 m-auto">
                                <button onClick={() => {setShowRoleLogin(false); setPendingAction(null);}} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors"><Icons.X className="w-5 h-5" /></button>
                                <div className="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-200"><Icons.Shield className="w-8 h-8" /></div>
                                <h3 className="text-xl font-black text-slate-800 mb-2">Role Verification</h3>
                                <p className="text-xs text-slate-500 mb-6 font-medium">Enter your specific PIN to continue.</p>
                                
                                {/* CUSTOM UI FEEDBACK BOX FOR ROLE PIN */}
                                {roleLoginFeedback && (
                                    <div className={`mb-6 text-sm font-bold p-3 rounded-lg shadow-sm transition-all animate-fade-in ${roleLoginFeedback.type === 'success' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200'}`}>
                                        {roleLoginFeedback.text}
                                    </div>
                                )}

                                <form onSubmit={submitRoleLogin}>
                                    <input type="password" value={rolePinInput} onChange={(e)=>setRolePinInput(e.target.value)} autoFocus className="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl text-center text-2xl font-black tracking-[0.3em] mb-4 focus:border-tdmh-blue outline-none transition-all" placeholder="••••••••" />
                                    <button type="submit" className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors">Unlock Access</button>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {/* MASTER ADMIN CONSOLE MODAL */}
                    {showAdminConsole && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-md animate-fade-in overflow-y-auto">
                            <div className="bg-slate-50 rounded-[2rem] shadow-2xl w-full max-w-7xl overflow-hidden flex flex-col h-[90vh] animate-slide-up border border-slate-700 m-auto">
                                <div className="bg-slate-900 p-6 flex justify-between items-center text-white shrink-0 shadow-md z-10">
                                    <div className="flex items-center gap-4">
                                        <div className="p-2.5 bg-slate-800 border border-slate-700 rounded-xl"><Icons.Shield className="w-6 h-6 text-tdmh-green" /></div>
                                        <div>
                                            <h2 className="text-2xl font-black tracking-tight">Master Admin Console</h2>
                                            <p className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-1">System Management & File Routing</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 items-center">
                                        <a href="https://docs.google.com/spreadsheets/d/1BGUrqHX9vThP21S3S6lhOekTw4r3xqEELIJpdfMDAuU/edit" target="_blank" className="hidden sm:flex px-6 py-2.5 bg-white/10 border border-white/20 text-white font-bold text-xs uppercase tracking-widest rounded-lg hover:bg-white/20 transition-colors">Raw Database</a>
                                        <button onClick={() => setShowAdminConsole(false)} className="text-slate-400 hover:text-white p-2 bg-slate-800 border border-slate-700 rounded-full transition-colors"><Icons.X className="w-5 h-5" /></button>
                                    </div>
                                </div>
                                <div className="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar flex flex-col lg:flex-row gap-8">
                                    <div className="w-full lg:w-1/3 flex flex-col gap-6">
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                                                <div className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center"><Icons.Upload className="w-5 h-5"/></div>
                                                <div><h3 className="font-black text-slate-800">Resolve Request (Option A)</h3><p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Stamp & Move to Vault</p></div>
                                            </div>
                                            <form onSubmit={handleResolveDCC} className="space-y-5">
                                                <div>
                                                    <label className="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2">Tracking ID to Resolve <span className="text-red-500">*</span></label>
                                                    <input type="text" value={resolveId} onChange={(e)=>setResolveId(e.target.value)} required className="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-emerald-500 outline-none font-bold text-slate-800" placeholder="e.g. CQI-1234" />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2">Upload Stamped Final File <span className="text-red-500">*</span></label>
                                                    <input ref={resolveFileRef} type="file" required className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:bg-emerald-500 file:text-white file:border-0 file:font-bold hover:file:bg-emerald-600 cursor-pointer" />
                                                </div>
                                                <button type="submit" disabled={isResolving} className="w-full bg-emerald-600 text-white font-black tracking-widest uppercase text-sm py-4 rounded-xl shadow-lg shadow-emerald-600/20 hover:bg-emerald-700 transition-colors disabled:opacity-50">
                                                    {isResolving ? "Processing..." : "Approve & Route File"}
                                                </button>
                                            </form>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center"><div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Forms</div><div className="text-3xl font-black text-tdmh-blue">{universalForms.length + isoRequirements.length || 0}</div></div>
                                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center"><div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Active Memos</div><div className="text-3xl font-black text-emerald-600">{memos.length || 0}</div></div>
                                        </div>
                                        
                                        {monitors.length > 0 && (
                                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                                <h3 className="font-black text-slate-800 flex items-center gap-2 mb-4">
                                                    <Icons.Activity className="w-5 h-5 text-tdmh-blue"/> System Monitors
                                                </h3>
                                                <div className="space-y-3 max-h-64 overflow-y-auto custom-scrollbar pr-2">
                                                    {monitors.map((m, i) => (
                                                        <a key={i} href={m.Link || m.link || m[1]} target="_blank" className="flex items-start gap-3 p-3 rounded-xl border border-slate-100 hover:border-tdmh-blue hover:bg-slate-50 transition-colors group">
                                                            <div className="p-2 bg-slate-100 text-slate-500 rounded-lg group-hover:bg-tdmh-blue group-hover:text-white transition-colors shrink-0 mt-0.5">
                                                                <Icons.Activity className="w-4 h-4" />
                                                            </div>
                                                            <div className="min-w-0">
                                                                <h5 className="text-sm font-bold text-slate-800 group-hover:text-tdmh-blue truncate">{m.Name || m.name || m[0]}</h5>
                                                                <p className="text-[10px] text-slate-500 line-clamp-2 mt-0.5 leading-snug">{m.Description || m.desc || m[2]}</p>
                                                            </div>
                                                        </a>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="w-full lg:w-2/3 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                                        <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-4">
                                            <h3 className="font-black text-slate-800 flex items-center gap-2"><Icons.FileText className="w-5 h-5 text-tdmh-blue"/> Master Index Reference</h3>
                                            <a href="https://docs.google.com/document/d/14_7i6NVjdQWP9bEw2k_qc4tBSzdzHJp96vVaGidxxgY/edit" target="_blank" className="text-xs font-bold text-tdmh-blue hover:underline">Open in new tab</a>
                                        </div>
                                        <div className="flex-1 bg-slate-100 rounded-xl overflow-hidden border-2 border-slate-200 min-h-[400px] lg:min-h-0 relative">
                                            <iframe src="https://docs.google.com/document/d/14_7i6NVjdQWP9bEw2k_qc4tBSzdzHJp96vVaGidxxgY/preview" className="absolute inset-0 w-full h-full border-none"></iframe>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ADD EVENT MODAL */}
                    {showAddEvent && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden relative transform animate-slide-up m-auto">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-black text-slate-800 text-xl">Schedule New Event</h3>
                                    <button onClick={() => setShowAddEvent(false)} className="text-slate-400 hover:text-slate-800 transition-colors"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 space-y-4" onSubmit={(e) => { e.preventDefault(); alert("Feature linked to Database!"); setShowAddEvent(false); }}>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Event Title</label><input type="text" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-purple-500" placeholder="e.g. Quality Assurance Meeting"/></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Date</label><input type="date" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-purple-500"/></div>
                                        <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Time</label><input type="time" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-purple-500"/></div>
                                    </div>
                                    <button type="submit" className="w-full bg-purple-600 text-white font-bold py-3.5 rounded-xl mt-4 hover:bg-purple-700 transition-colors">Add to Calendar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ADD NEWS MODAL */}
                    {showAddNews && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden relative transform animate-slide-up m-auto">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-black text-slate-800 text-xl">Post Announcement</h3>
                                    <button onClick={() => setShowAddNews(false)} className="text-slate-400 hover:text-slate-800 transition-colors"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 space-y-4" onSubmit={(e) => { e.preventDefault(); alert("Feature links to Database!"); setShowAddNews(false); }}>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Headline / Title</label><input type="text" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-tdmh-blue" placeholder="Announcement Title"/></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Category</label><select className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-tdmh-blue"><option>General</option><option>System Update</option><option>Urgent</option></select></div>
                                        <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Date</label><input type="date" required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-tdmh-blue"/></div>
                                    </div>
                                    <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Message Content</label><textarea required className="w-full p-3 rounded-lg border border-slate-300 outline-none focus:border-tdmh-blue resize-none h-32" placeholder="Write the announcement details here..."></textarea></div>
                                    <button type="submit" className="w-full bg-tdmh-blue text-white font-bold py-3.5 rounded-xl mt-4 hover:bg-blue-900 transition-colors shadow-sm">Post to News Feed</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVIGATION: FIXED LOGO - REMOVED CONTAINER AND TEXT */}
                    <nav className="bg-tdmh-blue text-white shadow-xl z-40 sticky top-0 border-b-2 border-blue-900">
                        <div className="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16 md:h-20 gap-4">
                                
                                <div className="flex items-center gap-2 md:gap-4 shrink-0">
                                    <a href="#" onClick={(e) => { e.preventDefault(); window.location.reload(); }} className="cursor-pointer hover:opacity-90 transition-transform hover:scale-105 flex items-center bg-white px-3 py-1.5 md:py-2 rounded-xl shadow-md border border-slate-200">
                                        <img 
                                            src="./images%20logo/tdmh-logo.png" 
                                            alt="TDMH Logo" 
                                            className="h-8 md:h-10 w-auto object-contain" 
                                            onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHg9IjUiIHk9IjUiIHdpZHRoPSI5MCIgaGVpZ2h0PSI5MCIgcng9IjIwIiBmaWxsPSIjMWUzYThhIiAvPjxwYXRoIGQ9Ik0zNSA1MCBINjUgTTUwIDM1IFY2NSIgc3Ryb2tlPSIjMTZhMzRhIiBzdHJva2VXaWR0aD0iMTYiIHN0cm9rZUxpbmVjYXA9InJvdW5kIiAvPjwvc3ZnPg=='; }} 
                                        />
                                    </a>

                                    <button onClick={() => handleSecureAction('admin')} className="p-2 rounded-md bg-white/10 border border-white/20 text-white hover:bg-white/20 transition-colors shadow-sm" title="Admin Control Center">
                                        <Icons.Shield className="w-5 h-5" />
                                    </button>
                                </div>
                                
                                <div className="hidden xl:flex flex-1 items-center justify-center min-w-0 px-10 relative">
                                    <button onClick={() => scrollTabs('left')} className="absolute left-1 z-10 p-1.5 rounded-full bg-blue-800/80 text-white hover:bg-tdmh-blue border border-blue-700 shadow-md transition-colors flex items-center justify-center" title="Scroll Left"><Icons.ChevronLeft className="w-4 h-4" /></button>
                                    <div ref={tabsContainerRef} className="flex items-center gap-1 bg-blue-900/40 p-1.5 rounded-xl border border-blue-800/50 overflow-x-auto no-scrollbar scroll-smooth w-full">
                                        {TABS.map(tab => {
                                            const IconCmp = Icons[tab.icon];
                                            return (
                                                <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`px-4 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 transition-all whitespace-nowrap shrink-0 ${activeTab === tab.id ? 'bg-white text-tdmh-blue shadow-md scale-105' : 'text-blue-100 hover:bg-blue-800 hover:text-white'}`}>
                                                    <IconCmp className="w-4 h-4" /> {tab.label}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <button onClick={() => scrollTabs('right')} className="absolute right-1 z-10 p-1.5 rounded-full bg-blue-800/80 text-white hover:bg-tdmh-blue border border-blue-700 shadow-md transition-colors flex items-center justify-center" title="Scroll Right"><Icons.ChevronRight className="w-4 h-4" /></button>
                                </div>

                                <div className="flex items-center gap-4 shrink-0">
                                    <div className="hidden lg:flex gap-2 mr-2">
                                        {userRole === 'admin' && <span className="bg-red-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-red-600">Admin</span>}
                                        {userRole === 'dept_head' && <span className="bg-yellow-500 text-yellow-900 text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-yellow-600">Dept Head</span>}
                                        {userRole === 'admitting' && <span className="bg-purple-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-purple-600">Admitting</span>}
                                    </div>
                                    
                                    {userRole === 'guest' ? (
                                        <button onClick={() => setShowRoleLogin(true)} className="hidden sm:flex items-center gap-2 bg-white/10 border border-white/20 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-white/20 transition-colors shadow-sm whitespace-nowrap"><Icons.Lock className="w-4 h-4" /> Login</button>
                                    ) : (
                                        <button onClick={() => {setUserRole('guest'); setActiveTab('home');}} className="hidden sm:flex text-xs font-bold uppercase tracking-widest text-red-300 hover:text-red-100 bg-red-900/30 px-4 py-2 rounded-lg border border-red-900/50 transition-colors">Logout</button>
                                    )}
                                    <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="xl:hidden p-2 bg-white text-tdmh-blue rounded-lg shadow-sm">{mobileMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}</button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        {mobileMenuOpen && (
                            <div className="xl:hidden bg-white border-t border-slate-200 absolute w-full shadow-2xl animate-fade-in text-slate-800 z-50 max-h-[calc(100vh-4rem)] overflow-y-auto custom-scrollbar">
                                <div className="p-4 space-y-2">
                                    {TABS.map(tab => {
                                        const IconCmp = Icons[tab.icon];
                                        return (
                                            <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`w-full flex items-center gap-3 px-5 py-4 rounded-xl text-sm font-bold transition-colors ${activeTab === tab.id ? 'bg-tdmh-blue text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 border border-slate-100'}`}>
                                                <IconCmp className="w-5 h-5" /> {tab.label}
                                            </button>
                                        );
                                    })}
                                    <div className="pt-4 mt-4 border-t border-slate-200 space-y-2">
                                        {userRole === 'guest' ? (
                                            <button onClick={() => {setShowRoleLogin(true); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-slate-100 border border-slate-200 text-slate-700 px-5 py-4 rounded-xl font-bold hover:bg-slate-200 transition-colors">
                                                <Icons.Lock className="w-5 h-5" /> Staff Login
                                            </button>
                                        ) : (
                                            <button onClick={() => {setUserRole('guest'); setActiveTab('home'); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-red-50 border border-red-100 text-red-600 px-5 py-4 rounded-xl font-bold hover:bg-red-100 transition-colors">
                                                Logout
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </nav>

                    <main className="flex-grow max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 w-full relative z-10 flex flex-col justify-start">
                        {renderActiveTabContent()}
                    </main>

                    <footer className="mt-auto bg-tdmh-blue border-t-2 border-blue-900 py-6 text-center text-white text-[10px] font-bold flex flex-col md:flex-row justify-center items-center gap-6 relative z-20 shrink-0">
                        <p className="uppercase tracking-widest text-blue-200">&copy; {new Date().getFullYear()} TAYTAY DOCTORS MULTISPECIALTY HOSPITAL.</p>
                        <button onClick={fetchDatabase} className="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-blue-900 border border-blue-800 text-tdmh-green hover:bg-blue-800 transition-colors uppercase tracking-widest text-xs font-black shadow-lg">
                            <Icons.Sync className="w-4 h-4" /> {isSyncing ? 'Syncing...' : 'System Sync'}
                        </button>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
