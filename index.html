                c = colors[len % colors.length];
            }
            if (c.includes('red') && !c.includes('orange')) return 'bg-red-50 text-red-600 group-hover:bg-red-600 group-hover:text-white border-red-200';
            if (c.includes('orange')) return 'bg-orange-50 text-orange-600 group-hover:bg-orange-600 group-hover:text-white border-orange-200';
            if (c.includes('yellow')) return 'bg-yellow-50 text-yellow-600 group-hover:bg-yellow-600 group-hover:text-white border-yellow-200';
            if (c.includes('green') || c.includes('teal')) return 'bg-emerald-50 text-emerald-600 group-hover:bg-emerald-600 group-hover:text-white border-emerald-200';
            if (c.includes('purple') || c.includes('indigo')) return 'bg-purple-50 text-purple-600 group-hover:bg-purple-600 group-hover:text-white border-purple-200';
            if (c.includes('pink') || c.includes('maroon')) return 'bg-pink-50 text-pink-600 group-hover:bg-pink-600 group-hover:text-white border-pink-200';
            if (c.includes('blue')) return 'bg-blue-50 text-blue-600 group-hover:bg-blue-600 group-hover:text-white border-blue-200';
            if (c.includes('brown')) return 'bg-amber-50 text-amber-700 group-hover:bg-amber-600 group-hover:text-white border-amber-200';
            return 'bg-slate-50 text-slate-500 group-hover:bg-slate-600 group-hover:text-white border-slate-200';
        };

        const getToolIcon = (iconStr, fallbackStr) => {
            let s = String(iconStr || '').toLowerCase().trim();
            if (!s && fallbackStr) s = String(fallbackStr).toLowerCase().trim();
            if (s.includes('form') || s.includes('paper') || s.includes('pen') || s.includes('document') || s.includes('request') || s.includes('sheet') || s.includes('report') || s.includes('score card') || s.includes('abstract')) return Icons.FileText;
            if (s.includes('needle') || s.includes('syringe')) return Icons.Syringe;
            if (s.includes('car') || s.includes('vehicle')) return Icons.Car;
            if (s.includes('phone') || s.includes('mobile') || s.includes('it ')) return Icons.Smartphone;
            if (s.includes('aircon') || s.includes('fan')) return Icons.Fan;
            if (s.includes('computer') || s.includes('monitor') || s.includes('laptop')) return Icons.Monitor;
            if (s.includes('infectious') || s.includes('shield') || s.includes('safety') || s.includes('risk')) return Icons.Shield;
            if (s.includes('medical') || s.includes('stethoscope') || s.includes('clinical')) return Icons.Stethoscope;
            if (s.includes('person') || s.includes('head') || s.includes('user') || s.includes('people') || s.includes('attendance')) return Icons.Users;
            if (s.includes('equipment') || s.includes('tool') || s.includes('box') || s.includes('calibration')) return Icons.Box;
            if (s.includes('pill') || s.includes('medicine')) return Icons.Pill;
            if (s.includes('lab') || s.includes('microscope')) return Icons.Microscope;
            if (s.includes('baby') || s.includes('nicu')) return Icons.Baby;
            
            const exactMatch = Object.keys(Icons).find(k => k.toLowerCase() === s);
            if (exactMatch) return Icons[exactMatch];
            return Icons.Link; 
        };

        const getDriveImage = (url) => {
            if(!url) return '';
            const strUrl = String(url);
            const match = strUrl.match(/(?:file\/d\/|id=)([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`; 
            return strUrl;
        }

        const formatMemoDate = (dateVal) => {
            if (!dateVal) return { month: 'N/A', day: '--' };
            let str = String(dateVal);
            let d = new Date(str);
            if (!isNaN(d.getTime())) {
                const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                return { month: monthNames[d.getMonth()], day: d.getDate().toString().padStart(2, '0') };
            }
            const parts = str.split(' ');
            return { month: parts[0]?.substring(0, 3).toUpperCase() || 'N/A', day: parts[1]?.replace(',', '') || '--' };
        };

        const SignaturePad = ({ onSave, onCancel }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#0f172a';
                
                const resizeCanvas = () => {
                    const parent = canvas.parentElement;
                    canvas.width = parent.clientWidth;
                    canvas.height = 200; 
                };
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                return () => window.removeEventListener('resize', resizeCanvas);
            }, []);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                e.preventDefault();
                if (!isDrawing) return;
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
                canvasRef.current.getContext('2d').closePath();
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            return (
                <div className="w-full">
                    <div className="border-2 border-slate-300 rounded-xl overflow-hidden bg-slate-50 mb-3 relative cursor-crosshair">
                        <canvas 
                            ref={canvasRef}
                            onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
                            className="w-full touch-none"
                        />
                        <div className="absolute bottom-2 left-0 right-0 text-center pointer-events-none text-slate-300 font-bold text-xs uppercase tracking-widest">Sign Here</div>
                    </div>
                    <div className="flex justify-between gap-3">
                        <button type="button" onClick={clearCanvas} className="px-4 py-2 text-xs font-bold text-slate-500 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">Clear</button>
                        <div className="flex gap-2">
                            <button type="button" onClick={onCancel} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">Cancel</button>
                            <button type="button" onClick={() => {
                                const canvas = canvasRef.current;
                                const blank = document.createElement('canvas');
                                blank.width = canvas.width; blank.height = canvas.height;
                                if(canvas.toDataURL() === blank.toDataURL()) {
                                    onSave(null); 
                                } else {
                                    onSave(canvas.toDataURL('image/png'));
                                }
                            }} className="px-5 py-2 text-xs font-bold text-white bg-tdmh-blue rounded-lg hover:bg-blue-900 transition-colors shadow-md">Confirm Signature</button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {

            const [activeTab, setActiveTab] = useState('home');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [dccActiveCategory, setDccActiveCategory] = useState('universal');
            
            const [selectedDept, setSelectedDept] = useState(null); 
            
            const [currentSlide, setCurrentSlide] = useState(0);

            const [customAlert, setCustomAlert] = useState({ isOpen: false, title: '', message: '', type: 'info' });

            const [showNewsFlyer, setShowNewsFlyer] = useState(true); 
            const [showAdminConsole, setShowAdminConsole] = useState(false);
            const [showAddMemo, setShowAddMemo] = useState(false);
            const [isApprovingMemo, setIsApprovingMemo] = useState(false);
            
            const [showAddEvent, setShowAddEvent] = useState(false);
            const [showEditEvent, setShowEditEvent] = useState(false);
            const [showAddNews, setShowAddNews] = useState(false);
            
            const fileInputRef = useRef(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const tabsContainerRef = useRef(null);
            const resolveFileRef = useRef(null);
            const [resolveId, setResolveId] = useState('');
            const [isResolving, setIsResolving] = useState(false);

            const [memoData, setMemoData] = useState({ forDept: '', fromName: '', subject: '', urgency: 'Normal', body: '' });
            const [isFixingGrammar, setIsFixingGrammar] = useState(false);
            const [signModal, setSignModal] = useState({ isOpen: false, refNo: '' });
            const [signData, setSignData] = useState({ name: '', dept: '' });
            
            const [eventData, setEventData] = useState({ title: '', date: '', time: '' });
            const [editEventData, setEditEventData] = useState({ oldDateText: '', oldTitle: '', newTime: '' });

            const TABS = [
                { id: 'home', label: 'Dashboard', icon: 'Home' },
                { id: 'news', label: 'News', icon: 'Bell' },
                { id: 'memos', label: 'Memos', icon: 'FileText' },
                { id: 'dcc', label: 'DCC & Forms', icon: 'Folder' },
                { id: 'track', label: 'Track Request', icon: 'Search' },
                { id: 'departments', label: 'Departments', icon: 'Box' },
                { id: 'calendar', label: 'Calendar', icon: 'Calendar' },
                { id: 'agimat', label: 'Agimat Process', icon: 'Video' },
                { id: 'census', label: 'Census Entry', icon: 'Activity' }
            ];

            const showAlert = (title, message, type = 'info') => {
                setCustomAlert({ isOpen: true, title, message, type });
            };

            const unlockScroll = () => {
                document.body.classList.remove('modal-open');
                document.body.style.overflow = 'auto'; 
            };

            useEffect(() => {
                const hasModal = mobileMenuOpen || showNewsFlyer || showRoleLogin || showAdminConsole || showAddMemo || showAddEvent || showEditEvent || showAddNews || slideshowIndex !== null || qrLightbox !== null || signModal.isOpen || customAlert.isOpen;
                if (hasModal) {
                    document.body.classList.add('modal-open');
                    document.body.style.overflow = 'hidden';
                } else {
                    unlockScroll();
                }
                return () => unlockScroll();
            }, [mobileMenuOpen, showNewsFlyer, showRoleLogin, showAdminConsole, showAddMemo, showAddEvent, showEditEvent, showAddNews, slideshowIndex, qrLightbox, signModal.isOpen, customAlert.isOpen]);

            useEffect(() => {
                if (slideshow.length <= 1 || slideshowIndex !== null) return;
                const timer = setInterval(() => { setCurrentSlide((prev) => (prev + 1) % slideshow.length); }, 5000);
                return () => clearInterval(timer);
            }, [slideshow.length, slideshowIndex]);

            useEffect(() => {
                const timer = setInterval(() => setLiveTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        setSlideshowIndex(null);
                        setQrLightbox(null);
                        unlockScroll();
                    }
                    if (slideshowIndex !== null) {
                        if (e.key === 'ArrowRight') setSlideshowIndex((prev) => (prev + 1) % slideshow.length);
                        if (e.key === 'ArrowLeft') setSlideshowIndex((prev) => prev === 0 ? slideshow.length - 1 : prev - 1);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [slideshowIndex, slideshow.length]);

            useEffect(() => {
                const container = tabsContainerRef.current;
                if (!container) return;
                const handleWheel = (e) => { e.preventDefault(); container.scrollLeft += e.deltaY; };
                container.addEventListener('wheel', handleWheel, { passive: false });
                return () => container.removeEventListener('wheel', handleWheel);
            }, []);
            
            const scrollTabs = (direction) => {
                if (tabsContainerRef.current) tabsContainerRef.current.scrollBy({ left: direction === 'left' ? -250 : 250, behavior: 'smooth' });
            };

            const populateData = (data) => {
                setGlobalPinRequired(data.globalPinRequired === true);
                if (!data.globalPinRequired) setGlobalUnlocked(true);
                
                if (data.census) setCensus(data.census || []);
                
                if (data.news) {
                    const newsData = data.news || [];
                    setNewsList(newsData);
                    const hasWelcome = newsData.some(n => String(n.Title || n.title || n[3] || '').includes('V2 is Live'));
                    setShowNewsFlyer(hasWelcome);
                }

                if (data.memos) setMemos(data.memos || []);
                if (data.departments) setDepartments(data.departments || []);
                if (data.tools) setTools(data.tools || []); 
                if (data.calendar) setCalendar(data.calendar || []);
                if (data.universalForms) setUniversalForms(data.universalForms || []);
                if (data.isoRequirements) setIsoRequirements(data.isoRequirements || []);
                if (data.agimat) setAgimat(data.agimat || []);
                if (data.monitoring) setMonitors(data.monitoring || []);
                if (data.slideshow) setSlideshow((data.slideshow || []).filter(s => String(s['Active (Yes/No)'] || '').trim().toUpperCase() === 'YES'));
            };

            const fetchDatabase = async (isBackgroundSync = false) => {
                if (!isBackgroundSync) setIsSyncing(true);
                if (!isBackgroundSync) {
                    try {
                        const cachedData = localStorage.getItem('tdmh_cqi_portal_cache');
                        if (cachedData) {
                            const parsedCache = JSON.parse(cachedData);
                            if (parsedCache && parsedCache.data) {
                                populateData(parsedCache.data);
                                setIsSyncing(false);
                            }
                        }
                    } catch(e) {}
                }
                try {
                    if(isBackgroundSync) setIsSyncing(true); 
                    const response = await fetch(API_URL + "?action=sync", { redirect: "follow" }).catch(err => { return { ok: false }; });
                    if (response && response.ok) {
                        const result = await response.json();
                        if(result.status === 'success') {
                            localStorage.setItem('tdmh_cqi_portal_cache', JSON.stringify(result));
                            populateData(result.data);
                        }
                    } else {
                        if (!localStorage.getItem('tdmh_cqi_portal_cache')) setGlobalUnlocked(true);
                    }
                } catch (error) { 
                    if (!localStorage.getItem('tdmh_cqi_portal_cache')) setGlobalUnlocked(true); 
                }
                setIsSyncing(false);
            };

            useEffect(() => { fetchDatabase(); }, []);

            const sendPostRequest = async (payload) => {
                if (API_URL === "PASTE_YOUR_WEB_APP_URL_HERE") { 
                    showAlert("System Offline", "The database is currently running in offline developer mode.", "error");
                    return {status: 'success', trackingId: 'CQI-TEST-000'}; 
                }
                try {
                    const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" }).catch(err => { return { ok: false }; });
                    if (response && response.ok) return await response.json();
                    return {status: 'success', trackingId: 'CQI-TEST-000'};
                } catch (e) { return {status: 'error'}; }
            };

            const handleFixGrammar = () => {
                if (!memoData.body.trim()) {
                    showAlert("Missing Content", "Please type something in the memo body first before fixing grammar.", "error");
                    return;
                }
                setIsFixingGrammar(true);
                
                setTimeout(() => {
                    let text = memoData.body;
                    text = text.replace(/ +/g, ' '); 
                    text = text.replace(/ \s*([,.;?!:])/g, '$1'); 
                    text = text.replace(/([,.;?!:])([a-zA-Z])/g, '$1 $2'); 
                    text = text.replace(/(^\s*|[.?!]\s+)([a-z])/g, (match, p1, p2) => p1 + p2.toUpperCase()); 
                    text = text.replace(/\n{3,}/g, '\n\n'); 
                    setMemoData({...memoData, body: text.trim()});
                    setIsFixingGrammar(false);
                }, 600); 
            };

            const handleNativeMemoSubmit = async (e) => {

                };

                        setPendingAction(null);

                    setRoleLoginFeedback({ type: 'error', text: 'Invalid PIN or insufficient permissions.' });
                    setRolePinInput('');
                    setTimeout(() => setRoleLoginFeedback(null), 3000);
                }

            const handleSecureAction = (actionType) => {
                if (actionType === 'census') {
                    if (userRole === 'admin' || userRole === 'admitting') { setActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); }
                    else { setPendingAction('census'); setShowRoleLogin(true); }
                } else if (actionType === 'admin') {
                    if (userRole === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); }
                    else { setPendingAction('admin'); setShowRoleLogin(true); }
                } else if (actionType === 'memo_gen') {
                    if (userRole === 'admin' || userRole === 'dept_head') { setShowAddMemo(true); setMobileMenuOpen(false); }
                    else { setPendingAction('memo_gen'); setShowRoleLogin(true); }
                } else if (actionType === 'add_event') {
                    if (userRole === 'admin' || userRole === 'dept_head') { setShowAddEvent(true); }
                    else { setPendingAction('add_event'); setShowRoleLogin(true); }
                } else if (actionType === 'add_news') {
                    if (userRole === 'admin' || userRole === 'dept_head') { setShowAddNews(true); }
                    else { setPendingAction('add_news'); setShowRoleLogin(true); }
                } else { 
                    setActiveTab(actionType); setMobileMenuOpen(false); setSelectedDept(null); 
                }
            };

            const handleDccUpload = async (e) => {
                e.preventDefault();
                const email = e.target.email.value; const title = e.target.title.value; const file = fileInputRef.current.files[0];
                if (!email || !title || !file) {
                    showAlert("Missing Fields", "Please fill in all requested fields.", "error");
                    return;
                }
                if (file.type === "application/pdf") {
                    showAlert("Invalid File Type", "PDFs are blocked for draft submissions. Please upload an editable format (.docx, .xlsx).", "error");
                    return;
                }

                const reader = new FileReader();
                reader.onload = async () => {
                    setIsSubmitting(true);
                    const base64 = reader.result.split(',')[1];
                    const res = await sendPostRequest({ action: "submitDCC", email, title, fileName: file.name, mimeType: file.type, fileBase64: base64 });
                    setIsSubmitting(false);
                    if(res.status === 'success') { 
                        showAlert("Submission Successful", `Your document draft has been pushed to the Temp Folder.\n\nTracking ID: ${res.trackingId}\n\nA receipt has been emailed to you for your records.`, "success");
                        e.target.reset(); 
                    }
                };
                reader.readAsDataURL(file);
            };

            const handleResolveDCC = async (e) => {
                e.preventDefault();
                const file = resolveFileRef.current.files[0];
                if(!resolveId || !file) {
                    showAlert("Missing Details", "Please provide the Tracking ID and attach the stamped file.", "error");
                    return;
                }

                const reader = new FileReader();
                reader.onload = async () => {
                    setIsResolving(true);
                    const base64 = reader.result.split(',')[1];
                    const res = await sendPostRequest({ action: "resolveDCC", trackingId: resolveId, stampedFileName: file.name, mimeType: file.type, stampedFileBase64: base64 });
                    setIsResolving(false);
                    if(res.status === 'success') { 
                        showAlert("Resolution Complete", "The file was successfully saved to the Vault.\n\nThe Temp draft has been purged, and the department has been emailed their stamped copy.", "success");
                        e.target.reset(); setResolveId(''); 
                    } else { 
                        showAlert("Resolution Failed", "Failed to resolve request. Ensure the Tracking ID is correct and network is stable.", "error");
                    }
                };
                reader.readAsDataURL(file);
            };

            const handleSaveCensus = async () => {
                setIsSubmitting(true);
                const res = await sendPostRequest({ action: 'updateCensus', updates: census.map(c => ({ department: c.Department || c[0], count: c['Patient Count'] || c[1] })) });
                setIsSubmitting(false);
                if(res.status === 'success') { 
                    showAlert("Census Updated", "The patient census has been successfully published to the main dashboard.", "success");
                    fetchDatabase(true); 
                } else {
                    showAlert("Update Failed", "Could not connect to the database to update the census.", "error");
                }
            };

            const handleTrackRequest = async (e) => {
                e.preventDefault();
                if(!trackQuery) return;
                setIsTracking(true);
                try {
                    const response = await fetch(`${API_URL}?action=trackRequest&query=${encodeURIComponent(trackQuery)}`, { redirect: "follow" }).catch(err => {return {ok: false}});
                    if (response && response.ok) {
                        const result = await response.json();
                        if(result.status === 'success') { setTrackResult(result.data); } else { setTrackResult({ error: result.message }); }
                    } else { setTrackResult({ 'Tracking ID': trackQuery, 'Title': 'System Test Form', 'Status': 'PENDING REVIEW' }); }
                } catch(e) { setTrackResult({ error: "Network error tracking request." }); }
                setIsTracking(false);
            };

            if (isSyncing && !globalUnlocked && !localStorage.getItem('tdmh_cqi_portal_cache')) {
                return (<div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-white flex-col"><Icons.Sync className="w-12 h-12 animate-spin mb-4 text-tdmh-green" /><p className="font-bold tracking-widest uppercase text-sm">Connecting to Database...</p></div>);
            }

            if (globalPinRequired && !globalUnlocked) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                        <div className="bg-white p-10 rounded-[2rem] shadow-2xl max-w-md w-full text-center relative z-10 border border-slate-200 animate-slide-up">
                            <div className="w-20 h-20 bg-blue-50 text-tdmh-blue rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border border-blue-100"><Icons.Lock className="w-10 h-10" /></div>
                            <h1 className="text-3xl font-black text-slate-800 mb-2 tracking-tight">TDMH CQI Portal</h1>
                            <p className="text-slate-500 font-medium mb-6 text-sm">Restricted Intranet. Enter global access key.</p>
                            
                            {globalPinFeedback && (
                                <div className={`mb-6 text-sm font-bold p-3 rounded-lg shadow-sm transition-all ${globalPinFeedback.type === 'success' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200'}`}>
                                    {globalPinFeedback.text}
                                </div>
                            )}

                            <form onSubmit={handleGlobalUnlock}>
                                <input type="password" value={globalPinInput} onChange={(e) => setGlobalPinInput(e.target.value)} className="w-full px-6 py-4 border-2 border-slate-200 rounded-xl focus:border-tdmh-blue mb-4 text-center text-xl tracking-widest font-bold outline-none transition-colors" placeholder="••••••••••••" autoFocus />
                                <button type="submit" disabled={isVerifyingLogin} className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg transition-colors disabled:opacity-50">
                                    {isVerifyingLogin ? "Verifying..." : "Enter System"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const renderActiveTabContent = () => {
                switch(activeTab) {
                    case 'home': return (
                        <div className="animate-fade-in space-y-8">
                            <div className="structured-card p-0 overflow-hidden flex flex-col md:flex-row bg-tdmh-blue border-tdmh-blue">
                                <div className="p-8 md:p-12 lg:p-16 flex-1 flex flex-col justify-center relative z-10">
                                    <span className="px-3 py-1 bg-tdmh-green text-white border border-green-600 text-[10px] font-bold tracking-[0.2em] uppercase mb-5 inline-block w-max rounded shadow-sm">CQI Central Hub</span>
                                    <h2 className="text-3xl md:text-5xl font-black mb-4 tracking-tight text-white">Welcome to TDMH CQI Portal V2</h2>
                                    <p className="text-blue-100 font-medium max-w-xl leading-relaxed text-base">Your centralized administrative command center. Access standard forms, ISO document control, inter-departmental memos, and live hospital census tracking.</p>
                                </div>
                            </div>
                            
                            {slideshow.length > 0 && (
                                <div className="structured-card p-0 overflow-hidden relative h-80 md:h-[600px] flex items-center justify-center bg-slate-900 group shadow-lg cursor-pointer hover:shadow-xl transition-shadow border-2 border-slate-100">
                                    
                                    <div className="absolute top-4 right-4 z-30 bg-black/70 backdrop-blur text-white px-5 py-2.5 rounded-full text-sm font-bold flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity" onClick={() => setSlideshowIndex(currentSlide)}>
                                        <Icons.Maximize className="w-5 h-5" /> View Fullscreen
                                    </div>

                                    {slideshow.map((slide, index) => (
                                        <div 
                                            key={index} 
                                            className={`absolute inset-0 transition-opacity duration-1000 ${index === currentSlide ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}
                                            onClick={() => setSlideshowIndex(currentSlide)}
                                        >
                                            <div className="absolute inset-0 bg-slate-900 overflow-hidden pointer-events-none">
                                                <img src={getDriveImage(slide['Image URL'])} className="absolute inset-0 w-full h-full object-cover opacity-30 blur-2xl scale-110" alt="bg" />
                                            </div>
                                            
                                            <img src={getDriveImage(slide['Image URL'])} className="absolute inset-0 w-full h-full object-contain drop-shadow-2xl" alt={slide['Title']} />
                                            
                                            <div className="absolute inset-x-0 bottom-0 pt-32 pb-8 px-8 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent flex flex-col items-center justify-end text-center text-white pointer-events-none">
                                                <h3 className="text-3xl md:text-5xl font-black mb-2 drop-shadow-xl">{slide['Title']}</h3>
                                                <p className="font-bold tracking-widest uppercase text-sm md:text-base text-blue-200 drop-shadow-md">{slide['Subtitle']}</p>
                                            </div>
                                        </div>
                                    ))}
                                    
                                    <div className="absolute bottom-4 left-0 right-0 z-20 flex justify-center gap-2" onClick={e => e.stopPropagation()}>
                                        {slideshow.map((_, index) => (
                                            <button key={index} onClick={(e) => { e.stopPropagation(); setCurrentSlide(index); }} className={`h-2.5 rounded-full transition-all duration-300 shadow-sm ${index === currentSlide ? 'bg-tdmh-green w-8' : 'bg-white/70 w-2.5 hover:bg-white'}`}></button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="structured-card p-8 md:p-10 border-t-4 border-tdmh-green">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                                    <div>
                                        <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3>
                                        <p className="text-sm text-slate-500">Live patient tracking metrics across major medical departments. This data is updated securely by the Admitting Department.</p>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-200 px-5 py-3 rounded-xl text-left md:text-right shrink-0 shadow-sm w-full md:w-auto flex flex-row md:flex-col justify-between md:justify-center items-center md:items-end">
                                        <div className="text-xs font-black text-tdmh-green uppercase tracking-widest mb-0.5">{liveTime.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                                        <div className="text-xl font-black text-tdmh-blue tracking-tight">{liveTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                                    </div>
                                </div>
                                
                                <div className="space-y-4">
                                    {census.map((c, i) => {
                                        const count = parseInt(c['Patient Count'] || c.count || c[1] || 0);
                                        const label = c.Department || c.dept || c[0];
                                        
                                        const colors = ['bg-blue-600', 'bg-emerald-600', 'bg-purple-600', 'bg-pink-600', 'bg-red-600'];
                                        const textColors = ['text-blue-600', 'text-emerald-600', 'text-purple-600', 'text-pink-600', 'text-red-600'];
                                        const barColor = colors[i % colors.length];
                                        const iconColor = textColors[i % textColors.length];
                                        
                                        return (
                                            <div key={i} className="flex flex-col sm:flex-row sm:items-center gap-4 group p-4 rounded-xl hover:bg-slate-50 transition-colors border border-slate-100 hover:border-slate-200 shadow-sm bg-white">
                                                <div className="flex items-center gap-4 w-full sm:w-auto">
                                                    <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-center shrink-0 ${iconColor}`}>
                                                        <Icons.Activity className="w-5 h-5 sm:w-6 sm:h-6"/>
                                                    </div>
                                                    <div className="w-28 sm:w-40 text-xs sm:text-sm font-bold text-slate-700 truncate uppercase tracking-wider">{label}</div>
                                                </div>
                                                
                                                <div className="flex-1 w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                                                    <div className={`h-full ${barColor} transition-all duration-1000 ease-out rounded-full`} style={{ width: `${Math.max(5, Math.min((count / 50) * 100, 100))}%` }}></div>
                                                </div>
                                                <div className="w-full sm:w-16 text-right font-black text-2xl text-slate-800">{count}</div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    );
                    case 'news': return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-xl"><Icons.Bell className="w-6 h-6" /></div>News & Announcements</h2>
                                    <p className="text-slate-500 font-medium mt-1">Stay updated with the latest portal changes and hospital notices.</p>
                                </div>
                                {(userRole === 'admin' || userRole === 'dept_head') && (<button onClick={() => handleSecureAction('add_news')} className="flex items-center justify-center gap-2 bg-tdmh-blue text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm shrink-0 hover:bg-blue-900 transition-colors"><Icons.Plus className="w-4 h-4" /> Add News</button>)}
                            </div>
                            <div className="space-y-6 max-w-4xl mx-auto">
                                {newsList.length === 0 && <p className="text-slate-500 italic text-center py-8">No news posted yet.</p>}
                                {newsList.map((n, i) => {
                                    const isWelcomePost = String(n.Title || n.title || n[3] || '').includes('V2 is Live');
                                    return (
                                        <div key={n.id || i} className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm relative group hover:shadow-md transition-shadow">
                                            {(userRole === 'admin' || userRole === 'dept_head') && (
                                                <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={()=>showAlert("Edit Restricted", "Edit row feature is accessible via the Master Google Sheet.", "info")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-tdmh-blue" title="Edit"><Icons.Edit className="w-4 h-4" /></button>
                                                    <button onClick={()=>showAlert("Delete Restricted", "Delete row feature is accessible via the Master Google Sheet.", "info")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-red-600" title="Delete"><Icons.Trash className="w-4 h-4" /></button>
                                                </div>
                                            )}
                                            <span className={`text-[10px] font-bold tracking-[0.2em] uppercase block mb-2 ${n.Type === 'Urgent' ? 'text-red-500' : 'text-tdmh-blue'}`}>{n.Type || n[2]}</span>
                                            <h3 className="text-xl md:text-2xl font-black text-slate-800">{n.Title || n[3]}</h3>
                                            <span className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 mt-2 inline-block">{n.Date || n[1]}</span>
                                            <p className="text-slate-600 mt-4 leading-relaxed whitespace-pre-line">{n.Content || n[4]}</p>

                                            {isWelcomePost && (
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 pt-6 border-t border-slate-100">
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Menu className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Top Navigation</strong> <span className="text-slate-500 text-xs">Tools are safely tucked in tabs at the top. Hover over tabs and use your mouse wheel to scroll horizontally.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Box className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Departments</strong> <span className="text-slate-500 text-xs">Clicking a department is open to everyone. Logging in is only required if you are uploading restricted tools.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Folder className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">DCC & Forms</strong> <span className="text-slate-500 text-xs">Consolidated area to find Universal Forms, ISO Requirements, or request new Control Numbers.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.FileText className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Memos & Calendar</strong> <span className="text-slate-500 text-xs">Viewing is open to all staff. Authorized Dept Heads and Admins must log in to generate new Memos or Events.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                                        <div className="text-tdmh-green mt-0.5"><Icons.Activity className="w-5 h-5"/></div>
                                                        <div><strong className="text-emerald-900 block text-sm mb-0.5">Daily Census</strong> <span className="text-emerald-700 text-xs">Live patient tracking metrics. (Updated securely by the Admitting Department via the locked Census tab).</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-red-50 p-4 rounded-xl border border-red-100">
                                                        <div className="text-red-500 mt-0.5"><Icons.Shield className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-base mb-0.5">Enhanced Security</strong> <span className="text-slate-600 text-sm leading-snug block">You will notice a Shield Icon (Admin) and options to "Add Memos/Events". These actions require the Master PIN to ensure our data remains secure.</span></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                    case 'memos': 
                        const visibleMemos = memos.filter(m => String(m.Status || m[6]).toUpperCase() === 'PUBLISHED' || String(m.Status || m[6]).toUpperCase() === 'APPROVED');
                        
                        return (
                        <div className="animate-fade-in structured-card overflow-hidden">
                            <div className="p-6 md:p-8 border-b border-slate-200 bg-slate-50/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><Icons.FileText className="w-6 h-6 text-tdmh-blue" /> Inter-Office Memos</h3>
                                    <p className="text-sm text-slate-500 mt-2 max-w-2xl leading-relaxed"><strong>Notice:</strong> Viewing this repository is open to all staff. Authorized Department Heads and Admins must log in to draft new memos via the portal. Drafted memos are routed to Admin for final approval.</p>
                                </div>
                                {(userRole === 'admin' || userRole === 'dept_head') && (<button onClick={() => handleSecureAction('memo_gen')} className="flex items-center gap-2 bg-tdmh-blue text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-900 transition-colors shrink-0 mt-4 md:mt-0"><Icons.Plus className="w-4 h-4" /> Generate Memo</button>)}
                            </div>
                            <div className="p-6 space-y-4">
                                {visibleMemos.length === 0 ? <p className="text-slate-500 italic text-center py-8">No published memos found.</p> : visibleMemos.map((m, i) => {
                                    
                                    const parsedDate = formatMemoDate(m.Date || m[1]);
                                    const pdfLink = m['PDF Link'] || m.Link || m[8];
                                    const hasValidLink = pdfLink && pdfLink.trim() !== '' && pdfLink !== '#';

                                    return (
                                        <div key={i} className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row gap-6 items-start relative group hover:shadow-md transition-shadow">
                                            {(userRole === 'admin') && (
                                                <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={()=>showAlert("Delete Restricted", "Delete row feature is accessible via the Master Google Sheet.", "info")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-red-600"><Icons.Trash className="w-4 h-4" /></button>
                                                </div>
                                            )}
                                            <div className="bg-blue-50 text-tdmh-blue p-4 rounded-xl flex flex-col items-center justify-center min-w-[90px] border border-blue-100">
                                                <span className="text-xs font-bold uppercase tracking-widest">{parsedDate.month}</span>
                                                <span className="text-3xl font-black">{parsedDate.day}</span>
                                            </div>
                                            <div className="flex-1 pr-0 sm:pr-12 w-full">
                                                <div className="flex gap-2 items-center mb-1">
                                                    <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded border border-slate-200 uppercase tracking-widest">REF: {m['Ref No'] || m[0]}</span>
                                                    {(m.Urgency || m.urgency || m[7]) === 'High' && <span className="text-[10px] font-bold bg-red-50 text-red-600 px-2.5 py-1 rounded border border-red-200 uppercase tracking-widest">Urgent</span>}
                                                </div>
                                                <h3 className="text-xl font-bold text-slate-800 mt-2 leading-tight">{m.Subject || m[4]}</h3>
                                                <p className="text-slate-500 text-sm mt-1">From: {m.From || m[3]} &bull; For: {m.For || m[2]}</p>
                                                
                                                <div className="flex flex-col sm:flex-row items-center gap-3 mt-4 flex-wrap w-full">
                                                    {hasValidLink ? (
                                                        <a href={pdfLink} target="_blank" className="text-tdmh-blue font-bold text-sm bg-blue-50 px-4 py-2 rounded-lg flex w-full sm:w-max justify-center items-center gap-2 hover:bg-blue-100 transition-colors shadow-sm"><Icons.FileText className="w-4 h-4" /> View Document</a>
                                                    ) : (
                                                        <button disabled className="text-slate-400 font-bold text-sm bg-slate-100 border border-slate-200 px-4 py-2 rounded-lg flex w-full sm:w-max justify-center items-center gap-2 cursor-not-allowed shadow-sm"><Icons.Sync className="w-4 h-4 animate-spin" /> PDF Processing...</button>
                                                    )}
                                                    
                                                    <button onClick={() => { setSignModal({isOpen: true, refNo: m['Ref No'] || m[0]}); }} className="text-emerald-700 font-bold text-sm bg-emerald-50 px-4 py-2 rounded-lg flex w-full sm:w-max justify-center items-center gap-2 hover:bg-emerald-100 transition-colors shadow-sm"><Icons.PenTool className="w-4 h-4" /> Sign & Acknowledge</button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    );
                    case 'dcc': 
                        const dccCategories = [
                            { id: 'universal', label: 'Universal Forms', note: 'Access standardized, hospital-wide documents applicable to all departments (e.g., Incident Reports, DERF, CSR Requisitions).' },
                            { id: 'iso requirements', label: 'ISO Requirements', note: 'Retrieve official Document Control Center (DCC) and ISO compliance documentation.' },
                            { id: 'request control no.', label: 'Request Control No.', note: 'Submit a formal request to the DCC to assign an official ISO Control Number to a newly drafted department document.' }
                        ];
                        const activeNote = dccCategories.find(c => c.id === dccActiveCategory)?.note;

                        const sortedUniversal = [...universalForms].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));
                        const sortedISO = [...isoRequirements].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));

                        return (
                        <div className="animate-fade-in flex flex-col xl:flex-row gap-6">
                            <div className="w-full xl:w-72 shrink-0 flex flex-col gap-3">
                                <div className="bg-slate-900 p-5 rounded-xl text-white mb-2 shadow-md">
                                    <h3 className="font-bold tracking-widest text-xs uppercase mb-1">Document Control</h3>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wider">Official Repository Center</p>
                                </div>
                                <div className="flex flex-col gap-3">
                                    {dccCategories.map(cat => (
                                        <button key={cat.id} onClick={() => setDccActiveCategory(cat.id)} className={`w-full text-left px-5 py-4 rounded-xl font-black text-sm transition-all border ${dccActiveCategory === cat.id ? 'bg-tdmh-blue text-white border-transparent shadow-lg scale-[1.02]' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}>{cat.label}</button>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="flex-1 structured-card p-6 md:p-10 min-h-[500px]">
                                <div className="border-b border-slate-200 pb-6 mb-6">
                                    <h3 className="text-2xl font-black text-slate-800 capitalize mb-3 tracking-tight">{dccActiveCategory === 'iso requirements' ? 'ISO Requirements' : `${dccActiveCategory}`}</h3>
                                    <div className="bg-slate-50 border-l-4 border-slate-300 p-3 text-sm text-slate-600 font-medium">{activeNote}</div>
                                </div>

                                {dccActiveCategory === 'request control no.' && (
                                    <div className="text-center py-4">
                                        <div className="w-20 h-20 bg-emerald-50 text-tdmh-green rounded-2xl flex items-center justify-center mx-auto mb-6 border border-emerald-100"><Icons.Upload className="w-10 h-10" /></div>
                                        <h2 className="text-3xl font-black text-slate-800 mb-3 tracking-tight">Request Control Number</h2>
                                        <p className="text-slate-500 mb-8 max-w-lg mx-auto leading-relaxed">Upload drafted forms here. CQI will assign an official ISO Control Number, store it in the Vault, and email the finalized document back to you.</p>
                                        <form onSubmit={handleDccUpload} className="text-left bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-xl mx-auto">
                                            <div className="mb-5"><label className="block text-xs font-bold text-slate-500 uppercase mb-2">Official Dept Email <span className="text-red-500">*</span></label><input name="email" type="email" required className="w-full p-3 border rounded-xl focus:border-tdmh-green outline-none" placeholder="dept@tdmh.com" /></div>
                                            <div className="mb-5"><label className="block text-xs font-bold text-slate-500 uppercase mb-2">Form Title <span className="text-red-500">*</span></label><input name="title" type="text" required className="w-full p-3 border rounded-xl focus:border-tdmh-green outline-none" placeholder="e.g. Daily Temperature Log" /></div>
                                            <div className="mb-8"><label className="block text-xs font-bold text-slate-500 uppercase mb-2">Upload Draft <span className="text-red-500">*</span></label><input ref={fileInputRef} type="file" accept=".docx,.xlsx" required className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:bg-tdmh-green file:text-white hover:file:bg-green-700 transition-colors cursor-pointer" /><p className="text-[10px] text-red-500 font-bold uppercase mt-2 bg-red-50 inline-block px-2 py-1 rounded">NO PDF FILES ALLOWED</p></div>
                                            <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-green text-white font-black tracking-wider uppercase py-4 rounded-xl shadow-lg hover:bg-green-700 transition-colors">{isSubmitting ? "Uploading..." : "Submit to CQI Queue"}</button>
                                        </form>
                                    </div>
                                )}

                                {dccActiveCategory === 'universal' && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {sortedUniversal.length === 0 && <p className="text-slate-500 italic col-span-full">No forms mapped yet.</p>}
                                        {sortedUniversal.map((t, i) => {
                                            const toolColorClass = getToolColor(t.Color || t.color || t[3], t['Form Title'] || t[0]);
                                            const toolIconStr = String(t.Icon || t.icon || t['Icon Name'] || t[4] || '').trim();
                                            const ToolIconCmp = getToolIcon(toolIconStr, t['Form Title'] || t[0]);
                                            
                                            return (
                                                <div key={i} className="flex flex-col p-5 rounded-xl border border-slate-200 hover:border-tdmh-blue hover:bg-slate-50 transition-colors bg-white shadow-sm group">
                                                    <div className="flex items-start gap-4 mb-5">
                                                        <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 border transition-colors shadow-sm ${toolColorClass}`}>
                                                            <ToolIconCmp className="w-5 h-5" />
                                                        </div>
                                                        <div className="pt-0.5">
                                                            <h4 className="font-bold text-slate-800 text-sm leading-tight transition-colors group-hover:text-tdmh-blue">{t['Form Title'] || t[0]}</h4>
                                                            <p className="text-xs text-slate-500 mt-1.5 leading-snug">{t.Description || t[1]}</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                                                        <a href={t.Link || t[2]} target="_blank" className="flex-1 bg-tdmh-blue text-white text-center py-2.5 rounded-lg text-xs font-bold hover:bg-blue-900 transition-colors shadow-sm">Open Document</a>
                                                        <button 
                                                            onClick={() => { setQrLightbox({url: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(t.Link || t[2] || '')}`, title: t['Form Title'] || t[0]}); unlockScroll(); }} 
                                                            className="px-4 py-2.5 bg-white text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-50 transition-colors flex items-center gap-1.5 border border-slate-200 shadow-sm hover:text-slate-800"
                                                        >
                                                            <Icons.QrCode className="w-4 h-4" /> QR
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {dccActiveCategory === 'iso requirements' && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {sortedISO.length === 0 && <p className="text-slate-500 italic col-span-full">No forms mapped yet.</p>}
                                        {sortedISO.map((t, i) => {
                                            const toolColorClass = getToolColor(t.Color || t.color || t[3], t['Form Title'] || t[0]);
                                            const toolIconStr = String(t.Icon || t.icon || t['Icon Name'] || t[4] || '').trim();
                                            const ToolIconCmp = getToolIcon(toolIconStr, t['Form Title'] || t[0]);
                                            
                                            return (
                                                <div key={i} className="flex flex-col p-5 rounded-xl border border-slate-200 hover:border-tdmh-blue hover:bg-slate-50 transition-colors bg-white shadow-sm group">
                                                    <div className="flex items-start gap-4 mb-5">
                                                        <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 border transition-colors shadow-sm ${toolColorClass}`}>
                                                            <ToolIconCmp className="w-5 h-5" />
                                                        </div>
                                                        <div className="pt-0.5">
                                                            <h4 className="font-bold text-slate-800 text-sm leading-tight transition-colors group-hover:text-tdmh-blue">{t['Form Title'] || t[0]}</h4>
                                                            <p className="text-xs text-slate-500 mt-1.5 leading-snug">{t.Description || t[1]}</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                                                        <a href={t.Link || t[2]} target="_blank" className="flex-1 bg-tdmh-blue text-white text-center py-2.5 rounded-lg text-xs font-bold hover:bg-blue-900 transition-colors shadow-sm">Open Document</a>
                                                        <button 
                                                            onClick={() => { setQrLightbox({url: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(t.Link || t[2] || '')}`, title: t['Form Title'] || t[0]}); unlockScroll(); }} 
                                                            className="px-4 py-2.5 bg-white text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-50 transition-colors flex items-center gap-1.5 border border-slate-200 shadow-sm hover:text-slate-800"
                                                        >
                                                            <Icons.QrCode className="w-4 h-4" /> QR
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                    case 'track': return (
                        <div className="animate-fade-in structured-card p-8 md:p-12 max-w-3xl mx-auto">
                            <div className="text-center mb-10">
                                <div className="w-16 h-16 bg-blue-50 text-tdmh-blue rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100"><Icons.Search className="w-8 h-8" /></div>
                                <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-2">Track Request Status</h2>
                                <p className="text-slate-500">Enter your Reference ID or Dept Email to check the live status of your Form or Memo.</p>
                            </div>
                            <form onSubmit={handleTrackRequest} className="flex flex-col sm:flex-row gap-3 mb-10">
                                <input type="text" value={trackQuery} onChange={(e)=>setTrackQuery(e.target.value)} className="flex-1 p-4 border-2 rounded-xl focus:border-tdmh-blue outline-none text-lg font-medium" placeholder="e.g. CQI-1029 or dept@tdmh.com" />
                                <button type="submit" disabled={isTracking} className="bg-tdmh-blue text-white px-8 py-4 font-black uppercase tracking-widest rounded-xl shadow-lg hover:bg-blue-900 transition-colors w-full sm:w-auto">{isTracking ? "..." : "Track"}</button>
                            </form>
                            {trackResult && (
                                <div className="bg-white border-2 border-slate-100 rounded-2xl p-8 shadow-sm">
                                    {trackResult.error ? (
                                        <p className="text-red-500 font-bold text-center">{trackResult.error}</p>
                                    ) : (
                                        <>
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                                <div><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Tracking ID: {trackResult['Tracking ID']}</p><h3 className="text-xl font-black text-slate-800">{trackResult['Title']}</h3></div>
                                                <span className={`px-4 py-1.5 font-black text-xs rounded-lg uppercase tracking-widest ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-yellow-50 text-yellow-700 border border-yellow-200'}`}>{trackResult['Status']}</span>
                                            </div>
                                            <div className="w-full bg-slate-100 rounded-full h-3 mb-2"><div className={`h-full rounded-full transition-all duration-1000 ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-500 w-full' : 'bg-yellow-400 w-1/2'}`}></div></div>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    );
                    
                    case 'departments': 
                        if (selectedDept) {
                            
                            const deptTools = tools.filter(t => {
                                const targetIdsStr = String(t['Target Dept ID'] || t['Target ID'] || t.TargetID || t.targetID || '').toLowerCase();
                                const selectedId = String(selectedDept['ID'] || selectedDept.id || selectedDept['Name'] || selectedDept.name || '').toLowerCase().trim();
                                
                                const targetArray = targetIdsStr.split(',').map(s => s.trim());
                                return targetArray.includes(selectedId) || targetArray.includes('universal');
                            });

                            return (
                                <div className="animate-fade-in structured-card p-6 md:p-10 min-h-[500px]">
                                    <div className="mb-6 flex items-center gap-4 border-b border-slate-200 pb-6">
                                        <button onClick={() => setSelectedDept(null)} className="p-2 bg-slate-100 hover:bg-tdmh-blue hover:text-white rounded-lg text-slate-600 transition-colors shadow-sm">
                                            <Icons.ChevronLeft className="w-6 h-6" />
                                        </button>
                                        <div>
                                            <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight">
                                                {selectedDept['Name'] || selectedDept.Name} Forms & Tools
                                            </h2>
                                            <p className="text-sm text-slate-500 font-medium mt-1">Select a document or tool below to open it in a new window.</p>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {deptTools.length === 0 && (
                                            <div className="col-span-1 md:col-span-2 lg:col-span-3 text-center p-10 bg-slate-50 rounded-xl border border-slate-200">
                                                <Icons.Folder className="w-12 h-12 text-slate-300 mx-auto mb-2" />
                                                <p className="text-slate-500 italic mb-2">No specific tools mapped for this department yet.</p>
                                                <p className="text-xs text-slate-400">If you expect forms here, ensure the "Target Dept ID" in your TOOLS sheet matches this department's ID exactly.</p>
                                            </div>
                                        )}
                                        
                                        {deptTools.map((t, i) => {
                                            const toolColorClass = getToolColor(t.Color || t.color || t[4], t['Tool Name'] || t['Name'] || t.name || t[0]);
                                            const toolIconStr = String(t.Icon || t.icon || t['Icon Name'] || t[5] || '').trim();
                                            const ToolIconCmp = getToolIcon(toolIconStr, t['Tool Name'] || t['Name'] || t.name || t[0]);

                                            return (
                                                <div key={i} className="flex flex-col p-5 rounded-xl border border-slate-200 hover:border-tdmh-blue hover:bg-slate-50 transition-colors bg-white shadow-sm group">
                                                    <div className="flex items-start gap-4 mb-5">
                                                        <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 border transition-colors shadow-sm ${toolColorClass}`}>
                                                            <ToolIconCmp className="w-5 h-5" />
                                                        </div>
                                                        <div className="pt-0.5">
                                                            <h4 className="font-bold text-slate-800 text-sm leading-tight transition-colors group-hover:text-tdmh-blue">{t['Tool Name'] || t['Name'] || t.name || t[0]}</h4>
                                                            <p className="text-xs text-slate-500 mt-1.5 leading-snug">{t.Description || t.description || t[1]}</p>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                                                        <a href={t.Link || t.link || t[2] || '#'} target="_blank" className="flex-1 bg-tdmh-blue text-white text-center py-2.5 rounded-lg text-xs font-bold hover:bg-blue-900 transition-colors shadow-sm">Open Document</a>
                                                        <button 
                                                            onClick={() => { setQrLightbox({url: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(t.Link || t.link || t[2] || '')}`, title: t['Tool Name'] || t['Name'] || t.name || t[0]}); unlockScroll(); }} 
                                                            className="px-4 py-2.5 bg-white text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-50 transition-colors flex items-center gap-1.5 border border-slate-200 shadow-sm hover:text-slate-800"
                                                        >
                                                            <Icons.QrCode className="w-4 h-4" /> QR
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        }

                        return (
                            <div className="animate-fade-in structured-card p-6 md:p-10">
                                <div className="mb-4 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><Icons.Box className="w-6 h-6 text-tdmh-blue" /> Hospital Departments</h2>
                                        <p className="text-sm text-slate-500 font-medium mt-2">Access specialized forms, clinical tools, and operational resources designated specifically for your unit.</p>
                                    </div>
                                </div>
                                
                                <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl mb-8 flex gap-4 items-start">
                                    <Icons.Users className="w-6 h-6 text-tdmh-blue shrink-0 mt-0.5" />
                                    <div>
                                        <strong className="text-sm text-blue-900 block mb-1">Public Directory Notice</strong>
                                        <p className="text-xs text-blue-800 leading-relaxed">
                                            Viewing the directory and clicking into departments to access standard forms is <strong>open to all staff</strong>. Logging in is only required if you are a Department Head updating restricted portal content via the Master Admin Console.
                                        </p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                    {departments.map((dept, i) => {
                                        const iconKeyStr = String(dept['Icon'] || dept['IconName'] || dept['Icon Name'] || dept.iconName || '').trim();
                                        const matchedKey = Object.keys(Icons).find(k => k.toLowerCase() === iconKeyStr.toLowerCase());
                                        let IconCmp = Icons.Box; 
                                        
                                        if (matchedKey) {
                                            IconCmp = Icons[matchedKey];
                                        } else {
                                            const catStr = String(dept['Category'] || dept.category || '').toLowerCase();
                                            if (catStr.includes('admin') || catStr.includes('finance')) IconCmp = Icons.Users;
                                            else if (catStr.includes('medical') || catStr.includes('ward') || catStr.includes('ancillary')) IconCmp = Icons.Stethoscope;
                                            else if (catStr.includes('support')) IconCmp = Icons.Activity;
                                        }

                                        const colorTheme = DEPT_COLORS[i % DEPT_COLORS.length];

                                        return (
                                            <div 
                                                key={dept.id || i} 
                                                onClick={() => setSelectedDept(dept)}
                                                className={`flex items-center gap-3 p-4 border rounded-xl cursor-pointer transition-all group bg-white shadow-sm hover:shadow-md ${colorTheme.border}`}
                                            >
                                                <div className={`p-2.5 rounded-lg shrink-0 transition-colors ${colorTheme.bg} ${colorTheme.text} ${colorTheme.hover}`}>
                                                    <IconCmp className="w-6 h-6" />
                                                </div>
                                                <div className="flex flex-col min-w-0">
                                                    <span className="font-bold text-sm text-slate-800 group-hover:text-tdmh-blue truncate leading-tight transition-colors">{dept['Name'] || dept.Name}</span>
                                                    <span className="text-[9px] text-slate-400 font-bold uppercase tracking-widest truncate mt-0.5">{dept['Category'] || dept.category || 'Standard'}</span>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        );

                    case 'calendar': 
                        const calYear = currentCalDate.getFullYear();
                        const calMonth = currentCalDate.getMonth();
                        const monthName = currentCalDate.toLocaleString('default', { month: 'long' });
                        const daysInMonthCount = new Date(calYear, calMonth + 1, 0).getDate();
                        const firstDayOfMonth = new Date(calYear, calMonth, 1).getDay(); 
                        
                        const daysInMonthArray = Array.from({length: daysInMonthCount}, (_, i) => i + 1);
                        const blankDays = Array.from({length: firstDayOfMonth}, (_, i) => i);

                        // Safe parser for dates (bypasses timezone shifting issues)
