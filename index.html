                      const type = ev['Event Type'] || ev[5] || 'Event / General';
                      let dotColor = 'border-purple-500'; let badgeClass = 'bg-purple-50 text-purple-600 border-purple-200';
                      if(type === 'Holiday / Non-Working') { dotColor = 'border-red-500'; badgeClass = 'bg-red-50 text-red-600 border-red-200'; }
                      if(type === 'Official Business') { dotColor = 'border-blue-500'; badgeClass = 'bg-blue-50 text-blue-600 border-blue-200'; }
                      return (
                      <div key={i} className="relative pl-6 group">
                        <div className={`absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-white border-2 ${dotColor}`}></div>
                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-purple-300">
                          <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                            {ev['Date Text'] || ev.date || ev[0]} {ev.Time || ev[2] ? `• ${ev.Time || ev[2]}` : ''}
                            <span className={`px-2 py-0.5 rounded border ${badgeClass}`}>{type}</span>
                            {(userRole === 'admin' || userRole === 'dept_head') && (
                              <button onClick={() => { setEditEventData({oldDateText: ev['Date Text'] || ev.date || ev[0], oldTitle: ev['Event Title'] || ev.Title || ev[3], newTime: ''}); setShowEditEvent(true); }} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-1 rounded ml-auto"><Icon name="Edit" className="w-3 h-3" /></button>
                            )}
                          </div>
                          <div className="text-base font-bold text-slate-800">{ev['Event Title'] || ev.Title || ev[3]}</div>
                        </div>
                      </div>
                    )})}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        if (activeTab === 'agimat') {
          return (
            <div className="animate-fade-in max-w-5xl mx-auto py-6">
              <div className="flex flex-col items-center justify-center mb-10 text-center">
                <img src="https://raw.githubusercontent.com/tdmh-cqi/Portal/main/images%20logo/agimat-logo.png" alt="Agimat" className="h-16 md:h-24 object-contain mb-4 drop-shadow-sm" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
                <p className="text-slate-500 font-medium text-base mt-2">Standardized video training and continuous quality improvement resources.</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                {agimat.length === 0 && (
                  <div className="col-span-full text-center p-10 bg-white border rounded-xl"><Icon name="Video" className="w-12 h-12 text-slate-300 mx-auto mb-2" /><p className="text-slate-500">No training videos found.</p></div>
                )}
                {agimat.map((vid, i) => (
                  <div key={i} className="structured-card p-5 group hover:border-tdmh-blue transition-colors flex flex-col">
                    <div className="aspect-video bg-slate-900 rounded-xl mb-4 overflow-hidden border border-slate-200 relative">
                      {(vid['Video URL (Embed)'] || '') ? (
                        <iframe className="w-full h-full" src={vid['Video URL (Embed)']} frameBorder="0" allowFullScreen></iframe>
                      ) : (
                        <div className="w-full h-full flex flex-col items-center justify-center bg-slate-100 text-slate-400 absolute inset-0"><Icon name="Video" className="w-12 h-12 mb-3 opacity-50" /></div>
                      )}
                    </div>
                    <div className="px-2 pb-2 flex-1 flex flex-col">
                      <div>
                        <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[10px] font-bold uppercase rounded border">{vid['Module Number']}</span>
                        <h4 className="text-slate-800 font-black text-xl mt-3">{vid['Video Title']}</h4>
                        <p className="text-sm text-slate-500 mt-2">{vid.Description}</p>
                      </div>
                      {(vid['Video URL (Embed)'] || '') && (
                        <div className="mt-auto pt-5">
                          <a href={(vid['Video URL (Embed)'] || '').replace('/preview', '/view')} target="_blank" className="w-full bg-tdmh-blue text-white py-2.5 rounded-lg text-xs font-bold flex justify-center items-center gap-2 hover:bg-blue-900"><Icon name="Maximize" className="w-4 h-4" /> Watch Fullscreen</a>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        return null;
      };

      return (
        <div className="flex flex-col min-h-screen bg-pattern">
          
          {/* TOP NAVIGATION HEADER */}
          <nav className="no-print bg-tdmh-blue text-white shadow-xl z-40 sticky top-0 border-b-2 border-blue-900">
            <div className="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-16 md:h-20 gap-4">
                <div className="flex items-center gap-2 md:gap-4 shrink-0">
                  <a href="#" onClick={(e) => { e.preventDefault(); window.location.reload(); }} className="bg-white px-3 py-1.5 md:py-2 rounded-xl shadow-md">
                    <img src="https://raw.githubusercontent.com/tdmh-cqi/Portal/main/images%20logo/tdmh-logo.png" alt="Logo" className="h-8 md:h-10 w-auto object-contain" />
                  </a>
                  {userRole === 'admin' && (
                    <button onClick={() => setShowAdminConsole(true)} className="relative p-2 md:p-2.5 rounded-lg bg-white/10 border border-white/20 hover:bg-white/20 transition-colors" title="Admin Control Center">
                      <Icon name="Shield" className="w-5 h-5" />
                      <div className="absolute -top-1.5 -right-1.5 flex flex-wrap gap-0.5 justify-end w-6">
                        {pendingDccRequests.length > 0 && <span className="w-2.5 h-2.5 bg-red-500 rounded-full border border-tdmh-blue animate-pulse"></span>}
                        {pendingMemosList.length > 0 && <span className="w-2.5 h-2.5 bg-orange-500 rounded-full border border-tdmh-blue animate-pulse"></span>}
                        {pendingMemoRequests.length > 0 && <span className="w-2.5 h-2.5 bg-yellow-400 rounded-full border border-tdmh-blue animate-pulse"></span>}
                        {openInquiries.length > 0 && <span className="w-2.5 h-2.5 bg-emerald-500 rounded-full border border-tdmh-blue animate-pulse"></span>}
                        {pendingNews.length > 0 && <span className="w-2.5 h-2.5 bg-blue-400 rounded-full border border-tdmh-blue animate-pulse"></span>}
                        {pendingToolRequests.length > 0 && <span className="w-2.5 h-2.5 bg-purple-500 rounded-full border border-tdmh-blue animate-pulse"></span>}
                      </div>
                    </button>
                  )}
                </div>
                
                <div className="hidden xl:flex flex-1 items-center justify-center min-w-0 px-10 relative">
                  <button onClick={() => scrollTabs('left')} className="absolute left-1 z-10 p-1.5 rounded-full bg-blue-800/80 hover:bg-white hover:text-tdmh-blue"><Icon name="ChevronLeft" className="w-4 h-4" /></button>
                  <div ref={tabsContainerRef} className="flex items-center gap-1 bg-blue-900/40 p-1.5 rounded-xl overflow-x-auto no-scrollbar scroll-smooth w-full">
                    {TABS.map(tab => (
                      <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`px-4 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 whitespace-nowrap shrink-0 ${activeTab === tab.id ? 'bg-white text-tdmh-blue' : 'text-blue-100 hover:bg-blue-800'}`}>
                        <Icon name={tab.icon} className="w-4 h-4" /> {tab.label}
                      </button>
                    ))}
                  </div>
                  <button onClick={() => scrollTabs('right')} className="absolute right-1 z-10 p-1.5 rounded-full bg-blue-800/80 hover:bg-white hover:text-tdmh-blue"><Icon name="ChevronRight" className="w-4 h-4" /></button>
                </div>

                <div className="flex items-center gap-3 md:gap-4 shrink-0">
                  {/* 🚀 LIVE USERS INDICATOR */}
                  <div className="hidden md:flex items-center gap-2 bg-blue-900/50 px-3 py-1.5 rounded-full border border-blue-800" title="Live portal activity across the hospital">
                    <span className="w-2 h-2 bg-green-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(74,222,128,0.8)]"></span>
                    <span className="text-xs font-bold text-blue-100">{liveUsersCount} Online</span>
                  </div>

                  <div className="hidden lg:flex gap-2 mr-2">
                    {userRole === 'admin' && <span className="bg-red-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded border border-red-600">Admin</span>}
                    {userRole === 'dept_head' && <span className="bg-yellow-500 text-yellow-900 text-[10px] font-black uppercase px-2 py-1 rounded border border-yellow-600">Dept Head</span>}
                    {userRole === 'admitting' && <span className="bg-purple-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded border border-purple-600">Admitting</span>}
                  </div>
                  {userRole === 'guest' ? (
                    <button onClick={() => setShowRoleLogin(true)} className="hidden sm:flex items-center gap-2 bg-white/10 text-white px-5 py-2.5 rounded-lg text-sm font-bold"><Icon name="Lock" className="w-4 h-4" /> Staff Login</button>
                  ) : (
                    <button onClick={handleLogout} className="hidden sm:flex text-xs font-bold uppercase text-red-300 hover:text-red-100 bg-red-900/30 px-5 py-2.5 rounded-lg border border-red-900/50">Logout</button>
                  )}
                  <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="xl:hidden p-2 bg-white text-tdmh-blue rounded-lg shadow-sm">
                    {mobileMenuOpen ? <Icon name="X" className="w-5 h-5" /> : <Icon name="Menu" className="w-5 h-5" />}
                  </button>
                </div>
              </div>
            </div>

            {mobileMenuOpen && (
              <div className="xl:hidden bg-white border-t border-slate-200 absolute w-full shadow-2xl animate-fade-in text-slate-800 z-50 max-h-[calc(100vh-4rem)] overflow-y-auto">
                <div className="p-4 space-y-2">
                  <div className="flex items-center justify-center gap-2 bg-slate-50 py-2 rounded-xl mb-4 border border-slate-100">
                    <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span className="text-xs font-bold text-slate-600">{liveUsersCount} Users Online</span>
                  </div>
                  {TABS.map(tab => (
                    <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`w-full flex items-center gap-3 px-5 py-4 rounded-xl text-sm font-bold ${activeTab === tab.id ? 'bg-tdmh-blue text-white' : 'text-slate-600 hover:bg-slate-50 border border-slate-100'}`}>
                      <Icon name={tab.icon} className="w-5 h-5" /> {tab.label}
                    </button>
                  ))}
                  <div className="pt-4 mt-4 border-t border-slate-200 space-y-3">
                    {userRole === 'guest' ? (
                      <button onClick={() => {setShowRoleLogin(true); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-slate-100 text-slate-700 px-5 py-4 rounded-xl text-sm font-bold"><Icon name="Lock" className="w-5 h-5" /> Staff Login</button>
                    ) : (
                      <button onClick={handleLogout} className="w-full bg-red-50 text-red-600 px-5 py-4 rounded-xl text-sm font-bold">Logout</button>
                    )}
                  </div>
                </div>
              </div>
            )}
          </nav>

          {/* MAIN CONTENT AREA */}
          <main className="flex-grow max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 w-full relative z-10 flex flex-col justify-start">
            {renderActiveTabContent()}
          </main>

          {/* FOOTER */}
          <footer className="no-print mt-auto bg-tdmh-blue border-t-2 border-blue-900 py-6 text-center text-white text-[10px] font-bold flex flex-col md:flex-row justify-center items-center gap-6 relative z-20 shrink-0">
            <p className="uppercase tracking-widest text-blue-200">© {new Date().getFullYear()} TAYTAY DOCTORS MULTISPECIALTY HOSPITAL.</p>
            <button onClick={() => fetchDatabase(true)} className="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-blue-900 border border-blue-800 text-tdmh-green hover:bg-blue-800 transition-colors uppercase tracking-widest text-xs font-black shadow-lg">
              <Icon name="Sync" className="w-4 h-4" /> {isSyncing ? 'Syncing...' : 'System Sync'}
            </button>
          </footer>

          {/* FLOATING CHAT WIDGET */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3 no-print">
            {showChatTooltip && (
              <div className="bg-white p-4 rounded-2xl shadow-xl border border-slate-200 max-w-[280px] animate-slide-up relative">
                <button onClick={() => setShowChatTooltip(false)} className="absolute top-2 right-2 text-slate-400 hover:text-slate-600"><Icon name="X" className="w-3 h-3"/></button>
                <p className="text-xs text-slate-600 font-medium leading-relaxed pr-2">If you have any concerns or inquiries, please submit them here. Our Admin team will see to it and assist you promptly.</p>
              </div>
            )}
            <button onClick={() => {setShowSupportChat(true); setShowChatTooltip(false);}} className="w-14 h-14 bg-tdmh-blue text-white rounded-full shadow-2xl flex items-center justify-center hover:bg-blue-900 transition-transform hover:scale-105 border-4 border-white">
              <Icon name="MessageCircle" className="w-6 h-6" />
            </button>
          </div>

          {/* MODALS */}
          <Modal isOpen={signModalOpen} onClose={() => setSignModalOpen(false)} title={viewingMemo?.Format === 'Quick Read' || viewingMemo?.[8] === 'Quick Read' ? "Acknowledge Memo" : "Sign Memorandum"} subtitle={`Acknowledging REF: ${viewingMemo ? (viewingMemo['Ref No'] || viewingMemo[0]) : ''}`} iconName={viewingMemo?.Format === 'Quick Read' || viewingMemo?.[8] === 'Quick Read' ? "CheckCircle" : "PenTool"} maxWidth="max-w-md">
            <FormInput label="Full Name" value={signData.name} onChange={e=>setSignData({...signData, name: e.target.value})} required placeholder="e.g. Juan Dela Cruz" />
            <FormInput label="Department / Position" value={signData.dept} onChange={e=>setSignData({...signData, dept: e.target.value})} required placeholder="e.g. Cardiology" />
            
            {viewingMemo?.Format === 'Quick Read' || viewingMemo?.[8] === 'Quick Read' ? (
              <button type="button" onClick={() => handleSignatureSubmit(null)} className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg mt-4 disabled:opacity-50">Mark as Read & Acknowledge</button>
            ) : (
              <SignaturePad onSave={handleSignatureSubmit} onCancel={() => setSignModalOpen(false)} />
            )}
          </Modal>

          {/* 🚀 BUG FIX: Added QR Modal that was missing */}
          <Modal isOpen={!!qrLightbox} onClose={() => setQrLightbox(null)} title={qrLightbox?.title || "QR Code"} iconName="QrCode" maxWidth="max-w-sm">
            {qrLightbox && (
              <div className="flex flex-col items-center justify-center pb-2">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-4">
                  <img src={qrLightbox.url} alt="QR Code" className="w-48 h-48 object-contain" />
                </div>
                <p className="text-sm text-slate-500 text-center mb-6">Scan this code with your mobile device to access the document.</p>
                <button onClick={() => setQrLightbox(null)} className="w-full bg-slate-100 text-slate-700 font-black uppercase tracking-widest text-sm py-4 rounded-xl hover:bg-slate-200 transition-colors shadow-sm">Close</button>
              </div>
            )}
          </Modal>
          
          <Modal isOpen={showAddToolReq} onClose={() => setShowAddToolReq(false)} title="Request New Tool" subtitle={`For ${selectedDept?.Name || 'Department'}`} iconName="Box" maxWidth="max-w-md">
            <form onSubmit={handleToolRequestSubmit}>
              <FormInput label="Tool / Form Name" value={toolReqData.toolName} onChange={e=>setToolReqData({...toolReqData, toolName: e.target.value})} required placeholder="e.g. Leave Request Form" />
              <FormInput label="Tool Link (URL)" type="url" value={toolReqData.link} onChange={e=>setToolReqData({...toolReqData, link: e.target.value})} required placeholder="https://..." />
              <FormInput as="textarea" label="Description" value={toolReqData.description} onChange={e=>setToolReqData({...toolReqData, description: e.target.value})} required placeholder="What is this tool used for?" />
              <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg mt-2 disabled:opacity-50">{isSubmitting ? 'Submitting...' : 'Submit Request'}</button>
            </form>
          </Modal>

          <Modal isOpen={showAddContent} onClose={() => setShowAddContent(false)} title={`Add ${contentData.contentType}`} iconName="Folder" maxWidth="max-w-md">
            <form onSubmit={handleAddContentSubmit}>
              <FormInput as="select" label="Content Type" value={contentData.contentType} onChange={e=>setContentData({...contentData, contentType: e.target.value})} options={['Universal', 'ISO', 'Agimat']} />
              <FormInput label="Title" value={contentData.title} onChange={e=>setContentData({...contentData, title: e.target.value})} required placeholder="Form / Video Title" />
              {contentData.contentType === 'Agimat' && (<FormInput label="Module Number" value={contentData.moduleNum} onChange={e=>setContentData({...contentData, moduleNum: e.target.value})} required placeholder="e.g. MOD-01" />)}
              <FormInput label="Resource URL / Link" type="url" value={contentData.link} onChange={e=>setContentData({...contentData, link: e.target.value})} required placeholder="https://..." />
              <FormInput as="textarea" label="Description" value={contentData.description} onChange={e=>setContentData({...contentData, description: e.target.value})} required placeholder="Short description..." />
              <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg mt-2 disabled:opacity-50">{isSubmitting ? 'Adding...' : 'Publish Content'}</button>
            </form>
          </Modal>

          <Modal isOpen={showSecurityModal} onClose={() => setShowSecurityModal(false)} title="Update Passwords" iconName="Key" maxWidth="max-w-md">
            <form onSubmit={handleSecuritySubmit}>
              <FormInput as="select" label="Update Type" value={securityData.type} onChange={e=>setSecurityData({...securityData, type: e.target.value, target: e.target.value === 'Role' ? 'Admin' : departments[0]?.Name})} options={['Role', 'Dept']} />
              {securityData.type === 'Role' ? (
                <FormInput as="select" label="Target Role" value={securityData.target} onChange={e=>setSecurityData({...securityData, target: e.target.value})} options={['Admin', 'Portal Lock', 'H.O.D', 'Admitting']} />
              ) : (
                <FormInput as="select" label="Target Department" value={securityData.target} onChange={e=>setSecurityData({...securityData, target: e.target.value})} options={departments.map(d => d.Name || d[1])} />
              )}
              <FormInput label="New PIN / Password" type="text" value={securityData.newPin} onChange={e=>setSecurityData({...securityData, newPin: e.target.value})} required placeholder="Enter new password" />
              <button type="submit" disabled={isSubmitting} className="w-full bg-red-600 text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg mt-2 disabled:opacity-50 hover:bg-red-700">{isSubmitting ? 'Updating...' : 'Confirm Security Change'}</button>
            </form>
          </Modal>
          
          <Modal isOpen={showAddMonitoring} onClose={() => setShowAddMonitoring(false)} title="Add Monitored System" iconName="Monitor" maxWidth="max-w-md">
            <form onSubmit={handleAddMonitoringSubmit}>
              <FormInput label="System Name" value={monitoringData.name} onChange={e=>setMonitoringData({...monitoringData, name: e.target.value})} required placeholder="e.g. HRIS Portal" />
              <FormInput label="System Link (URL)" type="url" value={monitoringData.link} onChange={e=>setMonitoringData({...monitoringData, link: e.target.value})} required placeholder="https://..." />
              <FormInput as="textarea" label="Description" value={monitoringData.description} onChange={e=>setMonitoringData({...monitoringData, description: e.target.value})} required placeholder="What is this system used for?" />
              <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg mt-2 disabled:opacity-50">{isSubmitting ? 'Adding...' : 'Add System'}</button>
            </form>
          </Modal>

          <Modal isOpen={showNewsFlyer} onClose={() => setShowNewsFlyer(false)} maxWidth="max-w-2xl">
            <div className="-m-8 mb-8 pb-6 bg-slate-50 border-b border-slate-100 flex flex-col items-center text-center rounded-t-[2rem] pt-8">
              <div className="w-16 h-16 bg-tdmh-blue text-white rounded-2xl flex items-center justify-center mb-4"><Icon name="Bell" className="w-8 h-8" /></div>
              <span className="text-[10px] font-bold tracking-[0.2em] text-tdmh-blue uppercase mb-2">TDMH Official Notice</span>
              <h2 className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight px-4">TDMH CQI Portal V2 is Live!</h2>
            </div>
            <p className="text-slate-700 mb-6 text-lg font-bold leading-relaxed text-center">Welcome to your upgraded administrative command center.</p>
            <ul className="space-y-5 mb-10 px-2 md:px-6">
              <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg"><Icon name="Menu" className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm">Top Navigation</strong> <span className="text-slate-500 text-xs">Tools are safely tucked in tabs at the top.</span></div></li>
              <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg"><Icon name="Box" className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm">Departments</strong> <span className="text-slate-500 text-xs">Clicking a department is open to everyone unless locked by the Admin.</span></div></li>
              <li className="flex items-start gap-4"><div className="p-2 bg-red-50 text-red-500 rounded-lg"><Icon name="Shield" className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm">Enhanced Security</strong> <span className="text-slate-600 text-xs">Admin actions require the Master PIN to ensure our data remains secure.</span></div></li>
            </ul>
            <button onClick={() => setShowNewsFlyer(false)} className="w-full py-4 bg-tdmh-blue text-white font-black uppercase tracking-widest rounded-xl text-sm shadow-lg hover:-translate-y-1 transition-transform">Acknowledge & Enter Portal</button>
          </Modal>

          <Modal isOpen={showRoleLogin} onClose={() => {setShowRoleLogin(false); setRolePinInput(''); setRoleLoginFeedback(null);}} title="Staff Login" subtitle="Enter your authorized role PIN" iconName="Lock" maxWidth="max-w-sm">
            {roleLoginFeedback && <div className="mb-6 text-sm font-bold p-3 rounded-lg bg-red-50 text-red-600 border border-red-200 text-center">{roleLoginFeedback.text}</div>}
            <form onSubmit={submitRoleLogin}>
              <input type="password" value={rolePinInput} onChange={(e) => setRolePinInput(e.target.value)} className="w-full p-4 text-center text-2xl tracking-[0.5em] font-black border-2 border-slate-200 rounded-xl focus:border-tdmh-blue outline-none mb-6" placeholder="••••" autoFocus />
              <button type="submit" disabled={isVerifyingLogin} className="w-full bg-tdmh-blue text-white font-black uppercase text-sm py-4 rounded-xl shadow-lg disabled:opacity-50">{isVerifyingLogin ? 'Verifying...' : 'Login Securely'}</button>
            </form>
          </Modal>

          <Modal isOpen={deptAuthModal.isOpen} onClose={() => setDeptAuthModal({...deptAuthModal, isOpen: false, pinInput: '', feedback: null})} title={deptAuthModal.targetDept?.Name || 'Department'} subtitle="Enter department PIN to unlock tools" iconName="Lock" maxWidth="max-w-sm">
            {deptAuthModal.feedback && <div className={`mb-6 text-sm font-bold p-3 rounded-lg text-center ${deptAuthModal.feedback.type === 'error' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'}`}>{deptAuthModal.feedback.text}</div>}
            <form onSubmit={submitDeptAuth}>
              <input type="password" value={deptAuthModal.pinInput} onChange={(e) => setDeptAuthModal({...deptAuthModal, pinInput: e.target.value})} className="w-full p-4 text-center text-2xl tracking-[0.5em] font-black border-2 border-slate-200 rounded-xl focus:border-tdmh-blue outline-none mb-6" placeholder="••••" autoFocus />
              <button type="submit" disabled={deptAuthModal.isLoading} className="w-full bg-tdmh-blue text-white font-black uppercase text-sm py-4 rounded-xl disabled:opacity-50">{deptAuthModal.isLoading ? 'Verifying...' : 'Unlock Tools'}</button>
            </form>
          </Modal>

          <Modal isOpen={customAlert.isOpen} onClose={() => setCustomAlert({ ...customAlert, isOpen: false })} maxWidth="max-w-sm">
            <div className="text-center">
              <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border ${customAlert.type === 'error' ? 'bg-red-50 text-red-500 border-red-100' : 'bg-tdmh-blue text-white border-blue-900 shadow-md'}`}>
                <Icon name={customAlert.type === 'error' ? "AlertCircle" : "CheckCircle"} className="w-8 h-8" />
              </div>
              <h3 className="text-2xl font-black text-slate-800 mb-2">{customAlert.title}</h3>
              <p className="text-slate-500 mb-8 whitespace-pre-wrap leading-relaxed">{customAlert.message}</p>
              <button onClick={() => setCustomAlert({ ...customAlert, isOpen: false })} className={`w-full font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-md ${customAlert.type === 'error' ? 'bg-slate-800 text-white hover:bg-black' : 'bg-tdmh-blue text-white hover:bg-blue-900'}`}>Acknowledge</button>
            </div>
          </Modal>

          <Modal isOpen={showAddEvent} onClose={() => setShowAddEvent(false)} title="Add Master Event" subtitle="Schedule & Alert System" iconName="Calendar" iconColor="text-purple-600" iconBg="bg-purple-50 border-purple-100">
            <form onSubmit={handleEventSubmit}>
              <FormInput as="select" label="Event Type" value={eventData.eventType} onChange={e=>setEventData({...eventData, eventType: e.target.value})} options={['Event / General', 'Official Business', 'Holiday / Non-Working']} />
              <FormInput label="Event Title" value={eventData.title} onChange={e=>setEventData({...eventData, title: e.target.value})} required placeholder="e.g. Monthly Dept Meeting" />
              <div className="grid grid-cols-2 gap-4">
                <FormInput label="Date" type="date" value={eventData.date} onChange={e=>setEventData({...eventData, date: e.target.value})} required />
                <FormInput label="Time (Optional)" type="time" value={eventData.time} onChange={e=>setEventData({...eventData, time: e.target.value})} />
              </div>
              <button type="submit" disabled={isSubmitting} className="w-full bg-purple-600 text-white font-black tracking-widest uppercase py-4 rounded-xl mt-2 shadow-lg disabled:opacity-50 hover:bg-purple-700">{isSubmitting ? 'Saving...' : 'Schedule Event'}</button>
            </form>
          </Modal>

          <Modal isOpen={showEditEvent} onClose={() => setShowEditEvent(false)} title="Edit Event Time">
            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-6"><p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">{editEventData.oldDateText}</p><p className="text-sm font-bold text-slate-700 leading-tight">{editEventData.oldTitle}</p></div>
            <form onSubmit={handleEditEventSubmit}>
              <FormInput label="Select New Time" type="time" value={editEventData.newTime} onChange={e=>setEditEventData({...editEventData, newTime: e.target.value})} required />
              <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black tracking-widest uppercase py-4 rounded-xl shadow-lg disabled:opacity-50">{isSubmitting ? 'Updating...' : 'Update Time'}</button>
            </form>
          </Modal>

          <Modal isOpen={showAddNews} onClose={() => setShowAddNews(false)} title="Post Announcement" subtitle="Global System Broadcast" iconName="Bell" maxWidth="max-w-2xl">
            <form onSubmit={handleAddNewsSubmit}>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                <FormInput className="md:col-span-2" label="Headline / Title" value={newsData.title} onChange={e=>setNewsData({...newsData, title: e.target.value})} required placeholder="e.g. Server Maintenance" />
                <FormInput as="select" label="Notice Type" value={newsData.type} onChange={e=>setNewsData({...newsData, type: e.target.value})} options={["Standard", "Urgent", "System Update"]} />
              </div>
              <FormInput as="textarea" label="Full Message Body" value={newsData.content} onChange={e=>setNewsData({...newsData, content: e.target.value})} required placeholder="Type the full announcement details here..." />
              <div className="pt-2 border-t border-slate-100 flex flex-col sm:flex-row gap-4 items-center justify-between">
                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Posting as: <span className="text-tdmh-blue">{userRole}</span></p>
                <button type="submit" disabled={isSubmitting} className="w-full sm:w-auto bg-tdmh-blue text-white font-black uppercase tracking-widest px-8 py-4 rounded-xl shadow-lg disabled:opacity-50 text-sm">{isSubmitting ? 'Sending to Queue...' : 'Submit for Approval'}</button>
              </div>
            </form>
          </Modal>

          <Modal isOpen={showSupportChat} onClose={() => setShowSupportChat(false)} title="Admin Support" subtitle="Help & Inquiries" iconName="MessageCircle">
            <form onSubmit={handleInquirySubmit}>
              <FormInput label="Your Dept Email" type="email" value={inquiryData.email} onChange={e=>setInquiryData({...inquiryData, email: e.target.value})} required placeholder="dept@tdmh.com" />
              <FormInput as="select" label="Inquiry Category" value={inquiryData.category} onChange={e=>setInquiryData({...inquiryData, category: e.target.value})} options={["General Help", "Bug Report", "Feature Request"]} />
              <FormInput as="textarea" label="Message" value={inquiryData.message} onChange={e=>setInquiryData({...inquiryData, message: e.target.value})} required placeholder="Describe your issue or request here..." />
              <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest py-4 rounded-xl shadow-lg disabled:opacity-50 mt-2 text-sm">{isSubmitting ? 'Sending...' : 'Submit Inquiry'}</button>
            </form>
          </Modal>

          <Modal isOpen={showAddMemo} onClose={() => {setShowAddMemo(false); setEditMemoRef(null); setMemoRequestMode(false); setRequesterName('');}} title={memoRequestMode ? 'Request Memo Edit' : (editMemoRef ? 'Edit Existing Memo' : 'Draft New Memo')} subtitle={editMemoRef ? `REF: ${editMemoRef}` : 'Official Record'} iconName="FileText" maxWidth="max-w-2xl">
            <form onSubmit={handleNativeMemoSubmit}>
              {memoRequestMode && (
                <FormInput label="Requested By (Name / Department)" value={requesterName} onChange={e=>setRequesterName(e.target.value)} required placeholder="e.g. Dr. Smith (Cardiology)" className="bg-blue-50 p-4 rounded-xl border border-blue-100" />
              )}
              {!editMemoRef && !memoRequestMode && (
                <div className="mb-5 bg-slate-50 p-5 rounded-xl border border-slate-200">
                  <FormInput label="Originating Dept Code" value={memoData.deptCode} onChange={e=>setMemoData({...memoData, deptCode: e.target.value.toUpperCase()})} required placeholder="e.g. HR, IT, CQI" className="mb-2" />
                  <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">* Enter your Department Acronym to generate the Reference Number.</p>
                </div>
              )}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <FormInput label="To (Department)" value={memoData.forDept} onChange={e=>setMemoData({...memoData, forDept: e.target.value})} required placeholder="e.g. All Staff"/>
                <FormInput label="From (Name)" value={memoData.fromName} onChange={e=>setMemoData({...memoData, fromName: e.target.value})} required placeholder="e.g. HR Dept" />
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <FormInput label="Subject Title" value={memoData.subject} onChange={e=>setMemoData({...memoData, subject: e.target.value})} required placeholder="Brief subject description" />
                
                {/* 🚀 SMART MEMOS: Acknowledgment Type Toggle */}
                {!memoRequestMode && (
                  <FormInput as="select" label="Acknowledgment Mode" value={memoData.ackType} onChange={e=>setMemoData({...memoData, ackType: e.target.value})} options={["Signature Required", "Quick Read"]} />
                )}
              </div>
              <FormInput as="select" label="Urgency Level" value={memoData.urgency} onChange={e=>setMemoData({...memoData, urgency: e.target.value})} options={["Normal", "High"]} />
              <div className="mb-4">
                <div className="flex justify-between items-end mb-1.5">
                  <label className="block text-[10px] font-bold uppercase text-slate-500 tracking-wider">Message Body <span className="text-red-500">*</span></label> 
                  <button type="button" onClick={handleFixGrammar} className="text-[10px] bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 px-3 py-1 rounded font-bold uppercase tracking-widest flex items-center gap-1.5"><Icon name="Sparkles" className="w-3 h-3"/> Fix Formatting</button>
                </div>
                <textarea required value={memoData.body} onChange={e=>setMemoData({...memoData, body: e.target.value})} className="w-full p-4 border border-slate-300 focus:border-tdmh-blue outline-none rounded-xl h-40 text-sm leading-relaxed text-slate-700" placeholder="Type standard paragraph format here..."></textarea>
              </div>
              <button type="submit" disabled={isSubmitting || isFixingGrammar} className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg disabled:opacity-50">
                {isSubmitting ? 'Routing...' : (memoRequestMode ? 'Submit Modification Request' : 'Generate Official Memo')}
              </button>
            </form>
          </Modal>

          {viewingMemo && (
            <div className="fixed inset-0 z-[140] flex items-center justify-center p-4 md:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in print-overlay overflow-y-auto" onClick={() => setViewingMemo(null)}>
              <div className="bg-white p-8 md:p-12 rounded-[2rem] shadow-2xl max-w-3xl w-full my-auto printable-memo relative border border-slate-200" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-start mb-8 no-print">
                  <div className="flex items-center gap-3"><div className="bg-slate-100 p-2.5 rounded-lg border"><Icon name="FileText" className="w-6 h-6 text-slate-600"/></div><h3 className="text-2xl font-black text-slate-800">Record Viewer</h3></div>
                  <button onClick={() => setViewingMemo(null)} className="p-2 bg-slate-50 text-slate-400 hover:text-slate-800 rounded-full"><Icon name="X" className="w-6 h-6"/></button>
                </div>
                <div className="border-b-4 border-slate-800 pb-6 mb-8 mt-2 text-center">
                  <img src="https://raw.githubusercontent.com/tdmh-cqi/Portal/main/images%20logo/tdmh-logo.png" alt="TDMH Logo" className="h-20 md:h-24 mx-auto mb-4 object-contain" />
                  <h1 className="text-3xl md:text-4xl font-black uppercase tracking-widest text-slate-800">Memorandum</h1>
                  <p className="text-sm font-bold text-slate-500 uppercase tracking-widest mt-1 mb-8">(Inter-Office Letter)</p>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-8 text-sm font-bold text-slate-800 text-left">
                    <div className="flex items-center"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">TO:</span> <span className="border-b border-slate-200 w-full pb-1">{viewingMemo.For || viewingMemo[2]}</span></div>
                    <div className="flex items-center"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">FROM:</span> <span className="border-b border-slate-200 w-full pb-1">{viewingMemo.From || viewingMemo[3]}</span></div>
                    <div className="flex items-center"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">DATE:</span> <span className="border-b border-slate-200 w-full pb-1">{viewingMemo.Date || viewingMemo[1]}</span></div>
                    <div className="flex items-center"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">REF NO:</span> <span className="border-b border-slate-200 w-full pb-1">{viewingMemo['Ref No'] || viewingMemo[0]}</span></div>
                    <div className="col-span-full flex items-center mt-2"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">SUBJECT:</span> <span className="border-b border-slate-200 w-full pb-1 font-black text-base uppercase">{viewingMemo.Subject || viewingMemo[4]}</span></div>
                  </div>
                </div>
                <div className="whitespace-pre-wrap text-slate-800 leading-relaxed min-h-[250px] mb-12 text-justify">{viewingMemo.Body || viewingMemo[5]}</div>
                <div className="no-print border-t border-slate-200 pt-8 flex flex-col sm:flex-row gap-4 items-center justify-between">
                  <div className="flex flex-wrap gap-3 w-full sm:w-auto">
                    {/* 🚀 SMART MEMOS: Button Change based on Form Type */}
                    <button onClick={() => setSignModalOpen(true)} className="flex-1 sm:flex-none bg-tdmh-blue text-white px-6 py-3 rounded-xl font-black uppercase text-xs flex items-center justify-center gap-2"><Icon name={(viewingMemo.Format || viewingMemo[8]) === 'Quick Read' ? "CheckCircle" : "PenTool"} className="w-4 h-4"/> {(viewingMemo.Format || viewingMemo[8]) === 'Quick Read' ? 'Acknowledge Read' : 'Sign Form'}</button>
                    <button onClick={handlePrintMemo} className="flex-1 sm:flex-none bg-slate-100 text-slate-700 px-6 py-3 rounded-xl font-black uppercase text-xs flex items-center justify-center gap-2 border"><Icon name="Download" className="w-4 h-4"/> Print / PDF</button>
                  </div>
                  {userRole === 'admin' && String(viewingMemo.Status || viewingMemo[6]).toUpperCase().includes('PENDING') && (
                    <button onClick={() => handleApproveMemo(viewingMemo['Ref No'] || viewingMemo[0])} disabled={isApprovingMemo} className="w-full sm:w-auto bg-tdmh-green text-white px-8 py-3 rounded-xl font-black uppercase text-xs disabled:opacity-50">{isApprovingMemo ? 'Approving...' : 'Approve to Live'}</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {showAdminConsole && (
            <div className="fixed inset-0 z-[130] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm animate-fade-in no-print overflow-y-auto" onClick={() => {setShowAdminConsole(false); setShowMasterlist(false);}}>
              <div className="bg-slate-900 p-6 md:p-10 rounded-[2rem] shadow-2xl max-w-6xl w-full my-auto border border-slate-700 animate-slide-up relative" onClick={e => e.stopPropagation()}>
                <button onClick={() => {setShowAdminConsole(false); setShowMasterlist(false);}} className="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800 p-2.5 rounded-full transition-colors"><Icon name="X" className="w-6 h-6"/></button>
                
                {/* 🚀 THE INTELLIGENCE HUB vs ACTION CENTER SPLIT */}
                <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 border-b border-slate-700 pb-6 gap-6">
                  <div className="flex items-center gap-4">
                    <div className="w-14 h-14 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center border border-blue-500/30"><Icon name="Shield" className="w-8 h-8" /></div>
                    <div>
                      <h3 className="text-3xl font-black text-white tracking-tight leading-none">Admin Console</h3>
                      <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">Enterprise Oversight Terminal</p>
                    </div>
                  </div>
                  <div className="flex bg-slate-800 p-1 rounded-xl w-full md:w-auto shrink-0 border border-slate-700">
                    <button onClick={() => { setAdminViewMode('action'); setAdminConsoleTab('dashboard'); }} className={`flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest transition-colors flex items-center justify-center gap-2 ${adminViewMode === 'action' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                      <Icon name="Activity" className="w-4 h-4"/> Action Center
                    </button>
                    <button onClick={() => { setAdminViewMode('reports'); setAdminConsoleTab('analytics'); }} className={`flex-1 md:flex-none px-6 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest transition-colors flex items-center justify-center gap-2 ${adminViewMode === 'reports' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                      <Icon name="Chart" className="w-4 h-4"/> Intelligence Hub
                    </button>
                  </div>
                </div>
                
                {adminViewMode === 'action' && (
                  <>
                    <div className="flex flex-wrap gap-2 border-b border-slate-700 mb-6 overflow-x-auto no-scrollbar pb-1">
                      {[
                        {id: 'dashboard', label: 'Dashboard Overview', icon: 'Activity', count: 0},
                        {id: 'dcc', label: 'DCC Queue', icon: 'Folder', count: pendingDccRequests.length},
                        {id: 'news', label: 'News Queue', icon: 'Bell', count: pendingNews.length}, 
                        {id: 'memos', label: 'Memos Queue', icon: 'FileText', count: pendingMemosList.length},
                        {id: 'inquiries', label: 'Support Tickets', icon: 'MessageCircle', count: openInquiries.length},
                        {id: 'memoRequests', label: 'Memo Reqs', icon: 'Edit', count: pendingMemoRequests.length},
                        {id: 'toolRequests', label: 'Tool Reqs', icon: 'Link', count: pendingToolRequests.length},
                        {id: 'monitoring', label: 'CMS: Systems', icon: 'Monitor', count: 0},
                        {id: 'content', label: 'CMS: Content', icon: 'Box', count: 0},
                        {id: 'security', label: 'Security', icon: 'Key', count: 0},
                      ].map(t => (
                        <button key={t.id} onClick={() => setAdminConsoleTab(t.id)} className={`px-4 md:px-5 py-2.5 font-bold text-xs uppercase tracking-widest rounded-lg transition-colors whitespace-nowrap flex items-center gap-2 ${adminConsoleTab === t.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                          <Icon name={t.icon} className="w-4 h-4"/> {t.label} {t.count > 0 && <span className="ml-1 bg-red-500 text-white px-1.5 py-0.5 rounded-md text-[9px] font-black">{t.count}</span>}
                        </button>
                      ))}
                    </div>
                    
                    <div className="min-h-[300px] max-h-[60vh] overflow-y-auto custom-scrollbar pr-2 space-y-4">
                      {adminConsoleTab === 'dashboard' && (
                        <div className="animate-fade-in">
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl text-center"><h4 className="text-4xl font-black text-blue-400 mb-1">{pendingDccRequests.length}</h4><p className="text-xs uppercase tracking-widest font-bold text-slate-400">Pending DCC</p></div>
                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl text-center"><h4 className="text-4xl font-black text-orange-400 mb-1">{pendingMemosList.length}</h4><p className="text-xs uppercase tracking-widest font-bold text-slate-400">Pending Memos</p></div>
                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl text-center"><h4 className="text-4xl font-black text-emerald-400 mb-1">{openInquiries.length}</h4><p className="text-xs uppercase tracking-widest font-bold text-slate-400">Open Tickets</p></div>
                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl text-center"><h4 className="text-4xl font-black text-purple-400 mb-1">{pendingToolRequests.length}</h4><p className="text-xs uppercase tracking-widest font-bold text-slate-400">Tool Requests</p></div>
                          </div>
                          <div className="bg-slate-800 border border-slate-700 p-6 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                              <h3 className="text-white font-black text-lg mb-1">Global Department Lock</h3>
                              <p className="text-slate-400 text-xs">Currently {deptPinRequired ? 'Enabled' : 'Disabled'}. Controls whether staff need a PIN to access specific department tools.</p>
                            </div>
                            <button onClick={handleToggleDeptPin} disabled={isTogglingLock} className={`px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest border transition-colors shadow-sm disabled:opacity-50 shrink-0 ${deptPinRequired ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/30' : 'bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600'}`}>
                              {isTogglingLock ? 'Updating...' : (deptPinRequired ? '🔓 Click to Unlock All' : '🔒 Click to Lock All')}
                            </button>
                          </div>
                        </div>
                      )}

                      {adminConsoleTab === 'toolRequests' && (
                        <div className="animate-fade-in">
                          {pendingToolRequests.length === 0 ? <div className="text-center py-16 bg-slate-800/50 rounded-2xl border border-slate-700"><Icon name="CheckCircle" className="w-12 h-12 text-tdmh-green mx-auto mb-3 opacity-50" /><p className="text-slate-400 font-bold">No pending tool requests.</p></div> :
                          pendingToolRequests.map((req, i) => (
                            <div key={i} className="p-6 border border-slate-700 rounded-2xl bg-slate-800 flex flex-col gap-4 mb-4 shadow-sm">
                              <div className="border-b border-slate-700 pb-4">
                                <div className="flex gap-2 mb-2">
                                  <span className="text-[10px] font-black uppercase bg-slate-700 text-slate-300 px-2.5 py-1 rounded">{req.Timestamp || req[0]}</span>
                                  <span className="text-[10px] font-black uppercase bg-purple-900/50 text-purple-400 px-2.5 py-1 rounded">Dept Request</span>
                                </div>
                                <h4 className="text-lg font-black text-white mb-1">Tool: {req['Tool Name'] || req[2]}</h4>
                                <p className="text-sm font-bold text-slate-400">Requested By: {req['Requesting Dept'] || req[1]} • Target Scope: {req.Scope || req[5]}</p>
                              </div>
                              <div className="bg-slate-900/50 p-4 rounded-xl text-slate-300 text-sm border border-slate-700"><p className="mb-2"><strong className="text-white">URL:</strong> <a href={req.Link || req[4]} target="_blank" className="text-blue-400 hover:underline">{req.Link || req[4]}</a></p><p><strong className="text-white">Description:</strong> {req.Description || req[3]}</p></div>
                              <div className="flex gap-3 pt-2">
                                <button onClick={() => handleResolveToolRequest(req, 'APPROVE')} disabled={isResolving === ((req.Timestamp || req[0]) + (req['Tool Name'] || req[2]))} className="flex-1 bg-tdmh-green text-white px-6 py-2.5 rounded-lg font-black text-xs uppercase disabled:opacity-50">Approve & Add to Database</button>
                                <button onClick={() => handleResolveToolRequest(req, 'REJECT')} disabled={isResolving === ((req.Timestamp || req[0]) + (req['Tool Name'] || req[2]))} className="flex-1 bg-red-600 text-white px-6 py-2.5 rounded-lg font-black text-xs uppercase disabled:opacity-50">Reject</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}

                      {adminConsoleTab === 'content' && (
                        <div className="space-y-4 animate-fade-in">
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800 p-5 rounded-xl border border-slate-700 gap-4 mb-2">
                            <div><h4 className="text-white font-black text-lg flex items-center gap-2"><Icon name="Box" className="w-5 h-5 text-purple-400" /> Content Management System</h4><p className="text-slate-400 text-xs mt-1">Add new forms, tools, and training videos without touching the Google Sheet.</p></div>
                            <button onClick={() => setShowAddContent(true)} className="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-colors shadow-md w-full sm:w-auto"><Icon name="Plus" className="w-4 h-4" /> Add New Content</button>
                          </div>
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl"><h4 className="text-white font-black mb-3">Universal Forms</h4><div className="space-y-2 max-h-40 overflow-y-auto custom-scrollbar pr-2">{universalForms.map((f,i)=><div key={i} className="text-xs text-slate-300 bg-slate-900 p-2 rounded truncate">{f['Form Title'] || f[0]}</div>)}</div></div>
                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl"><h4 className="text-white font-black mb-3">ISO Requirements</h4><div className="space-y-2 max-h-40 overflow-y-auto custom-scrollbar pr-2">{isoRequirements.map((f,i)=><div key={i} className="text-xs text-slate-300 bg-slate-900 p-2 rounded truncate">{f['Form Title'] || f[0]}</div>)}</div></div>
                            <div className="bg-slate-800 border border-slate-700 p-5 rounded-xl"><h4 className="text-white font-black mb-3">Agimat Videos</h4><div className="space-y-2 max-h-40 overflow-y-auto custom-scrollbar pr-2">{agimat.map((f,i)=><div key={i} className="text-xs text-slate-300 bg-slate-900 p-2 rounded truncate">{f['Video Title'] || f[1]}</div>)}</div></div>
                          </div>
                        </div>
                      )}

                      {adminConsoleTab === 'security' && (

                                [...dccLogbook].reverse().map((log, i) => (
                                  <tr key={i} className="hover:bg-slate-800/50 transition-colors">
                                    <td className="px-4 py-3 font-bold text-white">{log['Tracking ID'] || log[0]}</td><td className="px-4 py-3">{log['Form Title'] || log['Title'] || log[1]}</td><td className="px-4 py-3">{log['Dept Email'] || log['Department Email'] || log[2]}</td>
                                    <td className="px-4 py-3">{log['Date Received'] ? new Date(log['Date Received'] || log[3]).toLocaleString('en-US', {dateStyle: 'medium', timeStyle: 'short'}) : 'N/A'}</td><td className="px-4 py-3 text-tdmh-green font-bold">{log['Date Accomplished'] ? new Date(log['Date Accomplished'] || log[4]).toLocaleString('en-US', {dateStyle: 'medium', timeStyle: 'short'}) : 'N/A'}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}

                      {adminConsoleTab === 'logs' && (
                        <div className="space-y-4 animate-fade-in">
                          <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 mb-2">
                            <h4 className="text-white font-black text-lg flex items-center gap-2"><Icon name="Clock" className="w-5 h-5 text-slate-300" /> Master Audit Trail</h4>
                            <p className="text-slate-400 text-xs mt-1">Permanent record of all actions taken within the Admin Console. Un-editable for compliance.</p>
                          </div>
                          <div className="bg-slate-900 border border-slate-700 rounded-xl overflow-x-auto custom-scrollbar">
                            <table className="w-full text-left text-sm text-slate-300 whitespace-nowrap">
                              <thead className="bg-slate-800 text-xs uppercase font-black tracking-widest text-slate-400"><tr><th className="px-4 py-3">Timestamp</th><th className="px-4 py-3">User</th><th className="px-4 py-3">Action Type</th><th className="px-4 py-3">Target Details</th></tr></thead>
                              <tbody className="divide-y divide-slate-700">
                                {systemLogs.length === 0 ? <tr><td colSpan="4" className="text-center py-8 italic text-slate-500">No logs found. Action trail is empty.</td></tr> :
                                [...systemLogs].reverse().map((log, i) => (
                                  <tr key={i} className="hover:bg-slate-800/50 transition-colors">
                                    <td className="px-4 py-3 text-xs">{log.Timestamp || log[0]}</td><td className="px-4 py-3 font-bold text-white">{log.User || log[1]}</td><td className="px-4 py-3 text-blue-400 font-bold">{log.Action || log[2]}</td><td className="px-4 py-3">{log['Target/Details'] || log[3]}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    if (window.ReactDOM) {
      const root = window.ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } else {
      document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center; color: #ef4444; font-family: sans-serif;"><h2>System Loading Error</h2><p>The React framework failed to load.</p></div>';
    }
  </script>
</body>
</html>
