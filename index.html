                                            <h3 className="font-black text-slate-800 text-sm flex items-center gap-2 mb-3 shrink-0 border-b border-slate-100 pb-2">
                                                <Icons.Activity className="w-4 h-4 text-tdmh-blue"/> System Monitors
                                            </h3>
                                            <div className="space-y-2 overflow-y-auto custom-scrollbar pr-2 flex-1">
                                                {monitors.map((m, i) => (
                                                    <a key={i} href={m.Link || m.link || m[1]} target="_blank" className="flex items-start gap-2 p-2 rounded-lg border border-slate-100 hover:border-tdmh-blue hover:bg-slate-50 transition-colors group">
                                                        <div className="p-1.5 bg-slate-100 text-slate-500 rounded flex items-center justify-center group-hover:bg-tdmh-blue group-hover:text-white transition-colors shrink-0 mt-0.5">
                                                            <Icons.Activity className="w-3 h-3" />
                                                        </div>
                                                        <div className="min-w-0">
                                                            <h5 className="text-xs font-bold text-slate-800 group-hover:text-tdmh-blue truncate">{m['System Name'] || m.Name || m.name || m[0]}</h5>
                                                            <p className="text-[9px] text-slate-500 truncate mt-0.5">{m.Description || m.desc || m[2]}</p>
                                                        </div>
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    );
                }

                if (adminConsoleTab === 'memos') {
                    return (
                        <div className="flex flex-col lg:flex-row gap-6 h-full">
                            <div className="w-full lg:w-1/2 flex flex-col gap-6">
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-full border-t-4 border-t-tdmh-blue">
                                    <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-blue-50 text-tdmh-blue rounded-xl flex items-center justify-center"><Icons.FileText className="w-5 h-5"/></div>
                                            <div>
                                                <h3 className="font-black text-slate-800 text-lg leading-tight">Digital Memo Queue</h3>
                                                <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mt-0.5">Awaiting Final Approval</p>
                                            </div>
                                        </div>
                                        <div className="bg-blue-100 text-tdmh-blue font-black text-xl px-4 py-1.5 rounded-xl shadow-sm">{pendingMemosList.length}</div>
                                    </div>
                                    
                                    <div className="space-y-4 overflow-y-auto custom-scrollbar pr-2 flex-1">
                                        {pendingMemosList.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                                                <Icons.ClipboardCheck className="w-16 h-16 mb-4 opacity-50"/>
                                                <p className="text-lg font-bold">No pending memos in the queue.</p>
                                                <p className="text-sm mt-1">All drafted memos have been processed.</p>
                                            </div>
                                        ) : (
                                            pendingMemosList.map((m, i) => (
                                                <div key={i} className="p-6 border border-slate-200 rounded-2xl bg-slate-50 hover:bg-white hover:border-tdmh-blue transition-all relative group shadow-sm flex flex-col xl:flex-row gap-4 justify-between items-start xl:items-center">
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-3 mb-2">
                                                            <span className="text-[10px] font-bold bg-white text-slate-600 px-2.5 py-1 rounded-md border border-slate-200 uppercase tracking-widest shadow-sm">REF: {m['Ref No'] || m[0]}</span>
                                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">{m.Date || m[1]}</span>
                                                        </div>
                                                        <h4 className="font-black text-slate-800 text-lg leading-tight mb-2 truncate">{m.Subject || m[4]}</h4>
                                                        <p className="text-xs text-slate-500"><strong>From:</strong> {m.From || m[3]} &bull; <strong>For:</strong> {m.For || m[2]}</p>
                                                    </div>
                                                    <div className="flex gap-3 w-full xl:w-auto shrink-0">
                                                        <button onClick={() => {
                                                            setMemoData({ forDept: m.For || m[2], fromName: m.From || m[3], subject: m.Subject || m[4], body: m.Body || m[5], urgency: m.Urgency || m[7] || 'Normal' });
                                                            setEditMemoRef(m['Ref No'] || m[0]); setMemoRequestMode(false); setShowAddMemo(true);
                                                        }} className="bg-white border border-slate-200 text-slate-600 font-bold p-3 rounded-xl hover:bg-slate-50 transition-colors flex items-center justify-center shadow-sm" title="Edit Draft">
                                                            <Icons.Edit className="w-4 h-4" />
                                                        </button>
                                                        <button onClick={() => setViewingMemo(m)} className="flex-1 xl:flex-none bg-blue-50 text-tdmh-blue border border-blue-100 font-bold px-6 py-3 rounded-xl hover:bg-blue-100 transition-colors flex items-center justify-center gap-2 text-sm shadow-sm">
                                                            <Icons.Eye className="w-4 h-4" /> Review & Publish
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="w-full lg:w-1/2 flex flex-col gap-6">
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-full border-t-4 border-t-amber-500">
                                    <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center"><Icons.Sparkles className="w-5 h-5"/></div>
                                            <div>
                                                <h3 className="font-black text-slate-800 text-lg leading-tight">Modification Requests</h3>
                                                <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mt-0.5">Edit/Archive Approvals</p>
                                            </div>
                                        </div>
                                        <div className="bg-amber-100 text-amber-700 font-black text-xl px-4 py-1.5 rounded-xl shadow-sm">{pendingMemoRequests.length}</div>
                                    </div>
                                    
                                    <div className="space-y-4 overflow-y-auto custom-scrollbar pr-2 flex-1">
                                        {pendingMemoRequests.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                                                <Icons.CheckCircle className="w-16 h-16 mb-4 opacity-50"/>
                                                <p className="text-lg font-bold">No pending requests.</p>
                                            </div>
                                        ) : (
                                            pendingMemoRequests.map((req, i) => (
                                                <div key={i} className="p-5 border border-slate-200 rounded-2xl bg-slate-50 flex flex-col gap-4 shadow-sm">
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <div className="flex items-center gap-2 mb-2">
                                                                <span className={`text-[10px] font-bold px-2 py-1 rounded border uppercase tracking-widest ${req['Request Type'] === 'ARCHIVE' ? 'bg-red-50 text-red-600 border-red-200' : 'bg-blue-50 text-tdmh-blue border-blue-200'}`}>{req['Request Type']}</span>
                                                                <span className="text-[10px] font-bold bg-white text-slate-600 px-2 py-1 rounded border border-slate-200 uppercase tracking-widest shadow-sm">REF: {req['Memo Ref No']}</span>
                                                            </div>
                                                            <p className="text-xs text-slate-500 font-bold mt-2">Requested By: <span className="text-slate-800">{req['Requested By']}</span></p>
                                                        </div>
                                                    </div>
                                                    
                                                    {req['Request Type'] === 'EDIT' && req['New Data'] && (
                                                        <div className="bg-white p-3 rounded-lg border border-slate-200 text-xs text-slate-600 h-24 overflow-y-auto custom-scrollbar italic shadow-inner">
                                                            <p className="font-bold text-slate-800 mb-1">Proposed Subject: {JSON.parse(req['New Data']).subject}</p>
                                                            {JSON.parse(req['New Data']).body}
                                                        </div>
                                                    )}
                                                    
                                                    <div className="flex gap-3 pt-2">
                                                        <button onClick={() => handleResolveMemoRequest(req['Request ID'], 'REJECT')} disabled={isResolving === req['Request ID']} className="flex-1 bg-white border border-slate-300 text-slate-600 px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-slate-50 transition-colors shadow-sm disabled:opacity-50">Reject</button>
                                                        <button onClick={() => handleResolveMemoRequest(req['Request ID'], 'APPROVE')} disabled={isResolving === req['Request ID']} className="flex-1 bg-tdmh-green text-white px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-green-700 transition-colors shadow-md disabled:opacity-50">Approve</button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }

                if (adminConsoleTab === 'inquiries') {
                    return (
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-full border-t-4 border-t-purple-500">
                            <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center"><Icons.MessageCircle className="w-5 h-5"/></div>
                                    <div>
                                        <h3 className="font-black text-slate-800 text-lg leading-tight">Support Inquiries</h3>
                                        <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mt-0.5">Respond & Resolve Tickets</p>
                                    </div>
                                </div>
                                <div className="bg-purple-100 text-purple-700 font-black text-xl px-4 py-1.5 rounded-xl shadow-sm">{openInquiries.length}</div>
                            </div>
                            
                            <div className="space-y-4 overflow-y-auto custom-scrollbar pr-2 flex-1">
                                {openInquiries.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                                        <Icons.CheckCircle className="w-16 h-16 mb-4 opacity-50"/>
                                        <p className="text-lg font-bold">No active inquiries.</p>
                                        <p className="text-sm mt-1">Inbox is zero.</p>
                                    </div>
                                ) : (
                                    openInquiries.map((inq, i) => (
                                        <form key={i} onSubmit={(e) => handleResolveInquiry(e, inq['Ticket ID'] || inq[0])} className="p-6 border border-slate-200 rounded-2xl bg-slate-50 flex flex-col gap-4 shadow-sm focus-within:border-purple-300 transition-colors">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <span className="text-[10px] font-bold bg-white text-slate-600 px-2 py-1 rounded border border-slate-200 uppercase tracking-widest">{inq['Ticket ID'] || inq[0]}</span>
                                                        <span className="text-[10px] font-bold bg-purple-100 text-purple-700 px-2 py-1 rounded border border-purple-200 uppercase tracking-widest">{inq.Category || inq[3]}</span>
                                                        {(inq['Ref No'] || inq[4]) !== 'N/A' && <span className="text-[10px] font-bold bg-blue-100 text-tdmh-blue px-2 py-1 rounded border border-blue-200 uppercase tracking-widest">MEMO: {inq['Ref No'] || inq[4]}</span>}
                                                    </div>
                                                    <p className="text-[10px] text-slate-500 font-bold tracking-wider">{inq.Timestamp || inq[1]}</p>
                                                    <p className="text-sm font-bold text-slate-700 mt-1">{inq['Dept Email'] || inq[2]}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white p-4 rounded-xl border border-slate-100 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">
                                                {inq.Message || inq[5]}
                                            </div>
                                            <div className="flex flex-col sm:flex-row gap-3 pt-2">
                                                <input type="text" required placeholder="Type your official admin reply here..." value={adminReplyData.reply} onChange={e=>setAdminReplyData({reply: e.target.value})} className="flex-1 p-3.5 border border-slate-300 rounded-xl focus:border-purple-500 outline-none text-sm font-medium transition-colors" />
                                                <button type="submit" disabled={isResolving === (inq['Ticket ID'] || inq[0])} className="bg-purple-600 text-white px-6 py-3.5 rounded-xl font-bold text-sm tracking-wide hover:bg-purple-700 transition-colors shadow-md disabled:opacity-50 shrink-0 whitespace-nowrap">
                                                    {isResolving === (inq['Ticket ID'] || inq[0]) ? 'Sending...' : 'Reply & Resolve'}
                                                </button>
                                            </div>
                                        </form>
                                    ))
                                )}
                            </div>
                        </div>
                    );
                }
                return null;
            };

            return (
                <div className="flex flex-col min-h-screen bg-pattern">
                    
                    {/* DEPT PASSWORD MODAL (NEW) */}
                    {deptAuthModal.isOpen && (
                        <div className="fixed inset-0 z-[200] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto no-print">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-8 text-center relative animate-slide-up border border-slate-200 my-auto shrink-0">
                                <button onClick={() => setDeptAuthModal({ isOpen: false, targetDept: null, pinInput: '', isLoading: false, feedback: null })} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors bg-slate-50 p-2 rounded-full"><Icons.X className="w-5 h-5" /></button>
                                <div className="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-200 shadow-inner"><Icons.Lock className="w-8 h-8" /></div>
                                <h3 className="text-xl font-black text-slate-800 mb-2">Department Locked</h3>
                                <p className="text-xs text-slate-500 mb-6 font-medium">Please enter the specific password for <b>{deptAuthModal.targetDept?.Name}</b> to access these forms.</p>
                                
                                {deptAuthModal.feedback && (
                                    <div className={`mb-6 text-sm font-bold p-3 rounded-lg shadow-sm transition-all animate-fade-in ${deptAuthModal.feedback.type === 'success' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200'}`}>
                                        {deptAuthModal.feedback.text}
                                    </div>
                                )}

                                <form onSubmit={submitDeptAuth}>
                                    <input type="password" value={deptAuthModal.pinInput} onChange={(e) => setDeptAuthModal({...deptAuthModal, pinInput: e.target.value})} autoFocus className="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl text-center text-2xl font-black tracking-[0.3em] mb-4 focus:border-tdmh-blue outline-none transition-all shadow-inner" placeholder="••••••••" />
                                    <button type="submit" disabled={deptAuthModal.isLoading} className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors disabled:opacity-50 tracking-widest uppercase text-sm">
                                        {deptAuthModal.isLoading ? "Verifying..." : "Unlock Forms"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* FLOATING SUPPORT WIDGET */}
                    <div className="fixed bottom-6 right-6 z-[90] no-print">
                        <button onClick={() => setShowSupportChat(!showSupportChat)} className={`w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition-transform hover:scale-110 ${showSupportChat ? 'bg-red-500 text-white' : 'bg-tdmh-blue text-white'}`}>
                            {showSupportChat ? <Icons.X className="w-6 h-6" /> : <Icons.MessageCircle className="w-6 h-6" />}
                        </button>
                        
                        {showSupportChat && (
                            <div className="absolute bottom-16 right-0 mb-4 w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden animate-slide-up origin-bottom-right flex flex-col">
                                <div className="bg-tdmh-blue p-4 text-white">
                                    <h3 className="font-black text-lg flex items-center gap-2"><Icons.Activity className="w-5 h-5"/> IT Support & Inquiries</h3>
                                    <p className="text-[10px] text-blue-200 font-bold uppercase tracking-widest mt-1">Submit a ticket to CQI Admin</p>
                                </div>
                                <form onSubmit={handleInquirySubmit} className="p-5 flex flex-col gap-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Your Dept Email <span className="text-red-500">*</span></label>
                                        <input type="email" required value={inquiryData.email} onChange={e=>setInquiryData({...inquiryData, email: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none focus:border-tdmh-blue" placeholder="dept@tdmh.com"/>
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="w-1/2">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Category</label>
                                            <select value={inquiryData.category} onChange={e=>setInquiryData({...inquiryData, category: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-slate-700 outline-none focus:border-tdmh-blue">
                                                <option>General Help</option>
                                                <option>DCC Status</option>
                                                <option>Memo Clarification</option>
                                                <option>Tech Issue</option>
                                            </select>
                                        </div>
                                        <div className="w-1/2">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Ref # (Optional)</label>
                                            <input type="text" value={inquiryData.refNo} onChange={e=>setInquiryData({...inquiryData, refNo: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs outline-none focus:border-tdmh-blue" placeholder="e.g. CQI-1234"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Your Message <span className="text-red-500">*</span></label>
                                        <textarea required value={inquiryData.message} onChange={e=>setInquiryData({...inquiryData, message: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none focus:border-tdmh-blue h-24 resize-none" placeholder="How can we help?"></textarea>
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black tracking-widest uppercase text-xs py-3 rounded-lg hover:bg-blue-900 transition-colors flex justify-center items-center gap-2 shadow-md">
                                        {isSubmitting ? 'Sending...' : <><Icons.Send className="w-4 h-4"/> Submit Ticket</>}
                                    </button>
                                </form>
                            </div>
                        )}
                    </div>

                    {/* CUSTOM ALERTS/NOTIFICATIONS MODAL */}
                    {customAlert.isOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in no-print" onClick={() => setCustomAlert({...customAlert, isOpen: false})}>
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden relative transform animate-slide-up border border-slate-200" onClick={e => e.stopPropagation()}>
                                <div className={`p-8 text-center ${customAlert.type === 'error' ? 'bg-red-50 border-b border-red-100' : 'bg-slate-50 border-b border-slate-100'}`}>
                                    <div className={`w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm border ${customAlert.type === 'error' ? 'bg-red-100 text-red-600 border-red-200' : 'bg-tdmh-blue text-white border-blue-800'}`}>
                                        {customAlert.type === 'error' ? <Icons.X className="w-10 h-10"/> : <Icons.CheckCircle className="w-10 h-10"/>}
                                    </div>
                                    <h3 className="font-black text-slate-800 text-2xl tracking-tight">{customAlert.title}</h3>
                                </div>
                                <div className="p-8">
                                    <p className="text-slate-600 text-center mb-8 whitespace-pre-line leading-relaxed font-medium">{customAlert.message}</p>
                                    <button onClick={() => setCustomAlert({...customAlert, isOpen: false})} className={`w-full font-black uppercase tracking-widest text-sm py-4 rounded-xl transition-transform hover:-translate-y-1 shadow-lg ${customAlert.type === 'error' ? 'bg-red-600 hover:bg-red-700 text-white shadow-red-900/20' : 'bg-tdmh-blue hover:bg-blue-900 text-white shadow-blue-900/20'}`}>
                                        Acknowledge
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ROLE LOGIN MODAL */}
                    {showRoleLogin && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto no-print">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-8 text-center relative animate-slide-up border border-slate-200 my-auto shrink-0">
                                <button onClick={() => {setShowRoleLogin(false); setPendingAction(null); unlockScroll(); }} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors bg-slate-50 p-2 rounded-full"><Icons.X className="w-5 h-5" /></button>
                                <div className="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-200 shadow-inner"><Icons.Shield className="w-8 h-8" /></div>
                                <h3 className="text-xl font-black text-slate-800 mb-2">Role Verification</h3>
                                <p className="text-xs text-slate-500 mb-6 font-medium">Enter your specific PIN to continue.</p>
                                
                                {roleLoginFeedback && (
                                    <div className={`mb-6 text-sm font-bold p-3 rounded-lg shadow-sm transition-all animate-fade-in ${roleLoginFeedback.type === 'success' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200'}`}>
                                        {roleLoginFeedback.text}
                                    </div>
                                )}

                                <form onSubmit={submitRoleLogin}>
                                    <input 
                                        type="password" 
                                        value={rolePinInput} 
                                        onChange={(e)=>setRolePinInput(e.target.value)} 
                                        autoFocus 
                                        className="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl text-center text-2xl font-black tracking-[0.3em] mb-4 focus:border-tdmh-blue outline-none transition-all shadow-inner" 
                                        placeholder="••••••••" 
                                    />
                                    <button type="submit" disabled={isVerifyingLogin} className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-bold py-4 rounded-xl shadow-lg transition-colors disabled:opacity-50 text-sm tracking-wide uppercase">
                                        {isVerifyingLogin ? "Verifying Database..." : "Unlock Access"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* DIGITAL MEMO VIEWER MODAL */}
                    {viewingMemo && (
                        <div className="fixed inset-0 z-[110] flex items-start justify-center p-0 sm:p-8 bg-slate-900/90 backdrop-blur-sm animate-fade-in overflow-y-auto custom-scrollbar no-print" onClick={() => setViewingMemo(null)}>
                            <div className="printable-memo bg-white rounded-none sm:rounded-2xl shadow-2xl w-full max-w-4xl relative transform animate-slide-up flex flex-col min-h-screen sm:min-h-[90vh] my-auto shrink-0" onClick={e => e.stopPropagation()}>
                                
                                {/* Viewer Toolbar */}
                                <div className="no-print bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center sticky top-0 z-20 rounded-t-none sm:rounded-t-2xl">
                                    <div className="flex items-center gap-3">
                                        <span className="bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-widest shadow-sm">
                                            {viewingMemo['Ref No'] || viewingMemo[0]}
                                        </span>
                                        {String(viewingMemo.Status || viewingMemo[6]).toUpperCase().includes('PENDING') && (
                                            <span className="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg border border-amber-200 text-xs font-bold uppercase tracking-widest shadow-sm">Preview Mode</span>
                                        )}
                                        {String(viewingMemo.Status || viewingMemo[6]).toUpperCase() === 'PUBLISHED' || String(viewingMemo.Status || viewingMemo[6]).toUpperCase() === 'APPROVED' ? (
                                            <span className="hidden sm:inline-block bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-200 text-xs font-bold uppercase tracking-widest shadow-sm">Official Record</span>
                                        ) : null}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button onClick={handlePrintMemo} className="text-tdmh-blue hover:text-white hover:bg-tdmh-blue transition-colors bg-white px-3 py-1.5 rounded-lg border border-blue-200 shadow-sm flex items-center gap-2 text-xs font-bold uppercase tracking-widest"><Icons.Download className="w-4 h-4"/> PDF</button>
                                        <button onClick={() => setViewingMemo(null)} className="text-slate-500 hover:text-slate-800 transition-colors bg-white p-2 rounded-lg border border-slate-200 shadow-sm"><Icons.X className="w-4 h-4"/></button>
                                    </div>
                                </div>

                                {/* Digital Letterhead Content */}
                                <div className="p-8 sm:p-14 flex-1 bg-white">
                                    <div className="flex flex-col items-center justify-center mb-10 border-b-2 border-slate-800 pb-8">
                                        <img src="https://raw.githubusercontent.com/tdmh-cqi/Portal/main/images%20logo/tdmh-logo.png" alt="TDMH" className="h-16 mb-6 object-contain" />
                                        <h1 className="text-2xl sm:text-3xl font-black text-slate-800 tracking-wider text-center uppercase">Inter-Office Memorandum</h1>
                                        <p className="text-sm font-bold text-slate-500 tracking-widest uppercase mt-2">{viewingMemo.From || viewingMemo[3]}</p>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10 text-sm sm:text-base border border-slate-200 p-6 rounded-xl bg-slate-50/50">
                                        <div className="flex gap-3">
                                            <span className="font-bold text-slate-500 uppercase tracking-wider w-16">Ref:</span> 
                                            <span className="font-black text-slate-800">{viewingMemo['Ref No'] || viewingMemo[0]}</span>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-slate-500 uppercase tracking-wider w-16">Date:</span> 
                                            <span className="font-bold text-slate-800">{formatDateFriendly(viewingMemo.Date || viewingMemo[1]).full}</span>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-slate-500 uppercase tracking-wider w-16">To:</span> 
                                            <span className="font-bold text-slate-800">{viewingMemo.For || viewingMemo[2]}</span>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-slate-500 uppercase tracking-wider w-16">Subj:</span> 
                                            <span className="font-black text-slate-800 uppercase">{viewingMemo.Subject || viewingMemo[4]}</span>
                                        </div>
                                    </div>

                                    <div className="print-area text-base text-slate-800 leading-loose mb-16 text-justify whitespace-pre-wrap">
                                        {viewingMemo.Body || viewingMemo[5]}
                                    </div>

                                    {/* Receiving Record Section */}
                                    <div className="border-t-2 border-slate-200 pt-8 mt-12 break-inside-avoid">
                                        <h4 className="font-black text-slate-800 mb-6 uppercase tracking-widest text-sm flex items-center gap-2"><Icons.ClipboardCheck className="w-5 h-5 text-tdmh-green" /> Receiving Record</h4>
                                        
                                        {currentMemoSigs.length === 0 ? (
                                            <p className="text-slate-400 italic text-sm mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">No acknowledgments recorded yet.</p>
                                        ) : (
                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                                                {currentMemoSigs.map((sig, i) => (
                                                    <div key={i} className="border border-slate-200 rounded-xl p-4 bg-white shadow-sm flex flex-col justify-between break-inside-avoid">
                                                        <div className="mb-2 border-b border-slate-100 pb-2">
                                                            <p className="font-black text-slate-800 text-sm truncate leading-tight">{sig['Signer Name'] || sig[1]}</p>
                                                            <p className="text-[10px] font-bold uppercase tracking-widest text-tdmh-blue truncate mt-0.5">{sig['Signer Dept'] || sig[2]}</p>
                                                        </div>
                                                        <img src={sig['Signature Data'] || sig[3]} alt="Signature" className="h-10 object-contain my-2 self-start opacity-80 mix-blend-multiply" />
                                                        <p className="text-[9px] text-slate-400 font-medium tracking-wider">{sig.Timestamp || sig[4]}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Viewer Footer Actions */}
                                <div className="no-print bg-slate-100 p-6 border-t border-slate-200 sticky bottom-0 z-20 flex flex-col sm:flex-row gap-4 justify-between items-center rounded-b-none sm:rounded-b-2xl">
                                    {String(viewingMemo.Status || viewingMemo[6]).toUpperCase().includes('PENDING') && userRole === 'admin' ? (
                                        <div className="w-full flex justify-end gap-4">
                                            <button onClick={() => setViewingMemo(null)} className="px-6 py-3 bg-white text-slate-600 font-bold text-sm rounded-xl border border-slate-300 hover:bg-slate-50 transition-colors">Cancel</button>
                                            <button onClick={() => handleApproveMemo(viewingMemo['Ref No'] || viewingMemo[0])} disabled={isApprovingMemo} className="flex-1 sm:flex-none px-10 py-3 bg-tdmh-green text-white font-black uppercase tracking-widest text-sm rounded-xl hover:bg-green-700 transition-colors shadow-lg shadow-green-900/20 disabled:opacity-50">
                                                {isApprovingMemo ? 'Approving...' : 'Approve & Publish Memo'}
                                            </button>
                                        </div>
                                    ) : (
                                        <>
                                            <button onClick={() => { setInquiryData({...inquiryData, refNo: viewingMemo['Ref No'] || viewingMemo[0], category: 'Memo Clarification'}); setShowSupportChat(true); }} className="w-full sm:w-auto bg-white text-slate-600 border border-slate-300 px-6 py-3 rounded-xl font-bold uppercase tracking-widest text-xs hover:bg-slate-50 transition-colors flex items-center justify-center gap-2">
                                                <Icons.MessageCircle className="w-4 h-4" /> Raise Inquiry
                                            </button>
                                            <div className="flex gap-3 w-full sm:w-auto">
                                                <button onClick={() => setSignModalOpen(true)} className="flex-1 sm:flex-none bg-tdmh-blue text-white px-8 py-3 rounded-xl font-black uppercase tracking-widest text-xs hover:bg-blue-900 transition-transform hover:-translate-y-1 shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2">
                                                    <Icons.PenTool className="w-4 h-4" /> Acknowledge
                                                </button>
                                            </div>
                                        </>
                                    )}
                                </div>

                            </div>
                        </div>
                    )}

                    {/* ADD/EDIT MEMO MODAL (TEXT GENERATOR) */}
                    {showAddMemo && (
                        <div className="fixed inset-0 z-[160] flex items-start justify-center p-0 sm:p-8 bg-slate-900/80 backdrop-blur-sm animate-fade-in overflow-y-auto no-print">
                            <div className="bg-white rounded-none sm:rounded-3xl shadow-2xl w-full max-w-4xl overflow-hidden relative transform animate-slide-up my-auto shrink-0 min-h-screen sm:min-h-0">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 sticky top-0 z-10">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg"><Icons.FileText className="w-6 h-6"/></div>
                                        <div>
                                            <h3 className="font-black text-slate-800 text-xl tracking-tight leading-tight">{editMemoRef ? 'Edit Existing Memo' : 'Draft Official Memo'}</h3>
                                            <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mt-0.5">{editMemoRef ? `Updating Record: ${editMemoRef}` : 'Digital Memo Format'}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => { setShowAddMemo(false); setEditMemoRef(null); setViewingMemo(null); setMemoRequestMode(false); unlockScroll(); }} className="text-slate-400 hover:text-slate-800 transition-colors bg-white p-2 rounded-full border border-slate-200 shadow-sm hover:bg-slate-50"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 md:p-8 space-y-6" onSubmit={handleNativeMemoSubmit}>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">To / For <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.forDept} onChange={(e)=>setMemoData({...memoData, forDept: e.target.value})} required className="w-full p-3.5 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700" placeholder="e.g. All Department Heads" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">From <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.fromName} onChange={(e)=>setMemoData({...memoData, fromName: e.target.value})} required className="w-full p-3.5 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700" placeholder="e.g. HR Department" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                        <div className="md:col-span-2">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Subject <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.subject} onChange={(e)=>setMemoData({...memoData, subject: e.target.value})} required className="w-full p-3.5 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-bold text-slate-800" placeholder="e.g. Updated Holiday Schedule" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Urgency</label>
                                            <select value={memoData.urgency} onChange={(e)=>setMemoData({...memoData, urgency: e.target.value})} className="w-full p-3.5 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700">
                                                <option>Normal</option>
                                                <option>High</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-2 flex-1 flex flex-col">
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block">Memo Body Content <span className="text-red-500">*</span></label>
                                            <button type="button" onClick={handleFixGrammar} disabled={isFixingGrammar} className="text-[10px] sm:text-xs font-bold text-purple-700 bg-purple-50 hover:bg-purple-100 border border-purple-200 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors disabled:opacity-50">
                                                <Icons.Sparkles className="w-3.5 h-3.5" /> {isFixingGrammar ? "Formatting..." : "✨ Auto-Format Draft"}
                                            </button>
                                        </div>
                                        <textarea spellCheck="true" value={memoData.body} onChange={(e)=>setMemoData({...memoData, body: e.target.value})} required className="w-full p-5 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700 h-64 sm:h-96 resize-none leading-relaxed" placeholder="Type or paste your memo here. Press enter for new paragraphs. It will be perfectly formatted on the digital viewer..."></textarea>
                                    </div>

                                    <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black tracking-widest uppercase text-sm py-4 rounded-xl mt-4 hover:bg-blue-900 transition-transform hover:-translate-y-1 shadow-lg shadow-blue-900/20 disabled:opacity-50 disabled:hover:translate-y-0">
                                        {isSubmitting ? "Processing..." : (memoRequestMode ? "Send Request to Admin" : (editMemoRef ? "Update Memo Database" : "Submit to Admin Review"))}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* SIGNATURE PAD MODAL */}
                    {signModalOpen && viewingMemo && (
                        <div className="fixed inset-0 z-[170] flex items-end sm:items-center justify-center p-0 sm:p-8 bg-slate-900/80 backdrop-blur-sm animate-fade-in no-print" onClick={() => setSignModalOpen(false)}>
                            <div className="bg-white rounded-t-3xl sm:rounded-[2rem] shadow-2xl w-full max-w-sm p-8 text-center relative animate-slide-up border border-slate-200" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSignModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors bg-slate-50 p-2 rounded-full"><Icons.X className="w-5 h-5" /></button>
                                <h3 className="text-xl font-black text-slate-800 mb-1">Acknowledge Memo</h3>
                                <p className="text-[10px] text-tdmh-blue uppercase font-bold tracking-widest mb-6">Ref: {viewingMemo['Ref No'] || viewingMemo[0]}</p>
                                
                                <div className="space-y-4 text-left">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Full Name</label>
                                        <input type="text" value={signData.name} onChange={e=>setSignData({...signData, name: e.target.value})} required className="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:border-tdmh-green outline-none transition-colors" placeholder="e.g. Jane Doe" />
                                    </div>
                                    <div className="mb-4">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Department</label>
                                        <input type="text" value={signData.dept} onChange={e=>setSignData({...signData, dept: e.target.value})} required className="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:border-tdmh-green outline-none transition-colors" placeholder="e.g. Pharmacy" />
                                    </div>
                                    <SignaturePad onSave={handleSignatureSubmit} onCancel={() => setSignModalOpen(false)} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MASTER ADMIN CONSOLE MODAL */}
                    {showAdminConsole && renderAdminConsoleTabs()}

                    {/* TOP NAVIGATION */}
                    <nav className="no-print bg-tdmh-blue text-white shadow-xl z-40 sticky top-0 border-b-2 border-blue-900">
                        <div className="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16 md:h-20 gap-4">
                                
                                <div className="flex items-center gap-2 md:gap-4 shrink-0">
                                    <a href="#" onClick={(e) => { e.preventDefault(); window.location.reload(); }} className="cursor-pointer hover:opacity-90 transition-transform hover:scale-105 flex items-center bg-white px-3 py-1.5 md:py-2 rounded-xl shadow-md border border-slate-200">
                                        <img src="https://raw.githubusercontent.com/tdmh-cqi/Portal/main/images%20logo/tdmh-logo.png" alt="TDMH Logo" className="h-8 md:h-10 w-auto object-contain" onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHg9IjUiIHk9IjUiIHdpZHRoPSI5MCIgaGVpZ2h0PSI5MCIgcng9IjIwIiBmaWxsPSIjMWUzYThhIiAvPjxwYXRoIGQ9Ik0zNSA1MCBINjUgTTUwIDM1IFY2NSIgc3Ryb2tlPSIjMTZhMzRhIiBzdHJva2VXaWR0aD0iMTYiIHN0cm9rZUxpbmVjYXA9InJvdW5kIiAvPjwvc3ZnPg=='; }} />
                                    </a>

                                    {(userRole === 'admin' || userRole === 'dept_head') && (
                                        <button onClick={() => handleSecureAction('admin')} className="relative p-2 md:p-2.5 rounded-lg bg-white/10 border border-white/20 text-white hover:bg-white/20 transition-colors shadow-sm" title="Admin Control Center">
                                            <Icons.Shield className="w-5 h-5" />
                                            {userRole === 'admin' && (pendingDccRequests.length > 0 || pendingMemosList.length > 0 || openInquiries.length > 0 || pendingMemoRequests.length > 0) && (
                                                <span className="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-tdmh-blue shadow-md animate-pulse">!</span>
                                            )}
                                        </button>
                                    )}
                                </div>
                                
                                <div className="hidden xl:flex flex-1 items-center justify-center min-w-0 px-10 relative">
                                    <button onClick={() => scrollTabs('left')} className="absolute left-1 z-10 p-1.5 rounded-full bg-blue-800/80 text-white hover:bg-white hover:text-tdmh-blue border border-blue-700 shadow-md transition-colors flex items-center justify-center" title="Scroll Left"><Icons.ChevronLeft className="w-4 h-4" /></button>
                                    
                                    <div ref={tabsContainerRef} className="flex items-center gap-1 bg-blue-900/40 p-1.5 rounded-xl border border-blue-800/50 overflow-x-auto no-scrollbar scroll-smooth w-full">
                                        {TABS.map(tab => {
                                            const IconCmp = Icons[tab.icon];
                                            return (
                                                <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`px-4 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 transition-all whitespace-nowrap shrink-0 ${activeTab === tab.id ? 'bg-white text-tdmh-blue shadow-md scale-105' : 'text-blue-100 hover:bg-blue-800 hover:text-white'}`}>
                                                    <IconCmp className="w-4 h-4" /> {tab.label}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    
                                    <button onClick={() => scrollTabs('right')} className="absolute right-1 z-10 p-1.5 rounded-full bg-blue-800/80 text-white hover:bg-white hover:text-tdmh-blue border border-blue-700 shadow-md transition-colors flex items-center justify-center" title="Scroll Right"><Icons.ChevronRight className="w-4 h-4" /></button>
                                </div>

                                <div className="flex items-center gap-3 md:gap-4 shrink-0">
                                    <div className="hidden lg:flex gap-2 mr-2">
                                        {userRole === 'admin' && <span className="bg-red-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-red-600">Admin</span>}
                                        {userRole === 'dept_head' && <span className="bg-yellow-500 text-yellow-900 text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-yellow-600">Dept Head</span>}
                                        {userRole === 'admitting' && <span className="bg-purple-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-purple-600">Admitting</span>}
                                    </div>
                                    
                                    {userRole === 'guest' ? (
                                        <button onClick={() => setShowRoleLogin(true)} className="hidden sm:flex items-center gap-2 bg-white/10 border border-white/20 text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-white/20 transition-colors shadow-sm whitespace-nowrap">
                                            <Icons.Lock className="w-4 h-4" /> Staff Login
                                        </button>
                                    ) : (
                                        <button onClick={() => {setUserRole('guest'); setActiveTab('home');}} className="hidden sm:flex text-xs font-bold uppercase tracking-widest text-red-300 hover:text-red-100 bg-red-900/30 px-5 py-2.5 rounded-lg border border-red-900/50 transition-colors">
                                            Logout
                                        </button>
                                    )}
                                    <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="xl:hidden p-2 bg-white text-tdmh-blue rounded-lg shadow-sm">
                                        {mobileMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        {mobileMenuOpen && (
                            <div className="xl:hidden bg-white border-t border-slate-200 absolute w-full shadow-2xl animate-fade-in text-slate-800 z-50 max-h-[calc(100vh-4rem)] overflow-y-auto custom-scrollbar">
                                <div className="p-4 space-y-2">
                                    {TABS.map(tab => {
                                        const IconCmp = Icons[tab.icon];
                                        return (
                                            <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`w-full flex items-center gap-3 px-5 py-4 rounded-xl text-sm font-bold transition-colors ${activeTab === tab.id ? 'bg-tdmh-blue text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 border border-slate-100'}`}>
                                                <IconCmp className="w-5 h-5" /> {tab.label}
                                            </button>
                                        );
                                    })}
                                    <div className="pt-4 mt-4 border-t border-slate-200 space-y-3">
                                        {userRole === 'guest' ? (
                                            <button onClick={() => {setShowRoleLogin(true); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-slate-100 border border-slate-200 text-slate-700 px-5 py-4 rounded-xl text-sm font-bold hover:bg-slate-200 transition-colors">
                                                <Icons.Lock className="w-5 h-5" /> Staff Login
                                            </button>
                                        ) : (
                                            <button onClick={() => {setUserRole('guest'); setActiveTab('home'); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-red-50 border border-red-100 text-red-600 px-5 py-4 rounded-xl text-sm font-bold hover:bg-red-100 transition-colors">
                                                Logout
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </nav>

                    <main className="flex-grow max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 w-full relative z-10 flex flex-col justify-start">
                        {renderActiveTabContent()}
                    </main>

                    <footer className="no-print mt-auto bg-tdmh-blue border-t-2 border-blue-900 py-6 text-center text-white text-[10px] font-bold flex flex-col md:flex-row justify-center items-center gap-6 relative z-20 shrink-0">
                        <p className="uppercase tracking-widest text-blue-200">© {new Date().getFullYear()} TAYTAY DOCTORS MULTISPECIALTY HOSPITAL.</p>
                        <button onClick={() => fetchDatabase(true)} className="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-blue-900 border border-blue-800 text-tdmh-green hover:bg-blue-800 transition-colors uppercase tracking-widest text-xs font-black shadow-lg">
                            <Icons.Sync className="w-4 h-4" /> {isSyncing ? 'Syncing...' : 'System Sync'}
                        </button>
                    </footer>
                </div>
            );
        }

        // Added a safety check to ensure ReactDOM is fully loaded before rendering
        if (window.ReactDOM) {
            const root = window.ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } else {
            document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center; color: #ef4444; font-family: sans-serif;"><h2>System Loading Error</h2><p>The React framework failed to load. Please check your internet connection.</p></div>';
        }
    </script>
</body>
</html>
