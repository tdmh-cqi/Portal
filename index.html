                                <div className="border-b border-slate-200 pb-6 mb-6">
                                    <h3 className="text-2xl font-black text-slate-800 capitalize mb-3 tracking-tight">{dccActiveCategory === 'iso requirements' ? 'ISO Requirements' : `${dccActiveCategory}`}</h3>
                                </div>
                                {dccActiveCategory === 'request control no.' && (
                                    <div className="text-left">
                                        <form onSubmit={handleDccUpload} className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-xl mx-auto">
                                            <FormInput label="Official Dept Email" name="email" type="email" required placeholder="dept@tdmh.com" />
                                            <FormInput label="Form Title" name="title" required placeholder="e.g. Daily Temperature Log" />
                                            <div className="mb-8">
                                                <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Upload Draft(s) <span className="text-red-500">*</span></label>
                                                {/* NEW: Allow multiple files */}
                                                <input ref={fileInputRef} type="file" multiple accept=".docx,.xlsx,.doc,.xls" required className="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:bg-emerald-50 file:text-tdmh-green file:border file:border-emerald-200 file:font-bold hover:file:bg-emerald-100 transition-colors cursor-pointer border border-slate-200 p-1 rounded-2xl" />
                                            </div>
                                            <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-green text-white font-black tracking-wider uppercase py-4 rounded-xl shadow-lg hover:bg-green-700 transition-transform hover:-translate-y-1 disabled:opacity-50">
                                                {isSubmitting ? "Uploading Securely..." : "Submit Control No. request to DCC"}
                                            </button>
                                        </form>
                                    </div>
                                )}
                                {(dccActiveCategory === 'universal' || dccActiveCategory === 'iso requirements') && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {(dccActiveCategory === 'universal' ? sortedUniversal : sortedISO).length === 0 && <p className="text-slate-500 italic col-span-full">No forms mapped yet.</p>}
                                        {(dccActiveCategory === 'universal' ? sortedUniversal : sortedISO).map((t, i) => {
                                            const colorTheme = DEPT_COLORS[i % DEPT_COLORS.length];
                                            const ToolIconCmp = getToolIcon(String(t.Icon || t.icon || t['Icon Name'] || t[4] || '').trim(), t['Form Title'] || t[0]);
                                            return (
                                                <div key={i} className={`flex flex-col p-5 rounded-xl border border-slate-200 hover:bg-slate-50 transition-colors bg-white shadow-sm group ${colorTheme.hover}`}>
                                                    <div className="flex items-start gap-4 mb-5">
                                                        <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 border shadow-sm ${colorTheme.bg} ${colorTheme.text} ${colorTheme.border}`}><ToolIconCmp className="w-5 h-5" /></div>
                                                        <div className="pt-0.5"><h4 className="font-bold text-slate-800 text-sm leading-tight group-hover:text-tdmh-blue">{t['Form Title'] || t[0]}</h4><p className="text-xs text-slate-500 mt-1.5 leading-snug">{t.Description || t[1]}</p></div>
                                                    </div>
                                                    <div className="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                                                        <a href={t.Link || t[2]} target="_blank" className="flex-1 bg-tdmh-blue text-white text-center py-2.5 rounded-lg text-xs font-bold hover:bg-blue-900 shadow-sm">Open Document</a>
                                                        <button onClick={() => { setQrLightbox({ url: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(t.Link || t[2] || '')}`, title: t['Form Title'] || t[0] }); unlockScroll(); }} className="px-4 py-2.5 bg-white text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-50 border border-slate-200 shadow-sm hover:text-slate-800"><Icons.QrCode className="w-4 h-4" /> QR</button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'track') {
                    return (
                        <div className="animate-fade-in structured-card p-8 md:p-12 max-w-3xl mx-auto">
                            <div className="text-center mb-10"><div className="w-16 h-16 bg-blue-50 text-tdmh-blue rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100"><Icons.Search className="w-8 h-8" /></div><h2 className="text-3xl font-black text-slate-800 tracking-tight mb-2">Track Request Status</h2></div>
                            <form onSubmit={handleTrackRequest} className="flex flex-col sm:flex-row gap-3 mb-10">
                                <input type="text" value={trackQuery} onChange={(e)=>setTrackQuery(e.target.value)} className="flex-1 p-4 border-2 rounded-xl focus:border-tdmh-blue outline-none text-lg font-medium" placeholder="e.g. CQI-1029 or dept@tdmh.com" />
                                <button type="submit" disabled={isTracking} className="bg-tdmh-blue text-white px-8 py-4 font-black uppercase tracking-widest rounded-xl shadow-lg hover:bg-blue-900 transition-colors w-full sm:w-auto">{isTracking ? "..." : "Track"}</button>
                            </form>
                            {trackResult && (
                                <div className="bg-white border-2 border-slate-100 rounded-2xl p-8 shadow-sm">
                                    {trackResult.error ? <p className="text-red-500 font-bold text-center">{trackResult.error}</p> : (
                                        <><div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4"><div><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Tracking ID: {trackResult['Tracking ID']}</p><h3 className="text-xl font-black text-slate-800">{trackResult['Title']}</h3></div><span className={`px-4 py-1.5 font-black text-xs rounded-lg uppercase tracking-widest ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-yellow-50 text-yellow-700 border border-yellow-200'}`}>{trackResult['Status']}</span></div><div className="w-full bg-slate-100 rounded-full h-3 mb-2"><div className={`h-full rounded-full transition-all duration-1000 ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-500 w-full' : 'bg-yellow-400 w-1/2'}`}></div></div></>
                                    )}
                                </div>
                            )}
                        </div>
                    );
                }

                if (activeTab === 'departments') {
                    if (selectedDept) {
                        const deptTools = tools.filter(t => [String(t['Target Dept ID'] || t['Target ID'] || t.TargetID || t.targetID || '').toLowerCase().split(',').map(s => s.trim())].some(arr => arr.includes(String(selectedDept['ID'] || selectedDept.id || selectedDept['Name'] || selectedDept.name || '').toLowerCase().trim()) || arr.includes('universal')));
                        return (
                            <div className="animate-fade-in structured-card p-6 md:p-10 min-h-[500px]">
                                <div className="mb-6 flex items-center gap-4 border-b border-slate-200 pb-6">
                                    <button onClick={() => setSelectedDept(null)} className="p-2 bg-slate-100 hover:bg-tdmh-blue hover:text-white rounded-lg text-slate-600 transition-colors shadow-sm"><Icons.ChevronLeft className="w-6 h-6" /></button>
                                    <div><h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight">{selectedDept['Name'] || selectedDept.Name} Forms & Tools</h2></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {deptTools.length === 0 && <div className="col-span-full text-center p-10 bg-slate-50 rounded-xl border border-slate-200"><Icons.Folder className="w-12 h-12 text-slate-300 mx-auto mb-2" /><p className="text-slate-500 italic">No specific tools mapped.</p></div>}
                                    {deptTools.map((t, i) => {
                                        const colorTheme = DEPT_COLORS[i % DEPT_COLORS.length];
                                        const ToolIconCmp = getToolIcon(String(t.Icon || t.icon || t['Icon Name'] || t[5] || '').trim(), t['Tool Name'] || t['Name'] || t.name || t[0]);
                                        return (
                                            <div key={i} className={`flex flex-col p-5 rounded-xl border border-slate-200 hover:bg-slate-50 transition-colors bg-white shadow-sm group ${colorTheme.hover}`}>
                                                <div className="flex items-start gap-4 mb-5">
                                                    <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 border shadow-sm ${colorTheme.bg} ${colorTheme.text} ${colorTheme.border}`}><ToolIconCmp className="w-5 h-5" /></div>
                                                    <div className="pt-0.5"><h4 className="font-bold text-slate-800 text-sm leading-tight group-hover:text-tdmh-blue">{t['Tool Name'] || t['Name'] || t.name || t[0]}</h4></div>
                                                </div>
                                                <div className="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                                                    <a href={t.Link || t.link || t[2] || '#'} target="_blank" className="flex-1 bg-tdmh-blue text-white text-center py-2.5 rounded-lg text-xs font-bold hover:bg-blue-900 shadow-sm">Open</a>
                                                    <button onClick={() => { setQrLightbox({ url: `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(t.Link || t.link || t[2] || '')}`, title: t['Tool Name'] || t['Name'] || t.name || t[0] }); unlockScroll(); }} className="px-4 py-2.5 bg-white text-slate-600 rounded-lg text-xs font-bold border border-slate-200 shadow-sm"><Icons.QrCode className="w-4 h-4" /> QR</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        );
                    }
                    return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-4 border-b border-slate-200 pb-6">
                                <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><Icons.Box className="w-6 h-6 text-tdmh-blue" /> Hospital Departments</h2>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 mt-6">
                                {departments.map((dept, i) => {
                                    let IconCmp = Icons[Object.keys(Icons).find(k => k.toLowerCase() === String(dept['Icon'] || dept['IconName'] || dept['Icon Name'] || dept.iconName || '').trim().toLowerCase())];
                                    if (!IconCmp) { const catStr = String(dept['Category'] || dept.category || '').toLowerCase(); IconCmp = catStr.includes('admin') || catStr.includes('finance') ? Icons.Users : catStr.includes('medical') || catStr.includes('ward') ? Icons.Stethoscope : Icons.Box; }
                                    const colorTheme = DEPT_COLORS[i % DEPT_COLORS.length];
                                    
                                    const hasLock = dept.HasPassword || (dept.Password && dept.Password.toString().trim() !== '');

                                    return (
                                        <div key={dept.id || i} onClick={() => handleDeptClick(dept)} className={`flex items-center gap-3 p-4 border rounded-xl cursor-pointer group bg-white shadow-sm hover:shadow-md ${colorTheme.border} relative`}>
                                            <div className={`p-2.5 rounded-lg shrink-0 ${colorTheme.bg} ${colorTheme.text} ${colorTheme.hover}`}><IconCmp className="w-6 h-6" /></div>
                                            <div className="flex flex-col min-w-0 pr-4"><span className="font-bold text-sm text-slate-800 truncate">{dept['Name'] || dept.Name}</span><span className="text-[9px] text-slate-400 font-bold uppercase tracking-widest truncate">{dept['Category'] || dept.category || 'Standard'}</span></div>
                                            {deptPinRequired && hasLock && <div className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 group-hover:text-tdmh-blue"><Icons.Lock className="w-4 h-4"/></div>}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'calendar') {
                    const calYear = currentCalDate.getFullYear(); const calMonth = currentCalDate.getMonth();
                    const monthName = currentCalDate.toLocaleString('default', { month: 'long' });
                    const eventDaysThisMonth = calendar.map(e => { const d = new Date(e.date || e['Date Text'] || e['Date'] || e[0] || e[1]); return (!isNaN(d) && d.getMonth() === calMonth && d.getFullYear() === calYear) ? d.getDate() : null; }).filter(Boolean);
                    
                    return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex justify-between items-center">
                                <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3"><Icons.Calendar className="w-6 h-6 text-purple-600" /> Master Activities Timeline</h2>
                                {(userRole === 'admin' || userRole === 'dept_head') && <button onClick={() => setShowAddEvent(true)} className="flex items-center gap-2 bg-purple-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm hover:bg-purple-700"><Icons.Plus className="w-4 h-4" /> Add Event</button>}
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <div className="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-black text-slate-800 text-lg uppercase tracking-wider">{monthName} {calYear}</h3>
                                        <div className="flex gap-2">
                                            <button onClick={() => setCurrentCalDate(new Date(calYear, calMonth - 1, 1))} className="p-1.5 rounded border border-slate-200 text-slate-400 hover:text-purple-600"><Icons.ChevronLeft className="w-4 h-4"/></button>
                                            <button onClick={() => setCurrentCalDate(new Date(calYear, calMonth + 1, 1))} className="p-1.5 rounded border border-slate-200 text-slate-400 hover:text-purple-600"><Icons.ChevronRight className="w-4 h-4"/></button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
                                    <div className="grid grid-cols-7 gap-1">
                                        {Array.from({length: new Date(calYear, calMonth, 1).getDay()}, (_, i) => <div key={`blank-${i}`} className="aspect-square"></div>)}
                                        {Array.from({length: new Date(calYear, calMonth + 1, 0).getDate()}, (_, i) => {
                                            const day = i + 1; const hasEvent = eventDaysThisMonth.includes(day); const isToday = new Date().getDate() === day && new Date().getMonth() === calMonth && new Date().getFullYear() === calYear;
                                            return <div key={day} className="aspect-square p-1"><div className={`w-full h-full flex items-center justify-center text-sm font-black rounded-full ${hasEvent ? 'bg-purple-600 text-white shadow-md cursor-pointer' : isToday ? 'bg-purple-50 text-purple-700 border border-purple-200' : 'text-slate-600 hover:bg-slate-100'}`}>{day}</div></div>
                                        })}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="font-bold text-slate-500 mb-6 uppercase tracking-widest text-[10px]">Upcoming Schedule</h3>
                                    <div className="relative border-l-2 border-slate-200 ml-2 space-y-6 pb-2">
                                        {calendar.length === 0 && <p className="text-slate-500 italic pl-6">No events scheduled.</p>}
                                        {calendar.map((ev, i) => (
                                            <div key={i} className="relative pl-6 group">
                                                <div className="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-white border-2 border-purple-500"></div>
                                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-purple-300">
                                                    <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-2">
                                                        {ev['Date Text'] || ev.date || ev[0]} {ev.Time || ev[2] ? `• ${ev.Time || ev[2]}` : ''}
                                                        {(userRole === 'admin' || userRole === 'dept_head') && <button onClick={() => { setEditEventData({oldDateText: ev['Date Text'] || ev.date || ev[0], oldTitle: ev['Event Title'] || ev.Title || ev[3], newTime: ''}); setShowEditEvent(true); }} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-1 rounded"><Icons.Edit className="w-3 h-3" /></button>}
                                                    </div>
                                                    <div className="text-base font-bold text-slate-800">{ev['Event Title'] || ev.Title || ev[3]}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'agimat') {
                    return (
                        <div className="animate-fade-in max-w-5xl mx-auto py-6">
                            <div className="flex flex-col items-center justify-center mb-10 text-center">
                                <img src="https://raw.githubusercontent.com/tdmh-cqi/Portal/main/images%20logo/agimat-logo.png" alt="Agimat" className="h-16 md:h-24 object-contain mb-4 drop-shadow-sm" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
                                <p className="text-slate-500 font-medium text-base mt-2">Standardized video training and continuous quality improvement resources.</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {agimat.length === 0 && <div className="col-span-full text-center p-10 bg-white border rounded-xl"><Icons.Video className="w-12 h-12 text-slate-300 mx-auto mb-2" /><p className="text-slate-500">No training videos found.</p></div>}
                                {agimat.map((vid, i) => (
                                    <div key={i} className="structured-card p-5 group hover:border-tdmh-blue transition-colors flex flex-col">
                                        <div className="aspect-video bg-slate-900 rounded-xl mb-4 overflow-hidden border border-slate-200 relative">
                                            {(vid['Video URL (Embed)'] || '') ? <iframe className="w-full h-full" src={vid['Video URL (Embed)']} frameBorder="0" allowFullScreen></iframe> : <div className="w-full h-full flex flex-col items-center justify-center bg-slate-100 text-slate-400 absolute inset-0"><Icons.Video className="w-12 h-12 mb-3 opacity-50" /></div>}
                                        </div>
                                        <div className="px-2 pb-2 flex-1 flex flex-col">
                                            <div><span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[10px] font-bold uppercase rounded border">{vid['Module Number']}</span><h4 className="text-slate-800 font-black text-xl mt-3">{vid['Video Title']}</h4><p className="text-sm text-slate-500 mt-2">{vid.Description}</p></div>
                                            {(vid['Video URL (Embed)'] || '') && <div className="mt-auto pt-5"><a href={(vid['Video URL (Embed)'] || '').replace('/preview', '/view')} target="_blank" className="w-full bg-tdmh-blue text-white py-2.5 rounded-lg text-xs font-bold flex justify-center items-center gap-2 hover:bg-blue-900"><Icons.Maximize className="w-4 h-4" /> Watch Fullscreen</a></div>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                return null;
            };

            return (
                <div className="flex flex-col min-h-screen bg-pattern">
                    
                    {/* TOP NAVIGATION HEADER */}
                    <nav className="no-print bg-tdmh-blue text-white shadow-xl z-40 sticky top-0 border-b-2 border-blue-900">
                        <div className="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16 md:h-20 gap-4">
                                <div className="flex items-center gap-2 md:gap-4 shrink-0">
                                    <a href="#" onClick={(e) => { e.preventDefault(); window.location.reload(); }} className="bg-white px-3 py-1.5 md:py-2 rounded-xl shadow-md"><img src="https://raw.githubusercontent.com/tdmh-cqi/Portal/main/images%20logo/tdmh-logo.png" alt="Logo" className="h-8 md:h-10 w-auto object-contain" /></a>
                                    {userRole === 'admin' && (
                                        <button onClick={() => setShowAdminConsole(true)} className="relative p-2 md:p-2.5 rounded-lg bg-white/10 border border-white/20 hover:bg-white/20 transition-colors" title="Admin Control Center">
                                            <Icons.Shield className="w-5 h-5" />
                                            {/* NEW: Colored Badges for Admin Notifications */}
                                            <div className="absolute -top-1.5 -right-1.5 flex flex-wrap gap-0.5 justify-end w-6">
                                                {pendingDccRequests.length > 0 && <span className="w-2.5 h-2.5 bg-red-500 rounded-full border border-tdmh-blue animate-pulse"></span>}
                                                {pendingMemosList.length > 0 && <span className="w-2.5 h-2.5 bg-orange-500 rounded-full border border-tdmh-blue animate-pulse"></span>}
                                                {pendingMemoRequests.length > 0 && <span className="w-2.5 h-2.5 bg-yellow-400 rounded-full border border-tdmh-blue animate-pulse"></span>}
                                                {openInquiries.length > 0 && <span className="w-2.5 h-2.5 bg-emerald-500 rounded-full border border-tdmh-blue animate-pulse"></span>}
                                            </div>
                                        </button>
                                    )}
                                </div>
                                
                                <div className="hidden xl:flex flex-1 items-center justify-center min-w-0 px-10 relative">
                                    <button onClick={() => scrollTabs('left')} className="absolute left-1 z-10 p-1.5 rounded-full bg-blue-800/80 hover:bg-white hover:text-tdmh-blue"><Icons.ChevronLeft className="w-4 h-4" /></button>
                                    <div ref={tabsContainerRef} className="flex items-center gap-1 bg-blue-900/40 p-1.5 rounded-xl overflow-x-auto no-scrollbar scroll-smooth w-full">
                                        {TABS.map(tab => {
                                            const IconCmp = Icons[tab.icon];
                                            return <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`px-4 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 whitespace-nowrap shrink-0 ${activeTab === tab.id ? 'bg-white text-tdmh-blue' : 'text-blue-100 hover:bg-blue-800'}`}><IconCmp className="w-4 h-4" /> {tab.label}</button>
                                        })}
                                    </div>
                                    <button onClick={() => scrollTabs('right')} className="absolute right-1 z-10 p-1.5 rounded-full bg-blue-800/80 hover:bg-white hover:text-tdmh-blue"><Icons.ChevronRight className="w-4 h-4" /></button>
                                </div>

                                <div className="flex items-center gap-3 md:gap-4 shrink-0">
                                    <div className="hidden lg:flex gap-2 mr-2">
                                        {userRole === 'admin' && <span className="bg-red-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded border border-red-600">Admin</span>}
                                        {userRole === 'dept_head' && <span className="bg-yellow-500 text-yellow-900 text-[10px] font-black uppercase px-2 py-1 rounded border border-yellow-600">Dept Head</span>}
                                        {userRole === 'admitting' && <span className="bg-purple-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded border border-purple-600">Admitting</span>}
                                    </div>
                                    {userRole === 'guest' ? <button onClick={() => setShowRoleLogin(true)} className="hidden sm:flex items-center gap-2 bg-white/10 text-white px-5 py-2.5 rounded-lg text-sm font-bold"><Icons.Lock className="w-4 h-4" /> Staff Login</button> : <button onClick={handleLogout} className="hidden sm:flex text-xs font-bold uppercase text-red-300 hover:text-red-100 bg-red-900/30 px-5 py-2.5 rounded-lg border border-red-900/50">Logout</button>}
                                    <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="xl:hidden p-2 bg-white text-tdmh-blue rounded-lg shadow-sm">{mobileMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}</button>
                                </div>
                            </div>
                        </div>

                        {mobileMenuOpen && (
                            <div className="xl:hidden bg-white border-t border-slate-200 absolute w-full shadow-2xl animate-fade-in text-slate-800 z-50 max-h-[calc(100vh-4rem)] overflow-y-auto">
                                <div className="p-4 space-y-2">
                                    {TABS.map(tab => { const IconCmp = Icons[tab.icon]; return <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`w-full flex items-center gap-3 px-5 py-4 rounded-xl text-sm font-bold ${activeTab === tab.id ? 'bg-tdmh-blue text-white' : 'text-slate-600 hover:bg-slate-50 border border-slate-100'}`}><IconCmp className="w-5 h-5" /> {tab.label}</button> })}
                                    <div className="pt-4 mt-4 border-t border-slate-200 space-y-3">
                                        {userRole === 'guest' ? <button onClick={() => {setShowRoleLogin(true); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-slate-100 text-slate-700 px-5 py-4 rounded-xl text-sm font-bold"><Icons.Lock className="w-5 h-5" /> Staff Login</button> : <button onClick={handleLogout} className="w-full bg-red-50 text-red-600 px-5 py-4 rounded-xl text-sm font-bold">Logout</button>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </nav>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-grow max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 w-full relative z-10 flex flex-col justify-start">
                        {renderActiveTabContent()}
                    </main>

                    {/* FOOTER */}
                    <footer className="no-print mt-auto bg-tdmh-blue border-t-2 border-blue-900 py-6 text-center text-white text-[10px] font-bold flex flex-col md:flex-row justify-center items-center gap-6 relative z-20 shrink-0">
                        <p className="uppercase tracking-widest text-blue-200">© {new Date().getFullYear()} TAYTAY DOCTORS MULTISPECIALTY HOSPITAL.</p>
                        <button onClick={() => fetchDatabase(true)} className="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-blue-900 border border-blue-800 text-tdmh-green hover:bg-blue-800 transition-colors uppercase tracking-widest text-xs font-black shadow-lg">
                            <Icons.Sync className="w-4 h-4" /> {isSyncing ? 'Syncing...' : 'System Sync'}
                        </button>
                    </footer>

                    {/* FLOATING CHAT WIDGET */}
                    <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3 no-print">
                        {showChatTooltip && (
                            <div className="bg-white p-4 rounded-2xl shadow-xl border border-slate-200 max-w-[280px] animate-slide-up relative">
                                <button onClick={() => setShowChatTooltip(false)} className="absolute top-2 right-2 text-slate-400 hover:text-slate-600"><Icons.X className="w-3 h-3"/></button>
                                <p className="text-xs text-slate-600 font-medium leading-relaxed pr-2">If you have any concerns or inquiries, please submit them here. Our Admin team will see to it and assist you promptly. Thank you for your cooperation with our system.</p>
                            </div>
                        )}
                        <button onClick={() => {setShowSupportChat(true); setShowChatTooltip(false);}} className="w-14 h-14 bg-tdmh-blue text-white rounded-full shadow-2xl flex items-center justify-center hover:bg-blue-900 transition-transform hover:scale-105 border-4 border-white">
                            <Icons.MessageCircle className="w-6 h-6" />
                        </button>
                    </div>

                    {/* OPTIMIZED REUSABLE MODALS */}

                    <Modal isOpen={showNewsFlyer} onClose={() => setShowNewsFlyer(false)} maxWidth="max-w-2xl">
                        <div className="-m-8 mb-8 pb-6 bg-slate-50 border-b border-slate-100 flex flex-col items-center text-center rounded-t-[2rem] pt-8">
                            <div className="w-16 h-16 bg-tdmh-blue text-white rounded-2xl flex items-center justify-center mb-4"><Icons.Bell className="w-8 h-8" /></div>
                            <span className="text-[10px] font-bold tracking-[0.2em] text-tdmh-blue uppercase mb-2">TDMH Official Notice</span>
                            <h2 className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight px-4">TDMH CQI Portal V2 is Live!</h2>
                        </div>
                        <p className="text-slate-700 mb-6 text-lg font-bold leading-relaxed text-center">Welcome to your upgraded administrative command center.</p>
                        <ul className="space-y-5 mb-10 px-2 md:px-6">
                            <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg"><Icons.Menu className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm">Top Navigation</strong> <span className="text-slate-500 text-xs">Tools are safely tucked in tabs at the top.</span></div></li>
                            <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg"><Icons.Box className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm">Departments</strong> <span className="text-slate-500 text-xs">Clicking a department is open to everyone unless locked by the Admin.</span></div></li>
                            <li className="flex items-start gap-4"><div className="p-2 bg-red-50 text-red-500 rounded-lg"><Icons.Shield className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm">Enhanced Security</strong> <span className="text-slate-600 text-xs">Admin actions require the Master PIN to ensure our data remains secure.</span></div></li>
                        </ul>
                        <button onClick={() => setShowNewsFlyer(false)} className="w-full py-4 bg-tdmh-blue text-white font-black uppercase tracking-widest rounded-xl text-sm shadow-lg hover:-translate-y-1 transition-transform">Acknowledge & Enter Portal</button>
                    </Modal>

                    <Modal isOpen={showRoleLogin} onClose={() => {setShowRoleLogin(false); setRolePinInput(''); setRoleLoginFeedback(null);}} title="Staff Login" subtitle="Enter your authorized role PIN" icon={Icons.Lock} maxWidth="max-w-sm">
                        {roleLoginFeedback && <div className="mb-6 text-sm font-bold p-3 rounded-lg bg-red-50 text-red-600 border border-red-200 text-center">{roleLoginFeedback.text}</div>}
                        <form onSubmit={submitRoleLogin}>
                            <input type="password" value={rolePinInput} onChange={(e) => setRolePinInput(e.target.value)} className="w-full p-4 text-center text-2xl tracking-[0.5em] font-black border-2 border-slate-200 rounded-xl focus:border-tdmh-blue outline-none mb-6" placeholder="••••" autoFocus />
                            <button type="submit" disabled={isVerifyingLogin} className="w-full bg-tdmh-blue text-white font-black uppercase text-sm py-4 rounded-xl shadow-lg disabled:opacity-50">{isVerifyingLogin ? 'Verifying...' : 'Login Securely'}</button>
                        </form>
                    </Modal>

                    <Modal isOpen={deptAuthModal.isOpen} onClose={() => setDeptAuthModal({...deptAuthModal, isOpen: false, pinInput: '', feedback: null})} title={deptAuthModal.targetDept?.Name || 'Department'} subtitle="Enter department PIN to unlock tools" icon={Icons.Lock} maxWidth="max-w-sm">
                        {deptAuthModal.feedback && <div className={`mb-6 text-sm font-bold p-3 rounded-lg text-center ${deptAuthModal.feedback.type === 'error' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'}`}>{deptAuthModal.feedback.text}</div>}
                        <form onSubmit={submitDeptAuth}>
                            <input type="password" value={deptAuthModal.pinInput} onChange={(e) => setDeptAuthModal({...deptAuthModal, pinInput: e.target.value})} className="w-full p-4 text-center text-2xl tracking-[0.5em] font-black border-2 border-slate-200 rounded-xl focus:border-tdmh-blue outline-none mb-6" placeholder="••••" autoFocus />
                            <button type="submit" disabled={deptAuthModal.isLoading} className="w-full bg-tdmh-blue text-white font-black uppercase text-sm py-4 rounded-xl disabled:opacity-50">{deptAuthModal.isLoading ? 'Verifying...' : 'Unlock Tools'}</button>
                        </form>
                    </Modal>

                    <Modal isOpen={customAlert.isOpen} onClose={() => setCustomAlert({ ...customAlert, isOpen: false })} maxWidth="max-w-sm">
                        <div className="text-center">
                            <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border ${customAlert.type === 'error' ? 'bg-red-50 text-red-500 border-red-100' : 'bg-tdmh-blue text-white border-blue-900 shadow-md'}`}>
                                {customAlert.type === 'error' ? <Icons.AlertCircle className="w-8 h-8" /> : <Icons.CheckCircle className="w-8 h-8" />}
                            </div>
                            <h3 className="text-2xl font-black text-slate-800 mb-2">{customAlert.title}</h3>
                            <p className="text-slate-500 mb-8 whitespace-pre-wrap leading-relaxed">{customAlert.message}</p>
                            <button onClick={() => setCustomAlert({ ...customAlert, isOpen: false })} className={`w-full font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-md ${customAlert.type === 'error' ? 'bg-slate-800 text-white hover:bg-black' : 'bg-tdmh-blue text-white hover:bg-blue-900'}`}>Acknowledge</button>
                        </div>
                    </Modal>

                    <Modal isOpen={showAddEvent} onClose={() => setShowAddEvent(false)} title="Add Master Event" subtitle="Schedule & Alert System" icon={Icons.Calendar} iconColor="text-purple-600" iconBg="bg-purple-50 border-purple-100">
                        <form onSubmit={handleEventSubmit}>
                            <FormInput label="Event Title" value={eventData.title} onChange={e=>setEventData({...eventData, title: e.target.value})} required placeholder="e.g. Monthly Dept Meeting" />
                            <div className="grid grid-cols-2 gap-4">
                                <FormInput label="Date" type="date" value={eventData.date} onChange={e=>setEventData({...eventData, date: e.target.value})} required />
                                <FormInput label="Time (Optional)" type="time" value={eventData.time} onChange={e=>setEventData({...eventData, time: e.target.value})} />
                            </div>
                            <button type="submit" disabled={isSubmitting} className="w-full bg-purple-600 text-white font-black tracking-widest uppercase py-4 rounded-xl mt-2 shadow-lg disabled:opacity-50">{isSubmitting ? 'Saving...' : 'Schedule Event'}</button>
                        </form>
                    </Modal>

                    <Modal isOpen={showEditEvent} onClose={() => setShowEditEvent(false)} title="Edit Event Time">
                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-6"><p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">{editEventData.oldDateText}</p><p className="text-sm font-bold text-slate-700 leading-tight">{editEventData.oldTitle}</p></div>
                        <form onSubmit={handleEditEventSubmit}>
                            <FormInput label="Select New Time" type="time" value={editEventData.newTime} onChange={e=>setEditEventData({...editEventData, newTime: e.target.value})} required />
                            <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black tracking-widest uppercase py-4 rounded-xl shadow-lg disabled:opacity-50">{isSubmitting ? 'Updating...' : 'Update Time'}</button>
                        </form>
                    </Modal>

                    <Modal isOpen={showAddNews} onClose={() => setShowAddNews(false)} title="Post Announcement" subtitle="Global System Broadcast" icon={Icons.Bell} maxWidth="max-w-2xl">
                        <form onSubmit={handleAddNewsSubmit}>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                <FormInput className="md:col-span-2" label="Headline / Title" value={newsData.title} onChange={e=>setNewsData({...newsData, title: e.target.value})} required placeholder="e.g. Server Maintenance" />
                                <FormInput as="select" label="Notice Type" value={newsData.type} onChange={e=>setNewsData({...newsData, type: e.target.value})} options={["Standard", "Urgent", "System Update"]} />
                            </div>
                            <FormInput as="textarea" label="Full Message Body" value={newsData.content} onChange={e=>setNewsData({...newsData, content: e.target.value})} required placeholder="Type the full announcement details here..." />
                            <div className="pt-2 border-t border-slate-100 flex flex-col sm:flex-row gap-4 items-center justify-between">
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Posting as: <span className="text-tdmh-blue">{userRole}</span></p>
                                <button type="submit" disabled={isSubmitting} className="w-full sm:w-auto bg-tdmh-blue text-white font-black uppercase tracking-widest px-8 py-4 rounded-xl shadow-lg disabled:opacity-50 text-sm">{isSubmitting ? 'Broadcasting...' : 'Publish to News Feed'}</button>
                            </div>
                        </form>
                    </Modal>

                    <Modal isOpen={showSupportChat} onClose={() => setShowSupportChat(false)} title="Admin Support" subtitle="Help & Inquiries" icon={Icons.MessageCircle}>
                        <form onSubmit={handleInquirySubmit}>
                            <FormInput label="Your Dept Email" type="email" value={inquiryData.email} onChange={e=>setInquiryData({...inquiryData, email: e.target.value})} required placeholder="dept@tdmh.com" />
                            <FormInput as="select" label="Inquiry Category" value={inquiryData.category} onChange={e=>setInquiryData({...inquiryData, category: e.target.value})} options={["General Help", "Bug Report", "Feature Request"]} />
                            <FormInput label="Reference No. (Optional)" value={inquiryData.refNo} onChange={e=>setInquiryData({...inquiryData, refNo: e.target.value})} placeholder="e.g. CQI-1234" />
                            <FormInput as="textarea" label="Message" value={inquiryData.message} onChange={e=>setInquiryData({...inquiryData, message: e.target.value})} required placeholder="Describe your issue or request here..." />
                            <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest py-4 rounded-xl shadow-lg disabled:opacity-50 mt-2 text-sm">{isSubmitting ? 'Sending...' : 'Submit Inquiry'}</button>
                        </form>
                    </Modal>

                    <Modal isOpen={showAddMemo} onClose={() => {setShowAddMemo(false); setEditMemoRef(null); setMemoRequestMode(false); setRequesterName('');}} title={memoRequestMode ? 'Request Memo Edit' : (editMemoRef ? 'Edit Existing Memo' : 'Draft New Memo')} subtitle={editMemoRef ? `REF: ${editMemoRef}` : 'Official Record'} icon={Icons.FileText} maxWidth="max-w-2xl">
                        <form onSubmit={handleNativeMemoSubmit}>
                            {memoRequestMode && (
                                <FormInput label="Requested By (Name / Department)" value={requesterName} onChange={e=>setRequesterName(e.target.value)} required placeholder="e.g. Dr. Smith (Cardiology)" className="bg-blue-50 p-4 rounded-xl border border-blue-100" />
                            )}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <FormInput label="To (Department)" value={memoData.forDept} onChange={e=>setMemoData({...memoData, forDept: e.target.value})} required placeholder="e.g. All Staff"/>
                                <FormInput label="From (Name)" value={memoData.fromName} onChange={e=>setMemoData({...memoData, fromName: e.target.value})} required placeholder="e.g. HR Dept" />
                            </div>
                            <FormInput label="Subject Title" value={memoData.subject} onChange={e=>setMemoData({...memoData, subject: e.target.value})} required placeholder="Brief subject description" />
                            <FormInput as="select" label="Urgency Level" value={memoData.urgency} onChange={e=>setMemoData({...memoData, urgency: e.target.value})} options={["Normal", "High"]} />
                            <div className="mb-4">
                                <div className="flex justify-between items-end mb-1.5">
                                    <label className="block text-[10px] font-bold uppercase text-slate-500 tracking-wider">Message Body <span className="text-red-500">*</span></label> 
                                    <button type="button" onClick={handleFixGrammar} className="text-[10px] bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 px-3 py-1 rounded font-bold uppercase tracking-widest flex items-center gap-1.5"><Icons.Sparkles className="w-3 h-3"/> Fix Formatting</button>
                                </div>
                                <textarea required value={memoData.body} onChange={e=>setMemoData({...memoData, body: e.target.value})} className="w-full p-4 border border-slate-300 focus:border-tdmh-blue outline-none rounded-xl h-40 text-sm leading-relaxed text-slate-700" placeholder="Type standard paragraph format here..."></textarea>
                            </div>
                            <button type="submit" disabled={isSubmitting || isFixingGrammar} className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg disabled:opacity-50">
                                {isSubmitting ? 'Routing...' : (memoRequestMode ? 'Submit Modification Request' : 'Generate Official Memo')}
                            </button>
                        </form>
                    </Modal>

                    {viewingMemo && (
                        <div className="fixed inset-0 z-[140] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in no-print overflow-y-auto" onClick={() => setViewingMemo(null)}>
                            <div className="bg-white p-8 md:p-12 rounded-[2rem] shadow-2xl max-w-3xl w-full my-auto printable-memo relative border border-slate-200" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-8 no-print">
                                    <div className="flex items-center gap-3"><div className="bg-slate-100 p-2.5 rounded-lg border"><Icons.FileText className="w-6 h-6 text-slate-600"/></div><h3 className="text-2xl font-black text-slate-800">Record Viewer</h3></div>
                                    <button onClick={() => setViewingMemo(null)} className="p-2 bg-slate-50 text-slate-400 hover:text-slate-800 rounded-full"><Icons.X className="w-6 h-6"/></button>
                                </div>
                                <div className="border-b-4 border-slate-800 pb-6 mb-8 mt-2">
                                    <div className="text-center mb-8 hidden print:block"><h1 className="text-2xl font-black">TAYTAY DOCTORS MULTISPECIALTY HOSPITAL</h1><p className="text-sm">Official Memorandum</p></div>
                                    <h1 className="text-4xl font-black uppercase tracking-widest mb-6 print:hidden">Memorandum</h1>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-8 text-sm font-bold text-slate-800">
                                        <div className="flex items-center"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">TO:</span> <span className="border-b border-slate-200 w-full pb-1">{viewingMemo.For || viewingMemo[2]}</span></div>
                                        <div className="flex items-center"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">FROM:</span> <span className="border-b border-slate-200 w-full pb-1">{viewingMemo.From || viewingMemo[3]}</span></div>
                                        <div className="flex items-center"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">DATE:</span> <span className="border-b border-slate-200 w-full pb-1">{viewingMemo.Date || viewingMemo[1]}</span></div>
                                        <div className="flex items-center"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">REF NO:</span> <span className="border-b border-slate-200 w-full pb-1">{viewingMemo['Ref No'] || viewingMemo[0]}</span></div>
                                        <div className="col-span-full flex items-center mt-2"><span className="text-slate-400 w-24 shrink-0 uppercase tracking-widest text-xs">SUBJECT:</span> <span className="border-b border-slate-200 w-full pb-1 font-black text-base uppercase">{viewingMemo.Subject || viewingMemo[4]}</span></div>
                                    </div>
                                </div>
                                <div className="whitespace-pre-wrap text-slate-800 leading-relaxed min-h-[250px] mb-12 text-justify">{viewingMemo.Body || viewingMemo[5]}</div>
                                <div className="no-print border-t border-slate-200 pt-8 flex flex-col sm:flex-row gap-4 items-center justify-between">
                                    <div className="flex flex-wrap gap-3 w-full sm:w-auto">
                                        <button onClick={() => setSignModalOpen(true)} className="flex-1 sm:flex-none bg-tdmh-blue text-white px-6 py-3 rounded-xl font-black uppercase text-xs flex items-center justify-center gap-2"><Icons.PenTool className="w-4 h-4"/> Sign</button>
                                        <button onClick={handlePrintMemo} className="flex-1 sm:flex-none bg-slate-100 text-slate-700 px-6 py-3 rounded-xl font-black uppercase text-xs flex items-center justify-center gap-2 border"><Icons.Download className="w-4 h-4"/> Print / PDF</button>
                                    </div>
                                    {userRole === 'admin' && String(viewingMemo.Status || viewingMemo[6]).toUpperCase().includes('PENDING') && (
                                        <button onClick={() => handleApproveMemo(viewingMemo['Ref No'] || viewingMemo[0])} disabled={isApprovingMemo} className="w-full sm:w-auto bg-tdmh-green text-white px-8 py-3 rounded-xl font-black uppercase text-xs disabled:opacity-50">{isApprovingMemo ? 'Approving...' : 'Approve to Live'}</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showAdminConsole && (
                        <div className="fixed inset-0 z-[130] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-fade-in no-print overflow-y-auto" onClick={() => {setShowAdminConsole(false); setShowMasterlist(false);}}>
                            <div className="bg-slate-900 p-6 md:p-10 rounded-[2rem] shadow-2xl max-w-5xl w-full my-auto border border-slate-700 animate-slide-up relative" onClick={e => e.stopPropagation()}>
                                <button onClick={() => {setShowAdminConsole(false); setShowMasterlist(false);}} className="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800 p-2.5 rounded-full transition-colors"><Icons.X className="w-6 h-6"/></button>
                                
                                <div className="flex items-center justify-between mb-8 border-b border-slate-700 pb-6 flex-wrap gap-4">
                                    <div className="flex items-center gap-4">
                                        <div className="w-14 h-14 bg-red-500/20 text-red-400 rounded-2xl flex items-center justify-center border border-red-500/30"><Icons.Shield className="w-8 h-8" /></div>
                                        <div><h3 className="text-3xl font-black text-white tracking-tight leading-none">Admin Console</h3><p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">Master Oversight Terminal</p></div>
                                    </div>
                                    <button onClick={handleToggleDeptPin} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest border transition-colors shadow-sm ${deptPinRequired ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/30' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>
                                        <Icons.Lock className="w-4 h-4" /> Dept Locks: {deptPinRequired ? 'ON' : 'OFF'}
                                    </button>
                                </div>
                                
                                <div className="flex flex-wrap gap-3 border-b border-slate-700 mb-6 overflow-x-auto no-scrollbar">
                                    {[
                                        {id: 'dcc', label: 'DCC Queue', count: pendingDccRequests.length},
                                        {id: 'memos', label: 'Memos', count: pendingMemosList.length},
                                        {id: 'inquiries', label: 'Inquiries', count: openInquiries.length},
                                        {id: 'memoRequests', label: 'Memo Requests', count: pendingMemoRequests.length}
                                    ].map(t => (
                                        <button key={t.id} onClick={() => setAdminConsoleTab(t.id)} className={`px-6 py-3 font-black text-sm uppercase tracking-widest rounded-t-xl transition-colors whitespace-nowrap ${adminConsoleTab === t.id ? 'bg-slate-800 text-blue-400 border-b-4 border-blue-500' : 'text-slate-400 hover:bg-slate-800 border-b-4 border-transparent'}`}>
                                            {t.label} {t.count > 0 && <span className="ml-2 bg-red-500 text-white px-2 py-0.5 rounded-md text-[10px]">{t.count}</span>}
                                        </button>
                                    ))}
                                </div>
                                
                                <div className="min-h-[300px] max-h-[60vh] overflow-y-auto custom-scrollbar pr-2 space-y-4">
                                    {adminConsoleTab === 'dcc' && (
                                        <div className="space-y-4">
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-800 p-5 rounded-xl border border-slate-700 gap-4 mb-2">
                                                <div>
                                                    <h4 className="text-white font-black text-lg">Document Control Queue</h4>
                                                    <p className="text-slate-400 text-xs mt-1">Review drafts, assign a Control No., and upload the stamped version.</p>
                                                </div>
                                                <button onClick={() => setShowMasterlist(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-xs font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-colors shadow-md w-full sm:w-auto">
                                                    <Icons.FileText className="w-4 h-4" /> Open Masterlist
                                                </button>
                                            </div>
                                            
                                            {pendingDccRequests.length === 0 ? <div className="text-center py-16 bg-slate-800/50 rounded-2xl border border-slate-700"><Icons.CheckCircle className="w-12 h-12 text-tdmh-green mx-auto mb-3 opacity-50" /><p className="text-slate-400 font-bold">No pending document requests.</p></div> :
                                            pendingDccRequests.map((r, i) => (
                                                <div key={i} className="p-6 border border-slate-700 rounded-2xl bg-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-6 shadow-sm">
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex gap-2 mb-2">
                                                            <span className="text-[10px] font-black uppercase bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-600">{r['Tracking ID'] || r[0]}</span>
                                                            <span className="text-[10px] font-black uppercase bg-yellow-900/30 text-yellow-500 px-2.5 py-1 rounded border border-yellow-700/50">Pending Review</span>
                                                        </div>
                                                        <h4 className="text-lg font-black text-white mb-1 truncate">{r.Title || r[2]}</h4>
                                                        <p className="text-xs font-bold text-slate-400 truncate">Contact: {r.Email || r[1]}</p>
                                                    </div>
                                                    <form onSubmit={(e) => handleResolveDCC(e, r['Tracking ID'] || r[0])} className="flex flex-col sm:flex-row gap-3 items-end md:items-center bg-slate-900/50 p-4 rounded-xl border border-slate-700 shrink-0 w-full md:w-auto">
                                                        <div className="w-full sm:w-auto flex-1">
                                                            <label className="text-[10px] uppercase font-bold text-slate-400 block mb-2">1. Attach Stamped File</label>
                                                            <input type="file" name="stampedFile" className="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-slate-700 file:text-white cursor-pointer" required />
                                                        </div>
                                                        <div className="w-full sm:w-auto">
                                                            <label className="text-[10px] uppercase font-bold text-slate-400 block mb-2 opacity-0 hidden sm:block">Action</label>
                                                            <button type="submit" disabled={isResolving === (r['Tracking ID'] || r[0])} className="w-full sm:w-auto bg-tdmh-green text-white px-6 py-2.5 rounded-lg font-black text-xs uppercase disabled:opacity-50">
                                                                {isResolving === (r['Tracking ID'] || r[0]) ? 'Uploading...' : 'Resolve & Email'}
                                                            </button>
                                                        </div>
                                                    </form>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {adminConsoleTab === 'memos' && (
                                        pendingMemosList.length === 0 ? <div className="text-center py-16 bg-slate-800/50 rounded-2xl border border-slate-700"><Icons.CheckCircle className="w-12 h-12 text-tdmh-green mx-auto mb-3 opacity-50" /><p className="text-slate-400 font-bold">No pending memos for approval.</p></div> :
                                        pendingMemosList.map((m, i) => (
                                            <div key={i} className="p-6 border border-slate-700 rounded-2xl bg-slate-800 flex flex-col md:flex-row justify-between md:items-center gap-6">
                                                <div><div className="flex gap-2 mb-2"><span className="text-[10px] font-black uppercase bg-slate-700 text-slate-300 px-2.5 py-1 rounded">{m['Ref No'] || m[0]}</span><span className="text-[10px] font-black uppercase bg-yellow-900/30 text-yellow-500 px-2.5 py-1 rounded">Pending Approval</span></div><h4 className="text-lg font-black text-white mb-1">{m.Subject || m[4]}</h4><p className="text-sm font-bold text-slate-400">From: {m.From || m[3]} • For: {m.For || m[2]}</p></div>
                                                <div className="flex gap-3 w-full md:w-auto"><button onClick={() => setViewingMemo(m)} className="flex-1 md:flex-none px-6 py-2.5 bg-slate-700 text-white text-xs font-black rounded-lg">Review</button><button onClick={() => handleApproveMemo(m['Ref No'] || m[0])} disabled={isApprovingMemo} className="flex-1 md:flex-none px-6 py-2.5 bg-tdmh-green text-white text-xs font-black rounded-lg disabled:opacity-50">Approve to Live</button></div>
                                            </div>
                                        ))
                                    )}
                                    {adminConsoleTab === 'inquiries' && (
                                        openInquiries.length === 0 ? <div className="text-center py-16 bg-slate-800/50 rounded-2xl border border-slate-700"><Icons.CheckCircle className="w-12 h-12 text-tdmh-green mx-auto mb-3 opacity-50" /><p className="text-slate-400 font-bold">No open support inquiries.</p></div> :
                                        openInquiries.map((inq, i) => (
                                            <div key={i} className="p-6 border border-slate-700 rounded-2xl bg-slate-800 flex flex-col gap-4">
                                                <div className="flex justify-between items-center border-b border-slate-700 pb-4"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-slate-700 rounded-xl flex items-center justify-center text-slate-300"><Icons.MessageCircle className="w-5 h-5"/></div><div><h4 className="font-black text-white text-sm">Ticket: {inq['Ticket ID'] || inq[0]}</h4><span className="text-[10px] font-bold uppercase text-slate-400">{inq.Category || inq[3]}</span></div></div><span className="text-xs font-bold text-slate-300 bg-slate-700 px-3 py-1.5 rounded-lg">{inq.Email || inq[2]}</span></div>
                                                <p className="text-sm bg-slate-900/50 p-4 rounded-xl text-slate-300 italic">"{inq.Message || inq[5]}"</p>
                                                <form onSubmit={(e) => handleResolveInquiry(e, inq['Ticket ID'] || inq[0])} className="flex flex-col sm:flex-row gap-3 pt-2"><input type="text" placeholder="Type resolution reply here to automatically email user..." value={adminReplyData.reply} onChange={(e) => setAdminReplyData({reply: e.target.value})} className="flex-1 p-3 bg-slate-900 border border-slate-700 text-white rounded-xl text-sm outline-none focus:border-blue-500" required /><button type="submit" disabled={isResolving === (inq['Ticket ID'] || inq[0])} className="bg-blue-600 text-white px-6 py-3 rounded-xl font-black text-xs uppercase disabled:opacity-50">{isResolving === (inq['Ticket ID'] || inq[0]) ? 'Sending...' : 'Send Reply & Resolve'}</button></form>
                                            </div>
                                        ))
                                    )}
                                    {adminConsoleTab === 'memoRequests' && (
                                        pendingMemoRequests.length === 0 ? <div className="text-center py-16 bg-slate-800/50 rounded-2xl border border-slate-700"><Icons.CheckCircle className="w-12 h-12 text-tdmh-green mx-auto mb-3 opacity-50" /><p className="text-slate-400 font-bold">No pending modification requests.</p></div> :
                                        pendingMemoRequests.map((req, i) => (
                                            <div key={i} className="p-6 border border-slate-700 rounded-2xl bg-slate-800 flex flex-col gap-4">
                                                <div className="border-b border-slate-700 pb-4"><div className="flex gap-2 mb-2"><span className="text-[10px] font-black uppercase bg-slate-700 text-slate-300 px-2.5 py-1 rounded">REQ: {req['Request ID'] || req[0]}</span><span className="text-[10px] font-black uppercase bg-blue-900/50 text-blue-400 px-2.5 py-1 rounded">{req['Request Type'] || req[2]}</span></div><h4 className="text-lg font-black text-white mb-1">Target Memo: {req['Target Ref No'] || req[1]}</h4><p className="text-sm font-bold text-slate-400">Requested By: {req['Requested By'] || req[3]}</p></div>
                                                {(req['Request Type'] || req[2]) === 'EDIT' && <div className="bg-slate-900/50 p-4 rounded-xl text-slate-300 text-sm border border-slate-700 whitespace-pre-wrap"><strong className="text-white block mb-2">Proposed Changes:</strong>{req['New Data JSON'] || req[5]}</div>}
                                                <div className="flex gap-3 pt-2"><button onClick={() => handleResolveMemoRequest(req['Request ID'] || req[0], 'APPROVE')} disabled={isResolving === (req['Request ID'] || req[0])} className="flex-1 bg-tdmh-green text-white px-6 py-2.5 rounded-lg font-black text-xs uppercase disabled:opacity-50">Approve & Apply</button><button onClick={() => handleResolveMemoRequest(req['Request ID'] || req[0], 'REJECT')} disabled={isResolving === (req['Request ID'] || req[0])} className="flex-1 bg-red-600 text-white px-6 py-2.5 rounded-lg font-black text-xs uppercase disabled:opacity-50">Reject</button></div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showMasterlist && showAdminConsole && (
                        <div className="fixed inset-0 z-[160] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm animate-fade-in no-print" onClick={() => setShowMasterlist(false)}>
                            <div className="bg-slate-800 rounded-2xl shadow-2xl w-full max-w-6xl h-[85vh] flex flex-col overflow-hidden border border-slate-700 animate-slide-up" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center p-5 border-b border-slate-700 bg-slate-900">
                                    <div>
                                        <h3 className="text-white font-black text-xl flex items-center gap-2"><Icons.FileText className="w-6 h-6 text-blue-400"/> Masterlist Reference</h3>
                                        <p className="text-slate-400 text-xs mt-1 font-bold tracking-widest uppercase">Official ISO Control Numbers</p>
                                    </div>
                                    <button onClick={() => setShowMasterlist(false)} className="text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-700 transition-colors"><Icons.X className="w-6 h-6"/></button>
                                </div>
                                <div className="flex-1 bg-white">
                                    <iframe src="https://docs.google.com/document/d/14_7i6NVjdQWP9bEw2k_qc4tBSzdzHJp96vVaGidxxgY/preview" className="w-full h-full" frameBorder="0"></iframe>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        if (window.ReactDOM) {
            const root = window.ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } else {
            document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center; color: #ef4444; font-family: sans-serif;"><h2>System Loading Error</h2><p>The React framework failed to load. Please check your internet connection.</p></div>';
        }
    </script>
</body>
</html>
