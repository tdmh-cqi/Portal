                        const getSafeDate = (val) => {
                            if (!val) return null;
                            let str = String(val).trim();
                            // If strictly YYYY-MM-DD, append T12:00:00 to prevent UTC midnight shifting backwards in local time
                            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return new Date(str + 'T12:00:00');
                            let d = new Date(str);
                            return isNaN(d.getTime()) ? null : d;
                        };

                        const eventDaysThisMonth = calendar.map(e => {
                            const d = getSafeDate(e.date || e['Date Text'] || e['Date'] || e[0] || e[1]);
                            if (d && d.getMonth() === calMonth && d.getFullYear() === calYear) {
                                return d.getDate();
                            }
                            return null;
                        }).filter(Boolean);
                        
                        return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><Icons.Calendar className="w-6 h-6 text-purple-600" /> Master Activities Timeline</h2>
                                    <p className="text-sm text-slate-500 mt-2 max-w-2xl leading-relaxed"><strong>Notice:</strong> Viewing the timeline is open to all staff. Authorized personnel must log in to schedule new events.</p>
                                </div>
                                {(userRole === 'admin' || userRole === 'dept_head') && (<button onClick={() => handleSecureAction('add_event')} className="flex items-center justify-center gap-2 bg-purple-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm shrink-0 hover:bg-purple-700 transition-colors"><Icons.Plus className="w-4 h-4" /> Add Event</button>)}
                            </div>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <div className="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-black text-slate-800 text-lg uppercase tracking-wider">{monthName} {calYear}</h3>
                                        <div className="flex gap-2">
                                            <button onClick={() => setCurrentCalDate(new Date(calYear, calMonth - 1, 1))} className="p-1.5 rounded border border-slate-200 text-slate-400 hover:text-purple-600 hover:bg-slate-50 transition-colors"><Icons.ChevronLeft className="w-4 h-4"/></button>
                                            <button onClick={() => setCurrentCalDate(new Date(calYear, calMonth + 1, 1))} className="p-1.5 rounded border border-slate-200 text-slate-400 hover:text-purple-600 hover:bg-slate-50 transition-colors"><Icons.ChevronRight className="w-4 h-4"/></button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">
                                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1">
                                        {blankDays.map(b => <div key={`blank-${b}`} className="aspect-square"></div>)}
                                        {daysInMonthArray.map(day => {
                                            const hasEvent = eventDaysThisMonth.includes(day);
                                            const isToday = new Date().getDate() === day && new Date().getMonth() === calMonth && new Date().getFullYear() === calYear;
                                            
                                            return (
                                                <div key={day} className="aspect-square p-1">
                                                    <div className={`w-full h-full flex flex-col items-center justify-center text-sm font-black transition-all rounded-full ${hasEvent ? 'bg-purple-600 text-white shadow-md transform hover:scale-105 cursor-pointer' : isToday ? 'bg-purple-50 text-purple-700 border border-purple-200' : 'bg-transparent text-slate-600 hover:bg-slate-100'}`}>
                                                        {day}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-slate-500 mb-6 uppercase tracking-widest text-[10px]">Upcoming Schedule</h3>
                                    <div className="relative border-l-2 border-slate-200 ml-2 space-y-6 pb-2">
                                        {calendar.length === 0 && <p className="text-slate-500 italic pl-6">No events scheduled.</p>}
                                        {calendar.map((ev, i) => {
                                            const rawDate = ev['Date Text'] || ev['Date'] || ev.date || ev[0];
                                            const safeDateObj = getSafeDate(rawDate);
                                            const displayDate = safeDateObj ? safeDateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : rawDate;
                                            const displayTime = ev.Time || ev.time || ev[2];
                                            return (
                                                <div key={i} className="relative pl-6 group">
                                                    <div className="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-white border-2 border-purple-500"></div>
                                                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-purple-300 transition-colors">
                                                        <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-2">
                                                            {displayDate} {displayTime ? `• ${displayTime}` : ''}
                                                            {(userRole === 'admin' || userRole === 'dept_head') && (
                                                                <button onClick={() => { setEditEventData({oldDateText: rawDate, oldTitle: ev['Event Title'] || ev.Title || ev[3], newTime: ''}); setShowEditEvent(true); }} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-1 rounded transition-colors" title="Edit Time">
                                                                    <Icons.Edit className="w-3 h-3" />
                                                                </button>
                                                            )}
                                                        </div>
                                                        <div className="text-base font-bold text-slate-800">{ev['Event Title'] || ev.Title || ev[3]}</div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                    case 'agimat': return (
                        <div className="animate-fade-in max-w-5xl mx-auto py-6">
                            <div className="flex flex-col items-center justify-center mb-10 text-center">
                                <img 
                                    src="./images%20logo/agimat-logo.png" 
                                    alt="Agimat" 
                                    className="h-16 md:h-24 object-contain mb-4 drop-shadow-sm" 
                                    onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }} 
                                />
                                <h2 className="text-[4rem] text-slate-900 font-serif leading-none tracking-tight hidden">Agimat</h2>
                                <p className="text-slate-500 font-medium text-base mt-2">Standardized video training and continuous quality improvement resources.</p>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {agimat.map((vid, i) => {
                                    let embedUrl = vid['Video URL (Embed)'] || '';
                                    let directUrl = embedUrl.replace('/preview', '/view');
                                    
                                    return (
                                        <div key={i} className="structured-card p-5 group hover:border-tdmh-blue transition-colors shadow-sm flex flex-col">
                                            <div className="aspect-video bg-slate-900 rounded-xl mb-4 overflow-hidden border border-slate-200 relative shadow-inner">
                                                {embedUrl ? (
                                                    <iframe className="w-full h-full" src={embedUrl} frameBorder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowFullScreen></iframe>
                                                ) : (
                                                    <div className="w-full h-full flex flex-col items-center justify-center bg-slate-100 text-slate-400 absolute inset-0">
                                                        <Icons.Video className="w-12 h-12 mb-3 opacity-50" />
                                                        <span className="text-[10px] font-bold uppercase tracking-widest text-slate-500">Video Placeholder</span>
                                                    </div>
                                                )}
                                            </div>
                                            
                                            <div className="px-2 pb-2 flex-1 flex flex-col">
                                                <div>
                                                    <span className="px-2.5 py-1 bg-slate-100 text-slate-600 text-[10px] font-bold uppercase tracking-widest rounded border border-slate-200">{vid['Module Number']}</span>
                                                    <h4 className="text-slate-800 font-black text-xl mt-3 leading-tight">{vid['Video Title']}</h4>
                                                    <p className="text-sm text-slate-500 mt-2 leading-relaxed">{vid.Description}</p>
                                                </div>
                                                
                                                {embedUrl && (
                                                    <div className="mt-auto pt-5">
                                                        <div className="bg-blue-50/50 border border-blue-100 p-3.5 rounded-xl flex items-center justify-between gap-4 shadow-sm">
                                                            <p className="text-[10px] text-tdmh-blue font-bold leading-snug">Video not playing?<br/><span className="text-slate-500 font-medium">This happens due to strict browser cookie settings.</span></p>
                                                            <a href={directUrl} target="_blank" rel="noopener noreferrer" className="shrink-0 bg-tdmh-blue text-white px-4 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 hover:bg-blue-900 transition-transform hover:scale-105 shadow-md">
                                                                <Icons.Maximize className="w-4 h-4" /> Watch Fullscreen
                                                            </a>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                                {agimat.length === 0 && (
                                    <div className="col-span-1 md:col-span-2 text-center p-10 bg-white border border-slate-200 rounded-xl">
                                        <Icons.Video className="w-12 h-12 text-slate-300 mx-auto mb-2" />
                                        <p className="text-slate-500">No training videos found in database.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                    case 'census': return (
                        <div className="animate-fade-in structured-card p-8 md:p-12 border-t-4 border-t-tdmh-green">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                                <div>
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3>
                                    <p className="text-sm text-slate-500">Live patient tracking metrics across major medical departments. This data is updated securely by the Admitting Department.</p>
                                </div>
                                <div className="bg-slate-50 border border-slate-200 px-5 py-3 rounded-xl text-left md:text-right shrink-0 shadow-sm w-full md:w-auto flex flex-row md:flex-col justify-between md:justify-center items-center md:items-end">
                                    <div className="text-xs font-black text-tdmh-green uppercase tracking-widest mb-0.5">{liveTime.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                                    <div className="text-xl font-black text-tdmh-blue tracking-tight">{liveTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 mb-10">
                                {census.map((c, i) => (
                                    <div key={i} className="bg-white p-6 rounded-2xl border-2 border-slate-100 text-center focus-within:border-tdmh-green transition-colors">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-4">{c.Department || c[0]}</label>
                                        <input type="number" value={c['Patient Count'] || c[1] || ''} onChange={(e) => { const newCensus = [...census]; newCensus[i] = {...newCensus[i], 'Patient Count': e.target.value}; setCensus(newCensus); }} className="w-full p-4 rounded-xl border border-slate-300 font-black text-4xl text-tdmh-blue text-center focus:border-tdmh-green focus:ring-1 outline-none transition-colors" />
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-end gap-4 border-t border-slate-200 pt-8"><button onClick={handleSaveCensus} disabled={isSubmitting} className="px-8 py-4 bg-tdmh-green text-white font-black uppercase rounded-xl hover:bg-green-700 shadow-lg disabled:opacity-50 transition-colors w-full sm:w-auto">{isSubmitting ? "Saving..." : "Save & Publish"}</button></div>
                        </div>
                    );
                    default: return null;
                }
            }

            return (
                <div className="flex flex-col min-h-screen bg-pattern">
                    
                    {/* CUSTOM ALERTS/NOTIFICATIONS MODAL */}
                    {customAlert.isOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in" onClick={() => setCustomAlert({...customAlert, isOpen: false})}>
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden relative transform animate-slide-up border border-slate-200" onClick={e => e.stopPropagation()}>
                                <div className={`p-8 text-center ${customAlert.type === 'error' ? 'bg-red-50 border-b border-red-100' : 'bg-slate-50 border-b border-slate-100'}`}>
                                    <div className={`w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm border ${customAlert.type === 'error' ? 'bg-red-100 text-red-600 border-red-200' : 'bg-tdmh-blue text-white border-blue-800'}`}>
                                        {customAlert.type === 'error' ? <Icons.X className="w-10 h-10"/> : <Icons.Bell className="w-10 h-10"/>}
                                    </div>
                                    <h3 className="font-black text-slate-800 text-2xl tracking-tight">{customAlert.title}</h3>
                                </div>
                                <div className="p-8">
                                    <p className="text-slate-600 text-center mb-8 whitespace-pre-line leading-relaxed font-medium">{customAlert.message}</p>
                                    <button onClick={() => setCustomAlert({...customAlert, isOpen: false})} className={`w-full font-black uppercase tracking-widest text-sm py-4 rounded-xl transition-transform hover:-translate-y-1 shadow-lg ${customAlert.type === 'error' ? 'bg-red-600 hover:bg-red-700 text-white shadow-red-900/20' : 'bg-tdmh-blue hover:bg-blue-900 text-white shadow-blue-900/20'}`}>
                                        Acknowledge
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SIGNATURE MODAL */}
                    {signModal.isOpen && (
                        <div className="fixed inset-0 z-[130] flex items-start justify-center p-4 sm:p-8 bg-slate-900/90 backdrop-blur-sm animate-fade-in overflow-y-auto" onClick={() => {setSignModal({isOpen: false, refNo: ''}); unlockScroll();}}>
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden relative transform animate-slide-up my-auto shrink-0 border border-slate-200" onClick={e => e.stopPropagation()}>
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <div>
                                        <h3 className="font-black text-slate-800 text-xl tracking-tight">Memo Acknowledgment</h3>
                                        <p className="text-[10px] uppercase font-bold tracking-widest text-slate-400 mt-1">Ref: {signModal.refNo}</p>
                                    </div>
                                    <button onClick={() => {setSignModal({isOpen: false, refNo: ''}); unlockScroll();}} className="text-slate-400 hover:text-slate-800 transition-colors bg-white p-2 rounded-full border border-slate-200 shadow-sm"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">Your Full Name</label>
                                        <input type="text" value={signData.name} onChange={e=>setSignData({...signData, name: e.target.value})} required className="w-full p-3 rounded-xl border border-slate-300 outline-none focus:border-emerald-500 font-medium transition-colors" placeholder="e.g. Jane Doe" />
                                    </div>
                                    <div className="mb-4">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">Department</label>
                                        <input type="text" value={signData.dept} onChange={e=>setSignData({...signData, dept: e.target.value})} required className="w-full p-3 rounded-xl border border-slate-300 outline-none focus:border-emerald-500 font-medium transition-colors" placeholder="e.g. Pediatrics" />
                                    </div>
                                    <div className="pt-2 border-t border-slate-100">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-3 text-center">Draw Your Signature Below</label>
                                        <SignaturePad onSave={handleSignatureSubmit} onCancel={() => {setSignModal({isOpen: false, refNo: ''}); unlockScroll();}} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FULLSCREEN SLIDESHOW OVERLAY */}
                    {slideshowIndex !== null && slideshow[slideshowIndex] && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-slate-900/95 backdrop-blur-xl animate-fade-in" onClick={() => { setSlideshowIndex(null); unlockScroll(); }}>
                            
                            <button onClick={() => { setSlideshowIndex(null); unlockScroll(); }} className="absolute top-6 right-6 z-50 text-white/70 hover:text-white transition-colors bg-white/10 hover:bg-white/20 p-3 rounded-full" title="Close (Esc)">
                                <Icons.X className="w-8 h-8"/>
                            </button>

                            {slideshow.length > 1 && (
                                <button onClick={(e) => { e.stopPropagation(); setSlideshowIndex((prev) => prev === 0 ? slideshow.length - 1 : prev - 1); }} className="absolute left-4 md:left-10 z-50 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-4 rounded-full transition-all hover:scale-110" title="Previous (Left Arrow)">
                                    <Icons.ChevronLeft className="w-8 h-8"/>
                                </button>
                            )}

                            <div className="relative max-w-7xl w-full max-h-[90vh] flex flex-col items-center justify-center" onClick={e => e.stopPropagation()}>
                                <img src={getDriveImage(slideshow[slideshowIndex]['Image URL'])} className="w-full h-auto max-h-[85vh] object-contain rounded-xl shadow-2xl" alt={slideshow[slideshowIndex]['Title']} />
                                <div className="absolute bottom-4 left-0 right-0 text-center text-white bg-black/50 p-2 mx-auto w-max rounded-lg backdrop-blur-md">
                                    <p className="text-sm font-bold">{slideshow[slideshowIndex]['Title']}</p>
                                </div>
                            </div>

                            {slideshow.length > 1 && (
                                <button onClick={(e) => { e.stopPropagation(); setSlideshowIndex((prev) => (prev + 1) % slideshow.length); }} className="absolute right-4 md:right-10 z-50 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-4 rounded-full transition-all hover:scale-110" title="Next (Right Arrow)">
                                    <Icons.ChevronRight className="w-8 h-8"/>
                                </button>
                            )}
                        </div>
                    )}

                    {/* QR CODE OVERLAY */}
                    {qrLightbox && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/95 backdrop-blur-md animate-fade-in" onClick={() => { setQrLightbox(null); unlockScroll(); }}>
                            <div className="relative flex flex-col items-center justify-center animate-slide-up w-full max-w-sm" onClick={e => e.stopPropagation()}>
                                <button onClick={() => { setQrLightbox(null); unlockScroll(); }} className="absolute -top-16 right-0 text-white hover:text-slate-300 transition-colors bg-white/10 p-2 rounded-full" title="Close (Esc)">
                                    <Icons.X className="w-8 h-8"/>
                                </button>
                                <div className="bg-white p-8 md:p-10 rounded-3xl shadow-2xl flex flex-col items-center w-full text-center border border-slate-200">
                                    <div className="w-12 h-12 bg-tdmh-blue text-white rounded-xl flex items-center justify-center mb-4"><Icons.QrCode className="w-6 h-6"/></div>
                                    <h3 className="font-black text-slate-800 text-xl tracking-tight mb-1">{qrLightbox.title}</h3>
                                    <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-6">Scan to Access Document</p>
                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                                        <img src={qrLightbox.url} className="w-48 h-48 object-contain" alt="QR Code" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NEWS WELCOME FLYER */}
                    {showNewsFlyer && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-2xl overflow-hidden relative transform animate-slide-up flex flex-col border border-slate-200 my-auto shrink-0">
                                <button onClick={() => { setShowNewsFlyer(false); unlockScroll(); }} className="absolute top-5 right-5 text-slate-400 hover:text-slate-800 z-20 transition-all bg-white p-2.5 rounded-full border border-slate-200 shadow-sm hover:bg-slate-50"><Icons.X className="w-5 h-5" /></button>
                                <div className="p-8 pb-6 bg-slate-50 border-b border-slate-100 flex flex-col items-center text-center shrink-0">
                                    <div className="w-16 h-16 bg-tdmh-blue text-white rounded-2xl flex items-center justify-center mb-4 shadow-md"><Icons.Bell className="w-8 h-8" /></div>
                                    <span className="text-[10px] font-bold tracking-[0.2em] text-tdmh-blue uppercase mb-2">TDMH Official Notice</span>
                                    <h2 className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight">TDMH CQI Portal V2 is Live!</h2>
                                </div>
                                <div className="p-8 md:px-10 bg-white">
                                    <p className="text-slate-700 mb-6 text-lg font-bold leading-relaxed text-center">Welcome to your upgraded administrative command center.</p>
                                    <p className="text-slate-600 mb-8 leading-relaxed text-sm sm:text-base">We have completely redesigned the portal to be faster, more secure, and easier to navigate. Instead of scrolling through a massive list, everything is now neatly organized into tabs. Here is your quick guide to navigating the new system:</p>
                                    
                                    <ul className="space-y-5 mb-10">
                                        <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg mt-0.5 shrink-0"><Icons.Menu className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm sm:text-base mb-0.5">The Top Navigation</strong> <span className="text-slate-600 text-xs sm:text-sm leading-snug block">All your tools are now located in the tabs at the top of your screen. You can scroll horizontally through them!</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg mt-0.5 shrink-0"><Icons.Box className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm sm:text-base mb-0.5">Departments Tab</strong> <span className="text-slate-600 text-xs sm:text-sm leading-snug block">Clicking a department is open to everyone. Logging in is only required if you are uploading restricted tools.</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg mt-0.5 shrink-0"><Icons.Folder className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm sm:text-base mb-0.5">DCC & Forms Tab</strong> <span className="text-slate-600 text-xs sm:text-sm leading-snug block">We have consolidated all documents! Go here to find Universal Forms (DERF, Incident Reports), ISO Requirements, or to request a new Control Number.</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg mt-0.5 shrink-0"><Icons.FileText className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm sm:text-base mb-0.5">Memos & Calendar</strong> <span className="text-slate-600 text-xs sm:text-sm leading-snug block">Viewing is open to all staff. Authorized Admin/Heads must log in to generate new Memos or Events.</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-emerald-50 text-tdmh-green rounded-lg mt-0.5 shrink-0"><Icons.Activity className="w-5 h-5"/></div><div><strong className="text-emerald-900 block text-sm sm:text-base mb-0.5">Daily Census</strong> <span className="text-emerald-700 text-xs sm:text-sm leading-snug block">Check the Home Dashboard for live patient tracking. (Note: Only the Admitting Department can edit these numbers using a secure PIN).</span></div></li>
                                        <li className="flex items-start gap-4"><div className="p-2 bg-red-50 text-red-500 rounded-lg mt-0.5 shrink-0"><Icons.Shield className="w-5 h-5"/></div><div><strong className="text-slate-800 block text-sm sm:text-base mb-0.5">Enhanced Security</strong> <span className="text-slate-600 text-xs sm:text-sm leading-snug block">You will notice a Shield Icon (Admin) and options to "Add Memos/Events". These actions require the Master PIN to ensure our data remains secure.</span></div></li>
                                    </ul>

                                    <p className="text-slate-600 italic text-sm mb-8 text-center bg-slate-50 p-4 rounded-xl border border-slate-100">Take a moment to click through the tabs and explore the new layout. If you need any assistance, please contact the CQI Department.</p>
                                    <button onClick={() => { setShowNewsFlyer(false); unlockScroll(); }} className="px-8 py-4 bg-tdmh-blue hover:bg-blue-900 text-white font-black uppercase tracking-widest rounded-xl transition-all w-full text-sm shadow-lg shadow-blue-900/20 hover:-translate-y-1">Acknowledge & Enter Portal</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ROLE LOGIN MODAL */}
                    {showRoleLogin && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 text-center relative animate-slide-up border border-slate-200 my-auto shrink-0">
                                <button onClick={() => {setShowRoleLogin(false); setPendingAction(null); unlockScroll(); }} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors"><Icons.X className="w-5 h-5" /></button>
                                <div className="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-200"><Icons.Shield className="w-8 h-8" /></div>
                                <h3 className="text-xl font-black text-slate-800 mb-2">Role Verification</h3>
                                <p className="text-xs text-slate-500 mb-6 font-medium">Enter your specific PIN to continue.</p>
                                
                                {roleLoginFeedback && (
                                    <div className={`mb-6 text-sm font-bold p-3 rounded-lg shadow-sm transition-all animate-fade-in ${roleLoginFeedback.type === 'success' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200'}`}>
                                        {roleLoginFeedback.text}
                                    </div>
                                )}

                                <form onSubmit={submitRoleLogin}>
                                    <input type="password" value={rolePinInput} onChange={(e)=>setRolePinInput(e.target.value)} autoFocus className="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl text-center text-2xl font-black tracking-[0.3em] mb-4 focus:border-tdmh-blue outline-none transition-all" placeholder="••••••••" />
                                    <button type="submit" disabled={isVerifyingLogin} className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors disabled:opacity-50">
                                        {isVerifyingLogin ? "Verifying Database..." : "Unlock Access"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {/* MASTER ADMIN CONSOLE MODAL */}
                    {showAdminConsole && (() => {
                        const pendingMemosList = memos.filter(m => String(m.Status || m.status || m[6] || '').toUpperCase().includes('PENDING'));
                        return (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/90 backdrop-blur-md animate-fade-in overflow-y-auto">
                            <div className="bg-slate-50 rounded-[2rem] shadow-2xl w-full max-w-[95vw] overflow-hidden flex flex-col h-[95vh] animate-slide-up border border-slate-700 my-auto shrink-0">
                                <div className="bg-slate-900 p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 text-white shrink-0 shadow-md z-10 border-b border-slate-800">
                                    <div className="flex items-center gap-4">
                                        <div className="p-2.5 bg-slate-800 border border-slate-700 rounded-xl"><Icons.Shield className="w-6 h-6 text-tdmh-green" /></div>
                                        <div>
                                            <h2 className="text-2xl font-black tracking-tight leading-none">Master Admin Console</h2>
                                            <p className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-1">System Management & File Routing</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 items-center w-full sm:w-auto justify-end">
                                        <a href="https://docs.google.com/spreadsheets/d/1BGUrqHX9vThP21S3S6lhOekTw4r3xqEELIJpdfMDAuU/edit" target="_blank" className="hidden sm:flex px-6 py-2.5 bg-white/10 border border-white/20 text-white font-bold text-xs uppercase tracking-widest rounded-lg hover:bg-white/20 transition-colors">Open Raw Database</a>
                                        <button onClick={() => { setShowAdminConsole(false); unlockScroll(); }} className="text-slate-400 hover:text-white p-2 bg-slate-800 border border-slate-700 rounded-full transition-colors"><Icons.X className="w-5 h-5" /></button>
                                    </div>
                                </div>
                                <div className="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar flex flex-col lg:flex-row gap-6">
                                    
                                    <div className="w-full lg:w-1/3 flex flex-col gap-6">
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                                                <div className="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center"><Icons.Upload className="w-5 h-5"/></div>
                                                <div><h3 className="font-black text-slate-800 text-lg">Resolve Request (DCC)</h3><p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mt-0.5">Stamp & Move to Vault</p></div>
                                            </div>
                                            <form onSubmit={handleResolveDCC} className="space-y-5">
                                                <div>
                                                    <label className="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2">Tracking ID to Resolve <span className="text-red-500">*</span></label>
                                                    <input type="text" value={resolveId} onChange={(e)=>setResolveId(e.target.value)} required className="w-full p-3 border border-slate-300 rounded-xl focus:border-emerald-500 outline-none font-bold text-slate-800 transition-colors" placeholder="e.g. CQI-1234" />
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2">Upload Stamped Final File <span className="text-red-500">*</span></label>
                                                    <input ref={resolveFileRef} type="file" required className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:bg-emerald-50 file:text-emerald-700 file:border file:border-emerald-200 file:font-bold hover:file:bg-emerald-100 cursor-pointer border border-slate-200 rounded-xl p-1.5" />
                                                </div>
                                                <button type="submit" disabled={isResolving} className="w-full bg-emerald-600 text-white font-black tracking-widest uppercase text-sm py-3.5 rounded-xl shadow-lg shadow-emerald-600/20 hover:bg-emerald-700 transition-colors disabled:opacity-50 mt-2">
                                                    {isResolving ? "Processing..." : "Approve & Route File"}
                                                </button>
                                            </form>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center"><div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Forms</div><div className="text-3xl md:text-4xl font-black text-tdmh-blue">{universalForms.length + isoRequirements.length || 0}</div></div>
                                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center"><div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Active Memos</div><div className="text-3xl md:text-4xl font-black text-emerald-600">{memos.length || 0}</div></div>
                                        </div>
                                        
                                        {monitors.length > 0 && (
                                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex-1 flex flex-col min-h-[250px] max-h-[40vh]">
                                                <h3 className="font-black text-slate-800 text-lg flex items-center gap-2 mb-4 shrink-0 border-b border-slate-100 pb-3">
                                                    <Icons.Activity className="w-5 h-5 text-tdmh-blue"/> System Monitors
                                                </h3>
                                                <div className="space-y-3 overflow-y-auto custom-scrollbar pr-2 flex-1">
                                                    {monitors.map((m, i) => (
                                                        <a key={i} href={m.Link || m.link || m[1]} target="_blank" className="flex items-start gap-3 p-3 rounded-xl border border-slate-100 hover:border-tdmh-blue hover:bg-slate-50 transition-colors group">
                                                            <div className="p-2.5 bg-slate-100 text-slate-500 rounded-lg group-hover:bg-tdmh-blue group-hover:text-white transition-colors shrink-0 mt-0.5">
                                                                <Icons.Activity className="w-4 h-4" />
                                                            </div>
                                                            <div className="min-w-0">
                                                                <h5 className="text-sm font-bold text-slate-800 group-hover:text-tdmh-blue truncate">{m['System Name'] || m.Name || m.name || m[0]}</h5>
                                                                <p className="text-[10px] text-slate-500 line-clamp-2 mt-1 leading-snug">{m.Description || m.desc || m[2]}</p>
                                                            </div>
                                                        </a>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div className="w-full lg:w-2/3 flex flex-col gap-6">
                                        
                                        {/* Master Index Ref */}
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-[400px] lg:h-[500px] shrink-0">
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b border-slate-100 pb-4 shrink-0 gap-3">
                                                <h3 className="font-black text-slate-800 flex items-center gap-2 text-lg"><Icons.FileText className="w-5 h-5 text-tdmh-blue"/> Master Index Reference</h3>
                                                <a href="https://docs.google.com/document/d/14_7i6NVjdQWP9bEw2k_qc4tBSzdzHJp96vVaGidxxgY/edit" target="_blank" className="text-xs font-bold bg-blue-50 text-tdmh-blue px-3 py-1.5 rounded hover:bg-blue-100 transition-colors border border-blue-100">Open Full Window</a>
                                            </div>
                                            <div className="flex-1 bg-slate-100 rounded-xl overflow-hidden border border-slate-200 relative shadow-inner">
                                                <iframe src="https://docs.google.com/document/d/14_7i6NVjdQWP9bEw2k_qc4tBSzdzHJp96vVaGidxxgY/preview" className="absolute inset-0 w-full h-full border-none"></iframe>
                                            </div>
                                        </div>

                                        {/* Pending Memos Queue Section */}
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-lg flex flex-col flex-1 border-t-4 border-t-amber-400">
                                            <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                                                <div className="flex items-center gap-3 md:gap-4">
                                                    <div className="w-10 h-10 md:w-12 md:h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center border border-amber-100"><Icons.FileText className="w-5 h-5 md:w-6 md:h-6"/></div>
                                                    <div>
                                                        <h3 className="font-black text-slate-800 text-lg md:text-xl leading-tight">Pending Memos Queue</h3>
                                                        <p className="text-[10px] md:text-xs text-slate-400 uppercase tracking-widest font-bold mt-1">Awaiting Final Admin Approval</p>
                                                    </div>
                                                </div>
                                                <div className="bg-amber-100 border border-amber-200 text-amber-700 font-black text-xl md:text-2xl px-4 py-1 rounded-xl shadow-sm">{pendingMemosList.length}</div>
                                            </div>
                                            
                                            <div className="space-y-4 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                                                {pendingMemosList.length === 0 ? (
                                                    <div className="flex flex-col items-center justify-center py-10 text-slate-400">
                                                        <Icons.ClipboardCheck className="w-12 h-12 mb-3 opacity-50"/>
                                                        <p className="text-base font-bold">No pending memos in the queue.</p>
                                                        <p className="text-xs mt-1">All drafted memos have been resolved.</p>
                                                    </div>
                                                ) : (
                                                    pendingMemosList.map((m, i) => {
                                                        const pdfLink = m['PDF Link'] || m.Link || m[8];
                                                        const hasValidLink = pdfLink && pdfLink.trim() !== '' && pdfLink !== '#';

                                                        return (
                                                        <div key={i} className="p-5 border border-slate-200 rounded-xl bg-slate-50 hover:bg-white hover:border-tdmh-blue transition-all relative group shadow-sm">
                                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3">
                                                                <span className="text-[10px] font-bold bg-white text-slate-600 px-2.5 py-1 rounded-lg border border-slate-200 uppercase tracking-widest shadow-sm">REF: {m['Ref No'] || m[0]}</span>
                                                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">{m.Date || m[1]}</span>
                                                            </div>
                                                            <h4 className="font-black text-slate-800 text-lg leading-tight mb-2">{m.Subject || m[4]}</h4>
                                                            <p className="text-sm text-slate-600 mb-5 border-l-2 border-slate-300 pl-3 bg-white/50 py-1"><strong>From:</strong> {m.From || m[3]}</p>
                                                            
                                                            <div className="flex flex-col sm:flex-row gap-3">
                                                                {hasValidLink ? (
                                                                    <a href={pdfLink} target="_blank" className="flex-1 bg-white border border-slate-200 text-slate-700 font-bold py-3 rounded-lg hover:bg-slate-50 hover:text-tdmh-blue transition-colors flex items-center justify-center gap-2 text-sm shadow-sm">
                                                                        <Icons.FileText className="w-4 h-4" /> View Draft
                                                                    </a>
                                                                ) : (
                                                                    <button disabled className="flex-1 bg-slate-100 border border-slate-200 text-slate-400 font-bold py-3 rounded-lg cursor-not-allowed flex items-center justify-center gap-2 text-sm">
                                                                        <Icons.Sync className="w-4 h-4 animate-spin" /> Processing PDF...
                                                                    </button>
                                                                )}
                                                                <button 
                                                                    onClick={() => handleApproveMemo(m['Ref No'] || m[0])} 
                                                                    disabled={isApprovingMemo} 
                                                                    className="flex-1 bg-tdmh-blue text-white font-bold py-3 rounded-lg hover:bg-blue-900 transition-colors disabled:opacity-50 flex items-center justify-center gap-2 text-sm shadow-sm"
                                                                >
                                                                    <Icons.ClipboardCheck className="w-4 h-4" /> {isApprovingMemo ? 'Approving...' : 'Approve & Publish'}
                                                                </button>
                                                            </div>
                                                        </div>
                                                        )
                                                    })
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        );
                    })()}

                    {/* NEW MEMO MODAL (TEXT GENERATOR) */}
                    {showAddMemo && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-3xl overflow-hidden relative transform animate-slide-up my-auto shrink-0 border border-slate-200">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 sticky top-0 z-10 shadow-sm">
                                    <div className="flex items-center gap-4">
                                        <div className="p-3 bg-blue-50 text-tdmh-blue rounded-xl shadow-sm border border-blue-100"><Icons.FileText className="w-6 h-6"/></div>
                                        <div>
                                            <h3 className="font-black text-slate-800 text-xl tracking-tight leading-tight">Draft Official Memo</h3>
                                            <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mt-0.5">Automated PDF Template Generation</p>
                                        </div>
                                    </div>
                                    <button onClick={() => { setShowAddMemo(false); unlockScroll(); }} className="text-slate-400 hover:text-slate-800 transition-colors bg-white p-2.5 rounded-full border border-slate-200 shadow-sm hover:bg-slate-50"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 md:p-8 space-y-6" onSubmit={handleNativeMemoSubmit}>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">To / For <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.forDept} onChange={(e)=>setMemoData({...memoData, forDept: e.target.value})} required className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700 shadow-inner" placeholder="e.g. All Department Heads" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">From <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.fromName} onChange={(e)=>setMemoData({...memoData, fromName: e.target.value})} required className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700 shadow-inner" placeholder="e.g. HR Department" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                        <div className="md:col-span-2">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Subject <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.subject} onChange={(e)=>setMemoData({...memoData, subject: e.target.value})} required className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors font-bold text-slate-800 shadow-inner" placeholder="e.g. Updated Holiday Schedule" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Urgency</label>
                                            <select value={memoData.urgency} onChange={(e)=>setMemoData({...memoData, urgency: e.target.value})} className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors font-bold text-slate-700 shadow-inner cursor-pointer">
                                                <option>Normal</option>
                                                <option>High</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-3 border-t border-slate-100">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 gap-3">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block">Raw Memo Content <span className="text-red-500">*</span></label>
                                            <button type="button" onClick={handleFixGrammar} disabled={isFixingGrammar} className="text-xs font-bold text-purple-700 bg-purple-50 hover:bg-purple-100 border border-purple-200 px-3 py-2 rounded-lg flex items-center gap-1.5 transition-colors disabled:opacity-50 shadow-sm w-full sm:w-auto justify-center">
                                                <Icons.Sparkles className="w-3.5 h-3.5" /> {isFixingGrammar ? "Formatting..." : "✨ Auto-Format Draft"}
                                            </button>
                                        </div>
                                        <textarea spellCheck="true" value={memoData.body} onChange={(e)=>setMemoData({...memoData, body: e.target.value})} required className="w-full p-5 rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700 h-56 resize-y leading-relaxed text-sm shadow-inner" placeholder="Type or paste your raw draft here. Use your browser's spellcheck (red lines) for typos. Click the 'Auto-Format' button above to instantly clean up messy spacing, fix punctuation gaps, and capitalize your sentences before you submit..."></textarea>
                                    </div>
                                    
                                    <div className="bg-blue-50 p-5 rounded-xl border border-blue-100 flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                                        <div className="p-2.5 bg-white rounded-lg shadow-sm shrink-0 border border-blue-100"><Icons.FileText className="w-6 h-6 text-tdmh-blue" /></div>
                                        <div>
                                            <p className="text-sm text-blue-900 font-black mb-0.5">What happens next?</p>
                                            <p className="text-xs text-blue-800 leading-relaxed">When you click submit, the system will automatically format this text into the official TDMH PDF Template. It will then be securely routed to the Admin panel for final review and signature placement before being published publicly.</p>
                                        </div>
                                    </div>

                                    <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black tracking-widest uppercase text-sm py-4 rounded-xl mt-2 hover:bg-blue-900 transition-transform hover:-translate-y-1 shadow-lg shadow-blue-900/20 disabled:opacity-50 disabled:hover:translate-y-0">
                                        {isSubmitting ? "Generating PDF Template..." : "Submit to Admin Review"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ADD EVENT MODAL (Time Optional) */}
                    {showAddEvent && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden relative transform animate-slide-up my-auto shrink-0 border border-slate-200">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-black text-slate-800 text-xl tracking-tight">Schedule New Event</h3>
                                    <button onClick={() => { setShowAddEvent(false); unlockScroll(); }} className="text-slate-400 hover:text-slate-800 transition-colors p-2 bg-white rounded-full shadow-sm border border-slate-200"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 space-y-5" onSubmit={handleEventSubmit}>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Event Title <span className="text-red-500">*</span></label>
                                        <input type="text" value={eventData.title} onChange={e=>setEventData({...eventData, title: e.target.value})} required className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-purple-500 transition-colors" placeholder="e.g. Quality Assurance Meeting"/>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Date <span className="text-red-500">*</span></label>
                                            <input type="date" value={eventData.date} onChange={e=>setEventData({...eventData, date: e.target.value})} required className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-purple-500 transition-colors"/>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Time <span className="text-slate-400 normal-case tracking-normal">(Optional)</span></label>
                                            <input type="time" value={eventData.time} onChange={e=>setEventData({...eventData, time: e.target.value})} className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-purple-500 transition-colors"/>
                                        </div>
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-purple-600 text-white font-black uppercase tracking-widest py-4 rounded-xl mt-4 hover:bg-purple-700 transition-transform hover:-translate-y-1 shadow-lg shadow-purple-600/20 disabled:opacity-50 disabled:hover:translate-y-0 text-sm">{isSubmitting ? "Adding to Calendar..." : "Add to Calendar"}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* EDIT EVENT TIME MODAL */}
                    {showEditEvent && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden relative transform animate-slide-up my-auto shrink-0 border border-slate-200">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-black text-slate-800 text-xl tracking-tight">Update Time</h3>
                                    <button onClick={() => { setShowEditEvent(false); unlockScroll(); }} className="text-slate-400 hover:text-slate-800 transition-colors p-2 bg-white rounded-full shadow-sm border border-slate-200"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 space-y-5" onSubmit={handleEditEventSubmit}>
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <p className="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-1.5">Event Details</p>
                                        <p className="font-black text-slate-800 leading-snug text-base mb-1">{editEventData.oldTitle}</p>
                                        <p className="text-sm text-slate-500 font-medium">{editEventData.oldDateText}</p>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">New Time <span className="text-slate-400 normal-case tracking-normal">(Leave blank for Tentative)</span></label>
                                        <input type="time" value={editEventData.newTime} onChange={e=>setEditEventData({...editEventData, newTime: e.target.value})} className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-blue-500 transition-colors"/>
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-blue-600 text-white font-black uppercase tracking-widest py-4 rounded-xl mt-2 hover:bg-blue-700 transition-transform hover:-translate-y-1 shadow-lg shadow-blue-600/20 disabled:opacity-50 disabled:hover:translate-y-0 text-sm">{isSubmitting ? "Updating..." : "Save New Time"}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ADD NEWS MODAL */}
                    {showAddNews && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden relative transform animate-slide-up my-auto shrink-0 border border-slate-200">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-black text-slate-800 text-xl tracking-tight">Post Announcement</h3>
                                    <button onClick={() => { setShowAddNews(false); unlockScroll(); }} className="text-slate-400 hover:text-slate-800 transition-colors p-2 bg-white rounded-full shadow-sm border border-slate-200"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 space-y-5" onSubmit={(e) => { e.preventDefault(); showAlert("Restricted", "Feature links directly to Database. Please enter News via the Master Sheet.", "info"); setShowAddNews(false); unlockScroll(); }}>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Headline / Title</label>
                                        <input type="text" required className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors" placeholder="Announcement Title"/>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Category</label>
                                            <select className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors cursor-pointer">
                                                <option>General</option>
                                                <option>System Update</option>
                                                <option>Urgent</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Date</label>
                                            <input type="date" required className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Message Content</label>
                                        <textarea required className="w-full p-3.5 text-sm rounded-xl border border-slate-300 outline-none focus:border-tdmh-blue transition-colors resize-none h-32" placeholder="Write the announcement details here..."></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-tdmh-blue text-white font-black uppercase tracking-widest py-4 rounded-xl mt-2 hover:bg-blue-900 transition-transform hover:-translate-y-1 shadow-lg shadow-blue-900/20 text-sm">Post to News Feed</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVIGATION */}
                    <nav className="bg-tdmh-blue text-white shadow-xl z-40 sticky top-0 border-b-2 border-blue-900">
                        <div className="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16 md:h-20 gap-4">
                                
                                <div className="flex items-center gap-2 md:gap-4 shrink-0">
                                    <a href="#" onClick={(e) => { e.preventDefault(); window.location.reload(); }} className="cursor-pointer hover:opacity-90 transition-transform hover:scale-105 flex items-center bg-white px-3 py-1.5 md:py-2 rounded-xl shadow-md border border-slate-200">
                                        <img 
                                            src="./images%20logo/tdmh-logo.png" 
                                            alt="TDMH Logo" 
                                            className="h-8 md:h-10 w-auto object-contain" 
                                            onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHg9IjUiIHk9IjUiIHdpZHRoPSI5MCIgaGVpZ2h0PSI5MCIgcng9IjIwIiBmaWxsPSIjMWUzYThhIiAvPjxwYXRoIGQ9Ik0zNSA1MCBINjUgTTUwIDM1IFY2NSIgc3Ryb2tlPSIjMTZhMzRhIiBzdHJva2VXaWR0aD0iMTYiIHN0cm9rZUxpbmVjYXA9InJvdW5kIiAvPjwvc3ZnPg=='; }} 
                                        />
                                    </a>

                                    <button onClick={() => handleSecureAction('admin')} className="p-2 md:p-2.5 rounded-lg bg-white/10 border border-white/20 text-white hover:bg-white/20 transition-colors shadow-sm" title="Admin Control Center">
                                        <Icons.Shield className="w-5 h-5" />
                                    </button>
                                </div>
                                
                                <div className="hidden xl:flex flex-1 items-center justify-center min-w-0 px-10 relative">
                                    <button onClick={() => scrollTabs('left')} className="absolute left-1 z-10 p-1.5 rounded-full bg-blue-800/80 text-white hover:bg-white hover:text-tdmh-blue border border-blue-700 shadow-md transition-colors flex items-center justify-center" title="Scroll Left"><Icons.ChevronLeft className="w-4 h-4" /></button>
                                    <div ref={tabsContainerRef} className="flex items-center gap-1 bg-blue-900/40 p-1.5 rounded-xl border border-blue-800/50 overflow-x-auto no-scrollbar scroll-smooth w-full">
                                        {TABS.map(tab => {
                                            const IconCmp = Icons[tab.icon];
                                            return (
                                                <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`px-4 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 transition-all whitespace-nowrap shrink-0 ${activeTab === tab.id ? 'bg-white text-tdmh-blue shadow-md scale-105' : 'text-blue-100 hover:bg-blue-800 hover:text-white'}`}>
                                                    <IconCmp className="w-4 h-4" /> {tab.label}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <button onClick={() => scrollTabs('right')} className="absolute right-1 z-10 p-1.5 rounded-full bg-blue-800/80 text-white hover:bg-white hover:text-tdmh-blue border border-blue-700 shadow-md transition-colors flex items-center justify-center" title="Scroll Right"><Icons.ChevronRight className="w-4 h-4" /></button>
                                </div>

                                <div className="flex items-center gap-3 md:gap-4 shrink-0">
                                    <div className="hidden lg:flex gap-2 mr-2">
                                        {userRole === 'admin' && <span className="bg-red-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-red-600">Admin</span>}
                                        {userRole === 'dept_head' && <span className="bg-yellow-500 text-yellow-900 text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-yellow-600">Dept Head</span>}
                                        {userRole === 'admitting' && <span className="bg-purple-500 text-white text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-purple-600">Admitting</span>}
                                    </div>
                                    
                                    {userRole === 'guest' ? (
                                        <button onClick={() => setShowRoleLogin(true)} className="hidden sm:flex items-center gap-2 bg-white/10 border border-white/20 text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-white/20 transition-colors shadow-sm whitespace-nowrap"><Icons.Lock className="w-4 h-4" /> Staff Login</button>
                                    ) : (
                                        <button onClick={() => {setUserRole('guest'); setActiveTab('home');}} className="hidden sm:flex text-xs font-bold uppercase tracking-widest text-red-300 hover:text-red-100 bg-red-900/30 px-5 py-2.5 rounded-lg border border-red-900/50 transition-colors">Logout</button>
                                    )}
                                    <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="xl:hidden p-2 bg-white text-tdmh-blue rounded-lg shadow-sm">{mobileMenuOpen ? <Icons.X className="w-5 h-5" /> : <Icons.Menu className="w-5 h-5" />}</button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        {mobileMenuOpen && (
                            <div className="xl:hidden bg-white border-t border-slate-200 absolute w-full shadow-2xl animate-fade-in text-slate-800 z-50 max-h-[calc(100vh-4rem)] overflow-y-auto custom-scrollbar">
                                <div className="p-4 space-y-2">
                                    {TABS.map(tab => {
                                        const IconCmp = Icons[tab.icon];
                                        return (
                                            <button key={tab.id} onClick={() => handleSecureAction(tab.id)} className={`w-full flex items-center gap-3 px-5 py-4 rounded-xl text-sm font-bold transition-colors ${activeTab === tab.id ? 'bg-tdmh-blue text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 border border-slate-100'}`}>
                                                <IconCmp className="w-5 h-5" /> {tab.label}
                                            </button>
                                        );
                                    })}
                                    <div className="pt-4 mt-4 border-t border-slate-200 space-y-3">
                                        {userRole === 'guest' ? (
                                            <button onClick={() => {setShowRoleLogin(true); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-slate-100 border border-slate-200 text-slate-700 px-5 py-4 rounded-xl text-sm font-bold hover:bg-slate-200 transition-colors">
                                                <Icons.Lock className="w-5 h-5" /> Staff Login
                                            </button>
                                        ) : (
                                            <button onClick={() => {setUserRole('guest'); setActiveTab('home'); setMobileMenuOpen(false);}} className="w-full flex justify-center items-center gap-2 bg-red-50 border border-red-100 text-red-600 px-5 py-4 rounded-xl text-sm font-bold hover:bg-red-100 transition-colors">
                                                Logout
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </nav>

                    <main className="flex-grow max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-10 w-full relative z-10 flex flex-col justify-start">
                        {renderActiveTabContent()}
                    </main>

                    <footer className="mt-auto bg-tdmh-blue border-t-2 border-blue-900 py-6 text-center text-white text-[10px] font-bold flex flex-col md:flex-row justify-center items-center gap-6 relative z-20 shrink-0">
                        <p className="uppercase tracking-widest text-blue-200">&copy; {new Date().getFullYear()} TAYTAY DOCTORS MULTISPECIALTY HOSPITAL.</p>
                        <button onClick={() => fetchDatabase(true)} className="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-blue-900 border border-blue-800 text-tdmh-green hover:bg-blue-800 transition-colors uppercase tracking-widest text-xs font-black shadow-lg">
                            <Icons.Sync className="w-4 h-4" /> {isSyncing ? 'Syncing...' : 'System Sync'}
                        </button>
                    </footer>
                </div>
            );
        }

        // Added a safety check to ensure ReactDOM is fully loaded before rendering
        if (window.ReactDOM) {
            const root = window.ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } else {
            document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center; color: #ef4444; font-family: sans-serif;"><h2>System Loading Error</h2><p>The React framework failed to load. Please check your internet connection or IT firewall settings.</p></div>';
        }
    </script>
</body>
</html>
