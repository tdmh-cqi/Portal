<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDMH CQI Portal V2</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] },
                    colors: { tdmh: { blue: '#1e3a8a', green: '#16a34a', dark: '#0f172a', surface: '#f4f7f9', border: '#e2e8f0' } },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards', 'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards', 'pulse-slow': 'pulse 3s infinite', 'spin-slow': 'spin 3s linear infinite' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>

    <style>
        body { background-color: #f4f7f9; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        body.modal-open { overflow: hidden !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .structured-card { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 1.5rem; }
        .bg-pattern { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        
        @media print {
            body * { visibility: hidden; }
            .printable-memo, .printable-memo * { visibility: visible; }
            .printable-memo { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 20px; box-shadow: none; border: none; border-radius: 0; min-height: 100vh; background: white; z-index: 99999; }
            .no-print { display: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body class="text-slate-800 relative bg-pattern">
    <div id="root" class="relative z-10 flex flex-col min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbwnnGfhhzSwRVwzoq7JJG9ZzkLmTG7VnR69TM1vf_OHWUxvBfHspy6SpEqTUQguqlW3/exec";

        // --- OPTIMIZED ICON COMPONENT ---
        const SvgIcon = ({ className, children }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                {children}
            </svg>
        );
        const Icons = {
            Search: (p) => <SvgIcon className={p.className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></SvgIcon>,
            X: (p) => <SvgIcon className={p.className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></SvgIcon>,
            Shield: (p) => <SvgIcon className={p.className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></SvgIcon>,
            Lock: (p) => <SvgIcon className={p.className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></SvgIcon>,
            Users: (p) => <SvgIcon className={p.className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></SvgIcon>,
            FileText: (p) => <SvgIcon className={p.className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></SvgIcon>,
            Home: (p) => <SvgIcon className={p.className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></SvgIcon>,
            Calendar: (p) => <SvgIcon className={p.className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></SvgIcon>,
            Video: (p) => <SvgIcon className={p.className}><rect width="20" height="14" x="2" y="5" rx="2" ry="2"/><line x1="2" x2="22" y1="10" y2="10"/><line x1="8" x2="8" y1="5" y2="19"/><line x1="16" x2="16" y1="5" y2="19"/></SvgIcon>,
            Activity: (p) => <SvgIcon className={p.className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></SvgIcon>,
            Bell: (p) => <SvgIcon className={p.className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></SvgIcon>,
            Folder: (p) => <SvgIcon className={p.className}><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></SvgIcon>,
            Box: (p) => <SvgIcon className={p.className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></SvgIcon>,
            Menu: (p) => <SvgIcon className={p.className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></SvgIcon>,
            Upload: (p) => <SvgIcon className={p.className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></SvgIcon>,
            Sync: (p) => <SvgIcon className={p.className}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></SvgIcon>,
            ChevronLeft: (p) => <SvgIcon className={p.className}><path d="m15 18-6-6 6-6"/></SvgIcon>,
            ChevronRight: (p) => <SvgIcon className={p.className}><path d="m9 18 6-6-6-6"/></SvgIcon>,
            Maximize: (p) => <SvgIcon className={p.className}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></SvgIcon>,
            Stethoscope: (p) => <SvgIcon className={p.className}><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v6"/><path d="M9 21h6"/><circle cx="19" cy="19" r="2"/></SvgIcon>,
            QrCode: (p) => <SvgIcon className={p.className}><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></SvgIcon>,
            Download: (p) => <SvgIcon className={p.className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></SvgIcon>,
            MessageCircle: (p) => <SvgIcon className={p.className}><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></SvgIcon>,
            CheckCircle: (p) => <SvgIcon className={p.className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></SvgIcon>,
            Sparkles: (p) => <SvgIcon className={p.className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></SvgIcon>,
            Plus: (p) => <SvgIcon className={p.className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></SvgIcon>,
            Trash: (p) => <SvgIcon className={p.className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2-2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></SvgIcon>,
            Edit: (p) => <SvgIcon className={p.className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></SvgIcon>,
            PenTool: (p) => <SvgIcon className={p.className}><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></SvgIcon>,
            Clock: (p) => <SvgIcon className={p.className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></SvgIcon>,
            Mail: (p) => <SvgIcon className={p.className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></SvgIcon>,
            AlertCircle: (p) => <SvgIcon className={p.className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></SvgIcon>,
            Eye: (p) => <SvgIcon className={p.className}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></SvgIcon>,
            Monitor: (p) => <SvgIcon className={p.className}><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></SvgIcon>,
            Link: (p) => <SvgIcon className={p.className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></SvgIcon>
        };

        const DEPT_COLORS = [
            { bg: 'bg-blue-50', border: 'border-blue-100', text: 'text-blue-600', hover: 'hover:bg-blue-50 border-slate-200 hover:border-tdmh-blue' },
            { bg: 'bg-emerald-50', border: 'border-emerald-100', text: 'text-emerald-600', hover: 'hover:bg-emerald-50 border-slate-200 hover:border-tdmh-green' },
            { bg: 'bg-purple-50', border: 'border-purple-100', text: 'text-purple-600', hover: 'hover:bg-purple-50 border-slate-200 hover:border-purple-500' },
            { bg: 'bg-pink-50', border: 'border-pink-100', text: 'text-pink-600', hover: 'hover:bg-pink-50 border-slate-200 hover:border-pink-500' },
            { bg: 'bg-orange-50', border: 'border-orange-100', text: 'text-orange-600', hover: 'hover:bg-orange-50 border-slate-200 hover:border-orange-500' }
        ];

        const getToolIcon = (iStr, fStr) => {
            let s = String(iStr || '').toLowerCase().trim();
            if (!s && fStr) s = String(fStr).toLowerCase().trim();
            if (s.includes('form') || s.includes('paper') || s.includes('pen') || s.includes('sheet') || s.includes('report')) return Icons.FileText;
            if (s.includes('computer') || s.includes('monitor') || s.includes('laptop') || s.includes('it ')) return Icons.Monitor;
            if (s.includes('infectious') || s.includes('shield') || s.includes('safety') || s.includes('risk')) return Icons.Shield;
            if (s.includes('medical') || s.includes('stethoscope') || s.includes('clinical')) return Icons.Stethoscope;
            if (s.includes('person') || s.includes('head') || s.includes('user') || s.includes('people') || s.includes('attendance')) return Icons.Users;
            const exactMatch = Object.keys(Icons).find(k => k.toLowerCase() === s);
            return exactMatch ? Icons[exactMatch] : Icons.Folder; 
        };

        const getDriveImage = (url) => {
            if(!url) return '';
            const match = String(url).match(/(?:file\/d\/|id=)([a-zA-Z0-9_-]+)/);
            return match && match[1] ? `https://lh3.googleusercontent.com/d/${match[1]}` : String(url);
        };

        const formatDateFriendly = (dateVal) => {
            if (!dateVal) return { month: 'N/A', day: '--', year: '----', full: 'N/A' };
            let d = new Date(String(dateVal).trim());
            if (!isNaN(d.getTime())) {
                const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                return { month: monthNames[d.getMonth()], day: d.getDate().toString().padStart(2, '0'), year: d.getFullYear(), full: d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) };
            }
            const parts = String(dateVal).trim().split(' ');
            return { month: parts[0] ? parts[0].substring(0, 3).toUpperCase() : 'N/A', day: parts[1] ? parts[1].replace(',', '') : '--', year: parts[2] ? parts[2] : '----', full: String(dateVal) };
        };

        // --- MOVABLE MASTERLIST WINDOW ---
        const FloatingMasterlist = ({ onClose }) => {
            const [pos, setPos] = useState({ x: window.innerWidth > 800 ? window.innerWidth - 600 : 20, y: 80 });
            const [isDragging, setIsDragging] = useState(false);
            const [rel, setRel] = useState({ x: 0, y: 0 });

            const onMouseDown = (e) => {
                if (e.button !== 0) return;
                setIsDragging(true);
                setRel({ x: e.pageX - pos.x, y: e.pageY - pos.y });
                e.stopPropagation(); e.preventDefault();
            };

            useEffect(() => {
                const onMouseUp = () => setIsDragging(false);
                const onMouseMove = (e) => {
                    if (!isDragging) return;
                    setPos({ x: e.pageX - rel.x, y: e.pageY - rel.y });
                    e.stopPropagation(); e.preventDefault();
                };
                if (isDragging) {
                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                }
                return () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
            }, [isDragging, rel]);

            return (
                <div style={{ left: Math.max(0, pos.x), top: Math.max(0, pos.y), width: '90%', maxWidth: '550px', height: '650px' }} className="fixed z-[200] bg-slate-800 border border-slate-600 shadow-2xl rounded-2xl flex flex-col overflow-hidden resize">
                    <div onMouseDown={onMouseDown} className="bg-slate-900 p-3 cursor-move flex justify-between items-center border-b border-slate-700 select-none">
                        <div className="flex items-center gap-2 text-white">
                            <Icons.FileText className="w-4 h-4 text-blue-400" />
                            <h4 className="font-black text-sm uppercase tracking-widest">Masterlist (Movable)</h4>
                        </div>
                        <button onClick={onClose} onMouseDown={e => e.stopPropagation()} className="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-1.5 rounded-full transition-colors"><Icons.X className="w-4 h-4"/></button>
                    </div>
                    <div className="flex-1 bg-white relative" style={{ pointerEvents: isDragging ? 'none' : 'auto' }}>
                        <iframe src="https://docs.google.com/document/d/14_7i6NVjdQWP9bEw2k_qc4tBSzdzHJp96vVaGidxxgY/preview" className="w-full h-full" frameBorder="0"></iframe>
                    </div>
                </div>
            );
        };

        // --- OPTIMIZED MODAL COMPONENT ---
        const Modal = ({ isOpen, onClose, title, icon: IconCmp, subtitle, children, maxWidth = "max-w-md", iconColor = "text-tdmh-blue", iconBg = "bg-blue-50 border-blue-100" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in no-print overflow-y-auto" onClick={onClose}>
                    <div className={`bg-white rounded-[2rem] shadow-2xl w-full ${maxWidth} p-8 relative animate-slide-up border border-slate-200 my-auto shrink-0`} onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-slate-800 transition-colors bg-slate-50 p-2 rounded-full border border-slate-200 shadow-sm"><Icons.X className="w-5 h-5"/></button>
                        {(title || IconCmp) && (
                            <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                                {IconCmp && <div className={`w-12 h-12 ${iconBg} ${iconColor} rounded-xl flex items-center justify-center border`}><IconCmp className="w-6 h-6"/></div>}
                                <div>
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 leading-tight">{title}</h3>
                                    {subtitle && <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mt-0.5">{subtitle}</p>}
                                </div>
                            </div>
                        )}
                        {children}
                    </div>
                </div>
            );
        };

        // --- OPTIMIZED FORM INPUT COMPONENT ---
        const FormInput = ({ label, type = "text", value, onChange, placeholder, required = false, as = "input", options = [], disabled = false, className = "", multiple = false }) => (
            <div className={`mb-4 ${className}`}>
                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">{label} {required && <span className="text-red-500">*</span>}</label>
                {as === "select" ? (
                    <select value={value} onChange={onChange} required={required} disabled={disabled} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none bg-white transition-colors">
                        {options.map(o => <option key={o.value || o} value={o.value || o}>{o.label || o}</option>)}
                    </select>
                ) : as === "textarea" ? (
                    <textarea value={value} onChange={onChange} placeholder={placeholder} required={required} disabled={disabled} className="w-full p-4 text-sm border border-slate-300 rounded-xl h-28 focus:border-tdmh-blue outline-none resize-y transition-colors"></textarea>
                ) : type === "file" ? (
                    <input type="file" onChange={onChange} accept={placeholder} required={required} disabled={disabled} multiple={multiple} className="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:bg-emerald-50 file:text-tdmh-green file:border file:border-emerald-200 file:font-bold hover:file:bg-emerald-100 transition-colors cursor-pointer border border-slate-200 p-1 rounded-2xl" />
                ) : (
                    <input type={type} value={value} onChange={onChange} placeholder={placeholder} required={required} disabled={disabled} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none transition-colors" />
                )}
            </div>
        );

        const SignaturePad = ({ onSave, onCancel }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#0f172a';
                const resizeCanvas = () => { canvas.width = canvas.parentElement.clientWidth; canvas.height = 150; };
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                return () => window.removeEventListener('resize', resizeCanvas);
            }, []);

            const getCoordinates = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const startDrawing = (e) => { e.preventDefault(); setIsDrawing(true); const { x, y } = getCoordinates(e); canvasRef.current.getContext('2d').beginPath(); canvasRef.current.getContext('2d').moveTo(x, y); };
            const draw = (e) => { e.preventDefault(); if (!isDrawing) return; const { x, y } = getCoordinates(e); canvasRef.current.getContext('2d').lineTo(x, y); canvasRef.current.getContext('2d').stroke(); };
            const stopDrawing = () => { setIsDrawing(false); canvasRef.current.getContext('2d').closePath(); };
            const clearCanvas = () => { canvasRef.current.getContext('2d').clearRect(0, 0, canvasRef.current.width, canvasRef.current.height); };

            return (
                <div className="w-full">
                    <div className="border-2 border-slate-300 rounded-xl overflow-hidden bg-slate-50 mb-3 relative cursor-crosshair">
                        <canvas ref={canvasRef} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} className="w-full touch-none" />
                        <div className="absolute bottom-2 left-0 right-0 text-center pointer-events-none text-slate-300 font-bold text-xs uppercase tracking-widest">Sign Here</div>
                    </div>
                    <div className="flex justify-between gap-3">
                        <button type="button" onClick={clearCanvas} className="px-4 py-2 text-xs font-bold text-slate-500 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">Clear</button>
                        <div className="flex gap-2">
                            <button type="button" onClick={onCancel} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">Cancel</button>
                            <button type="button" onClick={() => { const blank = document.createElement('canvas'); blank.width = canvasRef.current.width; blank.height = canvasRef.current.height; onSave(canvasRef.current.toDataURL() === blank.toDataURL() ? null : canvasRef.current.toDataURL('image/png')); }} className="px-5 py-2 text-xs font-bold text-white bg-tdmh-blue rounded-lg hover:bg-blue-900 transition-colors shadow-md">Confirm Signature</button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [userRole, setUserRole] = useState(() => localStorage.getItem('tdmh_role') || 'guest');
            const [activeTab, setActiveTab] = useState(() => localStorage.getItem('tdmh_tab') || 'home');

            const changeUserRole = (role) => { setUserRole(role); localStorage.setItem('tdmh_role', role); };
            const changeActiveTab = (tab) => { setActiveTab(tab); localStorage.setItem('tdmh_tab', tab); };
            const handleLogout = () => { changeUserRole('guest'); changeActiveTab('home'); setMobileMenuOpen(false); };

            const [isSyncing, setIsSyncing] = useState(true);
            const [globalPinRequired, setGlobalPinRequired] = useState(false);
            const [deptPinRequired, setDeptPinRequired] = useState(true);
            const [emailQuota, setEmailQuota] = useState(null);
            const [timeUntilReset, setTimeUntilReset] = useState('');
            
            const [departments, setDepartments] = useState([]);
            const [tools, setTools] = useState([]); 
            const [universalForms, setUniversalForms] = useState([]);
            const [isoRequirements, setIsoRequirements] = useState([]);
            const [dccQueue, setDccQueue] = useState([]);
            const [census, setCensus] = useState([{Department: 'Station 3', 'Patient Count': 0}, {Department: 'Station 4B', 'Patient Count': 0}]);
            const [newsList, setNewsList] = useState([]);
            const [calendar, setCalendar] = useState([]);
            const [slideshow, setSlideshow] = useState([]);
            const [agimat, setAgimat] = useState([]);
            const [memos, setMemos] = useState([]);
            const [signatures, setSignatures] = useState([]);
            const [inquiries, setInquiries] = useState([]);
            const [memoRequests, setMemoRequests] = useState([]);

            const [trackQuery, setTrackQuery] = useState('');
            const [trackResult, setTrackResult] = useState(null);
            const [isTracking, setIsTracking] = useState(false);

            const [globalUnlocked, setGlobalUnlocked] = useState(false);
            const [globalPinInput, setGlobalPinInput] = useState('');
            const [globalPinFeedback, setGlobalPinFeedback] = useState(null); 
            const [isVerifyingLogin, setIsVerifyingLogin] = useState(false);

            const [showRoleLogin, setShowRoleLogin] = useState(false);
            const [rolePinInput, setRolePinInput] = useState('');
            const [roleLoginFeedback, setRoleLoginFeedback] = useState(null); 
            const [pendingAction, setPendingAction] = useState(null); 
            
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [dccActiveCategory, setDccActiveCategory] = useState('universal');
            
            const [selectedDept, setSelectedDept] = useState(null); 
            const [deptAuthModal, setDeptAuthModal] = useState({ isOpen: false, targetDept: null, pinInput: '', isLoading: false, feedback: null });
            
            const [currentSlide, setCurrentSlide] = useState(0);
            const [slideshowIndex, setSlideshowIndex] = useState(null); 
            const [qrLightbox, setQrLightbox] = useState(null); 
            
            const [liveTime, setLiveTime] = useState(new Date());
            const [currentCalDate, setCurrentCalDate] = useState(new Date());
            
            const [customAlert, setCustomAlert] = useState({ isOpen: false, title: '', message: '', type: 'info' });
            const showAlert = (title, message, type = 'info') => setCustomAlert({ isOpen: true, title, message, type });

            const [showNewsFlyer, setShowNewsFlyer] = useState(false); 
            const [showAdminConsole, setShowAdminConsole] = useState(false);
            const [adminConsoleTab, setAdminConsoleTab] = useState('dcc');
            const [showMasterlist, setShowMasterlist] = useState(false); // NEW: Movable Masterlist
            
            const [showAddEvent, setShowAddEvent] = useState(false);
            const [showEditEvent, setShowEditEvent] = useState(false);
            const [showAddNews, setShowAddNews] = useState(false);
            
            const [showSupportChat, setShowSupportChat] = useState(false);
            const [showChatTooltip, setShowChatTooltip] = useState(false); 
            const [inquiryData, setInquiryData] = useState({ email: '', category: 'General Help', refNo: '', message: '' });
            const [adminReplyData, setAdminReplyData] = useState({ reply: '' });
            
            const fileInputRef = useRef(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const tabsContainerRef = useRef(null);
            const [isResolving, setIsResolving] = useState(null); 
            
            const [eventData, setEventData] = useState({ title: '', date: '', time: '' });
            const [editEventData, setEditEventData] = useState({ oldDateText: '', oldTitle: '', newTime: '' });
            const [newsData, setNewsData] = useState({ title: '', content: '', type: 'Standard' });

            const [showAddMemo, setShowAddMemo] = useState(false);
            const [viewingMemo, setViewingMemo] = useState(null); 
            const [signModalOpen, setSignModalOpen] = useState(false);
            const [memoData, setMemoData] = useState({ forDept: '', fromName: '', subject: '', urgency: 'Normal', body: '' });
            const [signData, setSignData] = useState({ name: '', dept: '' });
            const [isFixingGrammar, setIsFixingGrammar] = useState(false);
            const [isApprovingMemo, setIsApprovingMemo] = useState(false);
            const [editMemoRef, setEditMemoRef] = useState(null); 
            const [memoRequestMode, setMemoRequestMode] = useState(false);
            const [requesterName, setRequesterName] = useState('');

            const pendingDccRequests = useMemo(() => dccQueue.filter(r => String(r.Status || r.status || r[4] || '').toUpperCase().includes('PENDING')), [dccQueue]);
            const visibleMemos = useMemo(() => memos.filter(m => String(m.Status || m[6]).toUpperCase() === 'PUBLISHED' || String(m.Status || m[6]).toUpperCase() === 'APPROVED'), [memos]);
            const pendingMemosList = useMemo(() => memos.filter(m => String(m.Status || m[6]).toUpperCase().includes('PENDING')), [memos]);
            const openInquiries = useMemo(() => inquiries.filter(i => String(i.Status || i[6]).toUpperCase().includes('OPEN')), [inquiries]);
            const currentMemoSigs = useMemo(() => viewingMemo ? signatures.filter(s => (s['Memo Ref No'] || s[0]) === (viewingMemo['Ref No'] || viewingMemo[0])) : [], [viewingMemo, signatures]);
            const pendingMemoRequests = useMemo(() => memoRequests.filter(r => String(r.Status || r.status || r[6] || '').toUpperCase().includes('PENDING')), [memoRequests]);

            const TABS = [
                { id: 'home', label: 'Dashboard', icon: 'Home' },
                { id: 'news', label: 'News', icon: 'Bell' },
                { id: 'memos', label: 'Memos & Signatures', icon: 'FileText' },
                { id: 'dcc', label: 'DCC & Forms', icon: 'Folder' },
                { id: 'track', label: 'Track Request', icon: 'Search' },
                { id: 'departments', label: 'Departments', icon: 'Box' },
                { id: 'calendar', label: 'Calendar', icon: 'Calendar' },
                { id: 'agimat', label: 'Agimat Process', icon: 'Video' },
                { id: 'census', label: 'Census Entry', icon: 'Activity' }
            ];

            const unlockScroll = () => { document.body.classList.remove('modal-open'); document.body.style.overflow = 'auto'; };

            // CHAT TOOLTIP AUTO-CYCLING LOGIC
            useEffect(() => {
                const showTimer = setTimeout(() => setShowChatTooltip(false), 10000); 
                const interval = setInterval(() => {
                    setShowChatTooltip(true);
                    setTimeout(() => setShowChatTooltip(false), 10000); 
                }, 60000); 
                return () => { clearTimeout(showTimer); clearInterval(interval); };
            }, []);

            useEffect(() => {
                const calculateTime = () => {
                    const diff = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Los_Angeles' })).setHours(24, 0, 0, 0) - new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
                    if (diff <= 0) return "00:00:00";
                    return `${Math.floor(diff / 3600000).toString().padStart(2, '0')}h ${Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0')}m ${Math.floor((diff % 60000) / 1000).toString().padStart(2, '0')}s`;
                };
                const timer = setInterval(() => { setTimeUntilReset(calculateTime()); setLiveTime(new Date()); }, 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const hasModal = mobileMenuOpen || showNewsFlyer || showRoleLogin || showAdminConsole || showAddEvent || showEditEvent || showAddNews || slideshowIndex !== null || qrLightbox !== null || customAlert.isOpen || showAddMemo || viewingMemo !== null || signModalOpen || deptAuthModal.isOpen || showSupportChat;
                hasModal ? document.body.classList.add('modal-open') : unlockScroll();
                return unlockScroll;
            }, [mobileMenuOpen, showNewsFlyer, showRoleLogin, showAdminConsole, showAddEvent, showEditEvent, showAddNews, slideshowIndex, qrLightbox, customAlert.isOpen, showAddMemo, viewingMemo, signModalOpen, deptAuthModal.isOpen, showSupportChat]);

            useEffect(() => {
                if (slideshow.length <= 1 || slideshowIndex !== null) return;
                const timer = setInterval(() => setCurrentSlide((prev) => (prev + 1) % slideshow.length), 5000);
                return () => clearInterval(timer);
            }, [slideshow.length, slideshowIndex]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') { setSlideshowIndex(null); setQrLightbox(null); unlockScroll(); }
                    if (slideshowIndex !== null) {
                        if (e.key === 'ArrowRight') setSlideshowIndex((prev) => (prev + 1) % slideshow.length);
                        if (e.key === 'ArrowLeft') setSlideshowIndex((prev) => prev === 0 ? slideshow.length - 1 : prev - 1);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [slideshowIndex, slideshow.length]);

            useEffect(() => {
                const container = tabsContainerRef.current;
                if (!container) return;
                const handleWheel = (e) => { e.preventDefault(); container.scrollLeft += e.deltaY; };
                container.addEventListener('wheel', handleWheel, { passive: false });
                return () => container.removeEventListener('wheel', handleWheel);
            }, []);
            
            const scrollTabs = (direction) => tabsContainerRef.current && tabsContainerRef.current.scrollBy({ left: direction === 'left' ? -250 : 250, behavior: 'smooth' });

            const populateData = (data) => {
                setGlobalPinRequired(data.globalPinRequired === true);
                if (data.deptPinRequired !== undefined) setDeptPinRequired(data.deptPinRequired === true);
                if (!data.globalPinRequired) setGlobalUnlocked(true);
                if (data.emailQuota !== undefined) setEmailQuota(data.emailQuota);
                setCensus(data.census || []);
                
                if (data.news && data.news.length > 0) {
                    setNewsList(data.news);
                    if(!localStorage.getItem('tdmh_welcome_seen') && data.news.some(n => String(n.Title || n.title || n[3] || '').includes('V2 is Live'))) {
                        setShowNewsFlyer(true); localStorage.setItem('tdmh_welcome_seen', 'true');
                    }
                }
                
                const safeDepts = (data.departments || []).map(d => ({
                    ...d, 
                    HasPassword: d.HasPassword || (d.Password && String(d.Password).trim() !== '') ? true : false
                }));

                setDepartments(safeDepts); 
                setTools(data.tools || []); setCalendar(data.calendar || []); setUniversalForms(data.universalForms || []); setIsoRequirements(data.isoRequirements || []); setAgimat(data.agimat || []); setDccQueue(data.dccQueue || []); setMemos(data.memos || []); setSignatures(data.signatures || []); setInquiries(data.inquiries || []); setMemoRequests(data.memoRequests || []);
                if (data.slideshow) setSlideshow(data.slideshow.filter(s => String(s['Active (Yes/No)'] || '').trim().toUpperCase() === 'YES'));
            };

            const fetchDatabase = async (isBackgroundSync = false) => {
                if (!isBackgroundSync) setIsSyncing(true);
                if (!isBackgroundSync) {
                    try { const cache = JSON.parse(localStorage.getItem('tdmh_cqi_portal_cache')); if (cache && cache.data) { populateData(cache.data); setIsSyncing(false); } } catch(e) {}
                }
                try {
                    if (isBackgroundSync) setIsSyncing(true); 
                    const response = await fetch(API_URL + "?action=sync", { redirect: "follow" }).catch(() => ({ ok: false }));
                    if (response && response.ok) {
                        const result = await response.json();
                        if (result.status === 'success') { localStorage.setItem('tdmh_cqi_portal_cache', JSON.stringify(result)); populateData(result.data); }
                    } else if (!localStorage.getItem('tdmh_cqi_portal_cache')) setGlobalUnlocked(true);
                } catch (error) { if (!localStorage.getItem('tdmh_cqi_portal_cache')) setGlobalUnlocked(true); }
                setIsSyncing(false);
            };

            useEffect(() => { fetchDatabase(); }, []);

            const sendPostRequest = async (payload) => {
                if (API_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") { showAlert("System Offline", "The database is currently running in offline developer mode.", "error"); return {status: 'success'}; }
                try {
                    const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" }).catch(() => ({ ok: false }));
                    if (response && response.ok) return await response.json();
                    return {status: 'error', message: 'Failed to parse JSON response from server.'};
                } catch (e) { return {status: 'error', message: e.toString()}; }
            };

            const handleDeptClick = (dept) => {
                const hasLock = dept.HasPassword || (dept.Password && dept.Password.toString().trim() !== '');
                if (deptPinRequired && hasLock && userRole !== 'admin') {
                    setDeptAuthModal({ isOpen: true, targetDept: dept, pinInput: '', isLoading: false, feedback: null });
                } else {
                    setSelectedDept(dept);
                }
            };

            const submitDeptAuth = async (e) => {
                e.preventDefault();
                setDeptAuthModal(prev => ({...prev, isLoading: true}));
                const deptId = deptAuthModal.targetDept.ID || deptAuthModal.targetDept.id || deptAuthModal.targetDept.Name || deptAuthModal.targetDept.name;
                const res = await sendPostRequest({ action: 'verifyDeptPin', pin: deptAuthModal.pinInput, deptId: deptId });
                if (res.status === 'success') {
                    setDeptAuthModal(prev => ({ ...prev, isLoading: false, feedback: {type: 'success', text: 'Access Granted'} }));
                    setTimeout(() => { setSelectedDept(deptAuthModal.targetDept); setDeptAuthModal({ isOpen: false, targetDept: null, pinInput: '', isLoading: false, feedback: null }); }, 800);
                } else {
                    setDeptAuthModal(prev => ({ ...prev, isLoading: false, pinInput: '', feedback: {type: 'error', text: 'Incorrect Department Password'} }));
                    setTimeout(() => setDeptAuthModal(prev => ({...prev, feedback: null})), 3000);
                }
            };

            const handleToggleDeptPin = async () => {
                const res = await sendPostRequest({ action: 'toggleDeptPin' });
                if(res.status === 'success') {
                    setDeptPinRequired(res.newState); showAlert("Security Updated", `Department PIN Locks are now ${res.newState ? 'ENABLED' : 'DISABLED'} globally.`, "success");
                } else showAlert("Error", "Failed to toggle Department PIN requirement.", "error");
            };

            const handleInquirySubmit = async (e) => {
                e.preventDefault(); setIsSubmitting(true);
                const res = await sendPostRequest({ action: 'submitInquiry', email: inquiryData.email, category: inquiryData.category, refNo: inquiryData.refNo, message: inquiryData.message });
                setIsSubmitting(false);
                if (res.status === 'success') {
                    showAlert("Ticket Submitted", `Your inquiry has been sent to Admin support. Ticket ID: ${res.ticketId}\n\nYou will receive a reply to your email.`, "success");
                    setShowSupportChat(false); setInquiryData({ email: '', category: 'General Help', refNo: '', message: '' }); fetchDatabase(true); 
                } else showAlert("Submission Failed", "Failed to submit inquiry.", "error"); 
            };

            const handleResolveInquiry = async (e, ticketId) => {
                e.preventDefault(); setIsResolving(ticketId);
                const res = await sendPostRequest({ action: 'resolveInquiry', ticketId: ticketId, reply: adminReplyData.reply });
                setIsResolving(null);
                if (res.status === 'success') { showAlert("Reply Sent", "Your reply has been emailed and the ticket is marked resolved.", "success"); setAdminReplyData({reply: ''}); fetchDatabase(true); } 
                else showAlert("Error", "Failed to resolve ticket.", "error"); 
            };

            const handleFixGrammar = () => {
                if (!memoData.body.trim()) { showAlert("Missing Content", "Please type something in the memo body first before fixing grammar.", "error"); return; }
                setIsFixingGrammar(true);
                setTimeout(() => {
                    let text = memoData.body.replace(/ +/g, ' ').replace(/ \s*([,.;?!:])/g, '$1').replace(/([,.;?!:])([a-zA-Z])/g, '$1 $2').replace(/(^\s*|[.?!]\s+)([a-z])/g, (match, p1, p2) => p1 + p2.toUpperCase()).replace(/\n{3,}/g, '\n\n'); 
                    setMemoData({...memoData, body: text.trim()}); setIsFixingGrammar(false);
                }, 600); 
            };

            const handleNativeMemoSubmit = async (e) => {
                e.preventDefault(); 
                if (memoRequestMode && !requesterName.trim()) {
                    return showAlert("Missing Details", "Please enter your Name and Department so the Admin knows who is requesting this edit.", "error");
                }
                setIsSubmitting(true);
                let payload = memoRequestMode && editMemoRef 
                    ? { action: 'requestMemoAction', requestType: 'EDIT', refNo: editMemoRef, requestedBy: requesterName.trim(), newData: { forDept: memoData.forDept, fromName: memoData.fromName, subject: memoData.subject, urgency: memoData.urgency, body: memoData.body } }
                    : { action: editMemoRef ? 'updateMemo' : 'generateMemo', refNo: editMemoRef, forDept: memoData.forDept, fromName: memoData.fromName, subject: memoData.subject, urgency: memoData.urgency, body: memoData.body };
                
                const res = await sendPostRequest(payload);
                setIsSubmitting(false);
                if(res.status === 'success') {
                    memoRequestMode ? showAlert("Modification Request Sent", `Your edit request for Memo ${editMemoRef} has been sent to the Master Admin for review.\nReq ID: ${res.reqId}`, "success") 
                                    : showAlert(editMemoRef ? "Memo Updated" : "Memo Sent for Approval", editMemoRef ? `Memo ${editMemoRef} has been successfully updated in the database.` : `Your digital memo has been generated and routed to the Admin queue for final review.\n\nTracking Ref: ${res.refNo}`, "success");
                    setShowAddMemo(false); setEditMemoRef(null); setViewingMemo(null); setMemoRequestMode(false); setRequesterName(''); unlockScroll(); setMemoData({ forDept: '', fromName: '', subject: '', urgency: 'Normal', body: '' }); fetchDatabase(true); 
                } else showAlert("Submission Failed", "Failed to process memo in database.", "error"); 
            };

            const handleApproveMemo = async (refNo) => {
                setIsApprovingMemo(true);
                const res = await sendPostRequest({ action: 'approveMemo', refNo: refNo });
                setIsApprovingMemo(false);
                if (res.status === 'success') { showAlert("Memo Approved", `Memo ${refNo} has been successfully published to the live portal.`, "success"); setViewingMemo(null); fetchDatabase(true); } 
                else showAlert("Approval Failed", "Failed to approve memo.", "error"); 
            };

            const handleArchiveMemo = async (refNo) => {
                if(userRole === 'admin') {
                    if(!window.confirm(`Are you sure you want to Archive (Delete) memo ${refNo}? It will be hidden from the portal.`)) return;
                    setIsApprovingMemo(true);
                    const res = await sendPostRequest({ action: 'archiveMemo', refNo: refNo });
                    setIsApprovingMemo(false);
                    if (res.status === 'success') { showAlert("Memo Archived", `Memo ${refNo} has been removed from the portal.`, "success"); setViewingMemo(null); fetchDatabase(true); } 
                    else showAlert("Archive Failed", "Failed to archive memo.", "error"); 
                } else {
                    const reqName = window.prompt(`You are requesting to ARCHIVE memo ${refNo}.\n\nPlease enter your Name and Department for the Master Admin to review:`);
                    if (!reqName || !reqName.trim()) return;
                    setIsApprovingMemo(true);
                    const res = await sendPostRequest({ action: 'requestMemoAction', requestType: 'ARCHIVE', refNo: refNo, requestedBy: reqName.trim() });
                    setIsApprovingMemo(false);
                    if (res.status === 'success') { showAlert("Archive Request Sent", `Your request to archive Memo ${refNo} has been sent to the Master Admin.\nReq ID: ${res.reqId}`, "success"); setViewingMemo(null); fetchDatabase(true); } 
                    else showAlert("Request Failed", "Failed to send archive request.", "error"); 
                }
            };

            const handleResolveMemoRequest = async (reqId, actionVal) => {
                setIsResolving(reqId);
                const res = await sendPostRequest({ action: 'resolveMemoRequest', reqId: reqId, action: actionVal });
                setIsResolving(null);
                if (res.status === 'success') { showAlert("Request Processed", `The modification request has been ${actionVal === 'APPROVE' ? 'Approved & Applied' : 'Rejected'}.`, "success"); fetchDatabase(true); } 
                else showAlert("Error", res.message || "Failed to process request.", "error"); 
            };

            const handleSignatureSubmit = async (signatureBase64) => {
                if (!signatureBase64) return showAlert("Missing Signature", "Please physically draw your signature on the pad before confirming.", "error"); 
                if (!signData.name.trim() || !signData.dept.trim()) return showAlert("Missing Details", "Please enter your full name and department.", "error"); 
                setIsSubmitting(true);
                const res = await sendPostRequest({ action: 'submitSignature', refNo: viewingMemo['Ref No'] || viewingMemo[0], name: signData.name, dept: signData.dept, signature: signatureBase64 });
                setIsSubmitting(false);
                if (res.status === 'success') { showAlert("Acknowledgment Saved", `Thank you, ${signData.name}!\n\nYour digital signature has been saved to the receiving record.`, "success"); setSignModalOpen(false); setSignData({name: '', dept: ''}); fetchDatabase(true); } 
                else showAlert("Network Error", "Failed to save signature.", "error"); 
            };

            const handleAddNewsSubmit = async (e) => {
                e.preventDefault(); setIsSubmitting(true);
                const res = await sendPostRequest({ action: 'addNews', title: newsData.title, content: newsData.content, type: newsData.type, author: userRole });
                setIsSubmitting(false);
                if (res.status === 'success') { showAlert("News Published", "The announcement has been posted successfully.", "success"); setShowAddNews(false); unlockScroll(); setNewsData({ title: '', content: '', type: 'Standard' }); fetchDatabase(true); } 
                else showAlert("Error", "Failed to post news.", "error"); 
            };

            const handleEventSubmit = async (e) => {
                e.preventDefault(); setIsSubmitting(true);
                const res = await sendPostRequest({ action: 'addEvent', title: eventData.title, date: eventData.date, time: eventData.time });
                setIsSubmitting(false);
                if (res.status === 'success') { showAlert("Event Scheduled", "The event has been successfully added to the Master Calendar.", "success"); setShowAddEvent(false); unlockScroll(); setEventData({ title: '', date: '', time: '' }); fetchDatabase(true); } 
                else showAlert("Network Error", "Failed to add event.", "error"); 
            };

            const handleEditEventSubmit = async (e) => {
                e.preventDefault(); setIsSubmitting(true);
                const res = await sendPostRequest({ action: 'editEventTime', dateText: editEventData.oldDateText, title: editEventData.oldTitle, newTime: editEventData.newTime });
                setIsSubmitting(false);
                if (res.status === 'success') { showAlert("Time Updated", "The event time has been successfully updated.", "success"); setShowEditEvent(false); unlockScroll(); setEditEventData({ oldDateText: '', oldTitle: '', newTime: '' }); fetchDatabase(true); } 
                else showAlert("Update Failed", "Could not locate event.", "error"); 
            };

            const handleGlobalUnlock = async (e) => { 
                e.preventDefault(); setIsVerifyingLogin(true);
                const res = await sendPostRequest({ action: 'verifyPin', pin: globalPinInput });
                setIsVerifyingLogin(false);
                if (res.status === 'success') { setGlobalPinFeedback({ type: 'success', text: 'Verification Successful. Unlocking...' }); setTimeout(() => { setGlobalUnlocked(true); setGlobalPinFeedback(null); }, 1000); } 
                else { setGlobalPinFeedback({ type: 'error', text: 'Invalid Site PIN. Please check your credentials.' }); setGlobalPinInput(''); setTimeout(() => setGlobalPinFeedback(null), 3000); } 
            };

            const submitRoleLogin = async (e) => {
                e.preventDefault(); setIsVerifyingLogin(true);
                const res = await sendPostRequest({ action: 'verifyPin', pin: rolePinInput });
                setIsVerifyingLogin(false);
                if (res.status === 'success' && res.role !== 'portal_lock') { 
                    changeUserRole(res.role); setShowRoleLogin(false); unlockScroll(); setRolePinInput(''); setRoleLoginFeedback(null);
                    if (pendingAction === 'census' && (res.role === 'admin' || res.role === 'admitting')) { changeActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); } 
                    else if (pendingAction === 'admin' && res.role === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); } 
                    else if (pendingAction === 'add_event' && (res.role === 'admin' || res.role === 'dept_head')) { setShowAddEvent(true); } 
                    else if (pendingAction === 'add_news' && (res.role === 'admin' || res.role === 'dept_head')) { setShowAddNews(true); } 
                    else if (pendingAction === 'add_memo' && (res.role === 'admin' || res.role === 'dept_head')) { setShowAddMemo(true); }
                    setPendingAction(null);
                } else { setRoleLoginFeedback({ type: 'error', text: 'Invalid PIN or insufficient permissions.' }); setRolePinInput(''); setTimeout(() => setRoleLoginFeedback(null), 3000); }
            };

            const handleSecureAction = (actionType) => {
                setShowAddEvent(false); setShowAddNews(false); setShowAddMemo(false); setViewingMemo(null); setShowEditEvent(false);
                const requireRole = (roles, fallbackAction) => {
                    if (roles.includes(userRole)) {
                        if(fallbackAction === 'census') { changeActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); }
                        else if(fallbackAction === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); }
                        else if(fallbackAction === 'add_event') setShowAddEvent(true); 
                        else if(fallbackAction === 'add_news') setShowAddNews(true); 
                        else if(fallbackAction === 'add_memo') setShowAddMemo(true); 
                    } else { setPendingAction(fallbackAction); setShowRoleLogin(true); }
                };
                if (actionType === 'census') requireRole(['admin', 'admitting'], 'census');
                else if (actionType === 'admin') requireRole(['admin'], 'admin');
                else if (actionType === 'add_event') requireRole(['admin', 'dept_head'], 'add_event');
                else if (actionType === 'add_news') requireRole(['admin', 'dept_head'], 'add_news');
                else if (actionType === 'add_memo') requireRole(['admin', 'dept_head'], 'add_memo');
                else { changeActiveTab(actionType); setMobileMenuOpen(false); setSelectedDept(null); }
            };

            // --- MULTIPLE FILES LOGIC ---
            const handleDccUpload = async (e) => {
                e.preventDefault(); 
                const email = e.target.email.value; 
                const title = e.target.title.value; 
                const files = Array.from(fileInputRef.current.files);
                
                if (!email || !title || files.length === 0) return showAlert("Missing Fields", "Please fill in all requested fields and attach a file.", "error"); 
                
                for (let file of files) {
                    if (file.size > 35 * 1024 * 1024) return showAlert("File Too Large", `The file "${file.name}" exceeds the 35MB safe upload limit.\nPlease compress any images inside your document.`, "error"); 
                    if (file.type === "application/pdf") return showAlert("Invalid File Type", `PDFs are blocked for draft submissions (${file.name}). Please upload an editable format (.docx, .xlsx).`, "error"); 
                }

                setIsSubmitting(true);
                let successCount = 0;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const base64 = await new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.readAsDataURL(file);
                    });
                    
                    const fileTitle = files.length > 1 ? `${title} (Part ${i+1})` : title;
                    const res = await sendPostRequest({ action: "submitDCC", email: email, title: fileTitle, fileName: file.name, mimeType: file.type, fileBase64: base64 });
                    if (res.status === 'success') successCount++;
                }

                setIsSubmitting(false);
                if (successCount > 0) { 
                    showAlert("Submission Successful", `Successfully pushed ${successCount} document(s) to the CQI Queue.\n\nReceipts have been emailed to you.`, "success"); 
                    e.target.reset(); 
                    fetchDatabase(true); 
                }
            };

            const handleResolveDCC = async (e, targetTrackingId) => {
                e.preventDefault(); const file = e.target.stampedFile.files[0];
                if (!targetTrackingId || !file) return showAlert("Missing Details", "Please select a stamped file to upload.", "error"); 
                const reader = new FileReader();
                reader.onload = async () => {
                    setIsResolving(targetTrackingId); const base64 = reader.result.split(',')[1];
                    const res = await sendPostRequest({ action: "resolveDCC", trackingId: targetTrackingId, stampedFileName: file.name, mimeType: file.type, stampedFileBase64: base64 });
                    setIsResolving(null);
                    if (res.status === 'success') { showAlert("Resolution Complete", "The file was successfully saved to the Vault.\n\nThe Temp draft has been purged, and the department has been emailed their stamped copy.", "success"); e.target.reset(); fetchDatabase(true); } 
                    else showAlert("Resolution Failed", "Failed to resolve request. Check network connection.", "error"); 
                };
                reader.readAsDataURL(file);
            };

            const handleSaveCensus = async () => {
                setIsSubmitting(true);
                const res = await sendPostRequest({ action: 'updateCensus', updates: census.map(c => ({ department: c.Department || c[0], count: c['Patient Count'] || c[1] })) });
                setIsSubmitting(false);
                if (res.status === 'success') { showAlert("Census Updated", "The patient census has been successfully published to the main dashboard.", "success"); fetchDatabase(true); } 
                else showAlert("Update Failed", "Could not connect to the database to update the census.", "error"); 
            };

            const handleTrackRequest = async (e) => {
                e.preventDefault(); if (!trackQuery) return; setIsTracking(true);
                try {
                    const response = await fetch(`${API_URL}?action=trackRequest&query=${encodeURIComponent(trackQuery)}`, { redirect: "follow" }).catch(() => ({ ok: false }));
                    if (response && response.ok) { const result = await response.json(); setTrackResult(result.status === 'success' ? result.data : { error: result.message }); } 
                    else setTrackResult({ 'Tracking ID': trackQuery, 'Title': 'System Test Form', 'Status': 'PENDING REVIEW' }); 
                } catch(e) { setTrackResult({ error: "Network error tracking request." }); }
                setIsTracking(false);
            };

            if (isSyncing && !globalUnlocked && !localStorage.getItem('tdmh_cqi_portal_cache')) {

                            {globalPinFeedback && <div className={`mb-6 text-sm font-bold p-3 rounded-lg shadow-sm transition-all ${globalPinFeedback.type === 'success' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200'}`}>{globalPinFeedback.text}</div>}

                                <button type="submit" disabled={isVerifyingLogin} className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg transition-colors disabled:opacity-50">{isVerifyingLogin ? "Verifying..." : "Enter System"}</button>
                            </form>
                        </div>
                    </div>

            }

            const renderActiveTabContent = () => {
                if (activeTab === 'home') {
                    return (
                        <div className="animate-fade-in space-y-8">

                                    <p className="text-blue-100 font-medium max-w-xl leading-relaxed text-base">Your centralized administrative command center. Access standard forms, ISO document control, inter-departmental memos, and live hospital census tracking.</p>

                                        <Icons.Maximize className="w-5 h-5" /> View Fullscreen

                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="structured-card p-8 md:p-10 border-t-4 border-tdmh-green">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                                    <div>
                                        <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3>
                                        <p className="text-sm text-slate-500">Live patient tracking metrics across major medical departments.</p>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-200 px-5 py-3 rounded-xl text-left md:text-right shrink-0 shadow-sm w-full md:w-auto">
                                        <div className="text-xs font-black text-tdmh-green uppercase tracking-widest mb-0.5">{liveTime.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                                        <div className="text-xl font-black text-tdmh-blue tracking-tight">{liveTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
                                    {census.map((c, i) => {
                                        const count = parseInt(c['Patient Count'] || c.count || c[1] || 0);
                                        const colors = ['bg-blue-600', 'bg-emerald-600', 'bg-purple-600', 'bg-pink-600', 'bg-red-600'];
                                        const textColors = ['text-blue-600', 'text-emerald-600', 'text-purple-600', 'text-pink-600', 'text-red-600'];
                                        return (
                                            <div key={i} className="flex flex-col gap-4 group p-5 rounded-2xl hover:bg-slate-50 transition-colors border border-slate-200 shadow-sm bg-white">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-center shrink-0 ${textColors[i % textColors.length]}`}><Icons.Activity className="w-5 h-5"/></div>
                                                    <div className="text-sm font-black text-slate-700 uppercase tracking-wider leading-tight">{c.Department || c.dept || c[0]}</div>
                                                </div>
                                                <div className="flex-1 w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                                    <div className={`h-full ${colors[i % colors.length]} transition-all duration-1000 ease-out rounded-full`} style={{ width: `${Math.max(5, Math.min(100, (count / 50) * 100))}%` }}></div>
                                                </div>
                                                <div className="text-right font-black text-3xl text-slate-800">{count}</div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'census') {
                    return (
                        <div className="animate-fade-in structured-card p-8 md:p-12 border-t-4 border-t-tdmh-green">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                                <div>
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3>
                                    <p className="text-sm text-slate-500">Live patient tracking metrics across major medical departments. Update the counts below and click Save.</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 mb-10">
                                {census.map((c, i) => (
                                    <div key={i} className="bg-white p-6 rounded-2xl border-2 border-slate-100 text-center focus-within:border-tdmh-green transition-colors">
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-4">{c.Department || c[0]}</label>
                                        {(userRole === 'admin' || userRole === 'admitting') ? (
                                            <input type="number" value={c['Patient Count'] || c[1] || ''} onChange={(e) => { const newCensus = [...census]; newCensus[i] = {...newCensus[i], 'Patient Count': e.target.value}; setCensus(newCensus); }} className="w-full p-4 rounded-xl border border-slate-300 font-black text-4xl text-tdmh-blue text-center focus:border-tdmh-green focus:ring-1 outline-none transition-colors" />
                                        ) : <div className="w-full p-4 rounded-xl border border-slate-100 bg-slate-50 font-black text-4xl text-tdmh-blue text-center">{c['Patient Count'] || c[1] || '0'}</div>}
                                    </div>
                                ))}
                            </div>
                            {(userRole === 'admin' || userRole === 'admitting') && (
                                <div className="flex justify-end gap-4 border-t border-slate-200 pt-8">
                                    <button onClick={handleSaveCensus} disabled={isSubmitting} className="px-8 py-4 bg-tdmh-green text-white font-black uppercase rounded-xl hover:bg-green-700 shadow-lg disabled:opacity-50 transition-colors w-full sm:w-auto">
                                        {isSubmitting ? "Saving..." : "Save & Publish"}
                                    </button>
                                </div>
                            )}
                        </div>
                    );
                }

                if (activeTab === 'news') {
                    return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                                        <div className="p-2 bg-blue-50 text-tdmh-blue rounded-xl"><Icons.Bell className="w-6 h-6" /></div> News & Announcements
                                    </h2>
                                </div>
                                {(userRole === 'admin' || userRole === 'dept_head') && (
                                    <button onClick={() => setShowAddNews(true)} className="flex items-center justify-center gap-2 bg-tdmh-blue text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm shrink-0 hover:bg-blue-900 transition-colors">
                                        <Icons.Plus className="w-4 h-4" /> Add News
                                    </button>
                                )}
                            </div>
                            <div className="space-y-6 max-w-4xl mx-auto">
                                {newsList.length === 0 && <p className="text-slate-500 italic text-center py-8">No news posted yet.</p>}
                                {newsList.map((n, i) => (
                                    <div key={n.id || i} className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm relative group hover:shadow-md transition-shadow">
                                        {(userRole === 'admin' || userRole === 'dept_head') && (
                                            <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => showAlert("Edit Restricted", "Edit row feature is accessible via the Master Google Sheet.", "info")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-tdmh-blue" title="Edit"><Icons.Edit className="w-4 h-4" /></button>
                                                <button onClick={() => showAlert("Delete Restricted", "Delete row feature is accessible via the Master Google Sheet.", "info")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-red-600" title="Delete"><Icons.Trash className="w-4 h-4" /></button>
                                            </div>
                                        )}
                                        <span className={`text-[10px] font-bold tracking-[0.2em] uppercase block mb-2 ${n.Type === 'Urgent' ? 'text-red-500' : 'text-tdmh-blue'}`}>{n.Type || n[2]}</span>
                                        <h3 className="text-xl md:text-2xl font-black text-slate-800">{n.Title || n[3]}</h3>
                                        <span className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 mt-2 inline-block">{n.Date || n[1]}</span>
                                        <p className="text-slate-600 mt-4 leading-relaxed whitespace-pre-line">{n.Content || n[4]}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'memos') {
                    return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                                        <div className="p-2 bg-blue-50 text-tdmh-blue rounded-xl"><Icons.FileText className="w-6 h-6" /></div> Inter-Office Memos
                                    </h2>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                                    <div className="bg-blue-50 text-tdmh-blue text-xs font-bold px-4 py-2.5 rounded-lg border border-blue-100 flex items-center justify-center gap-2 shadow-sm shrink-0"><Icons.Activity className="w-4 h-4" /> {visibleMemos.length} Active Records</div>
                                    {(userRole === 'admin' || userRole === 'dept_head') && (

                                            <Icons.Plus className="w-4 h-4" /> New Memo
                                        </button>

                                </div>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                {visibleMemos.length === 0 ? (
                                    <div className="col-span-1 lg:col-span-2 text-center p-12 bg-slate-50 rounded-2xl border border-slate-200">
                                        <Icons.FileText className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                                        <p className="text-slate-500 italic">No published memos currently available in the database.</p>
                                    </div>
                                ) : visibleMemos.map((m, i) => {
                                    const sigCount = signatures.filter(s => (s['Memo Ref No'] || s[0]) === (m['Ref No'] || m[0])).length;
                                    const parsedDate = formatDateFriendly(m.Date || m[1]);
                                    return (
                                        <div key={i} className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row gap-5 relative group hover:shadow-md transition-shadow hover:border-tdmh-blue cursor-pointer" onClick={() => setViewingMemo(m)}>

                                                <div className="flex gap-2 items-center mb-1">
                                                    <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded border border-slate-200 uppercase tracking-widest">REF: {m['Ref No'] || m[0]}</span>
                                                    {(m.Urgency || m.urgency || m[7]) === 'High' && <span className="text-[10px] font-bold bg-red-50 text-red-600 px-2.5 py-1 rounded border border-red-200 uppercase tracking-widest">Urgent</span>}
                                                </div>

                                                            <Icons.Trash className="w-3 h-3"/> {userRole === 'admin' ? 'Archive' : 'Req Archive'}
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="flex flex-row sm:flex-col items-center sm:items-end justify-between sm:justify-center shrink-0 gap-2 mt-2 sm:mt-0 border-t sm:border-t-0 border-slate-100 pt-3 sm:pt-0">
                                                <div className="text-tdmh-blue font-bold text-xs bg-blue-50 px-4 py-2 rounded-lg flex items-center justify-center gap-2 border border-blue-100 shadow-sm hover:bg-blue-100 transition-colors"><Icons.Eye className="w-4 h-4" /> Read</div>

                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                }

                if (activeTab === 'dcc') {
                    const sortedUniversal = [...universalForms].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));

                    return (

                                <div className="bg-slate-900 p-5 rounded-xl text-white mb-2 shadow-md">
                                    <h3 className="font-bold tracking-widest text-xs uppercase mb-1">Document Control</h3>
                                </div>
                                <div className="flex flex-col gap-3">
                                    {['universal', 'iso requirements', 'request control no.'].map(cat => (
                                        <button key={cat} onClick={() => setDccActiveCategory(cat)} className={`w-full text-left px-5 py-4 rounded-xl font-black text-sm capitalize transition-all border ${dccActiveCategory === cat ? 'bg-tdmh-blue text-white border-transparent shadow-lg scale-[1.02]' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}>
                                            {cat === 'universal' ? 'Universal Forms' : cat}
                                        </button>
                                    ))}
                                </div>
