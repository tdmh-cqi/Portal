<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDMH CQI Portal V2</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] },
                    colors: { tdmh: { blue: '#1e3a8a', green: '#16a34a', dark: '#0f172a', surface: '#f4f7f9', border: '#e2e8f0' } },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards', 'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f4f7f9; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        body.modal-open { overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .structured-card { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 1.5rem; }
        .bg-pattern { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="text-slate-800 relative bg-pattern">
    <div id="root" class="relative z-10 flex flex-col min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 🚨 PASTE YOUR DEPLOYED WEB APP URL HERE 
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwnnGfhhzSwRVwzoq7JJG9ZzkLmTG7VnR69TM1vf_OHWUxvBfHspy6SpEqTUQguqlW3/exec";

        // --- ICON LIBRARY ---
        const Icons = {
            Search: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            X: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Shield: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>,
            Lock: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Users: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            FileText: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
            Home: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Calendar: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            Video: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="5" rx="2" ry="2"/><line x1="2" x2="22" y1="10" y2="10"/><line x1="8" x2="8" y1="5" y2="19"/><line x1="16" x2="16" y1="5" y2="19"/></svg>,
            Activity: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Bell: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
            Folder: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>,
            Box: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Menu: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            Upload: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Sync: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>,
            Edit: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Trash: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            ChevronLeft: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
            Maximize: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>,
            Stethoscope: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v6"/><path d="M9 21h6"/><circle cx="19" cy="19" r="2"/></svg>,
            Link: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        };

        // Department UI Colors Array (To give variety to the department grid icons)
        const DEPT_COLORS = [
            { bg: 'bg-blue-50', border: 'border-blue-100', text: 'text-blue-600', hover: 'group-hover:bg-blue-600 group-hover:text-white group-hover:border-blue-600' },
            { bg: 'bg-emerald-50', border: 'border-emerald-100', text: 'text-emerald-600', hover: 'group-hover:bg-emerald-600 group-hover:text-white group-hover:border-emerald-600' },
            { bg: 'bg-purple-50', border: 'border-purple-100', text: 'text-purple-600', hover: 'group-hover:bg-purple-600 group-hover:text-white group-hover:border-purple-600' },
            { bg: 'bg-pink-50', border: 'border-pink-100', text: 'text-pink-600', hover: 'group-hover:bg-pink-600 group-hover:text-white group-hover:border-pink-600' },
            { bg: 'bg-orange-50', border: 'border-orange-100', text: 'text-orange-600', hover: 'group-hover:bg-orange-600 group-hover:text-white group-hover:border-orange-600' }
        ];

        function App() {
            // --- DATA & SYNC STATES ---
            const [isSyncing, setIsSyncing] = useState(true);
            const [globalPinRequired, setGlobalPinRequired] = useState(false);
            
            // FULL FALLBACK MOCK DATA
            const [departments, setDepartments] = useState([{ id: "HR01", Name: "Human Resources", Category: "Admin", IconName: "Users" }, { id: "IT02", Name: "IT Operations", Category: "Support", IconName: "Activity" }]);
            const [tools, setTools] = useState([]); // Array to hold specific department tools
            
            const [universalForms, setUniversalForms] = useState([{ 'Form Title': "DERF (Digitalized)", Description: "Report defective equipment", Link: "#" }]);
            const [isoRequirements, setIsoRequirements] = useState([{ 'Form Title': "Reference Copy Request Form", Description: "Request an official copy.", Link: "#" }]);
            const [census, setCensus] = useState([{Department: 'Station 3', 'Patient Count': 12}, {Department: 'Station 4B', 'Patient Count': 28}, {Department: 'Station 5A', 'Patient Count': 15}, {Department: 'Station 5B', 'Patient Count': 9}, {Department: 'NICU', 'Patient Count': 4}]);
            const [memos, setMemos] = useState([{ id: 1, Date: '2026-03-01', From: 'CQI', For: 'All Depts', Subject: 'V2 Portal Launch', 'Ref No': 'CQI-03-2026-01', urgency: 'High' }]);
            const [newsList, setNewsList] = useState([{ id: 1, Date: 'Today', Type: 'System Update', Title: 'TDMH CQI Portal V2 is Live!', Content: 'Welcome to your upgraded administrative command center.'}]);
            const [calendar, setCalendar] = useState([{ DateText: 'Mar 15', time: '10:00 AM', Title: 'Department Heads Meeting', dayNum: 15 }]);
            const [slideshow, setSlideshow] = useState([{ 'Image URL': 'https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=2053&auto=format&fit=crop', 'Title': 'Welcome to TDMH CQI Portal V2', 'Subtitle': 'Continuous Quality Improvement', 'Active (Yes/No)': 'Yes' }]);
            const [agimat, setAgimat] = useState([
                { 'Module Number': 'Module 1', 'Video Title': 'How to make Clinical Abstract', 'Description': 'Step-by-step guide.', 'Video URL (Embed)': '' },
                { 'Module Number': 'Module 2', 'Video Title': 'How to make Discharge Summary', 'Description': 'Step-by-step guide.', 'Video URL (Embed)': '' }
            ]);
            const [monitors, setMonitors] = useState([]); 

            // Tracking States
            const [trackQuery, setTrackQuery] = useState('');
            const [trackResult, setTrackResult] = useState(null);
            const [isTracking, setIsTracking] = useState(false);

            // --- UI & AUTH STATES ---
            const [globalUnlocked, setGlobalUnlocked] = useState(false);
            const [globalPinInput, setGlobalPinInput] = useState('');
            const [globalPinFeedback, setGlobalPinFeedback] = useState(null); // Custom alert for Global PIN

            const [userRole, setUserRole] = useState('guest');
            const [showRoleLogin, setShowRoleLogin] = useState(false);
            const [rolePinInput, setRolePinInput] = useState('');
            const [roleLoginFeedback, setRoleLoginFeedback] = useState(null); // Custom alert for Role PIN
            const [pendingAction, setPendingAction] = useState(null); // Remembers what user clicked before logging in
            
            const [activeTab, setActiveTab] = useState('home');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [dccActiveCategory, setDccActiveCategory] = useState('universal');
            
            const [selectedDept, setSelectedDept] = useState(null); // Controls Department Sub-view
            
            // --- SLIDESHOW STATES ---
            const [currentSlide, setCurrentSlide] = useState(0);
            const [lightboxImg, setLightboxImg] = useState(null); 
            
            // --- MODAL STATES ---
            const [showNewsFlyer, setShowNewsFlyer] = useState(true);
            const [showAdminConsole, setShowAdminConsole] = useState(false);
            const [showAddMemo, setShowAddMemo] = useState(false);
            const [showAddEvent, setShowAddEvent] = useState(false);
            const [showAddNews, setShowAddNews] = useState(false);
            
            const fileInputRef = useRef(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const tabsContainerRef = useRef(null);
            const resolveFileRef = useRef(null);
            const [resolveId, setResolveId] = useState('');
            const [isResolving, setIsResolving] = useState(false);

            const TABS = [
                { id: 'home', label: 'Dashboard', icon: 'Home' },
                { id: 'news', label: 'News', icon: 'Bell' },
                { id: 'memos', label: 'Memos', icon: 'FileText' },
                { id: 'dcc', label: 'DCC & Forms', icon: 'Folder' },
                { id: 'track', label: 'Track Request', icon: 'Search' },
                { id: 'departments', label: 'Departments', icon: 'Box' },
                { id: 'calendar', label: 'Calendar', icon: 'Calendar' },
                { id: 'agimat', label: 'Agimat Process', icon: 'Video' },
                { id: 'census', label: 'Census Entry', icon: 'Activity' }
            ];

            useEffect(() => {
                if (mobileMenuOpen || showNewsFlyer || showRoleLogin || showAdminConsole || showAddMemo || showAddEvent || showAddNews || lightboxImg) document.body.classList.add('modal-open');
                else document.body.classList.remove('modal-open');
            }, [mobileMenuOpen, showNewsFlyer, showRoleLogin, showAdminConsole, showAddMemo, showAddEvent, showAddNews, lightboxImg]);

            useEffect(() => {
                if (slideshow.length <= 1 || lightboxImg) return;
                const timer = setInterval(() => { setCurrentSlide((prev) => (prev + 1) % slideshow.length); }, 5000);
                return () => clearInterval(timer);
            }, [slideshow.length, lightboxImg]);

            // --- TAB SCROLL FUNCTIONS ---
            useEffect(() => {
                const container = tabsContainerRef.current;
                if (!container) return;
                const handleWheel = (e) => { e.preventDefault(); container.scrollLeft += e.deltaY; };
                container.addEventListener('wheel', handleWheel, { passive: false });
                return () => container.removeEventListener('wheel', handleWheel);
            }, []);
            const scrollTabs = (direction) => {
                if (tabsContainerRef.current) tabsContainerRef.current.scrollBy({ left: direction === 'left' ? -250 : 250, behavior: 'smooth' });
            };

            // --- API ENGINE ---
            const fetchDatabase = async () => {
                setIsSyncing(true);
                try {
                    const response = await fetch(API_URL + "?action=sync", { redirect: "follow" }).catch(err => { return { ok: false }; });
                    if (response && response.ok) {
                        const result = await response.json();
                        if(result.status === 'success') {
                            setGlobalPinRequired(result.data.globalPinRequired === true);
                            if (!result.data.globalPinRequired) setGlobalUnlocked(true);
                            
                            if (result.data.census) setCensus(result.data.census || []);
                            if (result.data.news) setNewsList(result.data.news || []);
                            if (result.data.memos) setMemos(result.data.memos || []);
                            if (result.data.departments) setDepartments(result.data.departments || []);
                            if (result.data.tools) setTools(result.data.tools || []); // Fetching Department Tools
                            if (result.data.calendar) setCalendar(result.data.calendar || []);
                            if (result.data.universalForms) setUniversalForms(result.data.universalForms || []);
                            if (result.data.isoRequirements) setIsoRequirements(result.data.isoRequirements || []);
                            if (result.data.agimat) setAgimat(result.data.agimat || []);
                            if (result.data.monitoring) setMonitors(result.data.monitoring || []);
                            if (result.data.slideshow) setSlideshow((result.data.slideshow || []).filter(s => String(s['Active (Yes/No)']).toUpperCase() === 'YES'));
                        }
                    } else { setGlobalUnlocked(true); }
                } catch (error) { setGlobalUnlocked(true); }
                setIsSyncing(false);
            };

            useEffect(() => { fetchDatabase(); }, []);

            const sendPostRequest = async (payload) => {
                if (API_URL === "PASTE_YOUR_WEB_APP_URL_HERE") { alert("System Offline Mode: Connect your URL to save data."); return {status: 'success', trackingId: 'CQI-TEST-000'}; }
                try {
                    const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" }).catch(err => { return { ok: false }; });
                    if (response && response.ok) return await response.json();
                    return {status: 'success', trackingId: 'CQI-TEST-000'};
                } catch (e) { return {status: 'error'}; }
            };

            // --- SECURITY HANDLERS ---
            
            // Fixed Global PIN UI Feedback
            const handleGlobalUnlock = (e) => { 
                e.preventDefault(); 
                if (globalPinInput === 'Wherecaringcomesfirst') { 
                    setGlobalPinFeedback({ type: 'success', text: 'Verification Successful. Unlocking...' });
                    setTimeout(() => {
                        setGlobalUnlocked(true); 
                        setGlobalPinFeedback(null);
                    }, 1000);
                } else { 
                    setGlobalPinFeedback({ type: 'error', text: 'Invalid Site PIN. Please check your credentials.' });
                    setGlobalPinInput('');
                    setTimeout(() => setGlobalPinFeedback(null), 3000);
                } 
            };

            // Fixed Role PIN UI Feedback & Action Resumption
            const submitRoleLogin = (e) => {
                e.preventDefault();
                let newRole = 'guest';
                if (rolePinInput === 'TDMHCQI2025') newRole = 'admin';
                else if (rolePinInput === 'TDMH-HEADS') newRole = 'dept_head';
                else if (rolePinInput === 'TDMH-CENSUS-ADMITTING') newRole = 'admitting';
                
                if (newRole !== 'guest') { 
                    setRoleLoginFeedback({ type: 'success', text: 'Access Granted! Unlocking module...' });
                    setTimeout(() => {
                        setUserRole(newRole); 
                        setShowRoleLogin(false); 
                        setRolePinInput(''); 
                        setRoleLoginFeedback(null);
                        
                        // Automatically open the tab/modal the user originally clicked before the PIN prompt!
                        if (pendingAction === 'census' && (newRole === 'admin' || newRole === 'admitting')) { setActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); }
                        else if (pendingAction === 'admin' && newRole === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); }
                        else if (pendingAction === 'memo_gen' && (newRole === 'admin' || newRole === 'dept_head')) { setShowAddMemo(true); setMobileMenuOpen(false); }
                        else if (pendingAction === 'add_event' && (newRole === 'admin' || newRole === 'dept_head')) { setShowAddEvent(true); }
                        else if (pendingAction === 'add_news' && (newRole === 'admin' || newRole === 'dept_head')) { setShowAddNews(true); }
                        setPendingAction(null);
                    }, 1000);
                } else { 
                    setRoleLoginFeedback({ type: 'error', text: 'Invalid PIN. Please check your credentials.' });
                    setRolePinInput('');
                    setTimeout(() => setRoleLoginFeedback(null), 3000);
                }
            };

            const handleSecureAction = (actionType) => {
                if (actionType === 'census') {
                    if (userRole === 'admin' || userRole === 'admitting') { setActiveTab('census'); setMobileMenuOpen(false); setSelectedDept(null); }
                    else { setPendingAction('census'); setShowRoleLogin(true); }
                } else if (actionType === 'admin') {
                    if (userRole === 'admin') { setShowAdminConsole(true); setMobileMenuOpen(false); }
                    else { setPendingAction('admin'); setShowRoleLogin(true); }
                } else if (actionType === 'memo_gen') {
                    if (userRole === 'admin' || userRole === 'dept_head') { setShowAddMemo(true); setMobileMenuOpen(false); }
                    else { setPendingAction('memo_gen'); setShowRoleLogin(true); }
                } else if (actionType === 'add_event') {
                    if (userRole === 'admin' || userRole === 'dept_head') { setShowAddEvent(true); }
                    else { setPendingAction('add_event'); setShowRoleLogin(true); }
                } else if (actionType === 'add_news') {
                    if (userRole === 'admin' || userRole === 'dept_head') { setShowAddNews(true); }
                    else { setPendingAction('add_news'); setShowRoleLogin(true); }
                } else { 
                    setActiveTab(actionType); setMobileMenuOpen(false); setSelectedDept(null); 
                }
            };

            const handleDccUpload = async (e) => {
                e.preventDefault();
                const email = e.target.email.value; const title = e.target.title.value; const file = fileInputRef.current.files[0];
                if (!email || !title || !file) return alert("Please fill all fields.");
                if (file.type === "application/pdf") return alert("NO PDFs. Upload editable .docx or .xlsx");
                const reader = new FileReader();
                reader.onload = async () => {
                    setIsSubmitting(true);
                    const base64 = reader.result.split(',')[1];
                    const res = await sendPostRequest({ action: "submitDCC", email, title, fileName: file.name, mimeType: file.type, fileBase64: base64 });
                    setIsSubmitting(false);
                    if(res.status === 'success') { alert(`Success! File sent to Temp Folder.\nTracking ID: ${res.trackingId}\nA receipt has been emailed to you.`); e.target.reset(); }
                };
                reader.readAsDataURL(file);
            };

            const handleResolveDCC = async (e) => {
                e.preventDefault();
                const file = resolveFileRef.current.files[0];
                if(!resolveId || !file) return alert("Please enter Tracking ID and attach file.");
                const reader = new FileReader();
                reader.onload = async () => {
                    setIsResolving(true);
                    const base64 = reader.result.split(',')[1];
                    const res = await sendPostRequest({ action: "resolveDCC", trackingId: resolveId, stampedFileName: file.name, mimeType: file.type, stampedFileBase64: base64 });
                    setIsResolving(false);
                    if(res.status === 'success') { alert(`Success! File saved to Vault.\nTemp file deleted.\nDepartment emailed.`); e.target.reset(); setResolveId(''); } else { alert("Failed to resolve. Ensure ID is correct."); }
                };
                reader.readAsDataURL(file);
            };

            const handleSaveCensus = async () => {
                setIsSubmitting(true);
                const res = await sendPostRequest({ action: 'updateCensus', updates: census.map(c => ({ department: c.Department || c[0], count: c['Patient Count'] || c[1] })) });
                setIsSubmitting(false);
                if(res.status === 'success') { alert("Census successfully published!"); fetchDatabase(); }
            };

            const handleTrackRequest = async (e) => {
                e.preventDefault();
                if(!trackQuery) return;
                setIsTracking(true);
                try {
                    const response = await fetch(`${API_URL}?action=trackRequest&query=${encodeURIComponent(trackQuery)}`, { redirect: "follow" }).catch(err => {return {ok: false}});
                    if (response && response.ok) {
                        const result = await response.json();
                        if(result.status === 'success') { setTrackResult(result.data); } else { setTrackResult({ error: result.message }); }
                    } else { setTrackResult({ 'Tracking ID': trackQuery, 'Title': 'System Test Form', 'Status': 'PENDING REVIEW' }); }
                } catch(e) { setTrackResult({ error: "Network error tracking request." }); }
                setIsTracking(false);
            };

            if (isSyncing && !globalUnlocked) return (<div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-white flex-col"><Icons.Sync className="w-12 h-12 animate-spin mb-4 text-tdmh-green" /><p className="font-bold tracking-widest uppercase text-sm">Connecting to Database...</p></div>);

            if (globalPinRequired && !globalUnlocked) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                        <div className="bg-white p-10 rounded-[2rem] shadow-2xl max-w-md w-full text-center relative z-10 border border-slate-200 animate-slide-up">
                            <div className="w-20 h-20 bg-blue-50 text-tdmh-blue rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border border-blue-100"><Icons.Lock className="w-10 h-10" /></div>
                            <h1 className="text-3xl font-black text-slate-800 mb-2 tracking-tight">TDMH CQI Portal</h1>
                            <p className="text-slate-500 font-medium mb-6 text-sm">Restricted Intranet. Enter global access key.</p>
                            
                            {/* CUSTOM GLOBAL PIN ERROR/SUCCESS MESSAGE */}
                            {globalPinFeedback && (
                                <div className={`mb-6 text-sm font-bold p-3 rounded-lg shadow-sm transition-all ${globalPinFeedback.type === 'success' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-red-50 text-red-600 border border-red-200'}`}>
                                    {globalPinFeedback.text}
                                </div>
                            )}

                            <form onSubmit={handleGlobalUnlock}>
                                <input type="password" value={globalPinInput} onChange={(e) => setGlobalPinInput(e.target.value)} className="w-full px-6 py-4 border-2 border-slate-200 rounded-xl focus:border-tdmh-blue mb-4 text-center text-xl tracking-widest font-bold outline-none transition-colors" placeholder="••••••••••••" autoFocus />
                                <button type="submit" className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-black uppercase tracking-widest text-sm py-4 rounded-xl shadow-lg transition-colors">Enter System</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const renderActiveTabContent = () => {
                switch(activeTab) {
                    case 'home': return (
                        <div className="animate-fade-in space-y-8">
                            <div className="structured-card p-0 overflow-hidden flex flex-col md:flex-row bg-tdmh-blue border-tdmh-blue">
                                <div className="p-8 md:p-12 lg:p-16 flex-1 flex flex-col justify-center relative z-10">
                                    <span className="px-3 py-1 bg-tdmh-green text-white border border-green-600 text-[10px] font-bold tracking-[0.2em] uppercase mb-5 inline-block w-max rounded shadow-sm">CQI Central Hub</span>
                                    <h2 className="text-3xl md:text-5xl font-black mb-4 tracking-tight text-white">Welcome to TDMH CQI Portal V2</h2>
                                    <p className="text-blue-100 font-medium max-w-xl leading-relaxed text-base">Your centralized administrative command center. Access standard forms, ISO document control, inter-departmental memos, and live hospital census tracking.</p>
                                </div>
                            </div>
                            
                            {slideshow.length > 0 && (
                                <div className="structured-card p-0 overflow-hidden relative h-80 md:h-[600px] flex items-center justify-center bg-slate-900 group shadow-lg cursor-pointer hover:shadow-xl transition-shadow border-2 border-slate-100">
                                    
                                    <div className="absolute top-4 right-4 z-30 bg-black/70 backdrop-blur text-white px-5 py-2.5 rounded-full text-sm font-bold flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity" onClick={() => setLightboxImg(slideshow[currentSlide]['Image URL'])}>
                                        <Icons.Maximize className="w-5 h-5" /> View Fullscreen
                                    </div>

                                    {slideshow.map((slide, index) => (
                                        <div 
                                            key={index} 
                                            className={`absolute inset-0 transition-opacity duration-1000 ${index === currentSlide ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}
                                            onClick={() => setLightboxImg(slide['Image URL'])}
                                        >
                                            <div className="absolute inset-0 bg-slate-900 overflow-hidden pointer-events-none">
                                                <img src={slide['Image URL']} className="absolute inset-0 w-full h-full object-cover opacity-30 blur-2xl scale-110" alt="bg" />
                                            </div>
                                            
                                            <img src={slide['Image URL']} className="absolute inset-0 w-full h-full object-contain drop-shadow-2xl" alt={slide['Title']} />
                                            
                                            <div className="absolute inset-x-0 bottom-0 pt-32 pb-8 px-8 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent flex flex-col items-center justify-end text-center text-white pointer-events-none">
                                                <h3 className="text-3xl md:text-5xl font-black mb-2 drop-shadow-xl">{slide['Title']}</h3>
                                                <p className="font-bold tracking-widest uppercase text-sm md:text-base text-blue-200 drop-shadow-md">{slide['Subtitle']}</p>
                                            </div>
                                        </div>
                                    ))}
                                    
                                    <div className="absolute bottom-4 left-0 right-0 z-20 flex justify-center gap-2" onClick={e => e.stopPropagation()}>
                                        {slideshow.map((_, index) => (
                                            <button key={index} onClick={(e) => { e.stopPropagation(); setCurrentSlide(index); }} className={`h-2.5 rounded-full transition-all duration-300 shadow-sm ${index === currentSlide ? 'bg-tdmh-green w-8' : 'bg-white/70 w-2.5 hover:bg-white'}`}></button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="structured-card p-8 md:p-10 border-t-4 border-tdmh-green">
                                <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight mb-2">Hospital Daily Census</h3>
                                <p className="text-sm text-slate-500 mb-8">Live patient tracking metrics across major medical departments. This data is updated securely by the Admitting Department.</p>
                                
                                <div className="space-y-4 mt-6">
                                    {census.map((c, i) => {
                                        const count = parseInt(c['Patient Count'] || c.count || c[1] || 0);
                                        const label = c.Department || c.dept || c[0];
                                        
                                        const colors = ['bg-blue-600', 'bg-emerald-600', 'bg-purple-600', 'bg-pink-600', 'bg-red-600'];
                                        const textColors = ['text-blue-600', 'text-emerald-600', 'text-purple-600', 'text-pink-600', 'text-red-600'];
                                        const barColor = colors[i % colors.length];
                                        const iconColor = textColors[i % textColors.length];
                                        
                                        return (
                                            <div key={i} className="flex flex-col sm:flex-row sm:items-center gap-4 group p-4 rounded-xl hover:bg-slate-50 transition-colors border border-slate-100 hover:border-slate-200 shadow-sm bg-white">
                                                <div className="flex items-center gap-4 w-full sm:w-auto">
                                                    <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-center shrink-0 ${iconColor}`}>
                                                        <Icons.Activity className="w-5 h-5 sm:w-6 sm:h-6"/>
                                                    </div>
                                                    <div className="w-28 sm:w-40 text-xs sm:text-sm font-bold text-slate-700 truncate uppercase tracking-wider">{label}</div>
                                                </div>
                                                
                                                <div className="flex-1 w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                                                    <div className={`h-full ${barColor} transition-all duration-1000 ease-out rounded-full`} style={{ width: `${Math.max(5, Math.min((count / 50) * 100, 100))}%` }}></div>
                                                </div>
                                                <div className="w-full sm:w-16 text-right font-black text-2xl text-slate-800">{count}</div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    );
                    case 'news': return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><div className="p-2 bg-blue-50 text-tdmh-blue rounded-xl"><Icons.Bell className="w-6 h-6" /></div>News & Announcements</h2>
                                    <p className="text-slate-500 font-medium mt-1">Stay updated with the latest portal changes and hospital notices.</p>
                                </div>
                                {(userRole === 'admin' || userRole === 'dept_head') && (<button onClick={() => handleSecureAction('add_news')} className="flex items-center justify-center gap-2 bg-tdmh-blue text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm shrink-0 hover:bg-blue-900 transition-colors"><Icons.Plus className="w-4 h-4" /> Add News</button>)}
                            </div>
                            <div className="space-y-6 max-w-4xl mx-auto">
                                {newsList.length === 0 && <p className="text-slate-500 italic">No news posted yet.</p>}
                                {newsList.map((n, i) => {
                                    const isWelcomePost = (n.id === 1) || String(n.Title || n.title || '').includes('V2 is Live');
                                    return (
                                        <div key={n.id || i} className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm relative group hover:shadow-md transition-shadow">
                                            {(userRole === 'admin' || userRole === 'dept_head') && (
                                                <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={()=>alert("Edit row feature accessible via Google Sheet.")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-tdmh-blue" title="Edit"><Icons.Edit className="w-4 h-4" /></button>
                                                    <button onClick={()=>alert("Delete row feature accessible via Google Sheet.")} className="p-2 bg-slate-100 text-slate-600 rounded hover:text-red-600" title="Delete"><Icons.Trash className="w-4 h-4" /></button>
                                                </div>
                                            )}
                                            <span className={`text-[10px] font-bold tracking-[0.2em] uppercase block mb-2 ${n.Type === 'Urgent' ? 'text-red-500' : 'text-tdmh-blue'}`}>{n.Type || n[2]}</span>
                                            <h3 className="text-xl md:text-2xl font-black text-slate-800">{n.Title || n[3]}</h3>
                                            <span className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 mt-2 inline-block">{n.Date || n[1]}</span>
                                            <p className="text-slate-600 mt-4 leading-relaxed whitespace-pre-line">{n.Content || n[4]}</p>

                                            {isWelcomePost && (
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 pt-6 border-t border-slate-100">
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Menu className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Top Navigation</strong> <span className="text-slate-500 text-xs">Tools are safely tucked in tabs at the top. Hover over tabs and use your mouse wheel to scroll horizontally.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Box className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Departments</strong> <span className="text-slate-500 text-xs">Clicking a department is open to everyone. Logging in is only required if you are uploading restricted tools.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.Folder className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">DCC & Forms</strong> <span className="text-slate-500 text-xs">Consolidated area to find Universal Forms, ISO Requirements, or request new Control Numbers.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                        <div className="text-tdmh-blue mt-0.5"><Icons.FileText className="w-5 h-5"/></div>
                                                        <div><strong className="text-slate-800 block text-sm mb-0.5">Memos & Calendar</strong> <span className="text-slate-500 text-xs">Viewing is open to all staff. Authorized Dept Heads and Admins must log in to generate new Memos or Events.</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                                        <div className="text-tdmh-green mt-0.5"><Icons.Activity className="w-5 h-5"/></div>
                                                        <div><strong className="text-emerald-900 block text-sm mb-0.5">Daily Census</strong> <span className="text-emerald-700 text-xs">Live patient tracking metrics. (Updated securely by the Admitting Department via the locked Census tab).</span></div>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-red-50 p-4 rounded-xl border border-red-100">
                                                        <div className="text-red-500 mt-0.5"><Icons.Shield className="w-5 h-5"/></div>
                                                        <div><strong className="text-red-900 block text-sm mb-0.5">Editing Content</strong> <span className="text-red-700 text-xs">Generating memos/events is done via the portal. Editing historical data requires accessing the Master Google Sheet directly.</span></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    );
                    case 'memos': return (
                        <div className="animate-fade-in structured-card overflow-hidden">
                            <div className="p-6 md:p-8 border-b border-slate-200 bg-slate-50/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><Icons.FileText className="w-6 h-6 text-tdmh-blue" /> Inter-Office Memos</h3>
                                    <p className="text-sm text-slate-500 mt-2 max-w-2xl leading-relaxed"><strong>Notice:</strong> Viewing this repository is open to all staff. Authorized Department Heads and Admins must log in to generate new memos via the portal. To edit historical data, please access the Master Google Sheet.</p>
                                </div>
                                {(userRole === 'admin' || userRole === 'dept_head') && (<button onClick={() => handleSecureAction('memo_gen')} className="flex items-center gap-2 bg-tdmh-blue text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-900 transition-colors shrink-0"><Icons.Plus className="w-4 h-4" /> Generate Memo</button>)}
                            </div>
                            <div className="p-6 space-y-4">
                                {memos.length === 0 ? <p className="text-slate-500 italic">No memos found.</p> : memos.map((m, i) => (
                                    <div key={i} className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex gap-6 items-start relative group hover:shadow-md transition-shadow">
                                        {(userRole === 'admin' || userRole === 'dept_head') && (
                                            <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button className="p-2 bg-slate-100 text-slate-600 rounded hover:text-tdmh-blue"><Icons.Edit className="w-4 h-4" /></button>
                                                <button className="p-2 bg-slate-100 text-slate-600 rounded hover:text-red-600"><Icons.Trash className="w-4 h-4" /></button>
                                            </div>
                                        )}
                                        <div className="bg-blue-50 text-tdmh-blue p-4 rounded-xl flex flex-col items-center justify-center min-w-[90px] border border-blue-100">
                                            <span className="text-xs font-bold uppercase tracking-widest">{String(m.Date || m[1]).split(' ')[0] || 'N/A'}</span>
                                            <span className="text-3xl font-black">{String(m.Date || m[1]).split(' ')[1]?.replace(',','') || '--'}</span>
                                        </div>
                                        <div className="flex-1 pr-12">
                                            <div className="flex gap-2 items-center mb-1">
                                                <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded border border-slate-200 uppercase tracking-widest">REF: {m['Ref No'] || m[0]}</span>
                                                {m.urgency === 'High' && <span className="text-[10px] font-bold bg-red-50 text-red-600 px-2.5 py-1 rounded border border-red-200 uppercase tracking-widest">Urgent</span>}
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800 mt-2 leading-tight">{m.Subject || m[4]}</h3>
                                            <p className="text-slate-500 text-sm mt-1">From: {m.From || m[3]} &bull; For: {m.For || m[2]}</p>
                                            <button className="mt-4 text-tdmh-blue font-bold text-sm bg-blue-50 px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-blue-100 transition-colors"><Icons.FileText className="w-4 h-4" /> View Document</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                    case 'dcc': 
                        const dccCategories = [
                            { id: 'universal', label: 'Universal Forms', note: 'Access standardized, hospital-wide documents applicable to all departments (e.g., Incident Reports, DERF, CSR Requisitions).' },
                            { id: 'iso requirements', label: 'ISO Requirements', note: 'Retrieve official Document Control Center (DCC) and ISO compliance documentation.' },
                            { id: 'request control no.', label: 'Request Control No.', note: 'Submit a formal request to the DCC to assign an official ISO Control Number to a newly drafted department document.' }
                        ];
                        const activeNote = dccCategories.find(c => c.id === dccActiveCategory)?.note;

                        const sortedUniversal = [...universalForms].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));
                        const sortedISO = [...isoRequirements].sort((a, b) => String(a['Form Title'] || a[0] || '').localeCompare(String(b['Form Title'] || b[0] || '')));

                        return (
                        <div className="animate-fade-in flex flex-col xl:flex-row gap-6">
                            <div className="w-full xl:w-72 shrink-0 flex flex-col gap-3">
                                <div className="bg-slate-900 p-5 rounded-xl text-white mb-2 shadow-md">
                                    <h3 className="font-bold tracking-widest text-xs uppercase mb-1">Document Control</h3>
                                    <p className="text-[10px] text-slate-400 uppercase tracking-wider">Official Repository Center</p>
                                </div>
                                <div className="flex flex-col gap-3">
                                    {dccCategories.map(cat => (
                                        <button key={cat.id} onClick={() => setDccActiveCategory(cat.id)} className={`w-full text-left px-5 py-4 rounded-xl font-black text-sm transition-all border ${dccActiveCategory === cat.id ? 'bg-tdmh-blue text-white border-transparent shadow-lg scale-[1.02]' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}>{cat.label}</button>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="flex-1 structured-card p-6 md:p-10 min-h-[500px]">
                                <div className="border-b border-slate-200 pb-6 mb-6">
                                    <h3 className="text-2xl font-black text-slate-800 capitalize mb-3 tracking-tight">{dccActiveCategory === 'iso requirements' ? 'ISO Requirements' : `${dccActiveCategory}`}</h3>
                                    <div className="bg-slate-50 border-l-4 border-slate-300 p-3 text-sm text-slate-600 font-medium">{activeNote}</div>
                                </div>

                                {dccActiveCategory === 'request control no.' && (
                                    <div className="text-center py-4">
                                        <div className="w-20 h-20 bg-emerald-50 text-tdmh-green rounded-2xl flex items-center justify-center mx-auto mb-6 border border-emerald-100"><Icons.Upload className="w-10 h-10" /></div>
                                        <h2 className="text-3xl font-black text-slate-800 mb-3 tracking-tight">Request Control Number</h2>
                                        <p className="text-slate-500 mb-8 max-w-lg mx-auto leading-relaxed">Upload drafted forms here. CQI will assign an official ISO Control Number, store it in the Vault, and email the finalized document back to you.</p>
                                        <form onSubmit={handleDccUpload} className="text-left bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-xl mx-auto">
                                            <div className="mb-5"><label className="block text-xs font-bold text-slate-500 uppercase mb-2">Official Dept Email <span className="text-red-500">*</span></label><input name="email" type="email" required className="w-full p-3 border rounded-xl focus:border-tdmh-green outline-none" placeholder="dept@tdmh.com" /></div>
                                            <div className="mb-5"><label className="block text-xs font-bold text-slate-500 uppercase mb-2">Form Title <span className="text-red-500">*</span></label><input name="title" type="text" required className="w-full p-3 border rounded-xl focus:border-tdmh-green outline-none" placeholder="e.g. Daily Temperature Log" /></div>
                                            <div className="mb-8"><label className="block text-xs font-bold text-slate-500 uppercase mb-2">Upload Draft <span className="text-red-500">*</span></label><input ref={fileInputRef} type="file" accept=".docx,.xlsx" required className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:bg-tdmh-green file:text-white hover:file:bg-green-700 transition-colors cursor-pointer" /><p className="text-[10px] text-red-500 font-bold uppercase mt-2 bg-red-50 inline-block px-2 py-1 rounded">NO PDF FILES ALLOWED</p></div>
                                            <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-green text-white font-black tracking-wider uppercase py-4 rounded-xl shadow-lg hover:bg-green-700 transition-colors">{isSubmitting ? "Uploading..." : "Submit to CQI Queue"}</button>
                                        </form>
                                    </div>
                                )}

                                {dccActiveCategory === 'universal' && (
                                    <div className="grid grid-cols-1 gap-4">
                                        {sortedUniversal.length === 0 && <p className="text-slate-500 italic">No forms mapped yet.</p>}
                                        {sortedUniversal.map((t, i) => (
                                            <a key={i} href={t.Link || t[2]} target="_blank" className="flex items-center gap-4 p-4 rounded-xl border border-slate-200 hover:border-tdmh-blue hover:bg-blue-50/30 transition-colors bg-white group shadow-sm">
                                                <div className="w-10 h-10 bg-slate-100 text-slate-500 group-hover:text-tdmh-blue rounded-lg flex items-center justify-center shrink-0"><Icons.FileText className="w-5 h-5" /></div>
                                                <div><h4 className="font-bold text-slate-800 text-sm group-hover:text-tdmh-blue leading-tight">{t['Form Title'] || t[0]}</h4><p className="text-xs text-slate-500 mt-1">{t.Description || t[1]}</p></div>
                                            </a>
                                        ))}
                                    </div>
                                )}

                                {dccActiveCategory === 'iso requirements' && (
                                    <div className="grid grid-cols-1 gap-4">
                                        {sortedISO.length === 0 && <p className="text-slate-500 italic">No forms mapped yet.</p>}
                                        {sortedISO.map((t, i) => (
                                            <a key={i} href={t.Link || t[2]} target="_blank" className="flex items-center gap-4 p-4 rounded-xl border border-slate-200 hover:border-tdmh-blue hover:bg-blue-50/30 transition-colors bg-white group shadow-sm">
                                                <div className="w-10 h-10 bg-slate-100 text-slate-500 group-hover:text-tdmh-blue rounded-lg flex items-center justify-center shrink-0"><Icons.FileText className="w-5 h-5" /></div>
                                                <div><h4 className="font-bold text-slate-800 text-sm group-hover:text-tdmh-blue leading-tight">{t['Form Title'] || t[0]}</h4><p className="text-xs text-slate-500 mt-1">{t.Description || t[1]}</p></div>
                                            </a>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                    case 'track': return (
                        <div className="animate-fade-in structured-card p-8 md:p-12 max-w-3xl mx-auto">
                            <div className="text-center mb-10">
                                <div className="w-16 h-16 bg-blue-50 text-tdmh-blue rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100"><Icons.Search className="w-8 h-8" /></div>
                                <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-2">Track Request Status</h2>
                                <p className="text-slate-500">Enter your Reference ID or Dept Email to check the live status of your Form or Memo.</p>
                            </div>
                            <form onSubmit={handleTrackRequest} className="flex gap-3 mb-10">
                                <input type="text" value={trackQuery} onChange={(e)=>setTrackQuery(e.target.value)} className="flex-1 p-4 border-2 rounded-xl focus:border-tdmh-blue outline-none text-lg font-medium" placeholder="e.g. CQI-1029 or dept@tdmh.com" />
                                <button type="submit" disabled={isTracking} className="bg-tdmh-blue text-white px-8 font-black uppercase tracking-widest rounded-xl shadow-lg hover:bg-blue-900 transition-colors">{isTracking ? "..." : "Track"}</button>
                            </form>
                            {trackResult && (
                                <div className="bg-white border-2 border-slate-100 rounded-2xl p-8 shadow-sm">
                                    {trackResult.error ? (
                                        <p className="text-red-500 font-bold text-center">{trackResult.error}</p>
                                    ) : (
                                        <>
                                            <div className="flex justify-between items-start mb-6">
                                                <div><p className="text-[10px] font-bold text-slate-400 uppercase">ID: {trackResult['Tracking ID']}</p><h3 className="text-xl font-black text-slate-800">{trackResult['Title']}</h3></div>
                                                <span className={`px-4 py-1.5 font-black text-xs rounded-lg uppercase tracking-widest ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-yellow-50 text-yellow-700 border border-yellow-200'}`}>{trackResult['Status']}</span>
                                            </div>
                                            <div className="w-full bg-slate-100 rounded-full h-3 mb-2"><div className={`h-full rounded-full transition-all duration-1000 ${trackResult['Status'] === 'RESOLVED' ? 'bg-emerald-500 w-full' : 'bg-yellow-400 w-1/2'}`}></div></div>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    );
                    
                    case 'departments': 
                        // SUB-VIEW: Show tools for a specific department if one is clicked
                        if (selectedDept) {
                            // FIXED: Robust filtering checks if "Target Dept ID" comma list includes the selected ID
                            const deptTools = tools.filter(t => {
                                const targetIdsStr = String(t['Target Dept ID'] || t['Target ID'] || t.TargetID || t.targetID || '').toLowerCase();
                                const selectedId = String(selectedDept.id || selectedDept.ID || selectedDept.Name || selectedDept.name || '').toLowerCase().trim();
                                return targetIdsStr.split(',').map(s => s.trim()).includes(selectedId);
                            });

                            return (
                                <div className="animate-fade-in structured-card p-6 md:p-10 min-h-[500px]">
                                    <div className="mb-6 flex items-center gap-4 border-b border-slate-200 pb-6">
                                        <button onClick={() => setSelectedDept(null)} className="p-2 bg-slate-100 hover:bg-tdmh-blue hover:text-white rounded-lg text-slate-600 transition-colors shadow-sm">
                                            <Icons.ChevronLeft className="w-6 h-6" />
                                        </button>
                                        <div>
                                            <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight">
                                                {selectedDept['Name'] || selectedDept.Name} Forms & Tools
                                            </h2>
                                            <p className="text-sm text-slate-500 font-medium mt-1">Select a document or tool below to open it in a new window.</p>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {deptTools.length === 0 && (
                                            <div className="col-span-2 text-center p-10 bg-slate-50 rounded-xl border border-slate-200">
                                                <Icons.Folder className="w-12 h-12 text-slate-300 mx-auto mb-2" />
                                                <p className="text-slate-500 italic">No specific tools mapped for this department yet.</p>
                                            </div>
                                        )}
                                        {deptTools.map((t, i) => (
                                            <a key={i} href={t.Link || t.link || t[2] || '#'} target="_blank" className="flex items-center gap-4 p-4 rounded-xl border border-slate-200 hover:border-tdmh-blue hover:bg-blue-50/30 transition-colors bg-white group shadow-sm">
                                                <div className="w-12 h-12 bg-slate-100 text-slate-500 group-hover:text-tdmh-blue rounded-lg flex items-center justify-center shrink-0 border border-slate-200 transition-colors">
                                                    <Icons.Link className="w-5 h-5" />
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-slate-800 text-sm group-hover:text-tdmh-blue leading-tight transition-colors">{t['Tool Name'] || t['Name'] || t.name || t[0]}</h4>
                                                    <p className="text-xs text-slate-500 mt-1">{t.Description || t.description || t[1]}</p>
                                                </div>
                                            </a>
                                        ))}
                                    </div>
                                </div>
                            );
                        }

                        // MAIN VIEW: The Grid of Departments
                        return (
                            <div className="animate-fade-in structured-card p-6 md:p-10">
                                <div className="mb-4 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><Icons.Box className="w-6 h-6 text-tdmh-blue" /> Hospital Departments</h2>
                                        <p className="text-sm text-slate-500 font-medium mt-2">Access specialized forms, clinical tools, and operational resources designated specifically for your unit.</p>
                                    </div>
                                </div>
                                
                                <div className="bg-red-50 border border-red-200 p-4 rounded-xl mb-8 flex gap-4 items-start">
                                    <Icons.Shield className="w-6 h-6 text-red-600 shrink-0 mt-0.5" />
                                    <div>
                                        <strong className="text-sm text-red-900 block mb-1">Strict Usage Policy</strong>
                                        <p className="text-xs text-red-800 leading-relaxed">
                                            Viewing the directory is open to all staff. However, please select <strong>only your designated department</strong> to access forms. Accessing clinical tools outside of your authorized unit is strictly monitored.
                                        </p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                    {departments.map((dept, i) => {
                                        // 1. Smart Icon Matching
                                        const iconKeyStr = String(dept['IconName'] || dept['Icon Name'] || dept.iconName || 'Box').trim();
                                        const matchedKey = Object.keys(Icons).find(k => k.toLowerCase() === iconKeyStr.toLowerCase());
                                        let IconCmp = Icons.Box; 
                                        
                                        if (matchedKey) {
                                            IconCmp = Icons[matchedKey];
                                        } else {
                                            const catStr = String(dept['Category'] || dept.category || '').toLowerCase();
                                            if (catStr.includes('admin') || catStr.includes('finance')) IconCmp = Icons.Users;
                                            else if (catStr.includes('medical') || catStr.includes('ward') || catStr.includes('ancillary')) IconCmp = Icons.Stethoscope;
                                            else if (catStr.includes('support')) IconCmp = Icons.Activity;
                                        }

                                        // 2. Cycle through beautiful colors
                                        const colorTheme = DEPT_COLORS[i % DEPT_COLORS.length];

                                        return (
                                            <div 
                                                key={dept.id || i} 
                                                onClick={() => setSelectedDept(dept)}
                                                className={`flex items-center gap-3 p-3 border border-slate-200 rounded-xl cursor-pointer transition-all group bg-white shadow-sm hover:shadow-md hover:border-tdmh-blue`}
                                            >
                                                {/* FIXED: Applied the dynamic color classes to the icon background */}
                                                <div className={`p-2.5 rounded-lg shrink-0 transition-colors ${colorTheme.bg} ${colorTheme.text} group-hover:bg-tdmh-blue group-hover:text-white`}>
                                                    <IconCmp className="w-6 h-6" />
                                                </div>
                                                <div className="flex flex-col min-w-0">
                                                    <span className="font-bold text-sm text-slate-800 group-hover:text-tdmh-blue truncate leading-tight transition-colors">{dept['Name'] || dept.Name}</span>
                                                    <span className="text-[9px] text-slate-400 font-bold uppercase tracking-widest truncate mt-0.5">{dept['Category'] || dept.category || 'Standard'}</span>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        );

                    case 'calendar': 
                        const daysInMonth = Array.from({length: 31}, (_, i) => i + 1);
                        const eventDays = calendar.map(e => parseInt(e.dayNum || String(e['Date Text']).replace(/[^0-9]/g, '') || 0));
                        
                        return (
                        <div className="animate-fade-in structured-card p-6 md:p-10">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl font-black text-slate-800 flex items-center gap-3 tracking-tight"><Icons.Calendar className="w-6 h-6 text-purple-600" /> Master Activities Timeline</h2>
                                    <p className="text-sm text-slate-500 mt-2 max-w-2xl leading-relaxed"><strong>Notice:</strong> Viewing the timeline is open to all staff. Authorized personnel must log in to schedule new events.</p>
                                </div>
                                {(userRole === 'admin' || userRole === 'dept_head') && (<button onClick={() => handleSecureAction('add_event')} className="flex items-center justify-center gap-2 bg-purple-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-sm shrink-0 hover:bg-purple-700 transition-colors"><Icons.Plus className="w-4 h-4" /> Add Event</button>)}
                            </div>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <div className="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-black text-slate-800 text-lg uppercase tracking-wider">March 2026</h3>
                                        <div className="flex gap-2">
                                            <button className="p-1.5 rounded border border-slate-200 text-slate-400 hover:text-purple-600 hover:bg-slate-50 transition-colors"><Icons.ChevronLeft className="w-4 h-4"/></button>
                                            <button className="p-1.5 rounded border border-slate-200 text-slate-400 hover:text-purple-600 hover:bg-slate-50 transition-colors"><Icons.ChevronRight className="w-4 h-4"/></button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">
                                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1">
                                        {daysInMonth.map(day => {
                                            const hasEvent = eventDays.includes(day);
                                            return (
                                                <div key={day} className={`aspect-square flex flex-col items-center justify-center rounded text-sm font-bold border transition-colors ${hasEvent ? 'bg-purple-50 border-purple-300 text-purple-700 cursor-pointer hover:bg-purple-600 hover:text-white shadow-sm' : 'bg-white border-transparent text-slate-600 hover:bg-slate-50'}`}>
                                                    {day}
                                                    {hasEvent && <div className="mt-0.5 w-1 h-1 bg-current rounded-full opacity-50"></div>}
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-slate-500 mb-6 uppercase tracking-widest text-[10px]">Upcoming Schedule</h3>
                                    <div className="relative border-l-2 border-slate-200 ml-2 space-y-6 pb-2">
                                        {calendar.length === 0 && <p className="text-slate-500 italic pl-6">No events scheduled.</p>}
                                        {calendar.map((ev, i) => (
                                            <div key={i} className="relative pl-6 group">
                                                <div className="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-white border-2 border-purple-500"></div>
                                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:border-purple-300 transition-colors">
                                                    <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">{ev['Date Text'] || ev.DateText} &bull; {ev.Time || ev.time}</div>
                                                    <div className="text-base font-bold text-slate-800">{ev['Event Title'] || ev.Title}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                    case 'agimat': return (
                        <div className="animate-fade-in max-w-5xl mx-auto py-6">
                            <div className="flex flex-col items-center justify-center mb-10 text-center">
                                {/* NEW AGIMAT LOGO: Add image to your GitHub images folder! */}
                                <img 
                                    src="./images%20logo/agimat-logo.png" 
                                    alt="Agimat" 
                                    className="h-16 md:h-24 object-contain mb-4 drop-shadow-sm" 
                                    onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }} 
                                />
                                {/* Fallback text if the image fails to load */}
                                <h2 className="text-[4rem] text-slate-900 font-serif leading-none tracking-tight hidden">Agimat</h2>
                                <p className="text-slate-500 font-medium text-base mt-2">Standardized video training and continuous quality improvement resources.</p>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {agimat.map((vid, i) => (
