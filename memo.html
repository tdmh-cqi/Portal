<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TDMH Memo System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { tdmh: { blue: '#1e3a8a', green: '#16a34a' } },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards', 'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>

    <style>
        body { background-color: #f4f7f9; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        body.modal-open { overflow: hidden !important; }
        .bg-pattern { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        .print-area { white-space: pre-wrap; word-wrap: break-word; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 relative bg-pattern">
    <div id="root" class="relative z-10 flex flex-col min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 🚨 PASTE YOUR NEW MEMO WEB APP URL HERE 
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycby0KPBCWeSRKD2X0k5AmwUkzqF4s950RLznQrVOpAD3_GkDNAgVVsFzq8_UpjIuBKF2MA/exec";

        const Icons = {
            FileText: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
            PenTool: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>,
            X: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Shield: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>,
            Bell: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
            Sparkles: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>,
            Sync: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>,
            Plus: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Lock: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Eye: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
            CheckCircle: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            ClipboardCheck: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2-2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>,
            Activity: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        };

        // --- SIGNATURE CANVAS COMPONENT ---
        const SignaturePad = ({ onSave, onCancel }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#0f172a';
                
                const resizeCanvas = () => {
                    const parent = canvas.parentElement;
                    canvas.width = parent.clientWidth;
                    canvas.height = 150; 
                };
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                return () => window.removeEventListener('resize', resizeCanvas);
            }, []);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                setIsDrawing(true);
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                e.preventDefault();
                if (!isDrawing) return;
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
                canvasRef.current.getContext('2d').closePath();
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            return (
                <div className="w-full">
                    <div className="border-2 border-slate-300 rounded-xl overflow-hidden bg-slate-50 mb-3 relative cursor-crosshair">
                        <canvas 
                            ref={canvasRef}
                            onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
                            className="w-full touch-none"
                        />
                        <div className="absolute bottom-2 left-0 right-0 text-center pointer-events-none text-slate-300 font-bold text-xs uppercase tracking-widest">Sign Here</div>
                    </div>
                    <div className="flex justify-between gap-3">
                        <button type="button" onClick={clearCanvas} className="px-4 py-2 text-xs font-bold text-slate-500 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">Clear</button>
                        <div className="flex gap-2">
                            <button type="button" onClick={onCancel} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">Cancel</button>
                            <button type="button" onClick={() => {
                                const canvas = canvasRef.current;
                                const blank = document.createElement('canvas');
                                blank.width = canvas.width; blank.height = canvas.height;
                                if(canvas.toDataURL() === blank.toDataURL()) {
                                    onSave(null); 
                                } else {
                                    onSave(canvas.toDataURL('image/png'));
                                }
                            }} className="px-5 py-2 text-xs font-bold text-white bg-tdmh-blue rounded-lg hover:bg-blue-900 transition-colors shadow-md">Confirm Signature</button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [isSyncing, setIsSyncing] = useState(true);
            const [memos, setMemos] = useState([]);
            const [signatures, setSignatures] = useState([]);
            
            const [userRole, setUserRole] = useState('guest');
            const [showRoleLogin, setShowRoleLogin] = useState(false);
            const [rolePinInput, setRolePinInput] = useState('');
            const [isVerifyingLogin, setIsVerifyingLogin] = useState(false);
            
            const [customAlert, setCustomAlert] = useState({ isOpen: false, title: '', message: '', type: 'info' });
            const [showAddMemo, setShowAddMemo] = useState(false);
            const [showAdminConsole, setShowAdminConsole] = useState(false);
            
            const [viewingMemo, setViewingMemo] = useState(null); 
            const [signModalOpen, setSignModalOpen] = useState(false);
            
            const [memoData, setMemoData] = useState({ forDept: '', fromName: '', subject: '', urgency: 'Normal', body: '' });
            const [signData, setSignData] = useState({ name: '', dept: '' });
            const [isFixingGrammar, setIsFixingGrammar] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isApprovingMemo, setIsApprovingMemo] = useState(false);

            const showAlert = (title, message, type = 'info') => {
                setCustomAlert({ isOpen: true, title, message, type });
            };

            const unlockScroll = () => {
                document.body.classList.remove('modal-open');
                document.body.style.overflow = 'auto'; 
            };

            useEffect(() => {
                if (showAddMemo || showAdminConsole || viewingMemo !== null || signModalOpen || customAlert.isOpen || showRoleLogin) {
                    document.body.classList.add('modal-open');
                    document.body.style.overflow = 'hidden';
                } else {
                    unlockScroll();
                }
                return () => unlockScroll();
            }, [showAddMemo, showAdminConsole, viewingMemo, signModalOpen, customAlert.isOpen, showRoleLogin]);

            const fetchDatabase = async () => {
                setIsSyncing(true);
                try {
                    const response = await fetch(API_URL + "?action=sync", { redirect: "follow" }).catch(() => ({ ok: false }));
                    if (response && response.ok) {
                        const result = await response.json();
                        if(result.status === 'success') {
                            setMemos(result.data.memos || []);
                            setSignatures(result.data.signatures || []);
                        }
                    }
                } catch (error) { 
                    showAlert("Connection Error", "Could not reach the master database.", "error");
                }
                setIsSyncing(false);
            };

            useEffect(() => { fetchDatabase(); }, []);

            const sendPostRequest = async (payload) => {
                if (API_URL === "PASTE_YOUR_NEW_MEMO_WEB_APP_URL_HERE") { 
                    showAlert("System Offline", "The database is currently running in offline developer mode. Please update your API URL.", "error");
                    return {status: 'success'}; 
                }
                try {
                    const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" }).catch(() => ({ ok: false }));
                    if (response && response.ok) return await response.json();
                    return {status: 'error'};
                } catch (e) { return {status: 'error'}; }
            };

            const submitRoleLogin = async (e) => {
                e.preventDefault();
                setIsVerifyingLogin(true);

                const res = await sendPostRequest({ action: 'verifyPin', pin: rolePinInput });
                setIsVerifyingLogin(false);

                if (res.status === 'success' && (res.role === 'admin' || res.role === 'dept_head')) { 
                    setUserRole(res.role); 
                    setShowRoleLogin(false); 
                    unlockScroll(); 
                    setRolePinInput(''); 
                } else { 
                    showAlert("Access Denied", "Invalid PIN or insufficient permissions.", "error");
                    setRolePinInput('');
                }
            };

            const handleFixGrammar = () => {
                if (!memoData.body.trim()) {
                    showAlert("Missing Content", "Please type something in the memo body first before fixing grammar.", "error");
                    return;
                }
                setIsFixingGrammar(true);
                
                setTimeout(() => {
                    let text = memoData.body;
                    text = text.replace(/ +/g, ' '); 
                    text = text.replace(/ \s*([,.;?!:])/g, '$1'); 
                    text = text.replace(/([,.;?!:])([a-zA-Z])/g, '$1 $2'); 
                    text = text.replace(/(^\s*|[.?!]\s+)([a-z])/g, (match, p1, p2) => p1 + p2.toUpperCase()); 
                    text = text.replace(/\n{3,}/g, '\n\n'); 
                    setMemoData({...memoData, body: text.trim()});
                    setIsFixingGrammar(false);
                }, 600); 
            };

            const handleNativeMemoSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const payload = {
                    action: 'generateMemo',
                    forDept: memoData.forDept,
                    fromName: memoData.fromName,
                    subject: memoData.subject,
                    urgency: memoData.urgency,
                    body: memoData.body
                };
                
                const res = await sendPostRequest(payload);
                setIsSubmitting(false);
                
                if(res.status === 'success') {
                    showAlert(
                        "Memo Sent for Approval", 
                        `Your digital memo has been successfully generated and routed to the Admin queue for final review.\n\nTracking Ref: ${res.refNo}`, 
                        "success"
                    );
                    setShowAddMemo(false);
                    unlockScroll();
                    setMemoData({ forDept: '', fromName: '', subject: '', urgency: 'Normal', body: '' });
                    fetchDatabase(); 
                } else {
                    showAlert("Submission Failed", "Failed to submit memo to the database. Please try again.", "error");
                }
            };

            const handleApproveMemo = async (refNo) => {
                setIsApprovingMemo(true);
                const res = await sendPostRequest({ action: 'approveMemo', refNo: refNo });
                setIsApprovingMemo(false);
                if (res.status === 'success') {
                    showAlert("Memo Approved", `Memo ${refNo} has been successfully published to the live portal.`, "success");
                    setViewingMemo(null); 
                    fetchDatabase();
                } else {
                    showAlert("Approval Failed", "Failed to approve memo.", "error");
                }
            }

            const handleSignatureSubmit = async (signatureBase64) => {
                if (!signatureBase64) {
                    showAlert("Missing Signature", "Please physically draw your signature on the pad before confirming.", "error");
                    return;
                }
                if (!signData.name.trim() || !signData.dept.trim()) { 
                    showAlert("Missing Details", "Please enter your full name and department.", "error");
                    return; 
                }

                setIsSubmitting(true);
                const payload = {
                    action: 'submitSignature',
                    refNo: viewingMemo['Ref No'] || viewingMemo[0],
                    name: signData.name,
                    dept: signData.dept,
                    signature: signatureBase64 
                };

                const res = await sendPostRequest(payload);
                setIsSubmitting(false);

                if (res.status === 'success') {
                    showAlert("Acknowledgment Saved", `Thank you, ${signData.name}!\n\nYour digital signature has been saved to the receiving record.`, "success");
                    setSignModalOpen(false);
                    setSignData({name: '', dept: ''});
                    fetchDatabase(); 
                } else {
                    showAlert("Network Error", "Failed to save signature. Please check your connection.", "error");
                }
            };

            const visibleMemos = memos.filter(m => String(m.Status || m[6]).toUpperCase() === 'PUBLISHED' || String(m.Status || m[6]).toUpperCase() === 'APPROVED');
            const pendingMemosList = memos.filter(m => String(m.Status || m[6]).toUpperCase().includes('PENDING'));

            if (isSyncing && memos.length === 0) {
                return (<div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-white flex-col"><Icons.Sync className="w-12 h-12 animate-spin mb-4 text-tdmh-green" /><p className="font-bold tracking-widest uppercase text-sm">Connecting to Database...</p></div>);
            }

            return (
                <div className="flex flex-col min-h-screen bg-pattern">
                    
                    {/* CUSTOM ALERTS MODAL */}
                    {customAlert.isOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in" onClick={() => setCustomAlert({...customAlert, isOpen: false})}>
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden relative transform animate-slide-up border border-slate-200" onClick={e => e.stopPropagation()}>
                                <div className={`p-8 text-center ${customAlert.type === 'error' ? 'bg-red-50 border-b border-red-100' : 'bg-slate-50 border-b border-slate-100'}`}>
                                    <div className={`w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm border ${customAlert.type === 'error' ? 'bg-red-100 text-red-600 border-red-200' : 'bg-tdmh-blue text-white border-blue-800'}`}>
                                        {customAlert.type === 'error' ? <Icons.X className="w-10 h-10"/> : <Icons.CheckCircle className="w-10 h-10"/>}
                                    </div>
                                    <h3 className="font-black text-slate-800 text-2xl tracking-tight">{customAlert.title}</h3>
                                </div>
                                <div className="p-8">
                                    <p className="text-slate-600 text-center mb-8 whitespace-pre-line leading-relaxed font-medium">{customAlert.message}</p>
                                    <button onClick={() => setCustomAlert({...customAlert, isOpen: false})} className={`w-full font-black uppercase tracking-widest text-sm py-4 rounded-xl transition-transform hover:-translate-y-1 shadow-lg ${customAlert.type === 'error' ? 'bg-red-600 hover:bg-red-700 text-white shadow-red-900/20' : 'bg-tdmh-blue hover:bg-blue-900 text-white shadow-blue-900/20'}`}>
                                        Acknowledge
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ROLE LOGIN MODAL */}
                    {showRoleLogin && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-8 text-center relative animate-slide-up border border-slate-200 my-auto shrink-0">
                                <button onClick={() => {setShowRoleLogin(false); unlockScroll(); }} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors bg-slate-50 p-2 rounded-full"><Icons.X className="w-5 h-5" /></button>
                                <div className="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-200 shadow-inner"><Icons.Shield className="w-8 h-8" /></div>
                                <h3 className="text-xl font-black text-slate-800 mb-2">Role Verification</h3>
                                <p className="text-xs text-slate-500 mb-6 font-medium">Please enter your PIN to continue.</p>
                                
                                <form onSubmit={submitRoleLogin}>
                                    <input type="password" value={rolePinInput} onChange={(e)=>setRolePinInput(e.target.value)} autoFocus className="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl text-center text-2xl font-black tracking-[0.3em] mb-4 focus:border-tdmh-blue outline-none transition-all shadow-inner" placeholder="••••••••" />
                                    <button type="submit" disabled={isVerifyingLogin} className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors disabled:opacity-50 tracking-widest uppercase text-sm">
                                        {isVerifyingLogin ? "Verifying..." : "Unlock Access"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* DIGITAL MEMO VIEWER MODAL */}
                    {viewingMemo && (
                        <div className="fixed inset-0 z-[110] flex items-start justify-center p-4 sm:p-8 bg-slate-900/80 backdrop-blur-sm animate-fade-in overflow-y-auto custom-scrollbar" onClick={() => setViewingMemo(null)}>
                            <div className="bg-white rounded-none sm:rounded-2xl shadow-2xl w-full max-w-4xl relative transform animate-slide-up flex flex-col min-h-[90vh] my-auto shrink-0" onClick={e => e.stopPropagation()}>
                                
                                {/* Viewer Toolbar */}
                                <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center sticky top-0 z-20 rounded-t-none sm:rounded-t-2xl">
                                    <div className="flex items-center gap-3">
                                        <span className="bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-widest shadow-sm">
                                            {viewingMemo['Ref No'] || viewingMemo[0]}
                                        </span>
                                        {String(viewingMemo.Status || viewingMemo[6]).toUpperCase().includes('PENDING') && (
                                            <span className="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg border border-amber-200 text-xs font-bold uppercase tracking-widest shadow-sm">Preview Mode</span>
                                        )}
                                    </div>
                                    <button onClick={() => setViewingMemo(null)} className="text-slate-500 hover:text-slate-800 transition-colors bg-white p-2 rounded-full border border-slate-200 shadow-sm"><Icons.X className="w-5 h-5"/></button>
                                </div>

                                {/* Digital Letterhead Content */}
                                <div className="p-8 sm:p-14 flex-1 bg-white">
                                    {/* Logo & Header */}
                                    <div className="flex flex-col items-center justify-center mb-10 border-b-2 border-slate-800 pb-8">
                                        <img src="https://raw.githubusercontent.com/tdmh-cqi/Portal/main/images%20logo/tdmh-logo.png" alt="TDMH" className="h-16 mb-6 object-contain" />
                                        <h1 className="text-2xl sm:text-3xl font-black text-slate-800 tracking-wider text-center uppercase">Inter-Office Memorandum</h1>
                                        <p className="text-sm font-bold text-slate-500 tracking-widest uppercase mt-2">{viewingMemo.From || viewingMemo[3]}</p>
                                    </div>

                                    {/* Memo Details */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 text-sm sm:text-base border border-slate-200 p-6 rounded-xl bg-slate-50/50">
                                        <div className="flex gap-3">
                                            <span className="font-bold text-slate-500 uppercase tracking-wider w-16">Ref:</span> 
                                            <span className="font-black text-slate-800">{viewingMemo['Ref No'] || viewingMemo[0]}</span>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-slate-500 uppercase tracking-wider w-16">Date:</span> 
                                            <span className="font-bold text-slate-800">{viewingMemo.Date || viewingMemo[1]}</span>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-slate-500 uppercase tracking-wider w-16">To:</span> 
                                            <span className="font-bold text-slate-800">{viewingMemo.For || viewingMemo[2]}</span>
                                        </div>
                                        <div className="flex gap-3">
                                            <span className="font-bold text-slate-500 uppercase tracking-wider w-16">Subj:</span> 
                                            <span className="font-black text-slate-800 uppercase">{viewingMemo.Subject || viewingMemo[4]}</span>
                                        </div>
                                    </div>

                                    {/* Main Body */}
                                    <div className="print-area text-base text-slate-800 leading-loose mb-16 text-justify">
                                        {viewingMemo.Body || viewingMemo[5]}
                                    </div>

                                    {/* Receiving Record Section */}
                                    <div className="border-t-2 border-slate-200 pt-8 mt-12">
                                        <h4 className="font-black text-slate-800 mb-6 uppercase tracking-widest text-sm flex items-center gap-2"><Icons.ClipboardCheck className="w-5 h-5 text-tdmh-green" /> Receiving Record</h4>
                                        
                                        {/* Filter signatures for this specific memo */}
                                        {(() => {
                                            const memoSigs = signatures.filter(s => (s['Memo Ref No'] || s[0]) === (viewingMemo['Ref No'] || viewingMemo[0]));
                                            
                                            if (memoSigs.length === 0) {
                                                return <p className="text-slate-400 italic text-sm mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">No acknowledgments recorded yet.</p>;
                                            }

                                            return (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                                                    {memoSigs.map((sig, i) => (
                                                        <div key={i} className="border border-slate-200 rounded-xl p-4 bg-white shadow-sm flex flex-col justify-between">
                                                            <div className="mb-2 border-b border-slate-100 pb-2">
                                                                <p className="font-black text-slate-800 text-sm truncate leading-tight">{sig['Signer Name'] || sig[1]}</p>
                                                                <p className="text-[10px] font-bold uppercase tracking-widest text-tdmh-blue truncate mt-0.5">{sig['Signer Dept'] || sig[2]}</p>
                                                            </div>
                                                            <img src={sig['Signature Data'] || sig[3]} alt="Signature" className="h-10 object-contain my-2 self-start opacity-80 mix-blend-multiply" />
                                                            <p className="text-[9px] text-slate-400 font-medium tracking-wider">{sig.Timestamp || sig[4]}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )
                                        })()}
                                    </div>
                                </div>

                                {/* Viewer Footer Actions */}
                                <div className="bg-slate-100 p-6 border-t border-slate-200 sticky bottom-0 z-20 flex flex-col sm:flex-row gap-4 justify-between items-center rounded-b-none sm:rounded-b-2xl">
                                    {String(viewingMemo.Status || viewingMemo[6]).toUpperCase().includes('PENDING') && userRole === 'admin' ? (
                                        <div className="w-full flex justify-end gap-4">
                                            <button onClick={() => setViewingMemo(null)} className="px-6 py-3 bg-white text-slate-600 font-bold text-sm rounded-xl border border-slate-300 hover:bg-slate-50 transition-colors">Cancel</button>
                                            <button onClick={() => handleApproveMemo(viewingMemo['Ref No'] || viewingMemo[0])} disabled={isApprovingMemo} className="flex-1 sm:flex-none px-10 py-3 bg-tdmh-blue text-white font-black uppercase tracking-widest text-sm rounded-xl hover:bg-blue-900 transition-colors shadow-lg shadow-blue-900/20 disabled:opacity-50">
                                                {isApprovingMemo ? 'Approving...' : 'Approve & Publish Memo'}
                                            </button>
                                        </div>
                                    ) : (
                                        <>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">This is an officially recorded document.</p>
                                            <button onClick={() => setSignModalOpen(true)} className="w-full sm:w-auto bg-tdmh-green text-white px-8 py-3 rounded-xl font-black uppercase tracking-widest text-sm hover:bg-green-700 transition-transform hover:-translate-y-1 shadow-lg shadow-green-900/20 flex items-center justify-center gap-2">
                                                <Icons.PenTool className="w-4 h-4" /> Acknowledge Memo
                                            </button>
                                        </>
                                    )}
                                </div>

                            </div>
                        </div>
                    )}

                    {/* NEW MEMO MODAL (TEXT GENERATOR) */}
                    {showAddMemo && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-3xl overflow-hidden relative transform animate-slide-up my-auto shrink-0">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 sticky top-0 z-10">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-blue-50 text-tdmh-blue rounded-lg"><Icons.FileText className="w-6 h-6"/></div>
                                        <div>
                                            <h3 className="font-black text-slate-800 text-xl tracking-tight leading-tight">Draft Official Memo</h3>
                                            <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mt-0.5">Digital Memo Format</p>
                                        </div>
                                    </div>
                                    <button onClick={() => { setShowAddMemo(false); unlockScroll(); }} className="text-slate-400 hover:text-slate-800 transition-colors bg-white p-2 rounded-full border border-slate-200 shadow-sm hover:bg-slate-50"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <form className="p-6 md:p-8 space-y-6" onSubmit={handleNativeMemoSubmit}>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">To / For <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.forDept} onChange={(e)=>setMemoData({...memoData, forDept: e.target.value})} required className="w-full p-3 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700" placeholder="e.g. All Department Heads" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">From <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.fromName} onChange={(e)=>setMemoData({...memoData, fromName: e.target.value})} required className="w-full p-3 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700" placeholder="e.g. HR Department" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                        <div className="md:col-span-2">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Subject <span className="text-red-500">*</span></label>
                                            <input type="text" value={memoData.subject} onChange={(e)=>setMemoData({...memoData, subject: e.target.value})} required className="w-full p-3 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-bold text-slate-800" placeholder="e.g. Updated Holiday Schedule" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Urgency</label>
                                            <select value={memoData.urgency} onChange={(e)=>setMemoData({...memoData, urgency: e.target.value})} className="w-full p-3 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700">
                                                <option>Normal</option>
                                                <option>High</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-2">
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block">Memo Body Content <span className="text-red-500">*</span></label>
                                            <button type="button" onClick={handleFixGrammar} disabled={isFixingGrammar} className="text-xs font-bold text-purple-700 bg-purple-50 hover:bg-purple-100 border border-purple-200 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors disabled:opacity-50">
                                                <Icons.Sparkles className="w-3.5 h-3.5" /> {isFixingGrammar ? "Formatting..." : "✨ Auto-Format Draft"}
                                            </button>
                                        </div>
                                        <textarea spellCheck="true" value={memoData.body} onChange={(e)=>setMemoData({...memoData, body: e.target.value})} required className="w-full p-4 rounded-xl border-2 border-slate-100 outline-none focus:border-tdmh-blue transition-colors font-medium text-slate-700 h-64 resize-y leading-relaxed" placeholder="Type or paste your memo here. Press enter for new paragraphs. It will be perfectly formatted on the digital viewer..."></textarea>
                                    </div>

                                    <button type="submit" disabled={isSubmitting} className="w-full bg-tdmh-blue text-white font-black tracking-widest uppercase text-sm py-4 rounded-xl mt-2 hover:bg-blue-900 transition-transform hover:-translate-y-1 shadow-lg shadow-blue-900/20 disabled:opacity-50 disabled:hover:translate-y-0">
                                        {isSubmitting ? "Generating..." : "Submit to Admin Review"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* SIGNATURE PAD MODAL (OPENS OVER THE VIEWER) */}
                    {signModalOpen && viewingMemo && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 sm:p-8 bg-slate-900/80 backdrop-blur-sm animate-fade-in" onClick={() => setSignModalOpen(false)}>
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm p-8 text-center relative animate-slide-up border border-slate-200" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSignModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800 transition-colors"><Icons.X className="w-5 h-5" /></button>
                                <h3 className="text-xl font-black text-slate-800 mb-1">Acknowledge Memo</h3>
                                <p className="text-[10px] text-tdmh-blue uppercase font-bold tracking-widest mb-6">Ref: {viewingMemo['Ref No'] || viewingMemo[0]}</p>
                                
                                <div className="space-y-4 text-left">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Full Name</label>
                                        <input type="text" value={signData.name} onChange={e=>setSignData({...signData, name: e.target.value})} required className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:border-tdmh-green outline-none transition-colors" placeholder="e.g. Jane Doe" />
                                    </div>
                                    <div className="mb-4">
                                        <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Department</label>
                                        <input type="text" value={signData.dept} onChange={e=>setSignData({...signData, dept: e.target.value})} required className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold focus:border-tdmh-green outline-none transition-colors" placeholder="e.g. Pharmacy" />
                                    </div>
                                    <SignaturePad onSave={handleSignatureSubmit} onCancel={() => setSignModalOpen(false)} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MASTER ADMIN CONSOLE MODAL */}
                    {showAdminConsole && (
                        <div className="fixed inset-0 z-[100] flex items-start justify-center p-4 sm:p-8 bg-slate-900/90 backdrop-blur-md animate-fade-in overflow-y-auto">
                            <div className="bg-slate-50 rounded-[2rem] shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col h-[85vh] animate-slide-up border border-slate-700 my-auto shrink-0">
                                <div className="bg-slate-900 p-6 flex justify-between items-center text-white shrink-0 shadow-md z-10 border-b border-slate-800">
                                    <div className="flex items-center gap-4">
                                        <div className="p-2 bg-slate-800 border border-slate-700 rounded-xl shadow-inner">
                                            <Icons.Shield className="w-6 h-6 text-amber-500" />
                                        </div>
                                        <div>
                                            <h2 className="text-xl md:text-2xl font-black tracking-tight leading-none">Memo Admin Console</h2>
                                            <p className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-1">Review & Publish Routing</p>
                                        </div>
                                    </div>
                                    <button onClick={() => { setShowAdminConsole(false); unlockScroll(); }} className="text-slate-400 hover:text-white p-2.5 bg-slate-800 border border-slate-700 rounded-full transition-colors shadow-sm"><Icons.X className="w-5 h-5" /></button>
                                </div>
                                <div className="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar bg-slate-100">
                                    
                                    <div className="flex items-center justify-between mb-6">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-amber-200 text-amber-700 rounded-xl flex items-center justify-center shadow-inner"><Icons.FileText className="w-5 h-5"/></div>
                                            <div>
                                                <h3 className="font-black text-slate-800 text-lg leading-tight">Pending Memos Queue</h3>
                                                <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mt-0.5">Awaiting Final Approval</p>
                                            </div>
                                        </div>
                                        <div className="bg-amber-500 text-white font-black text-xl px-4 py-1.5 rounded-xl shadow-sm">{pendingMemosList.length}</div>
                                    </div>
                                    
                                    <div className="space-y-4">
                                        {pendingMemosList.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center py-20 text-slate-400 bg-white rounded-2xl border border-slate-200 shadow-sm">
                                                <Icons.ClipboardCheck className="w-16 h-16 mb-4 opacity-50"/>
                                                <p className="text-lg font-bold text-slate-500">No pending memos in the queue.</p>
                                            </div>
                                        ) : (
                                            pendingMemosList.map((m, i) => (
                                                <div key={i} className="p-6 border border-slate-200 rounded-2xl bg-white hover:border-tdmh-blue transition-all relative group shadow-sm flex flex-col md:flex-row gap-6 justify-between items-start md:items-center">
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-3 mb-2">
                                                            <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md border border-slate-200 uppercase tracking-widest shadow-sm">REF: {m['Ref No'] || m[0]}</span>
                                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">{m.Date || m[1]}</span>
                                                        </div>
                                                        <h4 className="font-black text-slate-800 text-lg leading-tight mb-2 truncate">{m.Subject || m[4]}</h4>
                                                        <p className="text-xs text-slate-500"><strong>From:</strong> {m.From || m[3]} &bull; <strong>For:</strong> {m.For || m[2]}</p>
                                                    </div>
                                                    
                                                    <div className="flex gap-3 w-full md:w-auto shrink-0">
                                                        <button 
                                                            onClick={() => setViewingMemo(m)} 
                                                            className="flex-1 md:flex-none bg-blue-50 text-tdmh-blue border border-blue-100 font-bold px-6 py-3 rounded-xl hover:bg-blue-100 transition-colors flex items-center justify-center gap-2 text-sm shadow-sm"
                                                        >
                                                            <Icons.Eye className="w-4 h-4" /> Review Memo
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOP HEADER */}
                    <nav className="bg-tdmh-blue text-white shadow-xl z-40 sticky top-0 border-b-2 border-blue-900">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16 md:h-20 gap-4">
                                <div className="flex items-center gap-3">
                                    <Icons.FileText className="w-6 h-6 md:w-8 md:h-8" />
                                    <div>
                                        <h1 className="font-black text-sm md:text-lg tracking-wider leading-tight">MEMO SYSTEM</h1>
                                        <p className="text-[8px] md:text-[10px] text-blue-200 uppercase tracking-widest font-bold">Public Repository & E-Signatures</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3 md:gap-4">
                                    {userRole === 'admin' && (
                                        <button onClick={() => setShowAdminConsole(true)} className="relative p-2 md:p-2.5 rounded-lg bg-white/10 border border-white/20 text-white hover:bg-white/20 transition-colors shadow-sm" title="Admin Control Center">
                                            <Icons.Shield className="w-5 h-5" />
                                            {pendingMemosList.length > 0 && (
                                                <span className="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-tdmh-blue shadow-md animate-pulse">
                                                    {pendingMemosList.length}
                                                </span>
                                            )}
                                        </button>
                                    )}
                                    {userRole !== 'guest' && <span className="hidden md:inline-block bg-yellow-500 text-yellow-900 text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded shadow-sm border border-yellow-600">Authorized Access</span>}
                                    <button onClick={() => { userRole === 'guest' ? setShowRoleLogin(true) : setShowAddMemo(true) }} className="flex items-center gap-2 bg-tdmh-green text-white px-4 md:px-5 py-2 md:py-2.5 rounded-lg text-xs md:text-sm font-bold shadow-md hover:bg-green-700 transition-colors">
                                        {userRole === 'guest' ? <><Icons.Lock className="w-4 h-4" /> Admin Login</> : <><Icons.Plus className="w-4 h-4" /> New Memo</>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* MAIN CONTENT */}
                    <main className="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
                        <div className="bg-white rounded-3xl p-6 md:p-10 shadow-lg border border-slate-200">
                            <div className="mb-8 border-b border-slate-200 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">Inter-Office Memos</h2>
                                    <p className="text-slate-500 font-medium mt-1">Official digital repository for published hospital memorandums.</p>
                                </div>
                                <div className="bg-blue-50 text-tdmh-blue text-xs font-bold px-4 py-2 rounded-lg border border-blue-100 flex items-center gap-2 shadow-sm">
                                    <Icons.Activity className="w-4 h-4" /> {visibleMemos.length} Active Records
                                </div>
                            </div>

                            <div className="space-y-4">
                                {visibleMemos.length === 0 ? (
                                    <div className="text-center p-12 bg-slate-50 rounded-2xl border border-slate-200">
                                        <Icons.FileText className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                                        <p className="text-slate-500 italic">No published memos currently available in the database.</p>
                                    </div>
                                ) : visibleMemos.map((m, i) => {
                                    
                                    const sigCount = signatures.filter(s => (s['Memo Ref No'] || s[0]) === (m['Ref No'] || m[0])).length;

                                    return (
                                    <div key={i} className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col sm:flex-row sm:items-center gap-6 relative group hover:shadow-md transition-shadow hover:border-tdmh-blue cursor-pointer" onClick={() => setViewingMemo(m)}>
                                        <div className="bg-blue-50 text-tdmh-blue p-4 rounded-xl flex flex-col items-center justify-center min-w-[90px] border border-blue-100 shrink-0">
                                            <span className="text-xs font-bold uppercase tracking-widest">{String(m.Date || m[1]).split(' ')[0] || 'N/A'}</span>
                                            <span className="text-3xl font-black">{String(m.Date || m[1]).split(' ')[1]?.replace(',','') || '--'}</span>
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="flex gap-2 items-center mb-1">
                                                <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded border border-slate-200 uppercase tracking-widest">REF: {m['Ref No'] || m[0]}</span>
                                                {(m.Urgency || m.urgency || m[7]) === 'High' && <span className="text-[10px] font-bold bg-red-50 text-red-600 px-2.5 py-1 rounded border border-red-200 uppercase tracking-widest">Urgent</span>}
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800 mt-2 leading-tight truncate group-hover:text-tdmh-blue transition-colors">{m.Subject || m[4]}</h3>
                                            <p className="text-slate-500 text-sm mt-1 truncate">From: {m.From || m[3]} &bull; For: {m.For || m[2]}</p>
                                        </div>
                                        <div className="flex flex-col items-end shrink-0 gap-2">
                                            <div className="text-tdmh-blue font-bold text-xs bg-blue-50 px-5 py-2.5 rounded-lg flex items-center justify-center gap-2 border border-blue-100 shadow-sm w-full sm:w-auto">
                                                <Icons.Eye className="w-4 h-4" /> Read Memo
                                            </div>
                                            <div className="text-[10px] text-slate-400 font-bold tracking-widest uppercase flex items-center justify-center sm:justify-end gap-1 w-full sm:w-auto">
                                                <Icons.PenTool className="w-3 h-3" /> {sigCount} Signatures
                                            </div>
                                        </div>
                                    </div>
                                    )
                                })}
                            </div>
                        </div>
                    </main>

                    <footer className="mt-auto bg-tdmh-blue py-6 text-center text-white text-[10px] font-bold border-t border-blue-800">
                        <p className="uppercase tracking-widest text-blue-200">&copy; {new Date().getFullYear()} TAYTAY DOCTORS MULTISPECIALTY HOSPITAL.</p>
                    </footer>
                </div>
            );
        }

        if (window.ReactDOM) {
            const root = window.ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } else {
            document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center; color: #ef4444; font-family: sans-serif;"><h2>System Loading Error</h2><p>The React framework failed to load.</p></div>';
        }
    </script>
</body>
</html>
